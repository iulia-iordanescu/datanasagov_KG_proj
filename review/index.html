  :root {
    --bg: #e9ece8; --panel: #ffffff; --ink: #262b31; --muted: #626a76; --line: #d5dad4;
    --tint: #f1f6f5; --paper: #fbf9f3; --label: #4a5260; --stripe: #8fc1cc;
    --accent: #2c6e82; --accent-bg: #eaf3f5; --soft: #fbefc4; --strong: #f5d77a; --error: #a8322b; --flag: #85601a;
    --error-bg: #fdecea; --flag-bg: #fff6e0; --ok: #1f7a3a; --ok-bg: #e5f4ea; --input: #ffffff;
    --subj: #2f6db5; --subj-bg: #eaf1fb; --pred: #8a4fb8; --pred-bg: #f4ecfa; --obj: #2c8a5a; --obj-bg: #e8f5ee;
    --bar: #1f5566; --bar-ink: #ffffff; --bar-soft: rgba(255, 255, 255, 0.16);
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111417; --panel: #1b1f24; --ink: #e4e7ea; --muted: #9aa2ad; --line: #30363d;
      --tint: #222a2e; --paper: #1f2226; --label: #b6bdc7; --stripe: #3f7684;
      --accent: #7fbccd; --accent-bg: #1f3036; --soft: #4d4415; --strong: #7a6400; --error: #ff8a80; --flag: #f0c060;
      --error-bg: #3a1f1f; --flag-bg: #3a3018; --ok: #6fd08c; --ok-bg: #1d3325; --input: #14171c;
      --subj: #7fb0ec; --subj-bg: #1c2836; --pred: #c79ae8; --pred-bg: #2a2133; --obj: #79d1a4; --obj-bg: #1b2e25;
      --bar: #163c47; --bar-ink: #e9f3f5; --bar-soft: rgba(255, 255, 255, 0.10);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
         -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bar); color: var(--bar-ink); box-shadow: var(--shadow); }
  header .topbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 8px 16px; }
  @media (min-width: 1200px) { header .topbar { flex-wrap: nowrap; } }
  header #status { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 5em; }
  header h1 { white-space: nowrap; }
  header nav.tabs { display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 0;
                    max-height: none; overflow: visible; position: static; border-radius: 0; box-shadow: none; }
  header nav.tabs button { display: inline-block; width: auto; margin: 0; text-align: center; box-shadow: none; }
  header nav.tabs .tab.current { background: var(--bar-ink); }
  header nav.tabs .tab.current > button, header nav.tabs .tab.current { color: #0f3d4a; }
  header .tab { display: inline-flex; align-items: center; gap: 4px; border-radius: 8px; }
      color: var(--bar-ink); padding: 6px 8px; border-radius: 8px; white-space: nowrap; }
  header .tab.current, header .tab.current button { background: var(--bar-ink); color: var(--bar); font-weight: 600; }
  header .tab select { border: 0; background: transparent; color: var(--bar-ink); font-weight: 600; padding: 6px 8px;
                       max-width: 330px; cursor: pointer; }
  header .tab select option { color: var(--ink); background: var(--panel); font-weight: 400; }
  header .tab.current select { color: var(--band-solid, #1f3a5f); }
  header #status { color: var(--bar-ink); opacity: 0.85; }
  header #status.failed { color: #ffd2cc; opacity: 1; }
  header #status.saved { color: #bdf2cc; opacity: 1; }
  header .count { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 12px;
                  font-weight: 600; background: #f4b6ae; color: #6d1d16; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.01em; margin: 0 12px 0 0; }
  select, input, textarea, button { font: inherit; color: var(--ink); }
  select, input, textarea { background: var(--input); border: 1px solid #c3cac3; border-radius: 8px; padding: 6px 9px; }
  @media (prefers-color-scheme: dark) { select, input, textarea { border-color: #3b434c; } }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
           transition: background 0.12s, border-color 0.12s; }
  button:hover { border-color: var(--accent); background: var(--accent-bg); }
  .bar button.current { outline: 2px solid var(--accent); font-weight: 600; }
  #status { margin-left: auto; color: var(--muted); font-size: 13.5px; }
  #status.saved { color: var(--ok); } #status.failed { color: var(--error); font-weight: 600; }
  #warnings { margin: 0; padding: 8px 16px; background: var(--error-bg); color: var(--error); }
  #intro { margin: 0; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--accent-bg); }
  #intro[hidden] { display: none; }
  #intro p { margin: 0 0 4px 0; }
  #warnings:empty { display: none; }
  #warnings li { white-space: pre-line; }
  .typepick { display: flex; gap: 6px; margin: 6px 0; }
  .explain p { margin: 6px 0; }
  .gaps { background: var(--error-bg); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .gaps ul { list-style: none; margin: 6px 0 0; padding: 0; }
  .gaps li { margin-top: 6px; }
  .addbox { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: 6px; }
  .addbox input { width: min(420px, 100%); }
  main { display: grid; grid-template-columns: 250px 1fr; gap: 16px; padding: 16px; }
  .workgrid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .textcol { position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow: auto; }

  .classpanel { max-height: 40vh; overflow: auto; }
  .classopt { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
              border-radius: 0; padding: 6px 4px; background: transparent; }

  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  nav { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px;
        max-height: calc(100vh - 88px); overflow: auto; position: sticky; top: 72px; align-self: start; }
  nav button { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 6px 8px; margin: 1px 0; }
  nav button.current { background: var(--accent-bg); outline: 0; box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
  nav button:hover { background: var(--tint); }
  nav .badge { float: right; font-size: 13px; margin-left: 6px; }
  nav .small { color: var(--muted); font-size: 12px; }
  section.card { background: var(--panel); border: 1px solid transparent; border-radius: 12px; padding: 16px 20px;
                 margin-bottom: 16px; min-width: 0; box-shadow: var(--shadow); }
  h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  label.finished { font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  #text { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 45vh; overflow: auto; font-size: 15.5px; line-height: 1.65;
          border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; background: var(--paper); }
  mark { background: var(--soft); color: inherit; border-radius: 2px; cursor: pointer; }
  mark.active { background: var(--strong); outline: 1px solid var(--flag); }
  mark.shared { box-shadow: inset 0 -2px 0 var(--muted); }   /* the source text of more than one ground truth triple */
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  ul.hint { padding-left: 18px; }
  ul.hint li { margin: 2px 0; }
  .row { border: 1px solid var(--line); border-left: 4px solid var(--stripe); border-radius: 10px; padding: 12px 14px;
         margin-bottom: 12px; background: var(--tint); }
  .row.active { border-color: var(--accent); border-left-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .rowhead { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .rowfoot { display: flex; justify-content: flex-end; margin-top: 8px; }
  .rowfoot button.deltriple { padding: 2px 10px; font-size: 12.5px; font-weight: 400; color: var(--ink); white-space: nowrap; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; margin-left: 6px; }
  .pill.error { background: var(--error-bg); color: var(--error); }
  .pill.flag { background: var(--flag-bg); color: var(--flag); }

  .headline button { padding: 4px 10px; }
  .headline .listtoggle { color: var(--accent); }
  .headmeta { margin: 4px 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
  .headmeta .pill { margin-left: 6px; }
  button.pill.jump { border: 0; cursor: pointer; font: inherit; font-size: 12px; }
  .patterns { margin: 0; }
  .patterns button.patbtn { font-size: 12px; padding: 1px 8px; margin-right: 6px; }

  .patterns .patlist ul { margin: 4px 0; padding-left: 18px; }
  button.pill.jump:hover { filter: brightness(0.95); text-decoration: underline; }
  body.norecords main { grid-template-columns: 1fr; }

  button.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; font-weight: 600; }

  @media (prefers-color-scheme: dark) { button.primary { color: #10181b; } }
  label.finished { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 4px 10px; }
  .hintbox { margin-top: 8px; }
  .hintbox summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
  /* a triple's parts, each its own group: subject + subject class, predicate, object + object class; then the
     pattern buttons and the source text. A thin line and some space between groups. */
  /* the component class column is a third of the width, or wider when a component class's longest word needs it */
  .triple .group { display: grid; grid-template-columns: minmax(0, 1fr) minmax(min-content, 34%); gap: 8px 10px; }
  .triple .group.wide { grid-template-columns: minmax(0, 1fr); }       /* the predicate: the triple's full width */
  .triple .group + .group, .row > .patterns, .row > .source { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
  .triple label, .source label { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; font-weight: 600;
                                 color: var(--label); min-width: 0; }
  .triple label input, .triple label textarea, .source label textarea { font-weight: 400; font-size: 14.5px; }
  .triple input, .triple textarea { width: 100%; min-width: 0; }
  textarea.grow { resize: none; overflow: hidden; line-height: 1.4; }
  /* a component class wraps only at spaces, never inside a word; a word wider than its field scrolls sideways */
  .triple .nobreak { overflow-wrap: normal; word-break: normal; min-width: 130px; }
  textarea.grow.nobreak, .fixed.nobreak { overflow-x: auto; }
  .triple label.f-subj { color: var(--subj); } .triple label.f-pred { color: var(--pred); } .triple label.f-obj { color: var(--obj); }
  .f-subj input, .f-subj textarea { background: var(--subj-bg); }
  .f-pred input, .f-pred textarea { background: var(--pred-bg); }
  .f-obj input, .f-obj textarea { background: var(--obj-bg); }
  .f-subj input, .f-subj textarea, .f-pred input, .f-pred textarea, .f-obj input, .f-obj textarea { color: var(--ink); }
  .schematable th { background: var(--tint); }
  .schemaview h3 { color: var(--accent); }
  .triple .cls { font-size: 13px; }
  .triple .def { font-weight: 400; font-size: 12px; }
  @media (max-width: 800px) { .triple .group { grid-template-columns: 1fr; } }
  .source textarea { width: 100%; }
  .source .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }   /* under the source text */
  .problems { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; }
  .problems li { padding: 3px 8px; border-radius: 5px; margin-top: 3px; }
  .problems li.error { background: var(--error-bg); color: var(--error); }
  .problems li.flag { background: var(--flag-bg); color: var(--flag); }
  .fixed { border: 1px dashed #c3cac3; border-radius: 8px; padding: 6px 9px; color: var(--muted); font-weight: 400;
           font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }                      /* written by code, shown only */
  .empty { color: var(--muted); }
  .name { font-weight: 600; }                 /* a view's or section's name, *written so* in the README and guidelines */
  #help { position: fixed; inset: 0; z-index: 5; background: rgba(0, 0, 0, 0.45); display: flex;
          justify-content: center; align-items: flex-start; padding: 40px 16px; overflow: auto; }
  #help[hidden] { display: none; }
  .helpbox.wide { max-width: 1240px; }
  .schemafilter { width: 100%; margin: 12px 0; }
  .schemagrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .schemagrid { grid-template-columns: 1fr; } }
  .schematable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .schematable th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 6px;
                    border-bottom: 1px solid var(--line); }

  .schematable td.schemauses { text-align: right; color: var(--muted); }
  .helpbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 28px 24px;
             max-width: 860px; width: 100%; box-shadow: 0 10px 30px rgba(16, 24, 40, 0.18); }
  .helpbody { line-height: 1.65; }
  .helpbody p, .helpbody li { max-width: 76ch; }
  .helpbody p { margin: 0 0 12px; }
  .helpbody h3 { font-size: 16.5px; font-weight: 600; margin: 22px 0 8px; }
  .helpbody h3:first-child { margin-top: 4px; font-size: 19px; }
  .helpbody ol, .helpbody ul { padding-left: 24px; margin: 0 0 12px; }
  .helpbody li { margin: 0 0 8px; }
  .helpbody code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 13.5px; }
  .helpbody pre { background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow: auto; }
  .helpbody a, .ref.doclink { color: var(--accent); text-decoration: none; cursor: pointer; }
  .helpbody a:hover, .ref.doclink:hover { text-decoration: underline; }
  .ref.term { border-bottom: 1px dotted var(--muted); cursor: help; }      /* a term: its definition on hover, click to open */
  #intro { box-shadow: var(--shadow); }
  #intro .helpbody p { margin: 0 0 6px; }
  .part { font-size: 12px; border-radius: 10px; padding: 0 7px; border: 1px solid var(--line); }
  .part.held-out { color: var(--flag); background: var(--flag-bg); border-color: var(--flag); }
  .part.tuning { color: var(--accent); background: var(--accent-bg); border-color: var(--accent); }
  .kind { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--line);
          border-radius: 10px; padding: 0 7px; margin-right: 6px; vertical-align: middle; }
  .maprow.todo { border-left: 4px solid var(--flag); }
  .example { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--bg);
             border-radius: 6px; padding: 6px 8px; margin-top: 6px; overflow-wrap: anywhere; white-space: pre-wrap; }
  /* the translation table: tabs (Entity classes, Predicates), search and filters, then one compact box per row:
     current schema → ground truth schema (names, then definitions, in two aligned columns), flags at the bottom */
  .mapcard { padding: 12px 16px; }
  .maptabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .maptab { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 14px; font-weight: 600; color: var(--navy); }
  .maptab.current { background: var(--navy); border-color: var(--navy); color: var(--panel); }
  .maptab.current .mapcount { background: var(--panel); }
  .maptab.current:hover { background: var(--navy); filter: brightness(1.1); }
  .maptab .mapcount { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 0 7px; background: var(--navy-bg); color: var(--navy); }
  .maptab .pill { margin-left: 0; }
  .mapfilters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 0; }
  .mapfilters .mapsearch { flex: 1 1 260px; min-width: 0; }
  .mapfilters label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .maphead, .mapgrid { display: grid; grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr); column-gap: 8px; }
  .maphead { position: sticky; top: 60px; z-index: 1; background: var(--navy-bg); color: var(--navy); font-size: 12px;
             font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 12px 6px 15px;
             border-radius: 8px; margin-bottom: 6px; }
  .mapbox { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; background: var(--panel);
            padding: 8px 12px 8px; margin-bottom: 6px; }
  .mapbox.todo { border-left-color: var(--flag); }
  .mapbox:hover { border-color: var(--stripe); }
  .mapbox.todo:hover { border-left-color: var(--flag); }
  /* an entity class or predicate never breaks inside a word: one line, cut with … (the full text in its tooltip);
     in the tool's own typeface, like every other name in the tool */
  .mapname { min-width: 0; font-size: 14.5px; font-weight: 600;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: center; }
  .mapname select { width: 100%; font: inherit; padding: 3px 8px; text-overflow: ellipsis; }
  .mapname select.none { color: var(--muted); font-style: italic; font-weight: 400; }
  .maparrow { color: var(--sky); display: flex; justify-content: center; align-self: center; }
  .maparrow svg { width: 30px; height: 30px; }
  .maphead .maparrow { color: var(--navy); }
  .maphead .maparrow svg { width: 22px; height: 22px; }
  .mapdef { font-size: 13px; line-height: 1.45; color: var(--label); margin-top: 4px; overflow-wrap: break-word; }
  .mapdef.empty { color: var(--muted); font-style: italic; }
  /* reviewers' comments (annotations/reviews/): under an entry, and the Reviewer comments view */
  .reviewnotes { margin-top: 8px; padding: 6px 10px; border-left: 3px solid var(--sky); background: var(--sky-bg);
                 border-radius: 6px; }
  .reviewnotes .reviewhead { font-size: 12px; font-weight: 600; color: var(--navy); text-transform: uppercase;
                             letter-spacing: 0.04em; }
  .reviewnote { margin-top: 4px; }
  .reviewnote .who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .reviewnote .reviewtext { font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: break-word; }
  /* what the ground truth leaves out on purpose (annotations/left_out.md): under a record's triples, and the Left out view */
  details.leftout { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  details.leftout > summary { cursor: pointer; color: var(--navy); font-weight: 600; font-size: 14px; }
  .leftitem { margin-top: 8px; padding: 6px 10px; border-left: 3px solid var(--line); border-radius: 6px; background: var(--tint);
              font-size: 13.5px; line-height: 1.45; overflow-wrap: break-word; }
  .leftitem .leftmatter, .leftitem .leftnote, .leftitem .leftq, .leftitem .leftrule { margin-top: 3px; }
  .leftitem .leftmatter .pill { margin-left: 0; }
  .leftitem .leftq .pill { margin-left: 0; margin-right: 4px; }
  .leftprob { color: var(--flag); }
  .reviewgroup .mapdef { margin-top: 2px; }
  .reviewgroup h4 { margin: 0; font-size: 14.5px; }
  .mapbox .example { margin-top: 6px; padding: 3px 8px; font-family: inherit; font-size: 13px; background: var(--tint);
                    overflow-wrap: break-word; }
  .mapflags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; padding-top: 6px;
              border-top: 1px dashed var(--line); font-size: 13px; }
  .mapflags .pill { margin-left: 0; }
  .mapflags .pill.jump { white-space: normal; text-align: left; }      /* a long flag wraps at spaces, never inside a word */
  .mapflag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px 1px 6px; border-radius: 999px;
             background: var(--tint); border: 1px solid var(--line); color: var(--label); cursor: pointer; white-space: nowrap; }
  .mapflag.on { background: var(--sky-bg); border-color: var(--sky); color: var(--navy); font-weight: 600; }
  .mapflag.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .mapflag input { margin: 0; }
  .mapflags .mapdelete { margin-left: auto; padding: 1px 10px; font-size: 12.5px; }
  .mapbox .problems { margin-top: 6px; }
  .mapempty { padding: 12px 4px; }
  /* partial pairs: one compact box per pair, in the translation table's style: the record on top, then the two
     triples side by side, each under its label, then the verdict buttons at the bottom */
  .pairhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 600; }
  .pairhead .pairpos { color: var(--muted); }
  .pairhead .part { font-weight: 400; }
  .pairgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 16px; margin-top: 8px; }
  .pairside { min-width: 0; }
  .pairside + .pairside { border-left: 1px solid var(--line); padding-left: 16px; }
  .pairlabel { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--navy);
               background: var(--navy-bg); border-radius: 6px; padding: 3px 8px; margin-bottom: 6px; }
  .pairpart { display: grid; grid-template-columns: 7.2em minmax(0, 1fr); column-gap: 8px; padding: 2px 0;
              font-size: 14px; line-height: 1.45; }
  .pairtag { font-size: 12px; font-weight: 600; padding-top: 1px; }
  .pairtag.f-subj { color: var(--subj); } .pairtag.f-pred { color: var(--pred); } .pairtag.f-obj { color: var(--obj); }
  .pairval { min-width: 0; overflow-wrap: break-word; }
  /* a subject instance, predicate, or object instance that differs between the two triples, once evened out: filled on
     both sides, the words only that side has a stronger shade */
  .pairpart { padding: 2px 6px; border-radius: 6px; }
  .pairpart.differs { background: var(--soft); }
  .pairextra, .pairlegend .swatch.extra { background: var(--strong); border-radius: 3px; font-weight: 600; }
  .pairlegend .swatch { padding: 0 5px; border-radius: 4px; background: var(--soft); color: var(--ink); }
  .pairbox details { margin-top: 8px; }
  .pairbox summary { cursor: pointer; }
  .pairtext { white-space: pre-wrap; overflow-wrap: break-word; max-height: 40vh; overflow: auto; margin-top: 4px;
              padding: 8px 12px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); }
  .pairexplain p { margin: 0 0 6px; }
  .pairexplain ul { margin: 0 0 8px; padding-left: 18px; }
  .pairexplain li { margin: 2px 0; }
  .mapflag.no { background: var(--flag-bg); border-color: var(--flag); color: var(--flag); font-weight: 600; }
  .mapflags .pairverdict { margin-left: auto; }
  @media (max-width: 700px) {
    .pairgrid { grid-template-columns: minmax(0, 1fr); }
    .pairside + .pairside { border-left: 0; padding-left: 0; border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
  }

  /* ---------------------------------------------------------------- the look: one palette, navy and sky blue on paper;
     Libre Franklin (chosen 2026-10-14, from eight samples), JetBrains Mono for anything code-like */
  :root {
    --bg: #f3f0ea; --panel: #fffdfa; --paper: #fffaf0; --tint: #f7f3ec; --line: #dcd5c9;
    --ink: #1f2933; --muted: #66707a; --label: #3e4a56;
    --navy: #1f3a5f; --navy-bg: #e7edf5; --sky: #3f7cc0; --sky-bg: #dcebfb; --steel-bg: #e8ebf5;
    --accent: var(--navy); --accent-bg: var(--navy-bg);
    --subj: #11777a; --subj-bg: #e6f4f3; --pred: #b0567a; --pred-bg: #fdeef4; --obj: #6f4a8e; --obj-bg: #f2ecf8;
    --soft: #f6e3b4; --strong: #efc36a;
    --bar: var(--navy); --bar-ink: #fdfaf3; --bar-soft: rgba(255, 255, 255, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181c; --panel: #1c2127; --paper: #1f2329; --tint: #222830; --line: #2e353d;
      --ink: #e9e4da; --muted: #9aa3ab; --label: #c3c9cf;
      --navy: #8fb0d6; --navy-bg: #1f2c3b; --sky: #7fb0e3; --sky-bg: #1b2a3a; --steel-bg: #222838;
      --subj: #6fd0cc; --subj-bg: #17292a; --pred: #f0b0c8; --pred-bg: #2e2027; --obj: #c3a6e3; --obj-bg: #251f2e;
      --soft: #4a3d1c; --strong: #6b5419;
      --bar: #172b45; --bar-ink: #ece6da; --bar-soft: rgba(255, 255, 255, 0.10);
    }
  }
  body { font-family: "Libre Franklin", "Segoe UI", system-ui, sans-serif; font-size: 15px; background: var(--bg); }
  header { background: var(--bar); box-shadow: none; border-bottom: 3px solid #6f9fd2; }
  @media (prefers-color-scheme: dark) { header { border-bottom-color: #3d6596; } }
  header h1 button { background: transparent; border: 0; color: var(--bar-ink); font: inherit; font-weight: 600;
                     font-size: 17px; padding: 4px 10px 4px 0; letter-spacing: 0.01em; }
  .pencil { display: inline-block; width: 24px; height: 24px; margin-left: 8px; vertical-align: -6px; }
  .pencil svg { width: 100%; height: 100%; }
  header h1 button:hover { background: transparent; text-decoration: underline; text-underline-offset: 4px; }
  header nav.tabs .tab.current, header nav.tabs .tab.current > button { background: var(--bar-ink); color: #1f3a5f; }

le 1 of *Writing a classed triple* in the annotation guidelines How a dataset's data are laid out over the ground is, so far, written in each record's own words: \"swath\", \"Polar-Gridded\", \"spatially gridded\", \"map\", \"gridded\". I am not sure whether to keep those words, or to use a closed list of values instead, the same few words for every record of the catalog. To decide, I need to know: (a) Is the spatial representation, for the records of this catalog, a closed set of values? Beyond swath and gridded, which layouts occur? The CF conventions name the layouts of data that are not on a grid, their discrete sampling geometries: a single point, a time series at one place, a trajectory (e.g. an aircraft's or a ship's track), a vertical profile, a time series of profiles, and a trajectory of profiles (Eaton, Gregory, Drach, Taylor, Hankin, et al., NetCDF Climate and Forecast (CF) Metadata Conventions, version 1.13, 17 December 2025, chapter 9, Discrete Sampling Geometries, Table 9.1; https://cfconventions.org/, doi:10.5281/zenodo.17801666). Which of these occur in this catalog, and are there others? (b) Is a Planetary Data System \"map\" product gridded? For example, the record \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" says \"These data are maps of fast neutron residual count rates\". (c) Is \"Polar-Gridded\" (in the example below) gridded, on a polar grid? That is, would it be the value gridded, plus a separate fact about which grid? The same for the record \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\", whose title ends in \"Global 1km SIN Grid\", the MODIS sinusoidal grid (checked, see below): should a record's grid be a fact of its own, written with the predicate BINNED_INTO and a Grid, as the record \"MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0\" already has: \"pixels\" (Dataset) BINNED_INTO \"integerized sinusoidal area grid (ISEAG)\" (Grid)? And does a polar grid say anything about the area the data cover: do \"Polar-Gridded\" data cover only the polar regions, or the whole Earth, laid out on a grid drawn around a pole? The example states no area, so I wrote none for it. The record \"MODIS/Terra Land Surface Temperature/Emissivity Daily L3 Global 1km SIN Grid V006\" ends in the same \"Global 1km SIN Grid\", and its notes add \"with 1 kilometer (km) spatial resolution in a 1,200 by 1,200 km grid\". My reading, not checked against a source: \"1,200 by 1,200 km\" is the size of one tile of that grid. Is it, and should that size be a fact of its own, about the grid, or about how much ground each of the dataset's files covers? (d) What kinds of thing collect the data of this catalog, and for each kind, which spatial representations occur? My guess is below: please complete or correct it. What collects the data Spatial representations I expect a satellite swath; gridded an aircraft, or a ship a track (a trajectory) a ground station a point; a time series at one place an instrument that measures along the vertical (e.g. a balloon) a vertical profile others? ? The records I have read so far write a layout in these words: \"5 minutes of swath data\" (written down as \"swath\"), \"Polar-Gridded\", \"spatially gridded (L3)\" (written down as \"spatially gridded\"), \"These data are maps\" (\"map\") and \"gridded Level 2 product\" (\"gridded\"). The example below writes its layout in two ways, \"Polar-Gridded\" in its title and \"gridded\" in its notes. Checked on 2026-10-25: \"SIN Grid\" is the MODIS sinusoidal grid, and \"Global 1km SIN Grid\" is the standard end of the titles of the MODIS products made on it, so \"Global\" there names the grid's worldwide tiling (NASA LAADS, the MCD19A2 product page, https://ladsweb.modaps.eosdis.nasa.gov/missions-and-measurements/products/MCD19A2; NASA MODAPS, MCD19A2N, https://modaps.modaps.eosdis.nasa.gov/services/about/products/c61-nrt/MCD19A2N.html). Whether that grid is a fact of its own is still question (c). Undecided, leaning towards option 2, a closed list, if the answers to (a) and (d) give a list that covers the catalog. Until then, the ground truth keeps each record's own words (option 1). Aquarius L3 Weekly Polar-Gridded Sea Surface Salinity V005 This data set consists of weekly gridded Level-3 products of Aquarius L-band radiometer Sea Surface Salinity (SSS) retrievals from the Aquarius/Satélite de Aplicaciones Científicas (SAC-D) mission, developed collaboratively between the U.S. National Aeronautics and Space Administration (NASA) and Argentina's space agency, Comisión Nacional de Actividades Espaciales (CONAE). 2705e0d1-95e7-4588-813b-ca91a6da94ff SpatialRepresentation how data are laid out over the ground; for a satellite, this is typically either along the satellite's path, as observed (swath), or on a fixed map grid (gridded) HAS_SPATIAL_REPRESENTATION lays out its data as Grid a fixed set of cells that data values are collected into, e.g. ISEAG BINNED_INTO its values were collected into the cells of this Grid Keep each record's own words Each record keeps its own words for its layout, as written (rule 1 of Writing a classed triple): \"swath\", \"Polar-Gridded\", \"spatially gridded\", \"map\", \"gridded\". A closed list A short list of layouts (swath, gridded, and the others your answers to (a) and (d) name), and each record's layout is written as the value of the list its words mean, in place of its own words: \"spatially gridded\" becomes \"gridded\"."}, {"id": "Q2", "number": 2, "title": "Mission or Spacecraft, when a mission and its spacecraft are written with the same words?", "status": "open", "priority": "high", "question_kind": "schema entry", "topic": "the ground truth schema's Mission and Spacecraft, and FROM_MISSION and FROM_SPACECRAFT", "line": 129, "records": [{"line": 151, "source_texts": [{"text": "This is a Rosetta Radio Science data set", "line": 157}, {"text": "ROSETTA-ORBITER", "line": 158}], "triples": [{"subject": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ES hat the record states. Never add what you know from elsewhere, and never write down what an unexplained code or abbreviation stands for.", "line": 178}, {"section": "Writing a classed triple", "rule": 1, "words": "Subject instance and object instance: the record's own words, as written.", "line": 179}, {"section": "Writing a classed triple", "rule": 4, "words": "Entity classes and predicates: the ground truth schema's, when one fits, so records name the same things the same way.", "line": 180}, {"section": "Writing a classed triple", "rule": 13, "words": "One thing, one wording, within a record.", "line": 181}], "methods": [], "options": [{"number": 1, "title": "Spacecraft where the words name the craft, Mission where they name the mission", "body": [{"p": "What the ground truth does now: FROM_SPACECRAFT when the record's words name the craft that carries the instrument (\"MODIS/Aqua\", \"DAWN\" at the start of a Planetary Data System title), FROM_MISSION when they name the mission (\"a Rosetta Radio Science data set\", \"the … mission\")."}], "consequences": ["No change to the ground truth triples listed under Affects, nor to the annotation guidelines.", "Each record needs a judgment, made from clues in its own words; two people may judge the same word differently, and so may the <a class=\"term\" data-term=\"model\" href=\"#terms\">model<\/a> when it extracts.", "A search of the knowledge graph for \"all data from DAWN\" has to look under both FROM_MISSION and FROM_SPACECRAFT."], "line": 185}, {"number": 2, "title": "Always Mission", "body": [{"p": "Every such word becomes FROM_MISSION, with the object instance a Mission, whether the record names the craft or the mission."}], "consequences": ["One choice for every record: easier to apply the same way.", "The ground truth triples with FROM_SPACECRAFT (listed under Affects) change to FROM_MISSION (\"DAWN\", \"Aqua\", \"ROSETTA-ORBITER\", \"Terra\").", "\"MODIS\" ABOARD \"Aqua\" (pool positions 2 and 4) would join an A-ORBITER\" (Spacecraft), from its title. For the record \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\", I wrote only \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" (Dataset) FROM_SPACECRAFT \"DAWN\" (Spacecraft), from its title, although DAWN is also the name of the mission."}], "answer": [], "notes": [{"p": "Of the <a class=\"term\" data-term=\"tuning records\" href=\"#terms\">tuning records<\/a> I have annotated so far, six name a mission or a spacecraft, at pool positions 1 to 6 (the one at pool position 6 is in the ground truth now); all their classed triples that the answer may change are listed under Affects. The example is the record at pool position 1; the record \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" is at pool position 5."}], "affects": {"records": [{"position": 1, "id": "cfd6ec3f-1e63-4a77-bc3f-007d45f7e2fc", "line": 236, "title": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0"}, {"position": 2, "id": "6cfafd07-40f1-46da-9d92-36c2bb319f0b", "line": 237, "title": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061"}, {"position": 3, "id": "2705e0d1-95e7-4588-813b-ca91a6da94ff", "line": 238, "title": "Aquarius L3 Weekly Polar-Gridded Sea Surface Salinity V005"}, {"position": 4, "id": "03a09af3-081e-4db6-9e3b-ea7c0e3138bd", "line": 239, "title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0"}, {"position": 5, "id": "99dff022-24ac-48cb-bc83-09fec8b90ad7", "line": 240, "title": "DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0"}, {"position": 6, "id": "4c64f3ed-39b4-4f95-95a0-022898ba47a4", "line": 241, "title": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid"}, {"position": 7, "id": "d5477563-0415-4e65-ab7c-d4bc9ed809e5", "line": 242, "title": "MODIS/Terra Land Surface Temperature/Emissivity Daily L3 Global 1km SIN Grid V006"}, {"position": 9, "id": "dc4ff01b-12f0-4235-8c8a-afb4bfb3bdbb", "line": 243, "title": "STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0"}, {"position": 10, "id": "3bceffb4-f01e-4 our field read it as the spacecraft, as the mission, or as both at once?", "(b) In a Planetary Data System data set title, such as \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" or \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\", is the first word the spacecraft that carried the instrument? My reading, not checked against a source: these titles start with the spacecraft, which the Planetary Data System calls the instrument host. The record \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" starts with \"STARDUST\", and its notes name the mission with other words, \"the Stardust-NExT mission\"; there I wrote both: \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" (Dataset) FROM_SPACECRAFT \"STARDUST\" (Spacecraft), and \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" (Dataset) FROM_MISSION \"Stardust-NExT\" (Mission). The record \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" starts with \"ROSETTA-ORBITER\", and its notes say \"acquired by the OSIRIS Narrow Angle Camera on the Rosetta spacecraft\"; I read the two as one spacecraft and wrote \"ROSETTA-ORBITER\", the wording that says more (rule 13): \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" (Dataset) FROM_SPACECRAFT \"ROSETTA-ORBITER\" (Spacecraft) and \"OSIRIS Narrow Angle Camera\" (Instrument) ABOARD \"ROSETTA-ORBITER\" (Spacecraft). Is the orbiter the same as \"the Rosetta spacecraft\" there?", "(c) \"Aquarius/Satélite de Aplicaciones Científicas (SAC-D) mission\" (in the record \"Aquarius L3 Weekly Polar-Gridded Sea Surface Salinity V005\"): my reading, not checked against a source, is that Aquarius was an instrument carried on the SAC-D spacecraft, and Aquarius/SAC-D the mission. Is that right, and if so, should the record's \"Aquarius L-band radiometer\" be the only Instrument here, with no Spacecraft named?", "(d) Is there a rule that holds for this whole catalog, e.g. \"a word that is only a mission's word is a Mission; a word written before an instrument (MODIS/Aqua) is a Spacecraft\"?"]}], "reading": [{"p": "Option 1, as the ground truth does now, because it follows the record's own words (rule 1 of <em>Writing a classed triple<\/em>) and adds nothing the record doesn't state. I would move to option 4 if your answers to (b) and (d) give a rule that holds across the catalog, since it would make the choice the same for every record."}], "terms": ["fact", "tuning records", "model"], "named_records": [{"title": "STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0", "line": 141}, {"title": "ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0", "line": 141}, {"title": "Aquarius L3 Weekly Polar-Gridded Sea Surface Salinity V005", "line": 142}, {"title": "DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0", "line": 149}], "fingerprint": "1ffef1e83f87", "shown": "Q2: Mission or Spacecraft, when a mission and its spacecraft are written with the same words? | fingerprint 1ffef1e83f87", "search": "Q2 Mission or Spacecraft, when a mission and its spacecraft are written with the same words? the ground truth schema's Mission and Spacecraft, and FROM_MISSION and FROM_SPACECRAFT Many records name where their data came from with one word that can mean a mission or the spacecraft that flew it: \"DAWN\", \"Aqua\", \"Terra\", \"Rosetta\", \"Aquarius\". The ground truth schema has an entity class for each, Mission (\"a named spaceflight effort\") and Spacecraft (\"a craft that operates in space\"), and a predicate for each, FROM_MISSION and FROM_SPACECRAFT. When a record writes only such a word, I have to choose one of the two, and the fact I write down depends on that choice. To decide, I need to know: (a) When a record says only \"DAWN\", \"Aqua\" or \"Terra\", without the word \"mission\" or \"satellite\" next to it, would someone in your field read it as the spacecraft, as the mission, or as both at once? (b) In a Planetary Data System data set title, such as \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" or \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\", is the first word the spacecraft that carried the instrument? My reading, not checked against a source: these titles start with the spacecraft, which the Planetary Data System calls the instrument host. The record \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" starts with \"STARDUST\", and its notes name the mission with other words, \"the Stardust-NExT mission\"; there I wrote both: \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" (Dataset) FROM_SPACECRAFT \"STARDUST\" (Spacecraft), and \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" (Dataset) FROM_MISSION \"Stardust-NExT\" (Mission). The record \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" starts with \"ROSETTA-ORBITER\", and its notes say \"acquired by the OSIRIS Narrow Angle Camera on the Rosetta spacecraft\"; I read the two as one spacecraft and wrote \"ROSETTA-ORBITER\", the wording that says more (rule 13): \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" (Dataset) FROM_SPACECRAFT \"ROSETTA-ORBITER\" (Spacecraft) and \"OSIRIS Narrow Angle Camera\" (Instrument) ABOARD \"ROSETTA-ORBITER\" (Spacecraft). Is the orbiter the same as \"the Rosetta spacecraft\" there? (c) \"Aquarius/Satélite de Aplicaciones Científicas (SAC-D) mission\" (in the record \"Aquarius L3 Weekly Polar-Gridded Sea Surface Salinity V005\"): my reading, not checked against a source, is that Aquarius was an instrument carried on the SAC-D spacecraft, and Aquarius/SAC-D the mission. Is that right, and if so, should the record's \"Aquarius L-band radiometer\" be the only Instrument here, with no Spacecraft named? (d) Is there a rule that holds for this whole catalog, e.g. \"a word that is only a mission's word is a Mission; a word written before an instrument (MODIS/Aqua) is a Spacecraft\"? The example below has both. So far I have used Mission where the record writes the word \"mission\" or a mission's data set (\"a Rosetta Radio Science data set\", \"the Aquarius/… (SAC-D) mission\"), and Spacecraft where the word names the craft that carries the instrument (\"MODIS/Aqua\", \"on board the Aqua satellite\", \"DAWN\" in the title, \"ROSETTA-ORBITER\"). For the example, I wrote \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\" (Dataset) FROM_MISSION \"Rosetta\" (Mission), from \"a Rosetta Radio Science data set\", and \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\" (Dataset) FROM_SPACECRAFT \"ROSETTA-ORBITER\" (Spacecraft), from its title. For the record \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\", I wrote only \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" (Dataset) FROM_SPACECRAFT \"DAWN\" (Spacecraft), from its title, although DAWN is also the name of the mission. Option 1, as the ground truth does now, because it follows the record's own words (rule 1 of Writing a classed triple) and adds nothing the record doesn't state. I would move to option 4 if your answers to (b) and (d) give a rule that holds across the catalog, since it would make the choice the same for every record. ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0 This is a Rosetta Radio Science data set, collected during the COMET ESCORT 4 phase 2015-10-22 to 2015-12-31. It is a Global Gravity measurement at the comet 67P and covers the time 2015-11-01T19:58:35.000 to 2015-11-02T04:59:27.000. cfd6ec3f-1e63-4a77-bc3f-007d45f7e2fc Mission a named spaceflight effort Spacecraft a craft that operates in space Instrument a device that takes measurements FROM_MISSION came from this Mission FROM_SPACECRAFT was collected from this Spacecraft ABOARD is carried on Mission Mission A planned space or flight undertaking, such as a satellite mission, balloon program, or spaceflight of a given duration, carried out to accomplish scientific objectives. Spacecraft Spacecraft A vehicle or platform, such as a satellite, aircraft, or balloon, that carries instruments to collect observations. Spacecraft where the words name the craft, Mission where they name the mission What the ground truth does now: FROM_SPACECRAFT when the record's words name the craft that carries the instrument (\"MODIS/Aqua\", \"DAWN\" at the start of a Planetary Data System title), FROM_MISSION when they name the mission (\"a Rosetta Radio Science data set\", \"the … mission\"). Always Mission Every such word becomes FROM_MISSION, with the object instance a Mission, whether the record names the craft or the mission. Both, a Mission and a Spacecraft Every such word gives two ground truth triples, FROM_MISSION and FROM_SPACECRAFT, with the same words. A rule by where the record comes from A rule per part of the catalog, e.g. in a Planetary Data System title, the first word is the Spacecraft (the instrument host); in an Earth science record, \"<instrument>/<word>\" names the Spacecraft; the word \"mission\" names the Mission."}, {"id": "Q3", "number": 3, "title": "Variable or PhysicalQuantity: what is measured, and what is computed?", "status": "open", "priority": "high", "question_kind": "schema entry", "topic": "the ground truth schema's Variable and PhysicalQuantity, and HAS_MEASUREMENTS_OF, HAS_VARIABLE and ESTIMATES", "line": 287, "records": [{"line": 315, "source_texts": [{"text": "global NASA skin sea surface temperature (SST) products", "line": 321}, {"text": "SST MID-IR", "line": 322}, {"text": "The first is a skin SST produced for both day and night (NSST)", "line": 323}, {"text": "the SST derived from these measurements is identified as SST4", "line": 324}], "triples": [{"subject": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "subject_class": "Dataset", "predicate": "HAS_MEASUREMENTS_OF", "object": "skin sea surface temperature (SST)", "object_class": "PhysicalQuantity", "line": 325}, {"subject": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "subject_class": "Dataset", "predicate": "HAS_VARIABLE", "object": "SST4", "object_class": "Variable", "line": 326}, {"subject": "skin SST (NSST)", "subject_class": "Variable", "predicate": "ESTIMATES", "object": "skin sea surface temperature (SST)", "object_class": "PhysicalQuantity", "line": 327}, {"subject": "SST4", "subject_class": "Variable", "predicate": "ESTIMATES", "object": "SST", "object_class": "PhysicalQuantity", "line": 328}], "in_ground_truth": true, "not_yet": "", "record id": "03a09af3-081e-4db6-9e3b-ea7c0e3138bd", "pool position": 4, "title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "notes": "Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution. Aqua was launched by NASA on May 4, 2002, into a sun synchronous, polar orbit with a daylight ascending node at 13:30, formation flying in the A-train with other Earth Observation Satellites (EOS), to study the global dynamics of the Earth atmosphere, land and oceans. MODIS captures data in 36 spectral bands at a variety of spatial resolutions. Two SST products can be present in these files. The first is a skin SST produced for both day and night (NSST) observations, derived from the long wave IR 11 and 12 micron wavelength channels, using a modified nonlinear SST algorithm intended to provide continuity of SST derived from heritage and current NASA sensors. At night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4"}], "schema": [{"kind": "entity class", "entry": "PhysicalQuantity", "definition": "a property that can be measured, in general, whatever method measures it, e.g. sea surface temperature; snow cover", "line": 332}, {"kind": "entity class", "entry": "Variable", "definition": "one named kind of value computed from an Instrument's measurements by one particular Algorithm, e.g. SST4; NDSI", "line": 333}, {"kind": "entity class", "entry": "Algorithm", "definition": "a method applied to data to compute a result, e.g. a series of screens; a modified nonlinear SST algorithm", "line": 334}, {"kind": "entity class", "entry": "SpatialExtent", "definition": "the area the data cover, of the CelestialBody they are about: all of it (global) or part of it (e.g. the Arctic; the south pole of Mars)", "line": 335}, {"kind": "entity class", "entry": "CelestialBody", "definition": "a natural object in space", "line": 336}, {"kind": "predicate", "entry": "HAS_MEASUREMENTS_OF", "definition": "holds measurements of", "line": 337}, {"kind": "predicate", "entry": "HAS_VARIABLE", "definition": "holds this Variable in its files", "line": 338}, {"kind": "predicate", "entry": "ESTIMATES", "definition": "gives approximate values for", "line": 339}, {"kind": "predicate", "entry": "COMPUTED_FROM", "definition": "was made by processing this input", "line": 340}, {"kind": "predicate", "entry": "PRODUCED_USING_ALGORITHM", "definition": "was made or detected by applying this Algorithm", "line": 34 y V005\" (Dataset) HAS_MEASUREMENTS_OF \"Sea Surface Salinity (SSS)\" (PhysicalQuantity). Should every quantity a record calls a \"retrieval\" be a Variable instead, since an algorithm computed it? (e) The record \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\" says \"It is a Global Gravity measurement at the comet 67P\", and I wrote \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\" (Dataset) HAS_MEASUREMENTS_OF \"Gravity\" (PhysicalQuantity) and \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\" (Dataset) HAS_SPATIAL_COVERAGE \"Global\" (SpatialExtent). Is \"Gravity\" the quantity measured (the comet's gravity field)? Or is \"Global Gravity\" the name of a kind of radio science measurement, as a whole, beside \"Occultation\" and \"Solar Conjunction\", which other records of the catalog name in the same sentence? If these are kinds of measurement: what is measured in each, in plain words (for example, my reading, not checked against a source: an occultation measures the atmosphere the radio signal passes through)? (f) \"Aerosol Optical Depth\" (in the record \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\") is what the record's product holds, computed by MAIAC (\"Multi-Angle Implementation of Atmospheric Correction (MAIAC) Land Aerosol Optical Depth gridded Level 2 product\"). I wrote it as a PhysicalQuantity, a property of the atmosphere that other methods could measure too, and MAIAC as the method. Is that right, or is it a Variable, since one algorithm computed it? (g) The same record says \"The MCD19A2N product provides the atmospheric properties and view geometry\", and I wrote \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\" (Dataset) HAS_MEASUREMENTS_OF \"atmospheric properties\" (PhysicalQuantity) and \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\" (Dataset) HAS_MEASUREMENTS_OF \"view geometry\" (PhysicalQuantity). Is \"atmospheric properties\" hat should be written: the images as the layout of the data, the unit as a fact of its own, or something else? (j) The record \"Ensemble X-Ray Variability of AGN in 2XMMi-DR3\" says its sources were matched with a quasar catalog \"to obtain redshifts and spectral classifications for the sources\". I wrote \"Ensemble X-Ray Variability of AGN in 2XMMi-DR3\" (Dataset) HAS_MEASUREMENTS_OF \"redshifts\" (PhysicalQuantity) and the same with \"spectral classifications\" (PhysicalQuantity). A redshift is a property that can be measured. Is a spectral classification (the label a source's spectrum is given, such as the type of quasar) a PhysicalQuantity too, or a label of its own? The example below holds both: a PhysicalQuantity, and two Variables that estimate it. The record \"MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061\" says its snow cover is \"detected using Normalized Difference Snow Index (NDSI) and a series of screens\", and \"The NDSI is derived from radiance data\"; the record \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" says \"These data are maps of fast neutron residual count rates\"; and the record \"Aquarius L3 Weekly Polar-Gridded Sea Surface Salinity V005\" says \"Aquarius L-band radiometer Sea Surface Salinity (SSS) retrievals\". The sentence of the record \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\" recurs across the catalog. I counted it in the records of the catalog (020's records.jsonl, 36,406 records, harvested before 2026-10-24): \"It is a Global Gravity measurement\" in 2,835 records (2,442 of them \"at the comet 67P\"), \"It is a Occultation measurement\" in 439, \"It is a Solar Conjunction measurement\" in 240, and \"It is a Phobos Gravity measurement\" in 9. Since \"Phobos Gravity\" sits beside \"Global Gravity\", my reading is that the word before \"Gravity\" says which gravity measurement it is, not an area; but I don't know. (Whether \"Global\" can be an area at a comet at all, I ask separately; here the question is only what is measured.) Option 1, because the two definitions already separate what is measured from the values an algorithm computes, and most records annotated so far fit them; \"Aerosol Optical Depth\" stays a PhysicalQuantity, since my reading is that other methods measure it too. Your answers to (b) and (c) decide whether the NDSI and the count rates need an entity class of their own (options 2 and 4). For (e), I lean towards \"Global Gravity\" whole (option 5, or its last consequence), because \"Phobos Gravity\" in other records reads like the same kind of name, with no area in it. MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0 Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution. Aqua was launched by NASA on May 4, 2002, into a sun synchronous, polar orbit with a daylight ascending node at 13:30, formation flying in the A-train with other Earth Observation Satellites (EOS), to study the global dynamics of the Earth atmosphere, land and oceans. MODIS captures data in 36 spectral bands at a variety of spatial resolutions. Two SST products can be present in these files. The first is a skin SST produced for both day and night (NSST) observations, derived from the long wave IR 11 and 12 micron wavelength channels, using a modified nonlinear SST algorithm intended to provide continuity of SST derived from heritage and current NASA sensors. At night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4 03a09af3-081e-4db6-9e3b-ea7c0e3138bd PhysicalQuantity a property that can be measured, in general, whatever method measures it, e.g. sea surface temperature; snow cover Variable one named kind of value computed from an Instrument's measurements by one particular Algorithm, e.g. SST4; NDSI Algorithm a method applied to data to compute a result, e.g. a series of screens; a modified nonlinear SST algorithm SpatialExtent the area the data cover, of the CelestialBody they are about: all of it (global) or part of it (e.g. the Arctic; the south pole of Mars) CelestialBody a natural object in space HAS_MEASUREMENTS_OF holds measurements of HAS_VARIABLE holds this Variable in its files ESTIMATES gives approximate values for COMPUTED_FROM was made by processing this input PRODUCED_USING_ALGORITHM was made or detected by applying this Algorithm HAS_SPATIAL_COVERAGE covers this area HAS_TARGET is about this CelestialBody PhysicalQuantity PhysicalQuantity A measurable physical property or variable, such as temperature, wind speed, water vapor, or emission distribution, that is observed or derived in a dataset. MEASURES HAS_MEASUREMENTS_OF The subject (an instrument, mission, dataset or product) measures or provides data on the object, a physical quantity, variable or phenomenon. PROVIDES HAS_MEASUREMENTS_OF The subject (an instrument, data center, product or dataset) supplies or produces the object, a data product, measurement, variable or information layer. MEASURED_BY HAS_MEASUREMENTS_OF Links a measured quantity to the instrument, system or method used to measure it. Keep the line as the definitions draw it A PhysicalQuantity for a property of what is observed (snow cover, sea surface salinity, gravity, aerosol optical depth); a Variable for a named value one algorithm computes (SST4, NDSI, the count rates). An entity class of its own for an index Coin an entity class for an index computed from other values (the NDSI), apart from Variable and PhysicalQuantity. Every computed quantity is a Variable A quantity the record says was retrieved or computed (\"Sea Surface Salinity (SSS) retrievals\", the aerosol optical depth MAIAC computes) is a Variable; a PhysicalQuantity only where the record names the property alone. An entity class of its own for what an instrument records Coin an entity class for what the instrument itself records, before any conversion (count rates, radiances), apart from Variable. A kind of measurement of its own Coin an entity class for a kind of measurement (for example, MeasurementType), with \"Global Gravity\", \"Occultation\" and \"Solar Conjunction\" as its object instances, and a predicate joining a Dataset to it; what is measured (gravity, for example) stays a PhysicalQuantity, where the record names it."}, {"id": "Q4", "number": 4, "title": "Where a dataset's data come from: which relationships to tell apart, and what carries the instruments?", "status": "open", "priority": "high", "question_kind": "schema entry", "topic": "the ground truth schema's FROM_MISSION, FROM_SPACECRAFT, ACQUIRED_BY_INSTRUMENT, HAS_MISSION_PHASE and OBTAINS_DATA_FROM, its Spacecraft, Mission and MissionPhase, and the translation table's rows for the current schema's SOURCED_FROM, platforms and campaigns", "line": 492,

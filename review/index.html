ED_FROM", "line": 698}, {"kind": "predicate", "crt": "PROVIDED_BY", "line": 699}, {"kind": "entity class", "crt": "Aircraft", "line": 700}, {"kind": "entity class", "crt": "Campaign", "line": 701}, {"kind": "entity class", "crt": "Program", "line": 702}], "entries": [{"kind": "entity class", "entry": "Spacecraft", "line": 703}, {"kind": "entity class", "entry": "Mission", "line": 704}, {"kind": "entity class", "entry": "MissionPhase", "line": 705}, {"kind": "predicate", "entry": "FROM_MISSION", "line": 706}, {"kind": "predicate", "entry": "FROM_SPACECRAFT", "line": 707}, {"kind": "predicate", "entry": "ACQUIRED_BY_INSTRUMENT", "line": 708}, {"kind": "predicate", "entry": "HAS_MISSION_PHASE", "line": 709}, {"kind": "predicate", "entry": "OBTAINS_DATA_FROM", "line": 710}], "rules": [{"section": "Writing a classed triple", "rule": 4, "line": 711}, {"section": "Writing a classed triple", "rule": 5, "line": 712}], "methods": [{"path": "040_induce_schema/run.py", "what": "how the current schema is learned (option 3: splitting a broad predicate)", "line": 713}, {"path": "common/common_helpers/component_class_mapping.py", "what": "how a row of the translation table translates (option 2: by the entity class of the object)", "line": 714}]}, "question": [{"p": "A record often says where its data came from: an instrument, the craft that carried it, a mission, a phase of a mission, a field campaign, or the data center that holds the data. The ground truth schema has one predicate for each of several of these (FROM_MISSION, FROM_SPACECRAFT, ACQUIRED_BY_INSTRUMENT, HAS_MISSION_PHASE, OBTAINS_DATA_FROM), and its Spacecraft is \"a craft that operates in space\", its Mission \"a named spaceflight effort\". The schema the <a class=\"term\" data-term=\"model\" href=\"#terms\">model<\/a> extracts with, the current schema, learned from other records of the catalog, draws these lines differently: it has mostly one broad predicate for all of them, SOURCED_FROM, which the translation table translates to (none), nothing in the ground truth schema; its Spacecraft includes aircraft and balloons, and its Mission includes balloon programs. So a <a class=\"term\" data-term=\"fact\" href=\"#terms\">fact<\/a> of FROM_MISSION or FROM_SPACECRAFT, when the model extracts it under SOURCED_FROM, can't count as found, and the same aircraft counts differently depending on which word of the current schema the model used. I would like to know:"}, {"ul": ["(a) For a dataset of this catalog, which of these are different relationships that someone in your field would ask about separately: the instrument, the craft that carried it (a spacecraft, or an aircraft, ship, balloon, ground station), the mission, the phase of a mission, the field campaign, the data center?", "(b) Which of them could be one relationship, \"comes from\", without losing anything you would search for?", "(c) Are there others a record of this catalog often states that are missing from that list?", "(d) Is an aircraft or a balloon that carries instruments the same kind of thing as a spacecraft, for this catalog (a \"platform\" in Earth science)? Should the ground truth schema have one entity class for anything that carries instruments, or keep spacecraft apart?", "(e) Is a space station (the International Space Station) a spacecraft?", "(f) Is a field campaign (a period of aircraft or balloon measurements) a phase of a mission, a mission of its own, or something else?", "(g) Is a scientific program (for example, a telescope's legacy program) a mission?"]}], "reading": [{"p": "Options 2 to 4 are about the predicates, options 5 and 6 about the entity classes, so one of each can be combined. For the predicates, option 3, then option 2 for what it leaves mixed: they keep the ground truth schema's distinctions, which follow what the records state, and fix the cause in the current schema, while option 4 throws the distinctions away. Your answers to (a) and (b) tell me which distinctions are worth keeping. For the entity classes, undecided: option 5 looks closer to how Earth science data are described, but no record annotated so far needs it, nor option 6; your answers to (d) and (f) decide them."}], "terms": ["model", "fact", "rows", "tuning records", "step"], "named_records": [], "fingerprint": "89230f23d8e3", "shown": "Q4: Where a dataset's data come from: which relationships to tell apart, and what carries the instruments? | fingerprint 89230f23d8e3", "search": "Q4 Where a dataset's data come from: which relationships to tell apart, and what carries the instruments? the ground truth schema's FROM_MISSION, FROM_SPACECRAFT, ACQUIRED_BY_INSTRUMENT, HAS_MISSION_PHASE and OBTAINS_DATA_FROM, its Spacecraft, Mission and MissionPhase, and the translation table's rows for the current schema's SOURCED_FROM, platforms and campaigns A record often says where its data came from: an instrument, the craft that carried it, a mission, a phase of a mission, a field campaign, or the data center that holds the data. The ground truth schema has one predicate for each of several of these (FROM_MISSION, FROM_SPACECRAFT, ACQUIRED_BY_INSTRUMENT, HAS_MISSION_PHASE, OBTAINS_DATA_FROM), and its Spacecraft is \"a craft that operates in space\", its Mission \"a named spaceflight effort\". The schema the model extracts with, the current schema, learned from other records of the catalog, draws these lines differently: it has mostly one broad predicate for all of them, SOURCED_FROM, which the translation table translates to (none), nothing in the ground truth schema; its Spacecraft includes aircraft and balloons, and its Mission includes balloon programs. So a fact of FROM_MISSION or FROM_SPACECRAFT, when the model extracts it under SOURCED_FROM, can't count as found, and the same aircraft counts differently depending on which word of the current schema the model used. I would like to know: (a) For a dataset of this catalog, which of these are different relationships that someone in your field would ask about separately: the instrument, the craft that carried it (a spacecraft, or an aircraft, ship, balloon, ground station), the mission, the phase of a mission, the field campaign, the data center? (b) Which of them could be one relationship, \"comes from\", without losing anything you would search for? (c) Are there others a record of this catalog often states that are missing from that list? (d) Is an aircraft or a balloon that carries instruments the same kind of thing as a spacecraft, for this catalog (a \"platform\" in Earth science)? Should the ground truth schema have one entity class for anything that carries instruments, or keep spacecraft apart? (e) Is a space station (the International Space Station) a spacecraft? (f) Is a field campaign (a period of aircraft or balloon measurements) a phase of a mission, a mission of its own, or something else? (g) Is a scientific program (for example, a telescope's legacy program) a mission? The example below names an instrument, the spacecraft that carries it, and a data center. In the current schema, the model filed such facts under SOURCED_FROM, ACQUIRED_BY and COLLECTED_DURING (the translation table's rows for them are below). The example also says that the data center, JPL, \"acquires MODIS ocean L3 SST data from the OBPG\", which the ground truth writes with OBTAINS_DATA_FROM. None of the records I have read so far names an aircraft, a balloon, a space station or a field campaign; they come up in records the model read when it learned the current schema. Before the model's classed triples are compared with the ground truth, each entity class and predicate of the current schema is translated into the one of the ground truth schema its row of the translation table names; a row that names (none) means the model's classed triples with it count as not in the ground truth. Options 2 to 4 are about the predicates, options 5 and 6 about the entity classes, so one of each can be combined. For the predicates, option 3, then option 2 for what it leaves mixed: they keep the ground truth schema's distinctions, which follow what the records state, and fix the cause in the current schema, while option 4 throws the distinctions away. Your answers to (a) and (b) tell me which distinctions are worth keeping. For the entity classes, undecided: option 5 looks closer to how Earth science data are described, but no record annotated so far needs it, nor option 6; your answers to (d) and (f) decide them. MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0 Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution. Aqua was launched by NASA on May 4, 2002, into a sun synchronous, polar orbit with a daylight ascending node at 13:30, formation flying in the A-train with other Earth Observation Satellites (EOS), to study the global dynamics of the Earth atmosphere, land and oceans. MODIS captures data in 36 spectral bands at a variety of spatial resolutions. Two SST products can be present in these files. The first is a skin SST produced for both day and night (NSST) observations, derived from the long wave IR 11 and 12 micron wavelength channels, using a modified nonlinear SST algorithm intended to provide continuity of SST derived from heritage and current NASA sensors. At night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4 03a09af3-081e-4db6-9e3b-ea7c0e3138bd Spacecraft a craft that operates in space Mission a named spaceflight effort MissionPhase a named phase of a Mission FROM_MISSION came from this Mission FROM_SPACECRAFT was collected from this Spacecraft ACQUIRED_BY_INSTRUMENT was collected by this Instrument HAS_MISSION_PHASE was collected during this MissionPhase OBTAINS_DATA_FROM receives data from DEVELOPED_BY_PARTY was built or created by this Person, Team, or Organization SOURCED_FROM (none) The subject (a dataset, file, objective or person) originates from the object, a source instrument, platform, observation set, data portion or institution. ACQUIRED_BY ACQUIRED_BY_INSTRUMENT The subject (a dataset or observed class of objects) is collected or detected by the object, an instrument or platform. COLLECTED_DURING HAS_MISSION_PHASE The subject (a dataset, campaign, mission activity or event) took place or was gathered during the object, a time period or named field campaign. PROVIDED_BY (none) The subject (a product, campaign or responsibility) is supplied, conducted or overseen by the object, an organization, team or instrument mission. Spacecraft Spacecraft A vehicle or platform, such as a satellite, aircraft, or balloon, that carries instruments to collect observations. SpaceStation Spacecraft A crewed orbiting space station, such as the International Space Station, used as a platform for research and observation. Aircraft (none) A crewed or research airplane used as a platform for airborne observations or measurements. Mission Mission A planned space or flight undertaking, such as a satellite mission, balloon program, or spaceflight of a given duration, carried out to accomplish scientific objectives. Campaign (none) A coordinated period of field or flight measurement activity, such as an aircraft or balloon campaign, conducted to collect data. Program (none) A named organized scientific initiative, often a telescope legacy or key program, encompassing coordinated observations and data products. Keep the ground truth schema and the translation table as they are SOURCED_FROM, an aircraft, a campaign and a program (current schema) translate to (none); a space station to Spacecraft; the current schema's Spacecraft and Mission to the ground truth schema's Spacecraft and Mission; \"collected during\" to HAS_MISSION_PHASE. Translate SOURCED_FROM by the entity class of its object A row of the translation table could say: SOURCED_FROM (current schema) with a Mission as object instance translates to FROM_MISSION (ground truth schema), with a Spacecraft to FROM_SPACECRAFT, and with anything else to (none). Today a row translates a predicate one way only, whatever its object. Let the current schema split SOURCED_FROM into one predicate per sense When the current schema is learned (step 040), a broad predicate whose object instances are of several entity classes is split into one predicate per entity class, each of which the translation table can translate on its own. One \"comes from\" predicate in the ground truth schema Merge the ground truth schema's predicates for the senses your answer to (b) says can be one. One entity class for anything that carries instruments The ground truth schema's Spacecraft is widened (or a new entity class, for example Platform, takes its place) to any craft or station that carries instruments: satellites, aircraft, balloons, ships, space stations. Campaigns of their own Coin an entity class for a field campaign (for example, Campaign) and a predicate for \"collected during\" a campaign, apart from MissionPhase."}, {"id": "Q5", "number": 5, "title": "Time in a record: temporal resolution, the time a file covers, and the period a dataset covers", "status": "open", "priority": "high", "question_kind": "schema entry", "topic": "the ground truth schema's TemporalResolution, Time and Value, its HAS_TEMPORAL_RESOLUTION, HAS_GRANULE_DURATION and HAS_TIME_SPAN, and the translation table's rows for the current schema's Frequency, HAS_TIME_RESOLUTION, COVERS and HAS_DURATION", "line": 716, "records": [{"line": 742, "source_texts": [{"text": "provides daily snow cover", "line": 750}, {"text": "Each data granule contains 5 minutes of swath data", "line": 751}, {"text": "5 minutes of swath data", "line": 752}, {"text": "This global Level-2 (L2) data set", "line": 753}], "triples": [{"subject": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061", "subject_class": "Dataset", "predicate": "HAS_TEMPORAL_RESOLUTION", "object": "daily", "object_class": "TemporalResolution", "line": 754}, {"subject": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061", "subject_class": "Dataset", "predicate": "HAS_GRANULE_DURATION", "object": "5 minutes", "object_class": "Value", "line": 755}, {"subject": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061", "subject_class": "Dataset", "predicate": "HAS_SPATIAL_REPRESENTATION", "object": "swath", "object_class": "SpatialRepresentation", "line": 756}, {"subject": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061", "subject_class": "Dataset", "predicate": "HAS_SPATIAL_COVERAGE", "object": "global", "object_class": "SpatialExtent", "line": 757}], "in_ground_truth": true, "not_yet": "", "record id": "6cfafd07-40f1-46da-9d92-36c2bb319f0b", "pool position": 2, "title": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061", "notes": "This global Level-2 (L2) data set provides daily snow cover detected using Normalized Difference Snow Index (NDSI) and a series of screens designed to alleviate errors and flag uncertain snow cover detections. The NDSI is derived from radiance data acquired by the Moderate Resolution Imaging Spectroradiometer (MODIS) on board the Aqua satellite: DOI:10.5067/MODIS/MYD02HKM.061 and DOI:10.5067/MODIS/MYD021KM.061. Each data granule contains 5 minutes of swath data observed at a resolution of 500 m.\n\nThe terms \"Version 61\" and \"Collection 6.1\" are used interchangeably in reference to this release of MODIS data."}], "schema": [{"kind": "entity class", "entry": "TemporalResolution", "definition": "the amount of time between one value of the data and the next, e.g. daily; weekly (8 day)", "line": 761}, {"kind": "entity class", "entry": "Time", "definition": "a point or period on the calendar, which happens once, e.g. March 11, 2016 19:08:03; May 4, 2002; the first week of February 2003; 2015-10-22 to 2015-12-31", "line": 762}, {"kind": "entity class", "entry": "Value", "definition": "an amount, as a number with its unit or in words, e.g. 36 spectral bands; 5 minutes", "line": 763}, {"kind": "predicate", "entry": "HAS_TEMPORAL_RESOLUTION", "definition": "gives values this often, e.g. daily; weekly (8 day)", "line": 764}, {"kind": "predicate", "entry": "HAS_GRANULE_DURATION", "definition": "each of its files covers this much time", "line": 765}, {"kind": "predicate", "entry": "HAS_TIME_SPAN", "definition": "covers this period", "line": 766}, {"kind": "predicate", "entry": "HAS_SPATIAL_COVERAGE", "definition": "covers this area", "line": 767}], "rows": [{"kind": "entity class", "crt": "Frequency", "gtt": "TemporalResolution", "swap": false, "definition": "A rate of occurrence, such as daily or weekly, or a radio frequency band, such as S-, X-, or Ku-band.", "line": 771}, {"kind": "predicate", "crt": "HAS_TIME_RESOLUTION", "gtt": "HAS_TEMPORAL_RESOLUTION", "swap": false, "definition": "The subject (a dataset or measurement) has the object as its temporal resolution, averaging interval, cycle or file time-period.", "line": 772}, {"kind": "predicate", "crt": "COVERS", "gtt": "HAS_TIME_SPAN", "swap": false, "definition": "The subject (a dataset, campaign, flight series or technique) spans the object, a time period, geographic area or measured variable.", "line": 773}, {"kind": "predicate", "crt": "HAS_DURATION", "gtt": "HAS_GRANULE_DURATION", "swap": false, "definition": "The subject (a dataset, granule, orbit portion or observation series) lasts for or spans the object, a time length or period.", "line": 774}], "rules": [{"section": "Writing a classed triple", "rule": 9, "words": "A qualifier that is a temporal resolution, an area the data cover, a processing level, a spatial resolution, a country, a time of day, or a target body is a ground truth triple of its own, and is taken out of the instance.", "line": 778}, {"section": "Writing a classed triple", "rule": 11, "words": "General facts: include them, unless they're about another dataset that the record's dataset isn't made from or part of.", "line": 779}, {"section": "Writing a classed triple", "rule": 11, "words": "Leave out facts about another dataset, unless the record's dataset is made from it or is part of it; for example, leave them out if the other dataset is a variant of the record's dataset (the same data at another temporal resolution, spatial resolution, or version), or is made from the record's dataset. In every case, include the fact of how the two datasets are connected.", "line": 780}, {"section": "Writing a classed triple", "rule": 11, "words": "Suppose: a record's title says \"8 Day\", and its notes say \"daily, weekly (8 day), and monthly products are available from this instrument's output\". Then: the record's dataset HAS_TEMPORAL_RESOLUTION \"weekly (8 day)\", its own (by rule 13, it says more than \"8 Day\"); the daily and monthly products are variants of the record's dataset, and the record states no connection beyond that, so they get none.", "line": 781}], "methods": [], "options": [{"number": 1, "title": "Keep the ground truth schema and the translation table as they are", "body": [{"p": "Any word that says how often values come, or the period they average over (\"daily\", \"weekly\", \"weekly (8 day)\"), is a TemporalResolution, in the record's own words; the rows stay: Frequency into TemporalResolution, COVERS into HAS_TIME_SPAN, HAS_DURATION into HAS_GRANULE_DURATION."}], "consequences": ["No change to the ground truth triples listed under Affects.", "\"daily\" for a dataset of 5-minute swath files and \"daily\" for a dataset with one value per place per day look the same, though they may mean different things (your answer to (a)).", "An area or a variable the model writes with COVERS, a whole series' duration written with HAS_DURATION, and a radio band filed under Frequency are compared with the wrong ground truth predicate or entity class, and counted wrong."], "line": 785}, {"number": 2, "title": "Tell apart how often from the period a value averages over", "body": [{"p": "TemporalResolution only for the time between one value and the next; a new entity class, and a new predicate, for the period one value averages over (\"8 day\" in an 8-day average)."}], "consequences": ["The ground truth triple \"weekly (8 day)\" (pool position 4) may become two, or move to the new predicate, depending on your answer to (b).", "One more entity class and predicate in the ground truth schema, for the annotation guidelines and the model to tell apart."], "line": 789}, {"number": 3, "title": "No temporal resolution for a swath dataset", "body": [{"p": "Where the dataset's files hold what the instrument saw along its path, \"daily\" is not a temporal resolution, so it gets no ground truth triple of HAS_TEMPORAL_RESOLUTION; it would be a different relationship (\"is made daily\"), or none."}], "consequences": ["The ground truth triple \"daily\" (pool position 2) i iple", "rule": 11, "line": 868}], "methods": [{"path": "040_induce_schema/run.py", "what": "how the current schema is learned (option 4: splitting a broad predicate or entity class)", "line": 869}]}, "question": [{"p": "The ground truth schema has three entity classes for time: Time, \"a point or period on the calendar, which happens once\"; TemporalResolution, \"the amount of time between one value of the data and the next, e.g. daily; weekly (8 day)\"; and Value, \"an amount\", which HAS_GRANULE_DURATION uses for how much time each file covers. Its predicates for time are HAS_TEMPORAL_RESOLUTION (\"gives values this often\"), HAS_GRANULE_DURATION (\"each of its files covers this much time\") and HAS_TIME_SPAN (\"covers this period\"). Some records' words for time fit more than one of them, and the schema the <a class=\"term\" data-term=\"model\" href=\"#terms\">model<\/a> extracts with, the current schema, learned from other records of the catalog, draws the lines more widely (its entries are in the translation table, below). I would like to know:"}, {"ul": ["(a) The record \"MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061\", the example below, is a Level-2 swath dataset whose files each hold \"5 minutes of swath data\", and the record says it \"provides daily snow cover\". Is \"daily\" its temporal resolution, the time between one value and the next? My reading, not checked against a source: each file holds what the instrument saw along its path in those 5 minutes, and \"daily\" says how often the product is made, or how often the instrument passes over the same ground, not the time between two values in a file.", "(b) The record \"MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0\" is an \"8 Day\" average (\"Average daily, weekly (8 day), monthly and annual skin SST products\"). Its 8 days are both the time each value averages over and the time between one value and the next. Is that one thing, a temporal resolution, or two that should be told apart (the period a value averages over, and how often a value is given)?", "(c) Is the line between Time (a date or period that happens once), TemporalResolution (how often), and the time a file covers (HAS_GRANULE_DURATION, a Value) the one you would draw?", "(d) Is a granule, for this catalog, always one file? The ground truth schema's HAS_GRANULE_DURATION says \"each of its files\", reading the example below that way.", "(e) Is \"each file (granule) covers 5 minutes\" the same kind of fact as \"the observation series lasted 3 years\"? Would someone searching this catalog want them kept apart?", "(f) In this catalog, when a record says a dataset \"covers\" something, is it more often a period, an area, or a measured variable? Should \"covers the Arctic\" and \"covers 2003 to 2010\" ever share one predicate?", "(g) The current schema's entity class Frequency puts two things together: \"A rate of occurrence, such as daily or weekly, or a radio frequency band, such as S-, X-, or Ku-band\", and the translation table translates it into TemporalResolution. In this catalog, are how often data are given (daily, weekly) and a radio frequency band (S-band, X-band, Ku-band) two different kinds of thing, which should never share an entity class? (My reading is that they are: one is a time between values, the other a part of the radio spectrum. Where a radio band belongs, I ask separately.)", "(h) The record \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" says its data run \"from January, 2007, through cruise, approach to and encounter with comet 9P/Tempel 1, and up to end of mission in March, 2011\", and that its encounter data cover \"a ~40 minute period\". I wrote the period as \"January, 2007 up to March, 2011\" (Time), its two ends in the record's words with the phases taken out (they are facts of their own), and the 40 minutes with a predicate I coined, HAS_DURATION (\"covers this much time, from its first value to its last\"): \"encounter data\" (Dataset) HAS_DURATION \"~40 minute period\" (Value). Is how long a set of observations lasts a fact to keep apart from the period on the calendar, and from the time a file covers (question (e))?"]}], "reading": [{"p": "Option 1 for now, because the definition of TemporalResolution covers the records I have read so far as they are written and needs no knowledge from outside the record; and option 4 later. If your answer to (a) is that \"daily\" means something else for a swath dataset, I would move to option 3 for those datasets; if your answer to (b) is that the averaging period is a separate thing, to option 2. Your answer to (e) decides whether the ground truth schema also needs a predicate for how long a whole series lasted."}], "terms": ["model", "row", "step", "tuning records", "fact"], "named_records": [{"title": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061", "line": 727}, {"title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "line": 728}, {"title": "STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0", "line": 734}, {"title": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0", "line": 740}], "fingerprint": "44eca17464f7", "shown": "Q5: Time in a record: temporal resolution, the time a file covers, and the period a dataset covers | fingerprint 44eca17464f7", "search": "Q5 Time in a record: temporal resolution, the time a file covers, and the period a dataset covers the ground truth schema's TemporalResolution, Time and Value, its HAS_TEMPORAL_RESOLUTION, HAS_GRANULE_DURATION and HAS_TIME_SPAN, and the translation table's rows for the current schema's Frequency, HAS_TIME_RESOLUTION, COVERS and HAS_DURATION The ground truth schema has three entity classes for time: Time, \"a point or period on the calendar, which happens once\"; TemporalResolution, \"the amount of time between one value of the data and the next, e.g. daily; weekly (8 day)\"; and Value, \"an amount\", which HAS_GRANULE_DURATION uses for how much time each file covers. Its predicates for time are HAS_TEMPORAL_RESOLUTION (\"gives values this often\"), HAS_GRANULE_DURATION (\"each of its files covers this much time\") and HAS_TIME_SPAN (\"covers this period\"). Some records' words for time fit more than one of them, and the schema the model extracts with, the current schema, learned from other records of the catalog, draws the lines more widely (its entries are in the translation table, below). I would like to know: (a) The record \"MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061\", the example below, is a Level-2 swath dataset whose files each hold \"5 minutes of swath data\", and the record says it \"provides daily snow cover\". Is \"daily\" its temporal resolution, the time between one value and the next? My reading, not checked against a source: each file holds what the instrument saw along its path in those 5 minutes, and \"daily\" says how often the product is made, or how often the instrument passes over the same ground, not the time between two values in a file. (b) The record \"MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0\" is an \"8 Day\" average (\"Average daily, weekly (8 day), monthly and annual skin SST products\"). Its 8 days are both the time each value averages over and the time between one value and the next. Is that one thing, a temporal resolution, or two that should be told apart (the period a value averages over, and how often a value is given)? (c) Is the line between Time (a date or period that happens once), TemporalResolution (how often), and the time a file covers (HAS_GRANULE_DURATION, a Value) the one you would draw? (d) Is a granule, for this catalog, always one file? The ground truth schema's HAS_GRANULE_DURATION says \"each of its files\", reading the example below that way. (e) Is \"each file (granule) covers 5 minutes\" the same kind of fact as \"the observation series lasted 3 years\"? Would someone searching this catalog want them kept apart? (f) In this catalog, when a record says a dataset \"covers\" something, is it more often a period, an area, or a measured variable? Should \"covers the Arctic\" and \"covers 2003 to 2010\" ever share one predicate? (g) The current schema's entity class Frequency puts two things together: \"A rate of occurrence, such as daily or weekly, or a radio frequency band, such as S-, X-, or Ku-band\", and the translation table translates it into TemporalResolution. In this catalog, are how often data are given (daily, weekly) and a radio frequency band (S-band, X-band, Ku-band) two different kinds of thing, which should never share an entity class? (My reading is that they are: one is a time between values, the other a part of the radio spectrum. Where a radio band belongs, I ask separately.) (h) The record \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" says its data run \"from January, 2007, through cruise, approach to and encounter with comet 9P/Tempel 1, and up to end of mission in March, 2011\", and that its encounter data cover \"a ~40 minute period\". I wrote the period as \"January, 2007 up to March, 2011\" (Time), its two ends in the record's words with the phases taken out (they are facts of their own), and the 40 minutes with a predicate I coined, HAS_DURATION (\"covers this much time, from its first value to its last\"): \"encounter data\" (Dataset) HAS_DURATION \"~40 minute period\" (Value). Is how long a set of observations lasts a fact to keep apart from the period on the calendar, and from the time a file covers (question (e))? The example below states both how often (\"daily\") and how much time each file covers (\"5 minutes\"). Under rule 9 of Writing a classed triple (quoted below), a word such as \"daily\" in \"daily snow cover\" is taken out of the object instance and written as a temporal resolution of its own. I write these facts with different predicates of the ground truth schema: HAS_TIME_SPAN for a period (the record \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\": \"covers the time 2015-11-01T19:58:35.000 to 2015-11-02T04:59:27.000\"), HAS_SPATIAL_COVERAGE for an area, and HAS_GRANULE_DURATION for the time each file covers (the example below). Before the model's classed triples are compared with the ground truth, each entity class and predicate of the current schema is translated into the one of the ground truth schema its row of the translation table names, and a row names only one. So a classed triple of the model that uses COVERS for an area is compared as a period, and one that files a radio band under Frequency is compared as a temporal resolution: both are counted wrong even when the model found the fact. Option 1 for now, because the definition of TemporalResolution covers the records I have read so far as they are written and needs no knowledge from outside the record; and option 4 later. If your answer to (a) is that \"daily\" means something else for a swath dataset, I would move to option 3 for those datasets; if your answer to (b) is that the averaging period is a separate thing, to option 2. Your answer to (e) decides whether the ground truth schema also needs a predicate for how long a whole series lasted. MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061 This global Level-2 (L2) data set provides daily snow cover detected using Normalized Difference Snow Index (NDSI) and a series of screens designed to alleviate errors and flag uncertain snow cover detections. The NDSI is derived from radiance data acquired by the Moderate Resolution Imaging Spectroradiometer (MODIS) on board the Aqua satellite: DOI:10.5067/MODIS/MYD02HKM.061 and DOI:10.5067/MODIS/MYD021KM.061. Each data granule contains 5 minutes of swath data observed at a resolution of 500 m. The terms \"Version 61\" and \"Collection 6.1\" are used interchangeably in reference to this release of MODIS data. 6cfafd07-40f1-46da-9d92-36c2bb319f0b TemporalResolution the amount of time between one value of the data and the next, e.g. daily; weekly (8 day) Time a point or period on the calendar, which happens once, e.g. March 11, 2016 19:08:03; May 4, 2002; the first week of February 2003; 2015-10-22 to 2015-12-31 Value an amount, as a number with its unit or in words, e.g. 36 spectral bands; 5 minutes HAS_TEMPORAL_RESOLUTION gives values this often, e.g. daily; weekly (8 day) HAS_GRANULE_DURATION each of its files covers this much time HAS_TIME_SPAN covers this period HAS_SPATIAL_COVERAGE covers this area Frequency TemporalResolution A rate of occurrence, such as daily or weekly, or a radio frequency band, such as S-, X-, or Ku-band. HAS_TIME_RESOLUTION HAS_TEMPORAL_RESOLUTION The subject (a dataset or measurement) has the object as its temporal resolution, averaging interval, cycle or file time-period. COVERS HAS_TIME_SPAN The subject (a dataset, campaign, flight series or technique) spans the object, a time period, geographic area or measured variable. HAS_DURATION HAS_GRANULE_DURATION The subject (a dataset, granule, orbit portion or observation series) lasts for or spans the object, a time length or period. Keep the ground truth schema and the translation table as they are Any word that says how often values come, or the period they average over (\"daily\", \"weekly\", \"weekly (8 day)\"), is a TemporalResolution, in the record's own words; the rows stay: Frequency into TemporalResolution, COVERS into HAS_TIME_SPAN, HAS_DURATION into HAS_GRANULE_DURATION. Tell apart how often from the period a value averages over TemporalResolution only for the time between one value and the next; a new entity class, and a new predicate, for the period one value averages over (\"8 day\" in an 8-day average). No temporal resolution for a swath dataset Where the dataset's files hold what the instrument saw along its path, \"daily\" is not a temporal resolution, so it gets no ground truth triple of HAS_TEMPORAL_RESOLUTION; it would be a different relationship (\"is made daily\"), or none. Let the current schema keep the meanings apart The step that learns the current schema splits a predicate whose object instances are of several entity classes into one predicate per entity class (COVERS with a period; COVERS with an area), and keeps how often data are given apart from a radio frequency band; each part gets its own row: into HAS_TIME_SPAN, into HAS_SPATIAL_COVERAGE, into TemporalResolution."}, {"id": "Q6", "number": 6, "title": "Processing levels: what is L2G, what are \"1/2/3\" in a Planetary Data System title, and which list should the ground truth follow?", "status": "open", "priority": "medium", "question_kind": "schema entry", "topic": "the ground truth schema's ProcessingLevel and HAS_PROCESSING_LEVEL, and a reference list of processing levels", "line": 871, "records": [{"line": 892, "source_texts": [{"text": "L2G", "line": 898}, {"text": "gridded Level 2 product", "line": 899}], "triples": [{"subject": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid", "subject_class": "Dataset", "predicate": "HAS_PROCESSING_LEVEL", "object": "Level 2", "object_class": "ProcessingLevel", "line": 900}, {"subject": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid", "subject_class": "Dataset", "predicate": "HAS_SPATIAL_REPRESENTATION", "object": "gridded", "object_class": "SpatialRepresentation", "line": 901}], "in_ground_truth": true, "not_yet": "", "record id": "4c64f3ed-39b4-4f95-95a0-022898ba47a4", "pool position": 6, "title": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid", "notes": "The Moderate Resolution Imaging Spectroradiometer (MODIS) Near Real Time (NRT) Combined Terra and Aqua Multi-Angle Implementation of Atmospheric Correction (MAIAC) Land Aerosol Optical Depth gridded Level 2 product (MCD19A2N) produced daily at 1 kilometer (km) pixel resolutions. The MCD19A2N product provides the atmospheric properties and view geometry used to calculate the MAIAC Land Surface Bidirectional Reflectance Factor (BRF) or surface reflectance, MCD19A1N product."}], "schema": [{"kind": "entity class", "entry": "  I would like to know:"}, {"ul": ["(a) The example below has \"L2G\" in its title and \"gridded Level 2 product\" in its notes. Is L2G \"Level 2, gridded\": a processing level (Level 2) plus a layout on a grid, which the ground truth writes as two <a class=\"term\" data-term=\"facts\" href=\"#terms\">facts<\/a>? Or is L2G a processing level of its own?", "(b) The record \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\", from the Planetary Data System, has \"RSI 1/2/3\" in its title. Are 1, 2 and 3 processing levels of the data from the instrument RSI? My reading, not checked against a source: they may be levels of a planetary data scale, but the record doesn't say so, and the annotation guidelines say never to write down what an unexplained code stands for, so the ground truth has no processing level for this record. If they are levels, are they CODMAC levels (my reading, not checked against a source: the Planetary Data System has numbered its data's processing levels by the CODMAC scale)? And what does \"1149\" stand for, in the same title's \"COMET ESCORT 4 1149 V1.0\"? If the Planetary Data System's data set names give it a fixed place with a fixed meaning, should the ground truth write it as a fact of its own? One answer about how these data set names are built would settle both codes. The record \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" has \"DFMI 2/3\" in its title, and its notes say \"This data set contains Level 2/3 (EDR/RDR) data\". I read \"2/3\" as two levels, paired in order with \"EDR/RDR\", and wrote two facts: \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" (Dataset) HAS_PROCESSING_LEVEL \"Level 2 (EDR)\" (ProcessingLevel) and \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" (Dataset) HAS_PROCESSING_LEVEL \"Level 3 (RDR)\" (ProcessingLevel). Is that pairing right, and does this record confirm the reading of \"1/2/3\" above? The record \"ROSETTA-ORBITER 67P/CAL ALICE 2 ESC1 V1.0\" has \"ALICE 2\" in its title, and its notes say \"This data set contains CODMAC level 2 data\", which I wrote as \"ROSETTA-ORBITER 67P/CAL ALICE 2 ESC1 V1.0\" (Dataset) HAS_PROCESSING_LEVEL \"CODMAC level 2\" (ProcessingLevel). Its title also has \"67P/CAL\", which the record doesn't explain, so I wrote nothing for \"CAL\": what does it stand for (my reading, not checked against a source: calibration)? The record \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" has three more such codes in its title: \"MTP020\" (after \"ESC3\", which its notes write as \"the COMET ESCORT 3 mission phase\"), \"RDR\" and \"INFLDSTR\"; for the last, the notes have \"in-field stray-light corrected\". I wrote nothing for \"MTP020\" and \"RDR\". What do they stand for?", "(c) Which list of processing levels should the ground truth follow? The one I know of is NASA Earthdata's <em>Data Processing Levels<\/em> (Level 0, Level 1A, 1B, 1C, Level 2, 2A, 2B, Level 3, 3A, Level 4; https://www.earthdata.nasa.gov/learn/earth-observation-data-basics/data-processing-levels). Does it hold for the whole catalog, or do records of other parts of NASA, e.g. the Planetary Data System, use other levels? If there are two lists, how do they line up?"]}], "reading": [{"p": "Option 1 for now, because it writes only the record's own words. I would move to option 2 or 3 if your answer to (c) gives one list that covers the catalog. For the example, I have written \"Level 2\" and \"gridded\" as two facts, my reading of \"gridded Level 2 product\"; your answer to (a) tells me whether that is right."}], "terms": ["facts", "model"], "named_records": [{"title": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0", "line": 883}, {"title": "STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0", "line": 883}, {"title": "ROSETTA-ORBITER 67P/CAL ALICE 2 ESC1 V1.0", "line": 883}, {"title": "ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0", "line": 883}, {"title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "line": 888}], "fingerprint": "0b0bf18aee94", "shown": "Q6: Processing levels: what is L2G, what are \"1/2/3\" in a Planetary Data System title, and which list should the ground truth follow? | fingerprint 0b0bf18aee94", "search": "Q6 Processing levels: what is L2G, what are \"1/2/3\" in a Planetary Data System title, and which list should the ground truth follow? the ground truth schema's ProcessingLevel and HAS_PROCESSING_LEVEL, and a reference list of processing levels The ground truth schema's ProcessingLevel is \"how far data have been processed from what the Instrument recorded, e.g. Level 2\". The records write it in many ways (\"Level-2 (L2)\", \"Level-3\", \"Level 3\", \"L2\", \"L2G\", and perhaps \"1/2/3\"), and so far the ground truth keeps each record's own words. I would like to know: (a) The example below has \"L2G\" in its title and \"gridded Level 2 product\" in its notes. Is L2G \"Level 2, gridded\": a processing level (Level 2) plus a layout on a grid, which the ground truth writes as two facts? Or is L2G a processing level of its own? (b) The record \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\", from the Planetary Data System, has \"RSI 1/2/3\" in its title. Are 1, 2 and 3 processing levels of the data from the instrument RSI? My reading, not checked against a source: they may be levels of a planetary data scale, but the record doesn't say so, and the annotation guidelines say never to write down what an unexplained code stands for, so the ground truth has no processing level for this record. If they are levels, are they CODMAC levels (my reading, not checked against a source: the Planetary Data System has numbered its data's processing levels by the CODMAC scale)? And what does \"1149\" stand for, in the same title's \"COMET ESCORT 4 1149 V1.0\"? If the Planetary Data System's data set names give it a fixed place with a fixed meaning, should the ground truth write it as a fact of its own? One answer about how these data set names are built would settle both codes. The record \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" has \"DFMI 2/3\" in its title, and its notes say \"This data set contains Level 2/3 (EDR/RDR) data\". I read \"2/3\" as two levels, paired in order with \"EDR/RDR\", and wrote two facts: \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" (Dataset) HAS_PROCESSING_LEVEL \"Level 2 (EDR)\" (ProcessingLevel) and \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" (Dataset) HAS_PROCESSING_LEVEL \"Level 3 (RDR)\" (ProcessingLevel). Is that pairing right, and does this record confirm the reading of \"1/2/3\" above? The record \"ROSETTA-ORBITER 67P/CAL ALICE 2 ESC1 V1.0\" has \"ALICE 2\" in its title, and its notes say \"This data set contains CODMAC level 2 data\", which I wrote as \"ROSETTA-ORBITER 67P/CAL ALICE 2 ESC1 V1.0\" (Dataset) HAS_PROCESSING_LEVEL \"CODMAC level 2\" (ProcessingLevel). Its title also has \"67P/CAL\", which the record doesn't explain, so I wrote nothing for \"CAL\": what does it stand for (my reading, not checked against a source: calibration)? The record \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" has three more such codes in its title: \"MTP020\" (after \"ESC3\", which its notes write as \"the COMET ESCORT 3 mission phase\"), \"RDR\" and \"INFLDSTR\"; for the last, the notes have \"in-field stray-light corrected\". I wrote nothing for \"MTP020\" and \"RDR\". What do they stand for? (c) Which list of processing levels should the ground truth follow? The one I know of is NASA Earthdata's Data Processing Levels (Level 0, Level 1A, 1B, 1C, Level 2, 2A, 2B, Level 3, 3A, Level 4; https://www.earthdata.nasa.gov/learn/earth-observation-data-basics/data-processing-levels). Does it hold for the whole catalog, or do records of other parts of NASA, e.g. the Planetary Data System, use other levels? If there are two lists, how do they line up? Of the records I have read so far, the example below is the one whose \"L2G\" I am least sure of. The record \"MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0\" has two levels: \"Level 3\" for its own dataset, and \"L2\" for the pixels it was made from (\"the L2 pixels are binned\"). The knowledge graph will be built from the records' metadata fields and the extracted triples. Two records that write one level in two wordings (\"Level 3\" and \"L3\") give two different object instances; a reference list would give one. Option 1 for now, because it writes only the record's own words. I would move to option 2 or 3 if your answer to (c) gives one list that covers the catalog. For the example, I have written \"Level 2\" and \"gridded\" as two facts, my reading of \"gridded Level 2 product\"; your answer to (a) tells me whether that is right. MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid The Moderate Resolution Imaging Spectroradiometer (MODIS) Near Real Time (NRT) Combined Terra and Aqua Multi-Angle Implementation of Atmospheric Correction (MAIAC) Land Aerosol Optical Depth gridded Level 2 product (MCD19A2N) produced daily at 1 kilometer (km) pixel resolutions. The MCD19A2N product provides the atmospheric properties and view geometry used to calculate the MAIAC Land Surface Bidirectional Reflectance Factor (BRF) or surface reflectance, MCD19A1N product. 4c64f3ed-39b4-4f95-95a0-022898ba47a4 ProcessingLevel how far data have been processed from what the Instrument recorded, e.g. Level 2 HAS_PROCESSING_LEVEL is processed to this ProcessingLevel ProcessingLevel ProcessingLevel A designation of how far a data product has been processed from raw instrument output, such as Level 0 through Level 3 or Near Real Time. HAS_PROCESSING_LEVEL HAS_PROCESSING_LEVEL The subject (a data product) has the object as its data processing level, such as L0, Level-2 or Level-3. Keep each record's own words The object instance of HAS_PROCESSING_LEVEL is the record's words, as written (\"Level-2 (L2)\", \"Level-3\", \"Level 3\", \"L2\"), and a code the record doesn't explain (\"1/2/3\") gets no ground truth triple. A closed list of process one in your field write each channel that way? (e) The record \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" says its data set \"contains solar stray-light corrected, in-field stray-light corrected, radiometric calibrated and geometric distortion corrected (resampled) image data\". Each word names a step and what it corrects, though only as a participle. I left each out for now (decided 2026-10-25, for me to confirm); they would be methods: \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" (Dataset) PRODUCED_USING_ALGORITHM \"solar stray-light corrected\" (Algorithm), and the same for \"in-field stray-light corrected\", \"radiometric calibrated\" and \"geometric distortion corrected (resampled)\". Elsewhere, where a record has only a verb (\"binned\", \"detrended\", \"convert\", \"cross-correlated\"), I wrote no method. Is a participle that names what was corrected or calibrated a method, and should it be written in the record's words (\"radiometric calibrated\") or as the name of the step (\"radiometric calibration\")? The example below has products computed from channels, and facts that say which channels are unique to MODIS. Settled, so not asked here: the record \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" says \"The nominal fast neutron count rates were detrended using the GRaND epithermal neutron map to produced this residual map\", and I wrote the epithermal neutron map as an input, COMPUTED_FROM, beside the count rates. A review of that record on 2026-10-22 checked NASA's archive documents for it: the epithermal neutron map is used to correct the fast neutron counts, so it is an input. No method is written for that record, since \"detrended\" names an operation but no algorithm with a name of its own. Option 1 until you answer, because the record's own words are \"derived from\", which read to me as an input used in the computation. If your answer to (a) is that a channel is not an input, I would choose option 2, since a ground truth triple should say what is true. Your answer to (c) would become part of rule 14. MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0 Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution. Aqua was launched by NASA on May 4, 2002, into a sun synchronous, polar orbit with a daylight ascending node at 13:30, formation flying in the A-train with other Earth Observation Satellites (EOS), to study the global dynamics of the Earth atmosphere, land and oceans. MODIS captures data in 36 spectral bands at a variety of spatial resolutions. Two SST products can be present in these files. The first is a skin SST produced for both day and night (NSST) observations, derived from the long wave IR 11 and 12 micron wavelength channels, using a modified nonlinear SST algorithm intended to provide continuity of SST derived from heritage and current NASA sensors. At night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. pment, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4"}], "schema": [{"kind": "entity class", "entry": "Organization", "definition": "a named institution or one of its named parts, not a Mission, e.g. NASA; OBPG", "line": 1176}, {"kind": "entity class", "entry": "Team", "definition": "a group of people without a name of its own, e.g. Peter Minnett and his team", "line": 1177}, {"kind": "entity class", "entry": "Role", "definition": "a position a Person, Team, or Organization holds, what they are, e.g. the official archive for SST", "line": 1178}, {"kind": "entity class", "entry": "Country", "definition": "a nation, e.g. U.S.; Argentina", "line": 1179}, {"kind": "predicate", "entry": "SERVES_AS", "definition": "holds this Role", "line": 1180}, {"kind": "predicate", "entry": "AFFILIATED_WITH", "definition": "works at or belongs to this Organization", "line": 1181}, {"kind": "predicate", "entry": "SPONSORED_BY_PARTY", "definition": "is sponsored by this Person, Team, or Organization", "line": 1182}, {"kind": "predicate", "entry": "BASED_IN", "definition": "belongs to this Country", "line": 1183}], "rows": [{"kind": "entity class", "crt": "Organization", "gtt": "Organization", "swap": false, "definition": "An institution, agency, center, or collaborative body, such as NASA, HEASARC, or CIESIN, responsible for producing, managing, or distributing data or research.", "line": 1187}, {"kind": "entity class", "crt": "Team", "gtt": "Team", "swap": false, "definition": "A group of people, such as investigators, specialists or institutional groups, working together on a mission, project or study.", "line": 1188}, {"kind": "entity class", "crt": "Program", "gtt": "(none)", "swap": false, "definition": "A named organized scientific initiative, often a tele y is a ground truth triple of its own, and is taken out of the instance.", "line": 1199}], "methods": [], "options": [{"number": 1, "title": "Keep the line as it is", "body": [{"p": "A named group or office is an Organization; a group without a name of its own is a Team; what an Organization is for (the official archive for SST) is a Role it holds, written with SERVES_AS. The translation table stays as it is: Program and Location mean nothing in the ground truth schema, Facility means Organization, LOCATED_IN means BASED_IN."}], "consequences": ["Nothing changes in the ground truth triples listed under Affects, the annotation guidelines, or the translation table.", "PO.DAAC appears only inside the Role \"official Physical Oceanography Data Archive (PO.DAAC) for SST\", so a search of the knowledge graph for PO.DAAC as an organization doesn't find it.", "A facility the model extracts is compared as an Organization: right for a center named as the body that runs something, wrong for a site named as the place where something happens; a classed triple with LOCATED_IN is right when its object instance is a country, and counted wrong when it is any other place."], "line": 1203}, {"number": 2, "title": "A named archive or program is an Organization too", "body": [{"p": "\"Physical Oceanography Data Archive (PO.DAAC)\" becomes an Organization of its own, and the NASA Technical Standards Program stays an Organization; the role JPL holds is then written as a fact joining JPL and PO.DAAC, with a predicate the ground truth schema doesn't have yet."}], "consequences": ["A new predicate is coined (for example, for \"is run by\" or \"hosts\"), and the record at pool position 4 gets one more classed triple.", "Only what the record states may be written (rule 1 of <em>What counts as a fact<\/em>): the record says JPL \"is\" the archive, not that JPL runs or hosts it, so the new predicate has to say exactly that.", "A search of the knowledge graph for PO.DAAC finds it as an organization, like any other data center."], "line": 1207}, {"number": 3, "title": "A program is its own entity class", "body": [{"p": "Coin an entity class for a named program (for example, Program), for the NASA Technical Standards Program and others like it, and keep Organization for institutions and their parts."}], "consequences": ["The translation table's row for the current schema's Program changes from (none) to the new entity class, so the model's Program instances can be compared with the ground truth.", "SPONSORED_BY_PARTY and DEVELOPED_BY_PARTY join only an Organization, a Person or a Team: they would need the new entity class added, or the record at pool position 0 changes."], "line": 1211}, {"number": 4, "title": "Places get an entity class of the ground truth schema", "body": [{"p": "When a record names a place in a fact of its own, the ground truth schema gets an entity class for it (and a predicate, \"is located in this place\"), and the model's Location and LOCATED_IN mean them; Facility means the place or Organization, as your answer to (d) says."}], "consequences": ["Places are compared rightly.", "The ground truth schema gains an entity class and a predicate, and the rows of the translation table that point to them are checked again.", "It waits for a tuning record that names a place: the annotation guidelines coin an entity class only when a record needs it."], "line": 1215}], "context": [{"p": "The example below names an archive, a named group and a team. Which entity class each gets decides which predicates fit it (for example, SPONSORED_BY_PARTY joins only an Organization, a Person or a Team), and how a search of the knowledge graph finds it. The only facts about where something is that I have written so far are two of the record \"Aquarius L3 Weekly Polar-Gridded Sea Surface Salinity V005\", both about which country an organization belongs to: \"National Aeronautics and Space Administration (NASA)\" (Organization) BASED_IN \"U.S.\" (Country), and \"Comisión Nacional de Actividades Espaciales (CONAE)\" (Organization) BASED_IN \"Argentina\" (Country)."}, {"p": "The <a class=\"term\" data-term=\"model\" href=\"#terms\">model<\/a> that reads the records has its own entity classes, and the translation table (quoted below) says which entity class of the ground truth schema each one means. It has an entity class Program (which means nothing in the ground truth schema: (none)), Facility (which means Organization), Location ((none)), and a predicate LOCATED_IN (which means BASED_IN)."}], "answer": [], "notes": [{"p": "The record at pool position 12 adds \"NASA HEASARC\" (Organization), written so by rule 13, though the record also writes \"the HEASARC\" (decided 2026-10-25, for me to confirm); its \"the authors\" (Team) are left out for now, with the study they belong to (Q26). The groups appear as the subject instance or object instance of the classed triples listed under Affects; the example is the record at pool position 4, and the program of (c) is the record at pool position 0's. The facts about a country are the record at pool position 3's: rule 9 of <em>Writing a classed triple<\/em> makes a country that qualifies an organization (\"U.S. National Aeronautics and Space Administration (NASA)\") a ground truth triple of its own."}, {"p": "The model extracts classed triples with the current schema. Before they are compared with the ground truth, each entity class and predicate of that schema is replaced by the one of the ground truth schema its <a class=\"term\" data-term=\"row\" href=\"#terms\">row<\/a> of the translation table names; a row that names (none): a classed triple that uses it always counts as extracted only. I would choose option 4 with the answers to (d) to (f) telling me what to coin, once a tuning record states a fact about a place."}], "affects": {"records": [{"position": 0, "id": "3122be4c-b9d0-4cc9-b6d3-9b96c6e743da", "line": 1256, "title": "NASA Standards and and Technical Assistance Resource Too f Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4 03a09af3-081e-4db6-9e3b-ea7c0e3138bd Purpose an aim something is meant to achieve HAS_PURPOSE is meant to achieve CelestialBody a natural object in space HAS_TARGET is about this CelestialBody Mission a named spaceflight effort Spacecraft a craft that operates in space USED_TO_STUDY HAS_PURPOSE The subject (a mission, instrument, program or dataset) is designed or used to investigate, characterize or trace the object, a scientific phenomenon or process. HAS_OBJECTIVE HAS_PURPOSE The subject (a mission, campaign, project or set of researchers) aims to achieve, study or address the object, a scientific goal, question or problem. Keep it as it is The purpose stays with what the sentence is about (Aqua), the phrase stays whole with \"Earth\" in it, and \"used to study\" and \"objective\" both count as a purpose. Take the body studied out as its own fact \"Earth\" becomes a fact of its own, \"Aqua\" (Spacecraft) HAS_TARGET \"Earth\" (CelestialBody), and the purpose keeps its words. What something studies apart from its purpose A predicate of its own for what a mission, spacecraft or instrument studies (a PhysicalQuantity or a Phenomenon), and keep HAS_PURPOSE for aims written as an action (\"make it simpler to access…\")."}, {"id": "Q10", "number": 10, "title": "Radio science, techniques and fields of science: is RSI an Instrument, is Radio Science a Discipline, and which list of disciplines?", "status": "open", "priority": "medium", "question_kind": "schema entry", "topic": "the ground truth schema's Discipline and Instrument for radio science data, the translation table's rows for Method and T ntity class of the ground truth schema for each of the model's, whatever the record: so every Method the model finds is judged as an Algorithm, and every Topic as a Discipline. The two Algorithms I have written so far are methods applied to data."}], "answer": [], "notes": [{"p": "The example is the record at pool position 1. The model extracts classed triples with the current schema. Before they are compared with the ground truth, each entity class and predicate of that schema is replaced by the one of the ground truth schema its <a class=\"term\" data-term=\"row\" href=\"#terms\">row<\/a> of the translation table names. The ground truth's two Algorithms so far are the records' at pool positions 2 and 4 (not listed under Affects: no option changes them)."}], "affects": {"records": [{"position": 1, "id": "cfd6ec3f-1e63-4a77-bc3f-007d45f7e2fc", "line": 1506, "title": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0"}], "triples": [{"position": 1, "subject": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0", "subject_class": "Dataset", "predicate": "HAS_DISCIPLINE", "object": "Radio Science", "object_class": "Discipline", "line": 1507, "draft": false}, {"position": 1, "subject": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0", "subject_class": "Dataset", "predicate": "ACQUIRED_BY_INSTRUMENT", "object": "RSI", "object_class": "Instrument", "line": 1508, "draft": false}], "rows": [{"kind": "entity class", "crt": "Method", "line": 1509}, {"kind": "entity class", "crt": "Topic", "line": 1510}, {"kind": "predicate", "crt": "HAS_DISCIPLINE", "line": 1511}], "entries": [{"kind": "entity class", "entry": "Discipline", "line": 1512}, {"kind": "predicate", "entry": "HAS_DISCIPLINE", "line": 1513}], "rules": [{"section": "What counts as a fact", "rule": 1, "line": 1514}, {"section": "Writing a classed triple", "rule": 1, "line": 1515}, {"section": "Writing a classed triple", "rule": 4, "line": 1516}], "methods": [{"path": "common/common_prompts/extraction_ he records has an entity class Method that also covers ways of collecting or sending data (an operating mode; my example: radio occultation, an observing technique), and the translation table (quoted below) says it means Algorithm. Is such a technique an Algorithm, or something else? (d) The model's Topic covers any subject a dataset addresses (\"agriculture\", \"AGN\", \"ecosystem interaction\"), and the translation table says it means Discipline. Is a subject like these a Discipline, a field of science? (e) Which list of disciplines should the ground truth follow, so that a record's words can be checked against it? The one I know of is the divisions of NASA's Science Mission Directorate, among them Earth Science, Planetary Science, Astrophysics and Heliophysics (https://science.nasa.gov/about-us/). Is that the right list for this catalog, or is another one used? The record doesn't say what \"RSI\" stands for, and the annotation guidelines don't let me write what an unexplained abbreviation stands for, so the object instance is \"RSI\", as written. \"Radio Science\" is the only Discipline I have written so far. The translation table names one entity class of the ground truth schema for each of the model's, whatever the record: so every Method the model finds is judged as an Algorithm, and every Topic as a Discipline. The two Algorithms I have written so far are methods applied to data. Option 1, for now, since the record gives no more than the code and the words \"Radio Science\", and every Algorithm and Discipline I have written so far fits its definition. Your answers to (a) and (b) decide options 2 and 3; your answers to (d) and (e) decide option 4. ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0 This is a Rosetta Radio Science data set, collected during the COMET ESCORT 4 phase 2015-10-22 to 2015-12-31. It is a Global Gravity measurement at the comet 67P and covers the time 2015-11-01T19:58:35.000 to 2015-11-02T04:59:27.000. cfd6ec3f-1e63-4a77-bc3f-007d4

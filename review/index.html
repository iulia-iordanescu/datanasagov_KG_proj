Y_PARTY \"NASA Ocean Biology Processing Group (OBPG)\" (Organization), from \"The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG)\" \"NASA\": whose products these are the record \"MODIS/Terra Land Surface Temperature/Emissivity Daily L3 Global 1km SIN Grid V006\" \"For complete information about known issues please refer to the MODIS/VIIRS Land Quality Assessment website\" \"MODIS/Terra Land Surface Temperature/Emissivity Daily L3 Global 1km SIN Grid V006\" (Dataset) DOCUMENTED_AT \"https://landweb.modaps.eosdis.nasa.gov/knownissue?sensor=MODIS&sat=Terra&as=6\" (WebPage) what the page is about: known issues the record \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" \"Lien corrected dataset after September 2019 PSA/PDS external peer review\" \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" (Dataset) REVISED_AFTER \"September 2019 PSA/PDS external peer review\" (Task) \"Lien\": what was corrected I would like to know: (a) Is \"NASA\" in \"global NASA skin sea surface temperature (SST) products\" a fact beyond who generated the products, worth a predicate of its own (whose products they are)? (b) Should the ground truth say what a web page is about (here, known issues), beyond that more details are written there? (c) What does \"Lien\" mean here, and is it worth a fact beyond that the dataset was corrected after the review? My reading, not checked against a source: it names the issues the review raised. Leave all three out, as now. For (a), the ground truth triple of who generated the products already says they are NASA's. For (b) and (c), I would write a fact if people search for a dataset's known issues, or for what a review changed. MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0 Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution. Aqua was launched by NASA on May 4, 2002, into a sun synchronous, polar orbit with a daylight ascending node at 13:30, formation flying in the A-train with other Earth Observation Satellites (EOS), to study the global dynamics of the Earth atmosphere, land and oceans. MODIS captures data in 36 spectral bands at a variety of spatial resolutions. Two SST products can be present in these files. The first is a skin SST produced for both day and night (NSST) observations, derived from the long wave IR 11 and 12 micron wavelength channels, using a modified nonlinear SST algorithm intended to provide continuity of SST derived from heritage and current NASA sensors. At night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4 03a09af3-081e-4db6-9e3b-ea7c0e3138bd Organization a named institution or one of its named parts, not a Mission, e.g. NASA; OBPG DEVELOPED_BY_PARTY was built or created by this Person, Team, or Organization WebPage a web address, written as the address itself, e.g. https://oceancolor.gsfc.nasa.gov/docs/format/ DOCUMENTED_AT more details about it are written at Task a piece of work a Person, Team, or Organization does or is in charge of, e.g. quality flagging REVISED_AFTER was corrected after this review"}], "priorities": ["high", "medium", "low"], "glossary": [{"term": "schema", "term_html": "<strong>schema<\/strong>", "meaning_html": "A description of the entity classes, the predicates, and the patterns: which entity classes each predicate has been seen between.", "aliases": ["schema"]}, {"term": "schema entry", "term_html": "<strong>schema entry<\/strong>", "meaning_html": "An entity class, a predicate, or a pattern. An output file that lists schema entries of more than one kind gives each its kind as <code>entry_type<\/code>: <code>entity class<\/code>, <code>predicate<\/code>, or <code>pattern<\/code>.", "aliases": ["schema entry"]}, {"term": "entity class", "term_html": "<strong>entity class<\/strong>", "meaning_html": "A type of thing a subject instance or object instance can be, e.g. <code>Instrument<\/code>, <code>Spacecraft<\/code>: a schema entry. The entity class of a classed triple's subject instance is its subject class; of its object instance, its object class. Through its patterns, an entity class can be a subject class, an object class, or both.", "aliases": ["entity class"]}, {"term": "predicate", "term_html": "<strong>predicate<\/strong>", "meaning_html": "A word with two senses, told apart by context: <strong>(1)<\/strong> the component in the middle slot of a triple instance or a classed triple; <strong>(2)<\/strong> a schema entry: a type of relationship, e.g. <code>ABOARD<\/code>, the component class of predicate instances.", "aliases": ["predicate"]}, {"term": "kind", "term_html": "<strong>kind<\/strong>", "meaning_html": "Of a component class: whether it is an entity class or a predicate (e.g. the translation table's <code>kind<\/code> column).", "aliases": ["kind"]}, {"term": "component class", "term_html": "<strong>component class<\/strong>", "meaning_html": "What a component instance is classed as in a particular schema. For a subject instance or an object instance, one of the schema's entity classes; for a predicate instance, one of the schema's predicates (examples below).", "aliases": ["component class"]}, {"term": "pattern", "term_html": "<strong>pattern<\/strong>", "meaning_html": "The component classes of the three slots of a classed triple, as a schema lists them: a subject class, a predicate, and an object class, read from subject to object, e.g. <code>Instrument ABOARD Spacecraft<\/code>. The subject class and the object class may be the same entity class (<code>PersonName ALSO_KNOWN_AS PersonName<\/code>), though that is unusual. A schema's patterns record where its predicates have been seen, not everywhere a predicate may be used.", "aliases": ["pattern"]}, {"term": "pinned predicate", "term_html": "<strong>pinned predicate<\/strong>", "meaning_html": "A predicate of a schema in the text shape (e.g. the ground truth schema) that may join only the entity classes listed on its \"only:\" line (\"any\": any entity class), e.g. <code>ACQUIRED_BY_INSTRUMENT<\/code>, with <code>only: Dataset -&gt; Instrument<\/code>. The checks flag a triple with any other pattern (<code>pattern_not_pinned<\/code>): a ground truth triple (050) or an extracted triple (060). Any other predicate may join whatever entity classes its meaning fits.", "aliases": ["pinned predicate"]}, {"term": "ground truth", "term_html": "<strong>ground truth<\/strong>", "meaning_html": "The classed triples of the records chosen for annotation, as a person corrects them. Only a finished record's have been checked; a record not finished yet may still hold drafted triples as the model wrote them. Kept in <code>annotations/ground_truth/<\/code>, one file per batch of records (<code>batch_000.csv<\/code> holds 6 records annotated by hand before step 050 was built: their ground truth triples were written entirely by a person, not drafted and corrected, except the rows of pool positions 1, 2, 3, and 4 whose <code>drafted_by<\/code> column names a model: a model drafted those and a person corrected them; <code>batch_001.csv<\/code> and every later file are corrected from step 050's drafted batch of the same number); the ground truth is all the files together.", "aliases": ["ground truth"]}, {"term": "ground truth triple", "term_html": "<strong>ground truth triple<\/strong>", "meaning_html": "A classed triple of the ground truth, other than its record's describes triple. A record that states no facts has none (its ground truth file keeps only its id, to show it was annotated). What step 070 pairs with the occurrences of the extracted triples. A record's ground truth triples form its <strong>set of ground truth triples<\/strong>. Two of them with the same subject instance and object instance (evened out) and the same predicate must differ in subject class, object class, or both (by loose match): otherwise they are <strong>the same classed triple twice<\/strong>, and step 070 refuses to run until one is deleted; when they do differ, step 070 warns before evaluating. It has been checked by a person only once its record is finished.", "aliases": ["ground truth triple"]}, {"term": "ground truth schema", "term_html": "<strong>ground truth schema<\/strong>", "meaning_html": "The schema of the ground truth, which a person writes while annotating: <code>annotations/ground_truth_schema.txt<\/code>, its entity classes and predicates, each with a one-line definition, and its patterns: those its file lists, and every one the ground truth uses (code reads them from the ground truth files, so none is ever added by hand). Every entity class and predicate a ground truth triple uses must be in it. One used that it doesn't have yet (compared by loose match) is <strong>coined<\/strong>. Its causes, all of them: a new one, typed while annotating; a typo; a drafted triple's component class (the model's) kept as it was; an old name left behind when an entry of the ground truth schema was renamed, merged, or deleted by hand in the file (the annotation tool's own rename or merge changes the ground truth files too, but never a drafted batch not opened yet, which keeps the old name until you open it); or a ground truth file written by hand or by a script. The annotation tool marks a coined one ✖, with a button that adds it with a definition, and step 070 stops while a finished record uses one; a pattern used for the first time is only flagged ⚑, for a look (a wrong entity class or direction). Step 050 shows it to the model as the component classes to reuse, step 040 compares the schema it learns with it, and step 070 translates the component classes of the current schema into it before comparing.", "aliases": ["ground truth schema"]}, {"term": "record", "term_html": "<strong>record<\/strong>", "meaning_html": "The metadata of one catalog entry. The catalog we work with is typically data.nasa.gov.", "aliases": ["record"]}, {"term": "classed triple", "term_html": "<strong>classed triple<\/strong>", "meaning_html": "A fact written as a subject instance with its subject class, a predicate of a schema, and an object instance with its object class, e.g. \"MODIS\" (<code>Instrument<\/code>) ABOARD \"Aqua\" (<code>Spacecraft<\/code>). What annotation (step 050) and extraction (step 060) write: every ground truth triple and every extracted triple is a classed triple.", "aliases": ["classed triple"]}, {"term": "subject instance", "term_html": "<strong>subject instance<\/strong>", "meaning_html": "The component instance in the subject slot: the text's words for one particular thing, e.g. \"MODIS\". Its component class, the <strong>subject class<\/strong>, is an entity class (<code>Instrument<\/code>).", "aliases": ["subject instance", "subject class"]}, {"term": "object instance", "term_html": "<strong>object instance<\/strong>", "meaning_html": "The component instance in the object slot, e.g. \"Aqua\". Its component class, the <strong>object class<\/strong>, is an entity class (<code>Spacecraft<\/code>).", "aliases": ["object instance", "object class"]}, {"term": "domain", "term_html": "<strong>domain<\/strong> (of a predicate)", "meaning_html": "The entity classes its subject may belong to.", "aliases": ["domain"]}, {"term": "range", "term_html": "<strong>range<\/strong> (of a predicate)", "meaning_html": "The entity classes its object may belong to.", "aliases": ["range"]}, {"term": "current schema", "term_html": "<strong>current schema<\/strong>", "meaning_html": "The schema step 060 extracts with. By default, the induced schema plus the schema additions. A person may give step 060 another <strong>schema file<\/strong> instead of the induced schema (<code>--schema &lt;file&gt;<\/code>), and another <strong>additions file<\/strong> instead of <code>annotations/schema_additions.txt<\/code> (<code>--additions &lt;file&gt;<\/code>), e.g. an empty one to leave the schema additions out. The schema step 060's last run used is written to <code>schema_used.json<\/code>, which step 070 reads (and 080 will), so both use exactly what 060 used. A <strong>past schema<\/strong> is one an earlier run of 060 used.", "aliases": ["current schema"]}, {"term": "extracted triple", "term_html": "<strong>extracted triple<\/strong>", "meaning_html": "A classed triple step 060 kept after checking it: one in <code>extracted_triples.csv<\/code>, the graph's facts and what 070 evaluates. The ones its checks <strong>removed<\/strong> go to <code>extracted_triples_removed.csv<\/code> with the reason, one of five: <code>source_text<\/code> (its source text is missing or isn't in the record's text), <code>component_class_not_in_schema<\/code> (an entity class or predicate the schema doesn't have), <code>component_class_not_in_schema source_text<\/code> (both of those), <code>duplicate<\/code> (the same classed triple twice in the record; one copy is kept, the first that passed the checks, or the first copy when none did), or <code>malformed<\/code> (not a classed triple at all, every way: a reply that isn't a JSON object with a \"triples\" list (all of it), or an item of that list that isn't a JSON object, or whose subject, predicate, or object is missing, empty, <code>true<\/code> or <code>false<\/code>, <code>null<\/code>, a list, or an object (a number is read as text)). How the five relate: each removed item has exactly one, decided in this order: <code>malformed<\/code> (never checked further), then <code>duplicate<\/code> (a copy of a fact kept once, whatever its own checks), then the checks, where a problem with the source text gives <code>source_text<\/code>, a component class outside the schema <code>component_class_not_in_schema<\/code>, and both the joined reason, under which it is counted once (in 060's report and in 070's table <em>Removed by 060<\/em>). The describes triple is never removed. Removed is not deleted: the file keeps them for a person to look at. A record's extracted triples form its <strong>set of extracted triples<\/strong>. Two of them may share subject instance, object instance (evened out), and predicate only if they differ in subject class or object class (by loose match); otherwise they are the same classed triple twice, and step 060 removes one as <code>duplicate<\/code>.", "aliases": ["extracted triple"]}, {"term": "translation table", "term_html": "<strong>translation table<\/strong>", "meaning_html": "The table <code>annotations/component_class_mapping.csv<\/code>, checked by a person: which component class of the ground truth schema each component class of the current schema means, or <code>(none)<\/code>. What one row says is a <strong>translation<\/strong>. Its columns abbreviate (crt: <strong>current<\/strong>, gtt: <strong>ground truth triples<\/strong>): <code>component_class_from_past_or_crt_schema<\/code> is a component class of the current schema or a past schema (one table serves every schema); <code>component_class_in_gtt<\/code> is a component class of the ground truth schema, the one the ground truth triples use; <code>definition_from_past_or_crt_schema<\/code> keeps that schema's definition of the component class from when the row was written or last checked, so a changed definition shows (the row is then stale: see <strong>row state<\/strong>). <code>kind<\/code> is <code>entity class<\/code> or <code>predicate<\/code>. <code>checked<\/code> says whether a person has checked the row: <code>no<\/code> (not yet: a row step 070 proposed), <code>yes<\/code>, or <code>same component class<\/code> (a row accepted automatically because the two are spelled the same); <code>definition_in_gtt<\/code> keeps the ground truth schema's definition of <code>component_class_in_gtt<\/code> from that check. <code>swap_subject_and_object<\/code> is <code>yes<\/code> when the row's predicate says the same relationship the other way round (\"A CARRIES B\" is \"B ABOARD A\"), else <code>no<\/code> (always <code>no<\/code> for an entity class). These three columns are read ignoring case and spaces at either end; any other value stops step 070, naming its line.", "aliases": ["translation table"]}, {"term": "row state", "term_html": "<strong>row state<\/strong>", "meaning_html": "A note the annotation tool shows on a row of the translation table, one of six, each with what step 070 does about it: <strong>repeated<\/strong> (✖; the component class has more than one row: step 070 stops); <strong>stale<\/strong> (⚑; only on a checked row: since it was checked, the current schema's definition of its component class changed (only for a row of the current schema), or the ground truth schema's definition of the one it translates to changed, or was missing when the row was checked; a row whose target the ground truth schema no longer has is not stale but <strong>missing target<\/strong>; a stale row counts as unchecked: step 070 stops); <strong>missing target<\/strong> (✖; the row translates to a component class, not <code>(none)<\/code>, that the file <code>annotations/ground_truth_schema.txt<\/code> doesn't have: step 070 stops. Its causes, all of them: a typo in <code>component_class_in_gtt<\/code> typed into the CSV; a component class of the ground truth schema renamed or deleted by hand in that file, or the file renamed or deleted; a coined component class chosen in the table (the tool offered coined ones until 2026-10-24, and still renames or merges onto a coined one when asked, warning that the rows will then have a missing target); a script writing the CSV; <code>--ground_truth_schema<\/code> given another file. Not the tool's own rename or merge of an entry of the ground truth schema onto one in the file: that updates the table's rows too); <strong>now exists<\/strong> (⚑; says <code>(none)<\/code>, though the ground truth schema now has a component class spelled the same: it was added to the ground truth schema since; a warning in step 070's report); <strong>suggested<\/strong> (⚑; says <code>(none)<\/code>, and the model suggests a component class the ground truth schema gained since; a warning in the report); or <strong>shared<\/strong> (⚑; another component class of the current schema translates to the same one, so evaluation can't tell them apart; listed in the report's <em>The translation table<\/em>). How they relate: a row can be in several at once, and the tool shows every note that applies, except that <strong>now exists<\/strong> replaces <strong>suggested<\/strong>; <strong>now exists<\/strong> and <strong>suggested<\/strong> are only on <code>(none)<\/code> rows; <strong>shared<\/strong> only on rows of the current schema that aren't <code>(none)<\/code>; <strong>stale<\/strong> only on checked rows. Step 070 stops on <strong>repeated<\/strong> first, before looking at any row; then it names each row of the current schema by the first of these that applies, in this order: not checked yet, <strong>stale<\/strong> (the current schema's definition), <strong>missing target<\/strong>, <strong>stale<\/strong> (the ground truth schema's definition); and it stops on the first of these four that has rows, so the next run may stop on the same rows for the next one. Not a <strong>flag<\/strong>, which is raised by a check of a triple instance or a classed triple.", "aliases": ["row state"]}, {"term": "row", "term_html": "<strong>row<\/strong>", "meaning_html": "One line of a CSV file the project keeps: in a ground truth file, a ground truth triple or a describes triple; in the translation table, one translation.", "aliases": ["row"]}, {"term": "step", "term_html": "<strong>step<\/strong>", "meaning_html": "One of the 8 numbered parts of the pipeline, <code>010_harvest<\/code> to <code>080_build_graph<\/code>. Each step reads what earlier steps wrote and writes its own output.", "aliases": ["step"]}, {"term": "fingerprint", "term_html": "<strong>fingerprint<\/strong>", "meaning_html": "A short code computed from exact content: a file, a prompt, a set of settings. The same content always gives the same fingerprint, and any change gives a different one. Used to tell whether an input or a cached model answer still matches (technically a SHA-256 hash).", "aliases": ["fingerprint"]}, {"term": "text", "term_html": "<strong>text<\/strong> (of a record)", "meaning_html": "What a model is given to read for one record: the record's text fields, joined in order, each preceded by its field name so the model can tell which part came from which field (example below).", "aliases": ["text"]}, {"term": "fact", "term_html": "<strong>fact<\/strong>", "meaning_html": "Something a record's text states, e.g. that MODIS is aboard Aqua. A triple instance or a classed triple writes one fact down; different ones can write the same fact (e.g. \"MODIS\" and \"Moderate Resolution Imaging Spectroradiometer\" as subject).", "aliases": ["fact"]}, {"term": "source text", "term_html": "<strong>source text<\/strong>", "meaning_html": "The passage of a text that states the fact of a triple instance or a classed triple, copied word for word from the text.", "aliases": ["source text"]}, {"term": "ground truth candidates pool", "term_html": "<strong>ground truth candidates pool<\/strong> (the <strong>pool<\/strong> for short)", "meaning_html": "1,000 records drawn once (2026-09-21) as candidates for ground truth, in a shuffled order. A person annotates them in that order, and only a subset ever gets annotated, since 1,000 is more than there is time to check. Each record's place in that order is its <strong>pool position<\/strong> (0, 1, 2, …).", "aliases": ["ground truth candidates pool", "pool", "pool position"]}, {"term": "tuning part", "term_html": "<strong>tuning part<\/strong>", "meaning_html": "The ground truth records whose metrics may be looked at while improving the pipeline (a prompt, the schema, a setting): pool positions 0–5, and from position 6 on, two of every three records. Step 030 marks the part of each record of the pool in <code>splits.json<\/code>. A record of it is a <strong>tuning record<\/strong>.", "aliases": ["tuning part", "tuning record"]}, {"term": "annotation guidelines", "term_html": "<strong>annotation guidelines<\/strong>", "meaning_html": "The rules for writing ground truth triples: <code>annotations/guidelines.md<\/code>. The model follows the same rules when it extracts triple instances to learn the schema (040), drafts (050), and extracts (060): <code>common/common_prompts/extraction_rules.txt<\/code> (a test keeps the two in step).", "aliases": ["annotation guidelines"]}, {"term": "model", "term_html": "<strong>model<\/strong> (<strong>LLM<\/strong>)", "meaning_html": "The AI model the steps ask, a large language model reached through a service, NASA's Ask Sage or NASA's LiteLLM (the defaults are <code>MODEL<\/code> and <code>SERVICE<\/code> in <code>common/common_helpers/llm.py<\/code>; each step that asks it has a <code>model<\/code> and a <code>service<\/code> setting, and <code>py helpers/models.py --service &lt;service&gt;<\/code> lists the models the service shows your account). In code comments, <code>LLM:<\/code> marks a move that asks it and <code>code:<\/code> one that doesn't.", "aliases": ["model", "llm"]}, {"term": "knowledge graph", "term_html": "<strong>knowledge graph<\/strong>", "meaning_html": "The graph step 080 will build from the records' metadata fields and the extracted triples: each extracted triple becomes one edge between two nodes.", "aliases": ["knowledge graph"]}, {"term": "qualifier", "term_html": "<strong>qualifier<\/strong>", "meaning_html": "A word or phrase, in a record's words for a subject instance or object instance, that narrows what it names, e.g. \"daily\" in \"daily snow cover\", \"U.S.\" in \"U.S. National Aeronautics and Space Administration (NASA)\". Rule 9 of <em>Writing a classed triple<\/em> in the annotation guidelines decides what happens to it: a qualifier that is \"a temporal resolution, an area the data cover, a processing level, a spatial resolution, a country, a time of day, or a target body\" is taken out of the instance and is a classed triple of its own (in the ground truth, a ground truth triple); a qualifier of any other kind stays in the instance, as written (\"sea surface salinity\" stays whole), and so does one of the listed kinds when taking it out would give a triple that isn't true (\"afternoon orbit\"). The full list of the kinds taken out: <code>annotations/guidelines.md<\/code>, <em>Writing a classed triple<\/em>, rule 9 (the model's copy: <code>common/common_prompts/extraction_rules.txt<\/code>).", "aliases": ["qualifier"]}, {"term": "describes triple", "term_html": "<strong>describes triple<\/strong>", "meaning_html": "The one classed triple every record gets that no text states, written by code: <code>&lt;record id&gt;<\/code> (<code>CatalogEntry<\/code>) DESCRIBES <code>&lt;the record&#x27;s title&gt;<\/code> (<code>&lt;entity class&gt;<\/code>). It keeps the catalog entry apart from the thing the entry is about. The model's only part in it is naming that entity class, the <strong>describes class<\/strong> (<code>describes_class<\/code> in its reply), e.g. <code>Dataset<\/code>; <code>X<\/code> means none was named yet.", "aliases": ["describes triple"]}, {"term": "metadata field", "term_html": "<strong>metadata field<\/strong>", "meaning_html": "A record's key, e.g. <code>title<\/code>, <code>notes<\/code>, <code>maintainer<\/code>. Also called: <em>field<\/em>, <em>metadata field name<\/em>, <em>field name<\/em>.", "aliases": ["metadata field"]}, {"term": "component instance", "term_html": "<strong>component instance<\/strong>", "meaning_html": "A value filling a slot. \"Rosetta\" might fill a subject or object slot; \"is mounted on\" might fill a predicate slot.", "aliases": ["component instance"]}, {"term": "induced schema", "term_html": "<strong>induced schema<\/strong>", "meaning_html": "The schema step 040 learns from the texts of the induction candidates, written to <code>outputs/intermediate_results/040_induce_schema/the_schema.json<\/code>. By default, the current schema is the induced schema plus the schema additions.", "aliases": ["induced schema"]}, {"term": "pair", "term_html": "<strong>pair<\/strong>", "meaning_html": "See <code>070_evaluate/metrics/pairs.md<\/code>. It defines the <strong>exact pair<\/strong>, the <strong>partial pair<\/strong>, the <strong>strict pair<\/strong>, the <strong>pair level<\/strong> (exact or partial), <strong>eligible<\/strong> (meeting a pair level's requirements), and the <strong>set of pairs<\/strong> (one choice of pairs in a record). It explains why a record's translated extracted triples form a <strong>multiset<\/strong>, and what an element's <strong>multiplicity<\/strong> is. It also names what pairing leaves without a partner: an occurrence without one is <strong>extracted only<\/strong>, and a ground truth triple without one is <strong>ground truth only<\/strong>.", "aliases": ["pair"]}, {"term": "precision", "term_html": "<strong>precision<\/strong>", "meaning_html": "See <code>070_evaluate/metrics/precision.md<\/code>.", "aliases": ["precision"]}, {"term": "recall", "term_html": "<strong>recall<\/strong>", "meaning_html": "See <code>070_evaluate/metrics/recall.md<\/code>.", "aliases": ["recall"]}, {"term": "schema additions", "term_html": "<strong>schema additions<\/strong>", "meaning_html": "A (typically) mini schema that a person discovers and manually writes to <code>annotations/schema_additions.txt<\/code> with the intention of including it with a second and (typically) larger, more complete schema passed together as a schema step 060 uses for extraction, hoping that step 060 performs better than it would with just the larger schema alone. This larger schema is usually the induced schema, since that is the default schema file step 060 takes. Each entry of this mini schema requires a source describing how it was discovered--- e.g. a subject-matter expert like a mentor; annotating tuning records; outside research, etc.", "aliases": ["schema additions"]}, {"term": "drafted triple", "term_html": "<strong>drafted triple<\/strong>", "meaning_html": "A classed triple step 050's model drafted (see <strong>drafted batch<\/strong>). When its drafted batch is opened in the annotation tool, it is copied into the ground truth file, and becomes a ground truth triple of a record not finished yet.", "aliases": ["drafted triple"]}], "linked_only_where_marked": ["kind", "domain", "range", "row", "step", "text", "fact", "model", "pool", "pair"]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const V = D.version;
const $ = (id) => document.getElementById(id);
// An arrow as the page shows it: "->" or "-->" in the files becomes "→" on the screen only; the data, the comments'
// entry texts, the emails and the downloads keep the files' own characters, so --read compares like with like.
const arrows = (text) => String(text).replace(/--?>/g, "→");
const arrowsHtml = (html) => String(html).replace(/--?&gt;/g, "→");
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) node.append(c);
  return node;
}

// ---------------------------------------------------------------- what this browser keeps (localStorage)
// Each read and write may fail (storage blocked for pages opened from disk, a private window): the page then works
// from memory, and says so, so the reviewer downloads before closing.
const KEY = { comments: "schemaReview:comments", name: "schemaReview:name", seen: "schemaReview:seen",
              oneAtATime: "schemaReview:oneAtATime" };
let storageWorks = true;
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch (_) { storageWorks = false; return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (_) { storageWorks = false; return false; }
}
// {id: {kind, entry, text, at, version, commit, shown}}: id is kind|entry, the same in every copy of the page, so
// comments carry over to a newer copy opened in the same browser.
let comments = load(KEY.comments, {});
if (!comments || typeof comments !== "object") comments = {};
let reviewer = load(KEY.name, "") || "";
let oneAtATime = load(KEY.oneAtATime, false) === true;

// ---------------------------------------------------------------- the entries
const ENTRIES = [];                          // every entry of this copy: {id, kind, entry, shown, ...}
for (const e of D.schema.entity_classes) ENTRIES.push({ ...e, id: `${e.kind}|${e.entry}` });
for (const e of D.schema.predicates) ENTRIES.push({ ...e, id: `${e.kind}|${e.entry}` });
for (const r of D.mapping.rows) ENTRIES.push({ ...r, kind: "translation row", rowKind: r.kind, id: `translation row|${r.entry}` });
for (const q of D.questions) ENTRIES.push({ ...q, kind: "question", entry: q.id, id: `question|${q.id}` });
const BY_ID = Object.fromEntries(ENTRIES.map((e) => [e.id, e]));
const GENERAL = { id: "general|(general)", kind: "general", entry: "(general)", shown: "" };

// Changed since you last looked: the copy opened before this one (an older one, by when it was made) left the text
// of each entry here; an entry whose text differs is changed, one it lacked is new.
const seenAll = (() => { const s = load(KEY.seen, {}); return s && typeof s === "object" ? s : {}; })();
const previous = Object.values(seenAll).filter((s) => s && s.content !== V.content && s.generated < V.generated)
  .sort((a, b) => (a.generated < b.generated ? 1 : -1))[0] || null;
const CHANGED = new Set(), NEW = new Set();
if (previous) for (const e of ENTRIES) {
  if (!(e.id in previous.entries)) NEW.add(e.id);
  else if (previous.entries[e.id] !== e.shown) CHANGED.add(e.id);
}
(() => {                                      // keep this copy's texts, and those of the three copies before it
  seenAll[V.content] = { version: V.id, generated: V.generated, content: V.content,
                         entries: Object.fromEntries(ENTRIES.map((e) => [e.id, e.shown])) };
  const keep = Object.values(seenAll).sort((a, b) => (a.generated < b.generated ? 1 : -1)).slice(0, 4);
  save(KEY.seen, Object.fromEntries(keep.map((s) => [s.content, s])));
})();

// ---------------------------------------------------------------- comments
const written = () => Object.values(comments).filter((c) => c && c.text && c.text.trim());
let saveTimer = null;
// The time now, on this computer's clock, with its offset from UTC: 2026-10-24T14:05:09-04:00.
function localIso() {
  const d = new Date(), pad = (n) => String(Math.abs(n)).padStart(2, "0"), off = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:` +
         `${pad(d.getSeconds())}${off < 0 ? "-" : "+"}${pad(Math.trunc(off / 60))}:${pad(off % 60)}`;
}
function setComment(e, text) {
  if (text.trim()) comments[e.id] = { kind: e.kind, entry: e.entry, text, at: localIso(),
                                      version: V.id, commit: V.commit, shown: e.shown };
  else delete comments[e.id];
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { save(KEY.comments, comments); drawStatus(); }, 300);
  drawStatus(true);
}
function commentBox(e, label) {
  const c = comments[e.id];
  const box = el("div", { class: "commentbox" + (c ? " has" : "") });
  const ta = el("textarea", { rows: 2, placeholder: "Your comment (optional): what is wrong, unclear, or missing",
                              "aria-label": label });
  ta.value = c ? c.text : "";
  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight + 2, 44) + "px"; };
  ta.addEventListener("input", () => {
    setComment(e, ta.value); box.classList.toggle("has", !!ta.value.trim());
    const card = box.closest(".mapbox"); if (card) card.classList.toggle("commented", !!ta.value.trim());
    grow();
  });
  requestAnimationFrame(grow);
  box.append(el("label", {}, label, ta));
  if (c && c.text && e.kind !== "general" && c.shown !== e.shown)
    box.append(el("p", { class: "hint" }, `You wrote this on the copy ${c.version}, when the entry read: ${arrows(c.shown)}`));
  return box;
}
const csvCell = (v) => /[",\r\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
const COLUMNS = ["reviewer", "page_version", "git_commit", "kind", "entry", "entry_text_shown", "comment", "timestamp"];
const KIND_ORDER = ["general", "question", "entity class", "predicate", "translation row"];
function commentsCsv() {
  const rows = written().sort((a, b) => (KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind)) ||
                                        a.entry.localeCompare(b.entry));
  const lines = [COLUMNS.join(",")].concat(rows.map((c) =>
    [reviewer, c.version, c.commit, c.kind, c.entry, c.shown, c.text, c.at].map(csvCell).join(",")));
  return "﻿" + lines.join("\r\n") + "\r\n";
}
function download() {
  if (!reviewer.trim()) {
    show("home");
    status("Type your name first, then press Download again.");
    const f = $("reviewer"); if (f) f.focus();
    return;
  }
  const blob = new Blob([commentsCsv()], { type: "text/csv;charset=utf-8" });
  const a = el("a", { href: URL.createObjectURL(blob),
                      download: `comments_${reviewer.trim().replace(/[^\w-]+/g, "_")}_${localIso().slice(0, 10)}.csv` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  status(`Saved ${written().length} comment(s) to your Downloads folder. Email me that file.`);
}

// ---------------------------------------------------------------- email
// "Email my comments to Iulia" opens the reviewer's email program with a new email, its body the comments in the
// plain-text format helpers/review_page.py --read reads back (common/common_helpers/review_comments.py,
// EMAIL_FORMAT): one "[field] value" line each, so lines an email client wraps, quotes or merges are put back.
// The address is put together only when the button is pressed, so it isn't in the page for address harvesters.
const to = () => ["iulia", "m", "iordanescu"].join(".") + "+kgreview" + String.fromCharCode(64) + ["gmail", "com"].join(".");
// The longest mailto: address made: 1,900 characters, under the 2,083 that Windows passes on to an email program
// (INTERNET_MAX_URL_LENGTH); more comments are split into parts, each its own email, up to MAX_EMAILS of them.
const MAILTO_MAX = 1900, MAX_EMAILS = 5;
const HEADER = "REVIEW COMMENTS (format 1): please send this email as it is";
function emailLines() {
  const rows = written().sort((a, b) => (KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind)) ||
                                        a.entry.localeCompare(b.entry));
  const one = (s) => String(s || "").replace(/\s+/g, " ").trim();
  return rows.flatMap((c) => ["=== comment ===", `[kind] ${c.kind}`, `[entry] ${one(c.entry)}`,
    `[page_version] ${one(c.version)}`, `[git_commit] ${one(c.commit)}`, `[timestamp] ${one(c.at)}`,
    `[entry_text_shown] ${one(c.shown)}`,
    ...c.text.trim().split(/\r?\n/).map((l) => `[comment] ${l.replace(/\s+$/, "")}`), ""]);
}
// {parts: [{subject, url}], needed}: the emails to send; needed > MAX_EMAILS: too many, and parts is empty.
function emailParts(sent) {
  const name = reviewer.trim();
  const subject = (k, n) => `Review comments — ${name} — ${V.id}` + (n > 1 ? ` — part ${k} of ${n}` : "");
  const body = (k, n, lines) => [HEADER, `[reviewer] ${name}`, `[page_version] ${V.id}`, `[git_commit] ${V.commit}`,
    `[sent] ${sent}`, `[part] ${k} of ${n}`, `=== start of part ${k} of ${n} ===`, "", ...lines,
    `=== end of part ${k} of ${n} ===`, ""].join("\r\n");
  const link = (k, n, lines) => `mailto:${to()}?subject=${encodeURIComponent(subject(k, n))}` +
                               `&body=${encodeURIComponent(body(k, n, lines))}`;
  const fits = (lines) => link(99, 99, lines).length <= MAILTO_MAX;
  const chunks = []; let cur = [];
  const pending = emailLines();
  while (pending.length) {
    const line = pending.shift();
    if (fits([...cur, line])) { cur.push(line); continue; }
    if (cur.some((l) => l)) { chunks.push(cur); cur = []; pending.unshift(line); continue; }
    // one line too long for an email by itself: as much as fits, cut at a space; the rest starts the next part
    let cut = line.length - 1;
    while (cut > 0 && !fits([line.slice(0, cut)])) cut = Math.floor(cut * 0.9);
    const space = line.lastIndexOf(" ", cut);
    if (cut < 20) return { parts: [], needed: MAX_EMAILS + 1 };       // the name alone fills an email
    const at = space > cut / 2 ? space : cut;
    chunks.push([line.slice(0, at)]);
    pending.unshift(line.slice(at).replace(/^ /, ""));
  }
  if (cur.length) chunks.push(cur);
  const n = chunks.length;
  return n > MAX_EMAILS ? { parts: [], needed: n }
    : { parts: chunks.map((lines, i) => ({ subject: subject(i + 1, n), url: link(i + 1, n, lines) })), needed: n };
}
let emailing = null;                         // {parts, opened: Set, needed}: the emails to send, shown in How to read this
function openMail(url) { const a = el("a", { href: url }); document.body.append(a); a.click(); a.remove(); }
function email() {
  if (!reviewer.trim()) {
    show("home");
    status("Type your name first, then press Email my comments again.");
    const f = $("reviewer"); if (f) f.focus();
    return;
  }
  if (!written().length) { status("No comments written yet: write one in the box under any entry first."); return; }
  const got = emailParts(localIso());
  emailing = { ...got, opened: new Set() };
  if (got.parts.length === 1) {
    emailing.opened.add(0);
    openMail(got.parts[0].url);
  }
  show("home");
  const box = $("emailing"); if (box) box.scrollIntoView({ block: "center" });
}
function drawEmailing() {
  if (!emailing) return null;
  const { parts, opened, needed } = emailing;
  if (!parts.length) return el("div", { id: "emailing", class: "card todo" },
    el("p", {}, `Your comments are too long to email from this page: they would take more than ${MAX_EMAILS} emails. Press Download my ` +
      "comments instead, then attach the file it saves to an email to me."),
    el("div", { class: "actions" },
      el("button", { class: "primary", onclick: download }, "Download my comments"),
      el("button", { onclick: () => openMail(`mailto:${to()}?subject=${encodeURIComponent(`Review comments — ${reviewer.trim()} — ${V.id}`)}` +
                                             `&body=${encodeURIComponent("My comment file is attached.\r\n")}`) },
         "Write the email to attach it to")));
  const one = parts.length === 1;
  return el("div", { id: "emailing", class: "card" },
    el("p", {}, one
      ? "Your email program should now show a new email to me with your comments in it: press Send there. If nothing " +
        "opened (no email program is set up in this browser), press Download my comments instead, and attach the file it saves to an email to me."
      : `Your comments take ${parts.length} emails. Press each button below in turn, and send each email it opens ` +
        "(nothing in them needs changing)."),
    el("div", { class: "actions" }, parts.map((p, i) => el("button", {
      class: opened.has(i) ? "" : "primary", title: p.subject,
      onclick: () => { opened.add(i); openMail(p.url); redraw(); } },
      one ? "Open the email again" : `${opened.has(i) ? "✓ " : ""}Email part ${i + 1} of ${parts.length}`))));
}
// A comment file downloaded from any copy of this page (another browser, another computer), read back in: each of
// its comments is kept unless this browser holds a newer one for the same entry.
function parseCsv(text) {
  const rows = []; let row = [], cell = "", quoted = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    const head = rows.shift() || [];
    if (!COLUMNS.every((c) => head.includes(c))) { status(`${file.name} isn't a file of comments saved by this page.`); return; }
    const at = Object.fromEntries(head.map((c, i) => [c, i]));
    let added = 0;
    for (const r of rows) {
      const get = (c) => (r[at[c]] || "");
      if (!get("comment").trim()) continue;
      const id = `${get("kind")}|${get("entry")}`;
      if (comments[id] && comments[id].at >= get("timestamp")) continue;
      comments[id] = { kind: get("kind"), entry: get("entry"), text: get("comment"), at: get("timestamp"),
                       version: get("page_version"), commit: get("git_commit"), shown: get("entry_text_shown") };
      added++;
      if (!reviewer && get("reviewer")) { reviewer = get("reviewer"); save(KEY.name, reviewer); }
    }
    save(KEY.comments, comments);
    redraw();
    status(`Read ${added} comment(s) from ${file.name}.`);
  };
  reader.readAsText(file, "utf-8");
}

// ---------------------------------------------------------------- the header and the version line
let message = "";
function status(text) { message = text; drawStatus(); }
function drawStatus(typing) {
  const n = written().length;
  const where = !storageWorks ? "kept only until you close this page: this browser doesn't let it save them, so download before closing"
    : typing ? "saving…" : "saved in this browser";
  $("status").replaceChildren(...[
    el("span", { class: "counter", title: "Comments you have written (on this computer, in this browser)" },
       `${n} comment${n === 1 ? "" : "s"} written, ${where}`),
    message ? el("span", {}, message) : null,
    el("button", { class: "primary", onclick: email, title: "Open a new email to Iulia in your email program, with your comments in it" },
       "Email my comments to Iulia"),
    el("button", { onclick: download, title: "Save your comments as a small CSV file, to attach to an email" },
       "Download my comments")].filter(Boolean));
}
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October",
                "November", "December"];
function drawVersion() {
  const made = V.generated.replace("T", " ").slice(0, 16);
  const [y, m, d] = V.date.split("-").map(Number);
  const since = previous && CHANGED.size + NEW.size ? ` · ${CHANGED.size} changed, ${NEW.size} new since you last looked` : "";
  const full = el("p", { class: "full" }, ...[
    el("strong", {}, "A read-only copy: it can't change anything. "),
    `Made ${made} from Git commit ${V.commit}` +
      (V.edited ? ", with changes to these two files not yet committed" : "") + `; page version ${V.id}. `,
    el("span", { class: "files" }, "Fingerprints (sha256): ",
       V.files.map((f, i) => [i ? "; " : "", el("code", {}, f.path), ` ${f.sha256}`])),
    previous ? el("span", {}, `. Since the copy you opened before (${previous.version}): ${CHANGED.size} entr${CHANGED.size === 1 ? "y" : "ies"} changed, ${NEW.size} new.`) : null].filter(Boolean));
  $("version").replaceChildren(el("details", {},
    el("summary", { title: "When this copy was made, from which Git commit, and the files' fingerprints" },
       el("span", {}, `Read-only · updated ${d} ${MONTHS[m - 1]} ${y}${since}`), el("span", { class: "more" }, "details")),
    full));
}

// ---------------------------------------------------------------- one at a time or all at once
function arrow(dir) {

    q.records.map((r) => [el("h4", {}, "An example"),
      field("Its title", quoted(r.title, marks(r))),
      field("Its notes (the words this question is about are highlighted)", quoted(r.notes, marks(r))),
      r.triples.length ? field(r.in_ground_truth ? "The facts I wrote down from these words" : "The facts I have written down from these words so far (a draft, not checked yet)",
                               r.triples.map(tripleLine)) : null]),
    q.schema.length || q.rows.length || q.rules.length ? [el("h4", {}, "The definitions and rules this is judged by"),
      q.schema.map((e) => field(`${e.kind} ${e.entry} (ground truth schema)`, quoted(e.definition))),
      q.rows.map((r) => field(`Translation table: ${r.kind} ${r.crt} (current or past schema) → ${r.gtt === D.mapping.none ? `${D.mapping.none}: nothing in the ground truth schema` : `${r.gtt} (ground truth schema)`}` +
                              (r.swap ? ", subject and object swapped" : "") + "; the row's definition of " + r.crt + ":", quoted(r.definition))),
      q.rules.map((r) => field(`Annotation guidelines, ${r.section}, rule ${r.rule}`, quoted(r.words)))] : null,
    q.options.length ? [el("h4", {}, "The choices I see (pick one, or tell me another)"), q.options.map((o) => el("div", { class: "option" },
      el("div", { class: "otitle" }, `Option ${o.number}: ${o.title}`), prose(o.body)))] : null,
    el("h4", {}, "My current reading"), prose(q.reading),
    q.answer.length ? [el("h4", {}, "The answer"), prose(q.answer)] : null,
    commentBox(q, `Your answer or comment on ${q.entry}`),
    impactsBox(q));
  linkTerms(card);
  return card;
}
const PRIORITIES = D.priorities;
function drawQuestions() {
  const st = state.questions;
  const all = ENTRIES.filter((e) => e.kind === "question")
    .sort((a, b) => (PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority)) || (a.number - b.number));
  const live = all.filter((q) => st.closed || q.status === "open");
  const shown = live.filter((q) => (st.priority === "all" || q.priority === st.priority) && (!st.mine || has(q))
    && (!st.changed || CHANGED.has(q.id) || NEW.has(q.id)) && matches(st.search, q.search));
  const count = (p) => live.filter((q) => q.priority === p).length;
  const closedN = all.filter((q) => q.status !== "open").length;
  const { at, bar } = itemsOneAtATime("questions", shown.map((q) => q.id), "Question");
  const select = el("select", { "aria-label": "Questions by priority", onchange: (ev) => { st.priority = ev.target.value; redraw(); } },
    [["all", `Every priority (${live.length})`], ...PRIORITIES.map((p) => [p, `${PRIORITY[p][1]} (${count(p)})`])]
      .map(([v, t]) => el("option", { value: v, selected: st.priority === v }, t)));
  const groups = at === null ? PRIORITIES.map((p) => [p, shown.filter((q) => q.priority === p)]).filter(([, l]) => l.length) : null;
  const intro = el("section", { class: "card" }, el("h2", {}, "Questions"),
    el("p", { class: "meta" }, "What I am not sure about and would like an expert's answer to, most urgent first. Each question " +
      "shows what you need to answer it: the question, one record as an example (its title and notes, the words concerned " +
      "highlighted), the definitions and rules it is judged by, the choices I see, and my current reading. " +
      "Write your answer in the box under a question; it is sent with your other comments. Under the box, folded, is my own " +
      "bookkeeping (what the answer would change in my files); you don't need it to answer."),
    el("p", { class: "meta" }, PRIORITIES.map((p, i) => `${i ? " · " : ""}${PRIORITY[p][1]}: ${count(p)}`).join("") +
      (closedN && !st.closed ? ` · ${closedN} answered or withdrawn, not shown` : "")));
  linkTerms(intro);
  return [intro,
    el("section", { class: "card mapcard" },
      el("div", { class: "mapfilters" },
        searchBox(st, "Search the questions, their records and options"), select,
        check(st, "closed", `Show answered and withdrawn questions too (${closedN})`),
        check(st, "mine", "Only those I commented on"),
        previous ? check(st, "changed", "Only those changed or new since I last looked") : null),
      bar,
      !shown.length ? el("p", { class: "empty mapempty" }, all.length ? "Nothing matches the search and filters above." : "No questions yet.")
        : at !== null ? questionBox(shown[at])
        : groups.map(([p, list]) => [el("h3", { class: "groupname" }, `${PRIORITY[p][1]} (${list.length})`), list.map(questionBox)]))];
}

// ---------------------------------------------------------------- terms
function drawTerms() {
  const rows = D.glossary.map((t) => {
    const term = el("td", { class: "term" }); term.innerHTML = arrowsHtml(t.term_html);      // written by helpers/review_page.py,
    const meaning = el("td", {}); meaning.innerHTML = arrowsHtml(t.meaning_html);           // from docs/terminology.md, escaped
    return el("tr", { id: termSlug(t.term) }, term, meaning);
  });
  return [el("section", { class: "card" }, el("h2", {}, "Terms"),
    el("p", { class: "meta" }, `The words this page uses, as my project's list of terms (docs/terminology.md) defines them at commit ${V.commit}.`),
    el("table", { class: "schematable terms" }, el("thead", {}, el("tr", {}, el("th", {}, "Term"), el("th", {}, "Meaning"))),
       el("tbody", {}, rows)))];
}

// ---------------------------------------------------------------- how to read this
function drawHome() {
  const nameField = el("input", { id: "reviewer", type: "text", value: reviewer, placeholder: "e.g. Jane Smith", autocomplete: "name",
    oninput: (ev) => { reviewer = ev.target.value; save(KEY.name, reviewer); } });
  const picker = el("input", { type: "file", accept: ".csv,text/csv", hidden: true,
                               onchange: (ev) => { if (ev.target.files[0]) loadFile(ev.target.files[0]); ev.target.value = ""; } });
  const gone = written().filter((c) => c.kind !== "general" && !BY_ID[`${c.kind}|${c.entry}`]);
  const nOpen = D.questions.filter((q) => q.status === "open").length;
  const nSchema = D.schema.entity_classes.length + " entity classes and " + D.schema.predicates.length + " predicates";
  return [el("section", { class: "card home" },
    el("h2", {}, "How to read this page"),
    el("p", {}, "Thank you for reviewing this. My project builds a knowledge graph from the records of the data.nasa.gov catalog: " +
      "a model reads each record's text and writes down the facts it states, each as a classed triple, e.g. “MODIS” (Instrument) " +
      "ABOARD “Aqua” (Spacecraft). To measure how well it does, I check a sample of records by hand and write down every fact " +
      "their texts state: the ground truth. This page shows two files that decide what those facts may say, as they were when " +
      "the page was made (the line above says when), so that you can tell me where they are wrong, unclear, or missing something, " +
      "and the questions I would like an expert's answer to."),
    el("h3", {}, "Questions"),
    el("p", {}, `${nOpen} question${nOpen === 1 ? "" : "s"} I would like an expert's answer to, most urgent first, each written out ` +
      "whole, so it can be read on its own: one record as its example, quoted, the definitions and rules it is judged by, the " +
      "choices I see, and my current reading. Your answer goes in the box under each one."),
    el("h3", {}, "Ground truth schema"),
    el("p", {}, `The ${nSchema} the ground truth may use, each with a one-line definition. An entity class is a kind of thing a ` +
      "subject instance or object instance can be (Instrument); a predicate is a kind of relationship (ABOARD). Under a predicate " +
      "are its patterns, the pairs of entity classes it has joined, read subject → object: Instrument → Spacecraft under ABOARD " +
      "says that an instrument is carried on a spacecraft. The ground truth itself may use more patterns than the file lists. " +
      "A line “only: …” pins a predicate: it may join only those entity classes (“any”: any entity class). A line " +
      "“source: …” says where the idea for an entry came from: “ground truth tuning #2” means from the record at position 2 of " +
      "my shuffled list of records to annotate."),
    el("p", {}, "Worth asking: is each definition right, and clear to someone in your field? Should two entries be one, or one be two? " +
      "Is a kind of thing or relationship that the catalog often states missing? Is a predicate pinned where it shouldn't be?"),
    el("h3", {}, "Translation table"),
    el("p", {}, "The model doesn't use the ground truth schema: it extracts with its own, the current schema, learned from other " +
      "records of the catalog. To compare its facts with the ground truth, each entity class and predicate of the current schema " +
      "(and of past ones) is translated into the one of the ground truth schema that means the same, or into (none) when none does. " +
      "Each box is one row: on the left, the current or past schema's entity class or predicate and its definition; on the right, " +
      "what it translates to and the ground truth schema's definition. “Swap subject and object” means the ground truth " +
      "schema's predicate states the relationship the other way round (“A CARRIES B” is “B ABOARD A”). The last pill says " +
      "whether I have checked the row."),
    el("p", {}, "Worth asking: does each translation keep the meaning? Does a row that says (none) really have no counterpart?"),
    el("h3", {}, "Your comments"),
    el("p", {}, "Write in the box under any entry, and anything else under General comments below. Every comment is kept in this " +
      "browser as you type, on this computer only, so you can stop and come back; the top of the page says how many you have written. " +
      "When you're done, type your name and press Email my comments to Iulia: your email program opens a new email to me " +
      "with your comments in it, for you to send (a long set of comments takes a few emails, numbered). If that doesn't " +
      "work, press Download my comments, and attach the small file it saves (a CSV file) to an email to me. " +
      "Your name and comments reach only me: I keep them on my computer, not in my project's public repository."),
    el("p", {}, "This page is a copy: it can't change the files, and it sends nothing anywhere by itself (an email goes only when you " +
      "press Send in your email program). When I update it, the same link shows the newer copy (or I send you a newer file): " +
      "open it in the same browser, and your comments carry over, and entries that changed since the copy you opened before are marked " +
      "“changed since you last looked”. In another browser or on another computer, read your comments back in from the file " +
      "you downloaded (Load my comments from a file, below)."),
    el("div", { class: "namefield" }, el("label", { for: "reviewer", class: "name" }, "Your name"), nameField),
    commentBox(GENERAL, "General comments"),
    el("div", { class: "actions" },
      el("button", { class: "primary", onclick: email }, "Email my comments to Iulia"),
      el("button", { onclick: download }, "Download my comments"),
      el("button", { onclick: () => picker.click(), title: "Read back a file of comments this page saved before" },
         "Load my comments from a file"), picker),
    drawEmailing(),
    !storageWorks ? el("p", { class: "problems" }, el("span", { class: "pill flag" },
      "⚑ This browser doesn't let the page keep your comments: download them before you close it.")) : null,
    gone.length ? el("div", { class: "gone" }, el("h3", {}, "Your comments on entries no longer on this page"),
      el("p", { class: "meta" }, "They are still in your download, with the entry as it read when you wrote them."),
      el("ul", {}, gone.map((c) => el("li", {}, el("strong", {}, `${c.kind} ${c.entry}`), `: ${c.text}`,
                                          el("div", { class: "meta" }, `It read: ${arrows(c.shown)}`))))) : null)];
}

// ---------------------------------------------------------------- views
let view = "home";
const VIEWS = { home: drawHome, questions: drawQuestions, schema: drawSchema, mapping: drawMapping, terms: drawTerms };
function redraw() {
  for (const v of Object.keys(VIEWS)) {
    $(`tab-${v}`).classList.toggle("current", v === view);
    if (v === view) $(`tab-${v}`).setAttribute("aria-current", "page"); else $(`tab-${v}`).removeAttribute("aria-current");
  }
  $("view").replaceChildren(...VIEWS[view]().flat(Infinity).filter(Boolean));
  drawStatus();
}
function show(v) {
  view = VIEWS[v] ? v : "home";
  history.replaceState(null, "", "#" + view);
  message = "";
  redraw();
  window.scrollTo(0, 0);
}
for (const v of Object.keys(VIEWS)) $(`tab-${v}`).addEventListener("click", () => show(v));
$("homebutton").addEventListener("click", () => show("home"));
drawVersion();
show(location.hash.slice(1) || "home");
</script>
</body>
</html>

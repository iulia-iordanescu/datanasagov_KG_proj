ut what is measured and what is computed.)", "(d) The same question of what counts as an identifier, in another record: the record \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" says \"Details of the map and data reduction are described in LAWRENCEETAL2013\". I wrote LAWRENCEETAL2013 as a Document, \"a written publication, or a set of them, named in words or by a reference key\": \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" (Dataset) DOCUMENTED_AT \"LAWRENCEETAL2013\" (Document). Is a Planetary Data System reference key such as LAWRENCEETAL2013 the publication itself (a Document named by its key, as now), or an identifier of the publication, an Identifier of its own?"]}], "reading": [{"p": "Undecided. For (a), I lean towards reading NRT as a processing stream, a product of its own (the sources above), with no latency value, since the record states none. For (b), I lean towards option 3, an identifier, since a product code names one product permanently, much as a DOI does. For (c), I write \"MCD19A1N\" COMPUTED_FROM this dataset, by rule 11 (\"In every case, include the fact of how the two datasets are connected\"), and leave out what MCD19A1N holds, since it is made from this dataset. For (d), I keep LAWRENCEETAL2013 a Document, as the definition of Document names it. I would still like to know whether MCD19A1N is computed from this product, and whether \"the atmospheric properties and view geometry\" are what this dataset holds."}], "terms": ["text", "fact", "model"], "named_records": [{"title": "MODIS/Terra Land Surface Temperature/Emissivity Daily L3 Global 1km SIN Grid V006", "line": 2471}, {"title": "DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0", "line": 2473}], "fingerprint": "73620d6c46e9", "shown": "Q20: What is \"Near Real Time (NRT)\", what counts as an identifier (\"MCD19A2N\", \"LAWRENCEETAL2013\"), and is \"MCD19A1N\" another dataset? | fingerprint 73620d6c46e9", "search": "Q20 What is \"Near Real Time (NRT)\", what counts as an identifier (\"MCD19A2N\", \"LAWRENCEETAL2013\"), and is \"MCD19A1N\" another dataset? the ground truth schema's Identifier, HAS_DOI, Document, Version and COMPUTED_FROM, the predicate HAS_IDENTIFIER I have coined, and rules 10, 11 and 14 of *Writing a classed triple* in the annotation guidelines I am annotating a record of a MODIS aerosol product, and three passages of its text I am not sure how to write as classed triples; one of them raises a question about another record too: (a) \"Near Real Time (NRT)\": is it a latency (how soon after the observation the data are made available), a separate processing stream (a different product from the standard one), or a version? Each would be a different predicate, and the ground truth schema has none for a latency. Until you answer, I write no classed triple for it. (b) \"(MCD19A2N)\": I have written it as an identifier of the dataset, with a predicate I coined for it, HAS_IDENTIFIER, \"has this Identifier\": the dataset HAS_IDENTIFIER \"MCD19A2N\" (Identifier), an Identifier being \"a code that names one thing permanently, e.g. a DOI\". Is a NASA product short name such as MCD19A2N permanent in that sense, or a label that can change, or be given to another product later? And should HAS_DOI (\"has the Digital Object Identifier\") and HAS_IDENTIFIER be one predicate, a DOI being one sort of identifier, or stay two? The record \"MODIS/Terra Land Surface Temperature/Emissivity Daily L3 Global 1km SIN Grid V006\" names its product \"MOD11A1 Version 6\", and the one users are encouraged to use instead \"MOD11A1 Version 6.1\": one short name for two versions. I wrote \"MODIS/Terra Land Surface Temperature/Emissivity Daily L3 Global 1km SIN Grid V006\" (Dataset) HAS_IDENTIFIER \"MOD11A1\" (Identifier). Is a short name that two versions share an identifier of each of them, or of the product across its versions? The same record gives its input's DOI as a link address, which I wrote as written: \"MOD11_L2\" (Dataset) HAS_DOI \"https://doi.org/10.5067/MODIS/MOD11_L2.006\" (Identifier). (c) \"The MCD19A2N product provides the atmospheric properties and view geometry used to calculate the MAIAC Land Surface Bidirectional Reflectance Factor (BRF) or surface reflectance, MCD19A1N product\": is \"MCD19A1N\" another dataset? If it is, is \"MCD19A1N is computed from this dataset\" a fact to write, as I now do (it says how the two datasets are connected), or a fact about the other dataset, to leave out? And are \"the atmospheric properties and view geometry\" what this dataset holds, to write as facts about it, or only the part of it the other product uses? (Whether each is specific enough, and what kind of thing each is, is asked in another question, about what is measured and what is computed.) (d) The same question of what counts as an identifier, in another record: the record \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" says \"Details of the map and data reduction are described in LAWRENCEETAL2013\". I wrote LAWRENCEETAL2013 as a Document, \"a written publication, or a set of them, named in words or by a reference key\": \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" (Dataset) DOCUMENTED_AT \"LAWRENCEETAL2013\" (Document). Is a Planetary Data System reference key such as LAWRENCEETAL2013 the publication itself (a Document named by its key, as now), or an identifier of the publication, an Identifier of its own? Below are the facts I have written for this record, now in the ground truth; one of them is \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\" (Dataset) HAS_IDENTIFIER \"MCD19A2N\" (Identifier), which (b) asks about. I have written no fact for \"Near Real Time (NRT)\" until (a) is answered. For (c), I have written \"MCD19A1N\" (Dataset) COMPUTED_FROM \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\" (Dataset), and left out what MCD19A1N holds (rule 11, quoted below). What I have checked about (a), on 2026-10-25. NASA's LANCE page (https://www.earthdata.nasa.gov/data/projects/lance) says: \"Near real-time (NRT) refers to data available 1 to 3 hours after an observation by an instrument aboard a space-based platform\"; the Terra, Aqua and Aura measurements \"are processed into higher-level \"standard\" products within 8 to 40 hours of observation\"; and \"If latency is not a primary concern, users are encouraged to use standard science products, which are created using the best available ancillary, calibration, and ephemeris information\". MODAPS lists MCD19A2N among its Collection 6.1 NRT products, as a product of its own, with its own DOI, 10.5067/MODIS/MCD19A2N.NRT.061 (https://modaps.modaps.eosdis.nasa.gov/services/about/products/c61-nrt/MCD19A2N.html), apart from the standard product MCD19A2. So my reading of the sources: NRT here names a processing stream, a separate product, whose defining property is how soon it is made available. The record itself states no number of hours, and the annotation guidelines write only what the record states, so a latency value from these sources can't go into its ground truth. The catalog also has another record, titled \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid NRT\", whose notes begin with the same words as this record's. Undecided. For (a), I lean towards reading NRT as a processing stream, a product of its own (the sources above), with no latency value, since the record states none. For (b), I lean towards option 3, an identifier, since a product code names one product permanently, much as a DOI does. For (c), I write \"MCD19A1N\" COMPUTED_FROM this dataset, by rule 11 (\"In every case, include the fact of how the two datasets are connected\"), and leave out what MCD19A1N holds, since it is made from this dataset. For (d), I keep LAWRENCEETAL2013 a Document, as the definition of Document names it. I would still like to know whether MCD19A1N is computed from this product, and whether \"the atmospheric properties and view geometry\" are what this dataset holds. MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid The Moderate Resolution Imaging Spectroradiometer (MODIS) Near Real Time (NRT) Combined Terra and Aqua Multi-Angle Implementation of Atmospheric Correction (MAIAC) Land Aerosol Optical Depth gridded Level 2 product (MCD19A2N) produced daily at 1 kilometer (km) pixel resolutions. The MCD19A2N product provides the atmospheric properties and view geometry used to calculate the MAIAC Land Surface Bidirectional Reflectance Factor (BRF) or surface reflectance, MCD19A1N product. 4c64f3ed-39b4-4f95-95a0-022898ba47a4 Identifier a code that names one thing permanently, e.g. a DOI HAS_DOI has the Digital Object Identifier Document a written publication, or a set of them, named in words or by a reference key, e.g. NASA developed standards; LAWRENCEETAL2013 DOCUMENTED_AT more details about it are written at Version a label that marks one release of something ALSO_KNOWN_AS is the same thing under another name COMPUTED_FROM was made by processing this input HAS_LATENCY (none) The subject (a data product or table) is made available or updated with the object, a latency or update delay. HAS_IDENTIFIER (none) The subject (a dataset, data series or document) is indexed by, or refers to items using, the object, which is a key, label or designator such as a prime key or detector name. Write none of the three for now None of (a), (b), (c) is written as a fact for now: the record keeps only the facts written so far. Write each with what the ground truth schema has (a) \"Near Real Time (NRT)\" kept inside the dataset's description, with no fact of its own; (b) \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\" (Dataset) ALSO_KNOWN_AS \"MCD19A2N\", in place of HAS_IDENTIFIER, and HAS_DOI as it is; (c) \"MCD19A1N product\" (Dataset) COMPUTED_FROM \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\" (Dataset), as a processing step of rule 14 with this dataset as its input. New predicates for a latency and an identifier A new predicate for a latency (the dataset has the latency \"Near Real Time (NRT)\"), and the one I coined for an identifier kept (the dataset HAS_IDENTIFIER \"MCD19A2N\" (Identifier)), both in the ground truth schema, with HAS_DOI either kept or made one with HAS_IDENTIFIER (question (b)); (c) and (d) as you answer them."}, {"id": "Q21", "number": 21, "title": "Should instruments, spacecraft, missions and physical quantities follow a reference list, and what should the knowledge graph answer?", "status": "open", "priority": "low", "question_kind": "general", "topic": "reference lists for the ground truth schema's Instrument, Spacecraft, Mission and PhysicalQuantity, and the questions the knowledge graph is for", "line": 2606, "records": [], "schema": [], "rows": [], "rules": [{"section": "Writing a classed triple", "rule": 1, "words": "Subject instance and object instance: the record's own words, as written.", "line": 2626}], "methods": [{"path": "docs/improvements.md", "words": "Linking subject instances and object instances to reference lists, so that one thing named several ways (\"Aqua\", \"EOS PM-1\") becomes one node.", "line": 2765}], "options": [{"number": 1, "title": "The record's own words everywhere (as now)", "body": [{"p": "Every subject instance and object instance stays as the record writes it, and no reference list is used."}], "consequences": ["Nothing changes in the annotation guidelines or the ground truth schema.", "One value may appear in several wordings across records, so a search of the knowledge graph has to know each wording."], "line": 2630}, {"number": 2, "title": "Reference lists in the ground truth", "body": [{"p": "For Instrument, Spacecraft, Mission and PhysicalQuantity, the instance is the reference list's value that the record's words mean, in place of the record's words."}], "consequences": ["A new exception to rule 1 of <em>Writing a classed id": "03a09af3-081e-4db6-9e3b-ea7c0e3138bd", "pool position": 4, "title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "notes": "Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution. Aqua was launched by NASA on May 4, 2002, into a sun synchronous, polar orbit with a daylight ascending node at 13:30, formation flying in the A-train with other Earth Observation Satellites (EOS), to study the global dynamics of the Earth atmosphere, land and oceans. MODIS captures data in 36 spectral bands at a variety of spatial resolutions. Two SST products can be present in these files. The first is a skin SST produced for both day and night (NSST) observations, derived from the long wave IR 11 and 12 micron wavelength channels, using a modified nonlinear SST algorithm intended to provide continuity of SST derived from heritage and current NASA sensors. At night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL ac  a degree at the equator, and the products are named by the rounded value.", "(b) Is the dataset of this record only the 4.63 km one, with the 9.26 km products in a record of their own, so that 9.26 km is about another dataset?", "(c) The record \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\" is the same case: its title says \"1km\" and its notes \"produced daily at 1 kilometer (km) pixel resolutions\", and I have written \"1 kilometer (km)\", the wording that spells out its abbreviation. Is a title's rounded or shortened value always the notes' value, for products of this catalog, or can the two differ?"]}], "reading": [{"p": "Option 1, because rule 13 takes the more precise wording and the record's own words give 4.63 km as one of the two resolutions it is available at. I would move to option 2 only if experts say a title's value and the notes' value can name different resolutions."}], "terms": ["model"], "named_records": [{"title": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid", "line": 2780}, {"title": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061", "line": 2784}, {"title": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid", "line": 2784}], "fingerprint": "7d7c80746ef6", "shown": "Q22: Is a title's \"4km\" the notes' \"4.63 km\"? | fingerprint 7d7c80746ef6", "search": "Q22 Is a title's \"4km\" the notes' \"4.63 km\"? the ground truth schema's SpatialResolution and HAS_SPATIAL_RESOLUTION, and rules 11 and 13 of the annotation guidelines The title of the example below says \"4km\", and its notes say the products \"are available at both 4.63 and 9.26 km spatial resolution\". Rule 13 of the annotation guidelines writes one thing with one wording in a record, the more precise one when two wordings name the same thing; its own example is this record: \"a title says \"4km\" and the notes say \"4.63 km\". Then: \"4.63 km\", the more precise.\" So I wrote \"MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0\" (Dataset) HAS_SPATIAL_RESOLUTION \"4.63 km\" (SpatialResolution), and nothing for 9.26 km, which rule 11 leaves out as a fact about another dataset (the same data at another resolution). Whether that is right depends on facts I can't check from the record. I would like to know: (a) Is \"4km\" in such a title the rounded name of the 4.63 km grid, so that the two name one resolution? My reading, not checked against a source: 4.63 km is about 1/24 of a degree at the equator, and the products are named by the rounded value. (b) Is the dataset of this record only the 4.63 km one, with the 9.26 km products in a record of their own, so that 9.26 km is about another dataset? (c) The record \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\" is the same case: its title says \"1km\" and its notes \"produced daily at 1 kilometer (km) pixel resolutions\", and I have written \"1 kilometer (km)\", the wording that spells out its abbreviation. Is a title's rounded or shortened value always the notes' value, for products of this catalog, or can the two differ? The spatial resolutions I have written so far: \"500m\" (the record \"MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061\"), \"4.63 km\" (the example below), and \"1 kilometer (km)\" (the record \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\"). Option 1, because rule 13 takes the more precise wording and the record's own words give 4.63 km as one of the two resolutions it is available at. I would move to option 2 only if experts say a title's value and the notes' value can name different resolutions. MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0 Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution. Aqua was launched by NASA on May 4, 2002, into a sun synchronous, polar orbit with a daylight ascending node at 13:30, formation flying in the A-train with other Earth Observation Satellites (EOS), to study the global dynamics of the Earth atmosphere, land and oceans. MODIS captures data in 36 spectral bands at a variety of spatial resolutions. Two SST products can be present in these files. The first is a skin SST produced for both day and night (NSST) observations, derived from the long wave IR 11 and 12 micron wavelength channels, using a modified nonlinear SST algorithm intended to provide continuity of SST derived from heritage and current NASA sensors. At night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4 03a09af3-081e-4db6-9e3b-ea7c0e3138bd SpatialResolution the amount of ground each value of the data covers, e.g. 500 m; 4.63 km HAS_SPATIAL_RESOLUTION each of its values covers this much ground, e.g. 500 m Ke y, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4 03a09af3-081e-4db6-9e3b-ea7c0e3138bd SatelliteFormation a group of Spacecraft flying together in formation in orbit, e.g. the A-train FLIES_IN flies in formation as part of Spacecraft a craft that operates in space Keep SatelliteFormation as it is The A-train stays a SatelliteFormation, as the record's own words \"formation flying\" say. One entity class for any group of spacecraft An entity class for any group of spacecraft that work together, in place of SatelliteFormation, with a definition that covers formations, constellations and trains, and FLIES_IN read as \"is part of this group\"."}, {"id": "Q24", "number": 24, "title": "Should facts about a product family be recorded, and as what?", "status": "open", "priority": "medium", "question_kind": "records and triples", "topic": "rule 11 of the annotation guidelines, and the facts about the other versions, temporal resolutions and spatial resolutions of a product", "line": 2924, "records": [{"line": 2945, "source_texts": [{"text": "Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products", "line": 2951}, {"text": "Average dail  night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4"}], "schema": [{"kind": "entity class", "entry": "TemporalResolution", "definition": "the amount of time between one value of the data and the next, e.g. daily; weekly (8 day)", "line": 2961}, {"kind": "predicate", "entry": "HAS_TEMPORAL_RESOLUTION", "definition": "gives values this often, e.g. daily; weekly (8 day)", "line": 2962}, {"kind": "entity class", "entry": "SpatialResolution", "definition": "the amount of ground each value of the data covers, e.g. 500 m; 4.63 km", "line": 2963}, {"kind": "predicate", "entry": "HAS_SPATIAL_RESOLUTION", "definition": "each of its values covers this much ground, e.g. 500 m", "line": 2964}, {"kind": "predicate", "entry": "SUPERSEDES", "definition": "replaces this earlier one", "line": 2965}], "rows": [], "rules": [{"section": "Writing a classed triple", "rule": 11, "words": "Leave out facts about another dataset, unless the record's dataset is made from it or is part of it; for example, leave them out if the other dataset is a variant of the record's dataset (the same data at another temporal resolution, spatial resolution, or version), or is made from the record's dataset. In every case, include the fact of how the two datasets are connected.", "line": 2969}], "methods": [], "options": [{"number": 1, "title": "Leave them out, as now", "body": [{"p": "The family's other temporal resolutions, spatial resolutions and times of day are not recorded, by rule 11. A search finds this dataset by its own temporal resolution and spatial resolution only."}], "consequences": ["Nothing changes.", "The ground truth never holds a fact of a family, and the model's extracted triples that state one count as wrong."], "line": 2973}, {"number": 2, "title": "A new entity class for a product family, with its own facts", "body": [{"p": "A family of products (for the example, the MODIS Aqua skin sea surface temperature products) is a thing of its own, with its temporal resolutions, spatial resolutions and times of day as its facts, and the dataset of the record is one of its members."}], "consequences": ["A new entity class and a predicate saying a dataset is a member of a family (see Q25), in the ground truth schema, with their definitions, and an example in rule 11 of the annotation guidelines and in the model's copy of the rules.", "The listed items become ground truth triples of the family; the record at pool position 4 gets one more ground truth triple, for the membership.", "Every record that lists its siblings is written the same way, so a family has one name in all of them: the work of joining the names of one family grows."], "line": 2977}, {"number": 3, "title": "Record them on the instrument", "body": [{"p": "The facts are written about the instrument that makes the products, as general facts about it (rule 11 includes general facts about a dataset's instrument): the instrument \"Moderate-resolution Imaging Spectroradiometer (MODIS)\" with the temporal resolutions and spatial resolutions of its skin sea surface temperature products."}], "consequences": ["The facts are written about MODIS, not about the dataset or its family; they would say that the instrument has \"daily\" and \"monthly\" products, which is true of one product of it only, not of all.", "Rule 11's second sentence changes."], "line": 2981}, {"number": 4, "title": "Another way", "body": [{"p": "Please describe it."}], "consequences": ["Depends on the answer."], "line": 2985}], "context": [{"p": "The same happens with the releases of a product: the record also says \"The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4\", and I wrote only that \"V2019.0\" replaces \"v2014.1\", not the address of the older datasets. Another record of the catalog (titled \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\") names the standard product and its Near Real Time sibling in one sentence."}, {"p": "How the groups of datasets could be written, if they are, depends on how the ground truth schema treats kinds and parts of things; that is asked in another question (Q25)."}], "answer": [], "notes": [{"p": "The example is the record at pool position 4, the densest record I have annotated: the items its notes leave out are listed in <code>annotations/left_out.md<\/code>. Q22 asks a narrower question about the same sentence (is the title's \"4km\" the notes' \"4.63 km\"), and Q5 (b) what the \"Average\" means; neither is settled by this one. I decided against merging this into Q19 (releases, \"R2019.0\" and \"Collection\"): an answer about whether \"R2019.0\" is \"V2019.0\" does not settle whether a family of products is recorded. It is not merged into Q25 either: Q25 asks how the schema groups things; this asks whether the facts are wanted at all, and one answer to this does not settle the other, though option 2 needs Q25's answer for a part-of predicate."}, {"p": "Items of <code>annotations/left_out.md<\/code> that this answer may bring back as ground truth triples:"}, {"ul": ["the record at pool position 4: \"Day\"; \"daily\", \"monthly\" and \"annual\"; \"9.26 km\"; \"Average\"; the DOI of the previous v2014.1 datasets;", "the record at pool position 6: the Near Real Time (NRT) product and the product MCD19A1N computed from this dataset, as members of a family (their own question: Q20)."]}], "affects": {"records": [{"position": 4, "id": "03a09af3-081e-4db6-9e3b-ea7c0e3138bd", "line": 3026, "title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0"}, {"position": 6, "id": "4c64f3ed-39b4-4f95-95a0-022898ba47a4", "line": 3027, "title": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid"}], "triples": [{"position": 4, "subject": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "subject_class": "Dataset", "predicate": "HAS_TEMPORAL_RESOLUTION", "object": "weekly (8 day)", "object_class": "TemporalResolution", "line": 3028, "draft": false}, {"position": 4, "subject": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "subject_class": "Dataset", "predicate": "HAS_SPATIAL_RESOLUTION", "object": "4.63 km", "object_class": "SpatialResolution", "line": 3029, "draft": false}, {"position": 4, "subject": "V2019.0", "subject_class": "Version", "predicate": "SUPERSEDES", "object": "v2014.1", "object_class": "Version", "line": 3030, "draft": false}], "rows": [], "entries": [], "rules": [{"section": "Writing a classed triple", "rule": 11, "line": 3031}], "methods": [{"path": "common/common_prompts/extraction_rules.txt", "what": "the model's copy of the annotation guidelines' rules, which changes with a rule", "line": 3032}]}, "question": [{"p": "The notes of a record often describe more than the one dataset the record is about: they describe the product family it belongs to. The example below is titled \"MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0\", so its dataset is the 8-day, 4 km (4.63 km), nighttime product; its notes say that \"Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution\", and begin \"Day and night spatially gridded (L3) ... products\". So the record also states which temporal resolutions (daily, monthly, annual), which spatial resolution (9.26 km) and which time of day (day) the other products of the family have. Rule 11 of the annotation guidelines leaves these out, because each of those products is another dataset with a record of its own, where its facts go. The ground truth then says that this dataset is \"weekly (8 day)\" and \"4.63 km\", and nothing says that the others exist. I would like to know:"}, {"ul": ["(a) Is the information about the family worth keeping, in a knowledge graph of this catalog? Would someone ask \"which temporal resolutions does this product come in?\", or \"is there a 9.26 km version of it?\", and expect an answer from the record that describes only one of them?", "(b) If it is, as what? As facts about each of the other products (each of them a dataset, but with no record of its own to hold its title), as facts about a family of products (a group of datasets sharing a name, with the family's own facts), or on the instrument that makes them?", "(c) Where a family is named by one record only, as here, is a fact such as \"there is also a daily product\" about this dataset (it has siblings), or only about the family?"]}], "reading": [{"p": "Option 1 for now, because rule 11 says so and the family facts need an entity class and predicates the ground truth schema does not have. But I think the information is worth keeping if an expert says people ask for it, and I would then lean towards option 2, since the facts are about the family, not about one instrument. I would like to know first whether a person looking for this product would expect to learn the other temporal resolutions and spatial resolutions from this record."}], "terms": [], "named_records": [], "fingerprint": "4b9ede634615", "shown": "Q24: Should facts about a product family be recorded, and as what? | fingerprint 4b9ede634615", "search": "Q24 Should facts about a product family be recorded, and as what? rule 11 of the annotation guidelines, and the facts about the other versions, temporal resolutions and spatial resolutions of a product The notes of a record often describe more than the one dataset the record is about: they describe the product family it belongs to. The example below is titled \"MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0\", so its dataset is the 8-day, 4 km (4.63 km), nighttime product; its notes say that \"Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution\", and begin \"Day and night spatially gridded (L3) ... products\". So the record also states which temporal resolutions (daily, monthly, annual), which spatial resolution (9.26 km) and which time of day (day) the other products of the family have. Rule 11 of the annotation guidelines leaves these out, because each of those products is another dataset with a record of its own, where its facts go. The ground truth then says that this dataset is \"weekly (8 day)\" and \"4.63 km\", and nothing says that the others exist. I would like to know: (a) Is the information about the family worth keeping, in a knowledge graph of this catalog? Would someone ask \"which temporal resolutions does this product come in?\", or \"is there a 9.26 km version of it?\", and expect an answer from the record that describes only one of them? (b) If it is, as what? As facts about each of the other products (each of them a dataset, but with no record of its own to hold its title), as facts about a family of products (a group of datasets sharing a name, with the family's own facts), or on the instrument that makes them? (c) Where a family is named by one record only, as here, is a fact such as \"there is also a daily product\" about this dataset (it has siblings), or only about the family? The same happens with the releases of a product: the record also says \"The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4\", and I wrote only that \"V2019.0\" replaces \"v2014.1\", not the address of the older datasets. Another record of the catalog (titled \"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\") names the standard product and its Near Real Time sibling in one sentence. How the groups of datasets could be written, if they are, depends on how the ground truth schema treats kinds and parts of things; that is asked in another question (Q25). Option 1 for now, because rule 11 says so and the family facts need an entity class and predicates the ground truth schema does not have. But I think the information is worth keeping if an expert says people ask for it, and I would then lean towards option 2, since the facts are about the family, not about one instrument. I would like to know first whether a person looking for this product would expect to learn the other temporal resolutions and spatial resolutions from this record. MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0 Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution. Aqua was launched by NASA on May 4, 2002, into a sun synchronous, polar orbit with a daylight ascending node at 13:30, formation flying in the A-train with other Earth Observation Satellites (EOS), to study the global dynamics of the Earth atmosphere, land and oceans. MODIS captures data in 36 spectral bands at a variety of spatial resolutions. Two SST products can be poral resolution and spatial resolution only. A new entity class for a product family, with its own facts A family of products (for the example, the MODIS Aqua skin sea surface temperature products) is a thing of its own, with its temporal resolutions, spatial resolutions and times of day as its facts, and the dataset of the record is one of its members. Record them on the instrument The facts are written about the instrument that makes the products, as general facts about it (rule 11 includes general facts about a dataset's instrument): the instrument \"Moderate-resolution Imaging Spectroradiometer (MODIS)\" with the temporal resolutions and spatial resolutions of its skin sea surface temperature products. Another way Please describe it."}, {"id": "Q25", "number": 25, "title": "Which entity classes are kinds of others, and which groupings of things matter?", "status": "open", "priority": "medium", "question_kind": "schema entry", "topic": "the ground truth schema as a flat list of entity classes, and its PART_OF predicate", "line": 3034, "records": [{"line": 3052, "source_texts": [{"text": "the GRaND plus Z boron loaded sensor", "line": 3058}], "triples": [{"subject": "GRaND plus Z boron loaded sensor", "subject_class": "Instrument", "predicate": "PART_OF", "object": "GRaND", "object_class": "Instrument", "line": 3059}], "in_ground_truth": true, "not_yet": "", "record id": "99dff022-24ac-48cb-bc83-09fec8b90ad7", "pool position": 5, "title": "DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0", "notes": "These data are maps of fast neutron residual count rates from the GRaND plus Z boron loaded sensor. The nominal fast neutron count rates were detrended using the GRaND epithermal neutron map to produced this residual map. The residual map is related to the average atomic mass on Vesta. Details of the map and data reduction are described in LAWRENCEETAL2013."}], "schema": [{"kind": "entity class", "entry": "Instrument", "definition": "a device that takes measurements", amed; Q24's option 2 gets its membership predicate."], "line": 3080}, {"number": 4, "title": "Another way", "body": [{"p": "Please describe it."}], "consequences": ["Depends on the answer."], "line": 3084}], "context": [{"p": "Today each predicate lists the entity classes it takes, so \"developed by\" lists Organization, Person and Team one by one. A hierarchy (an entity class that is a kind of another) is standard in schemas of knowledge graphs; adding one to the ground truth schema would change how the ground truth is written and how the model's schema is compared with it, so I want to know first whether the catalog needs it."}], "answer": [], "notes": [{"p": "The example is the record at pool position 5, the only tuning record annotated so far with a PART_OF triple (listed under Affects). Q4 (d) asks the platform half of (1) for the data's carriers; Q24 is the product family half of (2), kept apart because it asks whether the family facts are wanted at all. Both would use the hierarchy this question asks for if it is kept: the improvements item \"An entity class hierarchy for the schemas\" (<code>docs/improvements.md<\/code>) lists what it touches (the schema reader and its file format, the pin check, step 040's induced schema, the translation table). The same file's item \"Kinds of translation, not only \"means the same\"\" would let a row of the translation table say a current-schema entity class is narrower or broader than a ground truth schema one, instead of only equal or none: with a hierarchy, a row for an aircraft could say it is a kind of a platform."}], "affects": {"records": [{"position": 5, "id": "99dff022-24ac-48cb-bc83-09fec8b90ad7", "line": 3119, "title": "DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0"}, {"position": 9, "id": "dc4ff01b-12f0-4235-8c8a-afb4bfb3bdbb", "line": 3120, "title": "STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0"}, {"position": 12, "id": "bb1fe4b0-6543-42e3-9386-acbab0b37ad4", "line": 3121, "title": "Ensemble X-Ray Variability of r it is Q4 (d)); a Person, a Team and an Organization are kinds of an agent (a party that develops, sponsors, launches or is responsible for something). If these were kinds of a larger entity class, a predicate such as \"developed by\" could say \"any agent\" instead of listing the three, and a search could ask for anything a platform carries. Are these two groups right? Which other kinds of kinds do you see in this catalog (for example, a Dataset and a Document as kinds of something that holds information)?", "(2) Which groupings of instances matter? In the example below, the notes name a part of an instrument: \"GRaND plus Z boron loaded sensor\" is one part of \"GRaND\". Other groupings of the same shape: a product family (the daily, weekly, monthly and annual products of one kind of data, Q24), a mission and its phases, a formation and its spacecraft. For each, is \"is part of\" the right link, or are they different kinds of link (a member of a group, a part of a whole, a phase of a mission) that should not share one predicate?"]}], "reading": [{"p": "Option 1 for now: the ground truth has one use of PART_OF and no record whose facts need a kind of a kind. I would move to option 2 if experts say the two groups of question (1) are right, since the same fact is then asked across several entity classes, and I would add the separate links of option 3 only for groupings that experts say differ."}], "terms": [], "named_records": [], "fingerprint": "9f807fca3e28", "shown": "Q25: Which entity classes are kinds of others, and which groupings of things matter? | fingerprint 9f807fca3e28", "search": "Q25 Which entity classes are kinds of others, and which groupings of things matter? the ground truth schema as a flat list of entity classes, and its PART_OF predicate The ground truth schema is a flat list: no entity class is a kind of another, and no predicate says a thing belongs to a group of things, except PART_OF (\"is one part of\"), which I coined for one record. Two questions follow, and I would like to know: (1) Which entity classes are kinds of others? My guess: a Spacecraft, an aircraft, a ship, a balloon and a ground station are kinds of a platform (the thing that carries instruments; whether this catalog needs one entity class for it is Q4 (d)); a Person, a Team and an Organization are kinds of an agent (a party that develops, sponsors, launches or is responsible for something). If these were kinds of a larger entity class, a predicate such as \"developed by\" could say \"any agent\" instead of listing the three, and a search could ask for anything a platform carries. Are these two groups right? Which other kinds of kinds do you see in this catalog (for example, a Dataset and a Document as kinds of something that holds information)? (2) Which groupings of instances matter? In the example below, the notes name a part of an instrument: \"GRaND plus Z boron loaded sensor\" is one part of \"GRaND\". Other groupings of the same shape: a product family (the daily, weekly, monthly and annual products of one kind of data, Q24), a mission and its phases, a formation and its spacecraft. For each, is \"is part of\" the right link, or are they different kinds of link (a member of a group, a part of a whole, a phase of a mission) that should not share one predicate? Today each predicate lists the entity classes it takes, so \"developed by\" lists Organization, Person and Team one by one. A hierarchy (an entity class that is a kind of another) is standard in schemas of knowledge graphs; adding one to the ground truth schema would change how the ground truth is written and how the model's schema is compared with it, so I want to know first whether the catalog needs it. Option 1 for now: the ground truth has one use of PART_OF and no record whose facts need a kind of a kind. I would move to option 2 if experts say the two groups of question (1) are right, since the same fact is then asked across several entity classes, and I would add the separate links of option 3 only for groupings that experts say differ. DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0 These data are maps of fast neutron residual count rates from the GRaND plus Z boron loaded sensor. The nominal fast neutron count rates were detrended using the GRaND epithermal neutron map to produced this residual map. The residual map is related to the average atomic mass on Vesta. Details of the map and data reduction are described in LAWRENCEETAL2013. 99dff022-24ac-48cb-bc83-09fec8b90ad7 Instrument a device that takes measurements Spacecraft a craft that operates in space Organization a named institution or one of its named parts, not a Mission, e.g. NASA; OBPG Team a group of people without a name of its own, e.g. Peter Minnett and his team Person one named human being, e.g. Peter Minnett PART_OF is one part of Keep the schema flat No entity class is a kind of another, and PART_OF stays for any part of a whole. A hierarchy of entity classes, and PART_OF as it is Entity classes get kinds (for example a platform with Spacecraft, aircraft, ship, balloon and ground station under it; an agent with Person, Team and Organization under it), and PART_OF keeps its one meaning. A hierarchy, and separate links for a part, a member and a phase As option 2, and the groupings of question (2) get one predicate each (part of a whole; member of a group; phase of a mission). Another way Please describe it."}, {"id": "Q26", "number": 26, "title": "Should a study's aim, method and findings, as a record tells them, be facts of the knowledge graph?", "status": "open", "priority": "medium", "question_kind": "records and triples", "topic": "records that tell the study a table comes from; a study's aim, method and findings", "line": 3133, "records": [{"line": 3152, "source_texts": [{"text": "In their study, the authors aimed to determine the ensemble variability properties of two serendipitously selected AGN samples", "line": 3158}, {"text": "They used the structure function (SF)", "line": 3159}, {"text": "The authors find statistically consistent results for the two samples", "line": 3160}, {"text": "The authors find statistically consistent results for the two samples, with the SF described by a power law of the time lag tau, approximately as SF ~ tau^0.1", "line": 3161}, {"text": "They confirm a strong anti-correlation of the variability with X-ray luminosity, accompanied by a change of the slope of the SF", "line": 3162}, {"text": "They also find evidence in support of a weak, intrinsic, average increase of X-ray variability with redshift", "line": 3163}], "triples": [], "in_ground_truth": true, "not_yet": "", "record id": "bb1fe4b0-6543-42e3-9386-acbab0b37ad4", "pool position": 12, "title": "Ensemble X-Ray Variability of AGN in 2XMMi-DR3", "notes": "The X-ray variability of active galactic nuclei (AGN) has been most often investigated with studies of individual, nearby sources, and only a few ensemble analyses have been applied to large samples in wide ranges of luminosity and redshift. In their study, the authors aimed to determine the ensemble variability properties of two serendipitously selected AGN samples extracted from the catalogs of XMM-Newton and Swift (the latter is not included in this table, notice), with redshift between ~ 0.2 and ~ 4.5, and X-ray luminosities, in the 0.5 - 4.5 keV band, between ~ 10^43 erg/s and ~ 10^46 erg/s. They used the structure function (SF), which operates in the time domain, and allows for an ensemble analysis even when only a few observations are available for individual sources and the power spectral density (PSD) cannot be derived. The SF is also more appropriate than fractional variability and excess variance, because these parameters are biased by the duration of the monitoring time interval in the rest-frame, and therefore by cosmological time dilation. The authors find statistically consistent results for the two samples, with the SF described by a power law of the time lag tau, approximately as SF ~ tau^0.1. They do not find evidence of the break in the SF, at variance with the case of lower luminosity AGNs. They confirm a strong anti-correlation of the variability with X-ray luminosity, accompanied by a change of the slope of the SF. They also find evidence in support of a weak, intrinsic, average increase of X-ray variability with redshift. For XMM, the authors used the version of the Serendipitous Source Catalog then available, namely 2XMMi-DR3, the latest incremental update of the second version of the catalogue, with observations made between 2000 February 3 and 2008 October 08; all datasets were publicly available by 2009 October 31, but not all public observations are included in this catalog. The total area of the catalog fields is ~ 814 deg^2, but taking account of the substantial overlaps between observations, the net sky area covered independently is ~ 504 deg^2. The 2XMMi-DR3 catalogue contains 353,191 detections (above the processing likelihood threshold of 6), related to 262,902 unique X-ray sources, therefore a significant number of sources (41,979) have more than one record within the catalog. The selected sources were cross-correlated with the DR7 edition of the SDSS Quasar Catalog (Schneider et al. 2010, AJ, 139, 2360) to obtain redshifts and spectral classifications for the sources. The authors used a maximum distance of 1.5 arcseconds, corresponding to the uncertainty in the X-ray positions, resulting in 412 quasars that were observed by XMM-Newton from 2 to 25 epochs each for a total of 1376 observations. The authors refer to these sources as the XMM-Newton sample. This table was created by the HEASARC in April 2012 based on CDS Catalog J/A+A/536/A84 [https://cdsarc.cds.unistra.fr/ftp/cats/J/A+A/536/A84] file table1.dat. This is a service provided by NASA HEASARC ."}], "schema": [{"kind": "entity class", "entry": "Team", "definition": "a group of people without a name of its own, e.g. Peter Minnett and his team", "line": 3167}, {"kind": "entity class", "entry": "Purpose", "definition": "an aim something is meant to achieve", "line": 3168}, {"kind": "entity class", "entry": "Algorithm", "definition": "a method applied to data to compute a result, e.g. a series of screens; a modified nonlinear SST algorithm", "line": 3169}, {"kind": "predicate", "entry": "HAS_PURPOSE", "definition": "is meant to achieve", "line": 3170}], "rows": [], "rules": [{"section": "What counts as a fact", "rule": 2, "words": "Every fact the record states, unless a rule leaves it out: rules 3 to 10 below, and rules 10, 11 and 14 of Writing a classed triple, or it waits on an expert's answer (annotations/questions_for_experts.md). This holds whether or not the ground truth schema has an entity class or predicate for it.", "line": 3174}, {"section": "What counts as a fact", "rule": 6, "words": "Not negated facts.", "line": 3175}, {"section": "What counts as a fact", "rule": 7, "words": "Not uncertain facts.", "line": 3176}, {"section": "Writing a classed triple", "rule": 2, "words": "The subject instance is what the sentence is about, which isn't always the title.", "line": 3177}], "methods": [], "options": [{"number": 1, "title": "Add them, with the authors as their subject", "body": [{"p": "The study's aim, method and findings become facts, each with \"the authors\" as its subject."}], "consequences": ["The pending facts are added, with the three entries (the predicates USED_METHOD and REPORTED, the entity class Finding) coined in the ground truth schema.", "The <a class=\"term\" data-term=\"model\" href=\"#terms\">model<\/a> must write a study's findings the same way, or step 070 counts them as missed."], "line": 3181}, {"number": 2, "title": "Add them, with the table as their subject", "body": [{"p": "The same facts added, with the table's title as their subject: the table HAS_PURPOSE the study's aim, and the findings are the table's."}], "consequences": ["The pending facts are added with the table's title as their subject instead of \"the authors\" (the DEVELOPED_BY_PARTY \"the authors\" one is then not needed), with the same three entries coined."], "line": 3185}, {"number": 3, "title": "Leave the study out", "body": [{"p": "Only what the table holds, how it was made and where it comes from are facts; the study's aim, method and findings stay left out, as now."}], "consequences": ["Nothing changes in the ground truth: the pending facts and their coined entries are already out (2026-10-25).", "The annotation guidelines get a rule that leaves a study's findings out, and so does the model's copy of the rules (<code>common/common_prompts/extraction_rules.txt<\/code>)."], "line": 3189}], "context": [{"p": "The notes also say what is in the table: its sources were selected from \"2XMMi-DR3\", \"cross-correlated with the DR7 edition of the SDSS Quasar Catalog\", \"resulting in 412 quasars that were observed by XMM-Newton from 2 to 25 epochs each for a total of 1376 observations\". Those I wrote as facts of the table, whatever the answer here. One finding is negated (\"They do not find evidence of the break in the SF\"), and I wrote no fact for it, since the annotation guidelines leave out negated facts. I also left out the background the notes start with (how the X-ray variability of AGN \"has been most often investigated\"), and that the structure function \"is also more appropriate than fractional variability and excess variance\": the first names no study or thing of its own, and the second is a judgement."}], "answer": [], "notes": [{"p": "The example is the record at pool position 12, the only tuning record annotated so far that tells a study (decided 2026-10-25, for me to confirm). Its other doubts: the source catalogs as datasets, and AGN as a target (Q12 (d)); the authors' aim and the method's \"allows for\" as purposes (Q9 (d)). What was left out, with its rule, is in <code>annotations/left_out.md<\/code>."}, {"p": "Three more items of <code>annotations/left_out.md<\/code> for this record wait on this answer (decided 2026-10-25): \"serendipitously selected\" (how the study selected its samples), written with the study's method if the answer is option 1 or 2, else left out; \"corresponding to the uncertainty in the X-ray positions\" (why the maximum distance of 1.5 arcseconds was chosen), written with the pending fact HAS_MATCHING_DISTANCE if that fact is written, else left out; \"taking account of the substantial overlaps between observations\" (how the net sky area of 2XMMi-DR3, my ground truth triple HAS_SKY_AREA \"~ 504 deg^2\", was computed from its fields), which is a method of the catalog, not of the study, so it is written only if the answer makes such methods facts too."}, {"p": "Pending facts, for the record at pool position 12 (bb1fe4b0, in the ground truth now without them; decided 2026-10-25, for me to confirm), each added if the answer says yes:"}, {"ul": ["pending fact: \"the authors\" (Team) HAS_PURPOSE \"determine the ensemble variability properties of two serendipitously selected AGN samples\" (Purpose)", "pending fact: \"the authors\" (Team) USED_METHOD \"structure function (SF)\" (Algorithm)", "pending fact: \"structure function (SF)\" (Algorithm) HAS_PURPOSE \"ensemble analysis even when only a few observations are available for individual sources and the power spectral density (PSD) cannot be derived\" (Purpose)", "pending fact: \"the authors\" (Team) REPORTED \"statistically consistent results for the two samples\" (Finding)", "pending fact: \"the authors\" (Team) REPORTED \"SF described by a power law of the time lag tau, approximately as SF ~ tau^0.1\" (Finding)", "pending fact: \"the authors\" (Team) REPORTED \"strong anti-correlation of the variability with X-ray luminosity, accompanied by a change of the slope of the SF\" (Finding)", "pending fact: \"the authors\" (Team) REPORTED \"evidence in support of a weak, intrinsic, average increase of X-ray variability with redshift\" (Finding)", "pending fact: \"Ensemble X-Ray Variability of AGN in 2XMMi-DR3\" (Dataset) DEVELOPED_BY_PARTY \"the authors\" (Team), since the record says what they selected and how", "pending fact: \"Ensemble X-Ray Variability of AGN in 2XMMi-DR3\" (Dataset) HAS_MATCHING_DISTANCE \"1.5 arcseconds\" (Value), a detail of the study's method, with a predicate to coin"]}], "affects": {"records": [{"position": 12, "id": "bb1fe4b0-6543-42e3-9386-acbab0b37ad4", "line": 3233, "title": "Ensemble X-Ray Variability of AGN in 2XMMi-DR3"}], "triples": [], "rows": [], "entries": [], "rules": [{"section": "What counts as a fact", "rule": 2, "line": 3234}, {"section": "Writing a classed triple", "rule": 2, "line": 3235}], "methods": [{"path": "common/common_prompts/extraction_rules.txt", "what": "the model's copy of the annotation guidelines' rules, which changes with a rule", "line": 3236}]}, "question": [{"p": "Some records of the catalog describe a table from an astronomical study, and most of their notes tell the study itself: what the authors aimed to find, the method they used, and what they found. The example below is one. I have left all of it out of the ground truth for now. If it is to be written, I would write it with \"the authors\" as the subject (a Team, the ground truth schema's entity class for \"a group of people without a name of its own\"), and I would coin three entries: the predicates USED_METHOD and REPORTED, and the entity class Finding. I would like to know:"}, {"ul": ["(a) For someone searching this catalog, are a study's findings (for example \"a strong anti-correlation of the variability with X-ray luminosity, accompanied by a change of the slope of the SF\") worth having in the knowledge graph, or only what the table holds and where it comes from?", "(b) If they are: is \"the authors\" the right subject, or the table itself (whose title names what the study is about), or the publication the table comes from (which the record names only by its catalog's key, \"CDS Catalog J/A+A/536/A84\")?", "(c) Some findings are about both samples of the study, one of which is not in this table (\"the latter is not included in this table\"), and one is hedged (\"evidence in support of\"). Should those be written too, and as what?"]}], "reading": [{"p": "Option 3 for now (decided 2026-10-25, for me to confirm): the ground truth keeps what the table holds and where it comes from, and the study's aim, method and findings wait for your answer. If your answer to (a) is that findings belong in the knowledge graph, option 1 or 2, by your answer to (b)."}], "terms": ["model"], "named_records": [], "fingerprint": "1dbe9090be23", "shown": "Q26: Should a study's aim, method and findings, as a record tells them, be facts of the knowledge graph? | fingerprint 1dbe9090be23", "search": "Q26 Should a study's aim, method and findings, as a record tells them, be facts of the knowledge graph? records that tell the study a table comes from; a study's aim, method and findings Some records of the catalog describe a table from an astronomical study, and most of their notes tell the study itself: what the authors aimed to find, the method they used, and what they found. The example below is one. I have left all of it out of the ground truth for now. If it is to be written, I would write it with \"the authors\" as the subject (a Team, the ground truth schema's entity class for \"a group of people without a name of its own\"), and I would coin three entries: the predicates USED_METHOD and REPORTED, and the entity class Finding. I would like to know: (a) For someone searching this catalog, are a study's findings (for example \"a strong anti-correlation of the variability with X-ray luminosity, accompanied by a change of the slope of the SF\") worth having in the knowledge graph, or only what the table holds and where it comes from? (b) If they are: is \"the authors\" the right subject, or the table itself (whose title names what the study is about), or the publication the table comes from (which the record names only by its catalog's key, \"CDS Catalog J/A+A/536/A84\")? (c) Some findings are about both samples of the study, one of which is not in this table (\"the latter is not included in this table\"), and one is hedged (\"evidence in support of\"). Should those be written too, and as what? The notes also say what is in the table: its sources were selected from \"2XMMi-DR3\", \"cross-correlated with the DR7 edition of the SDSS Quasar Catalog\", \"resulting in 412 quasars that were observed by XMM-Newton from 2 to 25 epochs each for a total of 1376 observations\". Those I wrote as facts of the table, whatever the answer here. One finding is negated (\"They do not find evidence of the break in the SF\"), and I wrote no fact for it, since the annotation guidelines leave out negated facts. I also left out the background the notes start with (how the X-ray variability of AGN \"has been most often investigated\"), and that the structure function \"is also more appropriate than fractional variability and excess variance\": the first names no study or thing of its own, and the second is a judgement. Option 3 for now (decided 2026-10-25, for me to confirm): the ground truth keeps what the table holds and where it comes from, and the study's aim, method and findings wait for your answer. If your answer to (a) is that findings belong in the knowledge graph, option 1 or 2, by your answer to (b). Ensemble X-Ray Variability of AGN in 2XMMi-DR3 The X-ray variability of active galactic nuclei (AGN) has been most often investigated with studies of individual, nearby sources, and only a few ensemble analyses have been applied to large samples in wide ranges of luminosity and redshift. In their study, the authors aimed to determine the ensemble variability properties of two serendipitously selected AGN samples extracted from the catalogs of XMM-Newton and Swift (the latter is not included in this table, notice), with redshift between ~ 0.2 and ~ 4.5, and X-ray luminosities, in the 0.5 - 4.5 keV band, between ~ 10^43 erg/s and ~ 10^46 erg/s. They used the structure function (SF), which operates in the time domain, and allows for an ensemble analysis even when only a few observations are available for individual sources and the power spectral density (PSD) cannot be derived. The SF is also more appropriate than fractional variability and excess variance, because these parameters are biased by the duration of the monitoring time interval in the rest-frame, and therefore by cosmological time dilation. The authors find statistically consistent results for the two samples, with the SF described by a power law of the time lag tau, approximately as SF ~ tau^0.1. They do not find evidence of the break in the SF, at variance with the case of lower luminosity AGNs. They confirm a strong anti-correlation of the variability with X-ray luminosity, accompanied by a change of the slope of the SF. They also find evidence in support of a weak, intrinsic, average increase of X-ray variability with redshift. For XMM, the authors used the version of the Serendipitous Source Catalog then available, namely 2XMMi-DR3, the latest incremental update of the second version of the catalogue, with observations made between 2000 February 3 and 2008 October 08; all datasets were publicly available by 2009 October 31, but not all public observations are included in this catalog. The total area of the catalog fields is ~ 814 deg^2, but taking account of the substantial overlaps between observations, the net sky area covered independently is ~ 504 deg^2. The 2XMMi-DR3 catalogue contains 353,191 detections (above the processing likelihood threshold of 6), related to 262,902 unique X-ray sources, therefore a significant number of sources (41,979) have more than one record within the catalog. The selected sources were cross-correlated with the DR7 edition of the SDSS Quasar Catalog (Schneider et al. 2010, AJ, 139, 2360) to obtain redshifts and spectral classifications for the sources. The authors used a maximum distance of 1.5 arcseconds, corresponding to the uncertainty in the X-ray positions, resulting in 412 quasars that were observed by XMM-Newton from 2 to 25 epochs each for a total of 1376 observations. The authors refer to these sources as the XMM-Newton sample. This table was created by the HEASARC in April 2012 based on CDS Catalog J/A+A/536/A84 [https://cdsarc.cds.unistra.fr/ftp/cats/J/A+A/536/A84] file table1.dat. This is a service provided by NASA HEASARC . bb1fe4b0-6543-42e3-9386-acbab0b37ad4 Team a group of people without a name of its own, e.g. Peter Minnett and his team Purpose an aim something is meant to achieve Algorithm a method applied to data to compute a result, e.g. a series of screens; a modified nonlinear SST algorithm HAS_PURPOSE is meant to achieve Add them, with the authors as their subject The study's aim, method and findings become facts, each with \"the authors\" as its subject. Add them, with the table as their subject The same facts added, with the table's title as their subject: the table HAS_PURPOSE the study's aim, and the findings are the table's. Leave the study out Only what the table holds, how it was made and where it comes from are facts; the study's aim, method and findings stay left out, as now."}, {"id": "Q27", "number": 27, "title": "Words that say how a fact holds: do people searching need them?", "status": "open", "priority": "medium", "question_kind": "rule", "topic": "words such as \"collaboratively\", \"entire\", \"prime\" and \"associated\", and a possible new rule of *What counts as a fact* in the annotation guidelines", "line": 3238, "records": [{"line": 3262, "source_texts": [{"text": "The prime target is comet 67P/Churyumov-Gerasimenko 1 (1969 R1)", "line": 3268}], "triples": [{"subject": "ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0", "subject_class": "Dataset", "predicate": "HAS_TARGET", "object": "67P/Churyumov-Gerasimenko 1 (1969 R1)", "obje l NASA skin sea surface temperature (SST) products\", \"known issues\", \"Lien\"", "line": 3328, "records": [{"line": 3351, "source_texts": [{"text": "global NASA skin sea surface temperature (SST) products", "line": 3357}, {"text": "The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG)", "line": 3358}], "triples": [{"subject": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "subject_class": "Dataset", "predicate": "DEVELOPED_BY_PARTY", "object": "NASA Ocean Biology Processing Group (OBPG)", "object_class": "Organization", "line": 3359}], "in_ground_truth": true, "not_yet": "", "record id": "03a09af3-081e-4db6-9e3b-ea7c0e3138bd", "pool position": 4, "title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "notes": "Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution. Aqua was launched by NASA on May 4, 2002, into a sun synchronous, polar orbit with a daylight ascending node at 13:30, formation flying in the A-train with other Earth Observation Satellites (EOS), to study the global dynamics of the Earth atmosphere, land and oceans. MODIS captures data in 36 spectral bands at a variety of spatial resolutions. Two SST products can be present in these files. The first is a skin SST produced for both day and night (NSST) observations, derived from the long wave IR 11 and 12 micron wavelength channels, using a modified nonlinear SST algorithm intended to provide continuity of SST derived from heritage and current NASA sensors. At night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4"}], "schema": [{"kind": "entity class", "entry": "Organization", "definition": "a named institution or one of its named parts, not a Mission, e.g. NASA; OBPG", "line": 3363}, {"kind": "predicate", "entry": "DEVELOPED_BY_PARTY", "definition": "was built or created by this Person, Team, or Organization", "line": 3364}, {"kind": "entity class", "entry": "WebPage", "definition": "a web address, written as the address itself, e.g. https://oceancolor.gsfc.nasa.gov/docs/format/", "line": 3365}, {"kind": "predicate", "entry": "DOCUMENTED_AT", "definition": "more details about it are written at", "line": 3366}, {"kind": "entity class", "entry": "Task", "definition": "a piece of work a Person, Team, or Organization does or is in charge of, e.g. quality flagging", "line": 3367}, {"kind": "predicate", "entry": "REVISED_AFTER", "definition": "was corrected after this review", "line": 3368}], "rows": [], "rules": [{"section": "What counts as a fact", "rule": 2, "words": "Every fact the record states, unless a rule leaves it out: rules 3 to 10 below, and rules 10, 11 and 14 of Writing a classed triple, or it waits o

th schema's SpatialExtent and HAS_SPATIAL_COVERAGE, and rule 9 of *Writing a classed triple* in the annotation guidelines", "line": 1519, "records": [{"line": 1542, "source_texts": [{"text": "Land Aerosol Optical Depth", "line": 1548}, {"text": "Global 1km SIN Grid", "line": 1549}], "triples": [{"subject": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid", "subject_class": "Dataset", "predicate": "HAS_SPATIAL_COVERAGE", "object": "Land", "object_class": "SpatialExtent", "line": 1550}, {"subject": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid", "subject_class": "Dataset", "predicate": "HAS_MEASUREMENTS_OF", "object": "Aerosol Optical Depth", "object_class": "PhysicalQuantity", "line": 1551}], "in_ground_truth": true, "not_yet": "", "record id": "4c64f3ed-39b4-4f95-95a0-022898ba47a4", "pool position": 6, "title": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid", "notes": "The Moderate Resolution Imaging Spectroradiometer (MODIS) Near Real Time (NRT) Combined Terra and Aqua Multi-Angle Implementation of Atmospheric Correction (MAIAC) Land Aerosol Optical Depth gridded Level 2 product (MCD19A2N) produced daily at 1 kilometer (km) pixel resolutions. The MCD19A2N product provides the atmospheric properties and view geometry used to calculate the MAIAC Land Surface Bidirectional Reflectance Factor (BRF) or surface reflectance, MCD19A1N product."}], "schema": [{"kind": "entity class", "entry": "SpatialExtent", "definition": "the area the data cover, of the CelestialBody they are about: all of it (global) or part of it (e.g. the Arctic; the south pole of Mars)", "line": 1555}, {"kind": "entity class", "entry": "PhysicalQuantity", "definition": "a property that can be measured, in general, whatever method measures it, e.g. sea surface temperature; snow cover", "line": 1556}, {"kind": "entity class", "entry": "CelestialBody", "definition": "a natural object in space", "line": 1557}, {"kind": "predicate", "entry": "HAS_SPATIAL_COVERAGE", "definition": "covers this area", "line": 1558}, {"kind": "predicate", "entry": "HAS_MEASUREMENTS_OF", "definition": "holds measurements of", "line": 1559}, {"kind": "predicate", "entry": "HAS_TARGET", "definition": "is about this CelestialBody", "line": 1560}], "rows": [{"kind": "entity class", "crt": "SpatialCoverage", "gtt": "SpatialExtent", "swap": false, "definition": "The geographic or sky extent covered by a dataset or observation, such as global, a swath width, or a number of square degrees or areas.", "line": 1564}, {"kind": "predicate", "crt": "HAS_SPATIAL_COVERAGE", "gtt": "HAS_SPATIAL_COVERAGE", "swap": false, "definition": "The subject (a dataset or survey) covers the object, a geographic region, latitude range, area extent or coverage descriptor.", "line": 1565}], "rules": [{"section": "Writing a classed triple", "rule": 9, "words": "A qualifier that is a temporal resolution, an area the data cover, a processing level, a spatial resolution, a country, a time of day, or a target body is a ground truth triple of its own, and is taken out of the instance.", "line": 1569}, {"section": "Writing a classed triple", "rule": 9, "words": "A qualifier stays in the instance, as written, if it is any other kind (\"sea surface salinity\" stays whole), or if taking it out would give a triple that isn't true.", "line": 1570}], "methods": [], "options": [{"number": 1, "title": "Keep them as I wrote them", "body": [{"p": "\"Global\" (at the comet 67P) and \"Land\" (in the example) are areas the data cover, each a fact of its own."}], "consequences": ["Nothing changes in the ground truth triples listed under Affects.", "If \"Global Gravity\" is the name of one sort of measurement, the area \"Global\" is a <a class=\"term\" data-term=\"fact\" href=\"#terms\">fact<\/a> the record doesn't state, and the 2,835 records with this sentence would each get it.", "SpatialExtent holds both regions and sorts of surface (land); its definition would say so."], "line": 1574}, {"number": 2, "title": "Only regions of a body are areas", "body": [{"p": "SpatialExtent holds only a region of a body, or the whole of it. \"Land Aerosol Optical Depth\" stays whole, as the quantity measured, since rule 9 of <em>Writing a classed triple<\/em> keeps a qualifier that is no area in the instance; \"Global Gravity\" stays whole too, if the answer to (a) is that it names a measurement."}], "consequences": ["The ground truth triples of the record at pool position 6 become one: HAS_MEASUREMENTS_OF \"Land Aerosol Optical Depth\", with no HAS_SPATIAL_COVERAGE.", "The record at pool position 1 loses HAS_SPATIAL_COVERAGE \"Global\", and its HAS_MEASUREMENTS_OF \"Gravity\" becomes \"Global Gravity\", if the answer to (a) says so.", "A search for land-only data has to look inside the quantities' words."], "line": 1578}, {"number": 3, "title": "Name sorts of surface in the definition", "body": [{"p": "The definition of SpatialExtent says that a sort of surface the data are limited to (land, ocean, sea ice) is an area too, and rule 9 of <em>Writing a classed triple<\/em> takes it out like any area."}], "consequences": ["The ground truth schema's definition of SpatialExtent changes, and the rows of the translation table into it are checked again.", "The model's copy of the rules (rule 9 of <em>Writing a classed triple<\/em>) says the same, so extraction takes \"Land\" out too."], "line": 1582}], "context": [{"p": "The areas I have written so far are \"Global\" (the record \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\"), \"global\" (the records \"MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061\" and \"MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0\"), and my draft \"Land\" (the example below, which question (b) is about)."}, {"p": "Settled, so not asked here: the example's title ends in \"Global 1km SIN Grid\". Checked on 2026-10-25, \"SIN Grid\" is the MODIS sinusoidal grid, and \"Global 1km SIN Grid\" is the standard end of the titles of the MODIS products made on it, so \"Global\" there names the grid's worldwide tiling, not the area this dataset covers (NASA LAADS, the MCD19A2 product page, https://ladsweb.modaps.eosdis.nasa.gov/missions-and-measurements/products/MCD19A2; NASA MODAPS, MCD19A2N, https://modaps.modaps.eosdis.nasa.gov/services/about/products/c61-nrt/MCD19A2N.html). So I wrote no area \"Global\" for it. A \"global\" written as a word of its own (\"This global Level-2 (L2) data set\") I am sure of; the three words above I am not."}, {"p": "The sentence of the record \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\" recurs across the catalog. I counted it in the catalog's 36,406 records: \"It is a Global Gravity measurement\" in 2,835 records (2,442 of them \"at the comet 67P\"), \"It is a Occultation measurement\" in 439, \"It is a Solar Conjunction measurement\" in 240, and \"It is a Phobos Gravity measurement\" in 9. Since \"Phobos Gravity\" sits beside \"Global Gravity\", my reading is that the word before \"Gravity\" may say which gravity measurement it is, not an area; but I don't know."}], "answer": [], "notes": [{"p": "Every ground truth triple with HAS_SPATIAL_COVERAGE so far is listed under Affects: \"Global\" (pool position 1), \"global\" (pool positions 2 and 4), and \"Land\" (pool position 6, the example). The count of the recurring sentence is over 020's records.jsonl (36,406 records). Until the answers, the ground truth stays as written (option 1). Rule 9 of <em>Writing a classed triple<\/em> now records my reading of a word naming a kind of ground or water: it is an area the data cover when \"the [rest] of the [word]\" is false (\"the aerosol optical depth of the land\" is false, because the aerosols are in the air), so \"Land\" stays taken out in the example; if the answers say otherwise, rule 9, the model's copy of the rules, and the ground truth triples under Affects change with them."}, {"p": "How the translation table is used: the <a class=\"term\" data-term=\"model\" href=\"#terms\">model<\/a> extracts classed triples with a schema it learned from other records of the catalog (the current schema; a schema an earlier run used is a past schema). Before its classed triples are compared with the ground truth, each entity class and predicate of that schema is replaced by the one of the ground truth schema its <a class=\"term\" data-term=\"row\" href=\"#terms\">row<\/a> of the translation table names. A row that names (none) says nothing in the ground truth schema means the same: a classed triple that uses it can never be part of a <a class=\"term\" data-term=\"pair\" href=\"#terms\">pair<\/a> with a ground truth triple, so it always counts as extracted only. The current schema's SpatialCoverage and HAS_SPATIAL_COVERAGE translate into SpatialExtent and HAS_SPATIAL_COVERAGE, so the answer also decides what an extracted triple with them is compared with."}], "affects": {"records": [{"position": 1, "id": "cfd6ec3f-1e63-4a77-bc3f-007d45f7e2fc", "line": 1617, "title": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0"}, {"position": 2, "id": "6cfafd07-40f1-46da-9d92-36c2bb319f0b", "line": 1618, "title": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061"}, {"position": 4, "id": "03a09af3-081e-4db6-9e3b-ea7c0e3138bd", "line": 1619, "title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0"}, {"position": 6, "id": "4c64f3ed-39b4-4f95-95a0-022898ba47a4", "line": 1620, "title": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid"}], "triples": [{"position": 1, "subject": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0", "subject_class": "Dataset", "predicate": "HAS_SPATIAL_COVERAGE", "object": "Global", "object_class": "SpatialExtent", "line": 1621, "draft": false}, {"position": 2, "subject": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061", "subject_class": "Dataset", "predicate": "HAS_SPATIAL_COVERAGE", "object": "global", "object_class": "SpatialExtent", "line": 1622, "draft": false}, {"position": 4, "subject": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "subject_class": "Dataset", "predicate": "HAS_SPATIAL_COVERAGE", "object": "global", "object_class": "SpatialExtent", "line": 1623, "draft": false}, {"position": 1, "subject": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0", "subject_class": "Dataset", "predicate": "HAS_MEASUREMENTS_OF", "object": "Gravity", "object_class": "PhysicalQuantity", "line": 1624, "draft": false}, {"position": 6, "subject": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid", "subject_class": "Dataset", "predicate": "HAS_SPATIAL_COVERAGE", "object": "Land", "object_class": "SpatialExtent", "line": 1625, "draft": false}, {"position": 6, "subject": "MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid", "subject_class": "Dataset", "predicate": "HAS_MEASUREMENTS_OF", "object": "Aerosol Optical Depth", "object_class": "PhysicalQuantity", "line": 1626, "draft": false}], "rows": [{"kind": "entity class", "crt": "SpatialCoverage", "line": 1627}, {"kind": "predicate", "crt": "HAS_SPATIAL_COVERAGE", "line": 1628}], "entries": [{"kind": "entity class", "entry": "SpatialExtent", "line": 1629}, {"kind": "predicate", "entry": "HAS_SPATIAL_COVERAGE", "line": 1630}], "rules": [{"section": "Writing a classed triple", "rule": 9, "line": 1631}], "methods": [{"path": "common/common_prompts/extraction_rules.txt", "what": "the model's copy of the annotation guidelines' rules (the list of qualifiers taken out, rule 9 of *Writing a classed triple*)", "line": 1632}]}, "question": [{"p": "The ground truth schema's SpatialExtent is \"the area the data cover, of the CelestialBody they are about: all of it (global) or part of it (e.g. the Arctic; the south pole of Mars)\", and a dataset HAS_SPATIAL_COVERAGE such an area. Rule 9 of <em>Writing a classed triple<\/em> in the annotation guidelines (quoted below) takes an area the data cover out of an instance, as a fact of its own. In two records I am not sure whether a word is such an area. To decide, I need to know:"}, {"ul": ["(a) The record \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\" says \"It is a Global Gravity measurement at the comet 67P\". I wrote \"Global\" as the area the data cover (all of the comet 67P). At a comet, what would \"Global\" mean: the whole comet, or something else? Or is \"Global Gravity\" the name of one sort of radio science measurement, as a whole, so that \"Global\" is no area at all? (Other records of the catalog have the same sentence with \"Phobos Gravity\", \"Occultation\" or \"Solar Conjunction\" in its place: see below.)", "(b) The example below is a dataset of \"Land Aerosol Optical Depth\". I took \"Land\" out as the area the data cover (\"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\" (Dataset) HAS_SPATIAL_COVERAGE \"Land\" (SpatialExtent)), and kept \"Aerosol Optical Depth\" as the quantity measured. Is \"Land\" (the land surfaces of the Earth, as against the oceans) an area in the sense of SpatialExtent, \"part of\" the Earth? Or is \"Land Aerosol Optical Depth\" one quantity, the aerosol optical depth over land, which should stay whole? Or does \"Land\" say what sort of surface the method that computes the product (MAIAC) is made for, so that it stays in the quantity's words as a qualifier of another sort (rule 9 of <em>Writing a classed triple<\/em>: \"any other kind\")?", "(c) In general: should SpatialExtent hold only a region of a body (the Arctic, a pole, the whole body), or also a sort of surface (land, ocean, sea ice) that the data are limited to?"]}], "reading": [{"p": "Undecided. For \"Land\", I lean towards option 3: it says which part of the Earth the data cover, which is what a search would ask. For \"Global Gravity\", I lean towards keeping it whole, since \"Phobos Gravity\" in other records reads like the same sort of title; your answer to (a) decides it."}], "terms": ["model", "row", "pair", "fact"], "named_records": [{"title": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0", "line": 1530}, {"title": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0", "line": 1536}, {"title": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061", "line": 1536}, {"title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "line": 1536}, {"title": "ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0", "line": 1540}], "fingerprint": "789edd164eb3", "shown": "Q11: What counts as an area the data cover: \"Global\" at a comet, and \"Land\"? | fingerprint 789edd164eb3", "search": "Q11 What counts as an area the data cover: \"Global\" at a comet, and \"Land\"? the ground truth schema's SpatialExtent and HAS_SPATIAL_COVERAGE, and rule 9 of *Writing a classed triple* in the annotation guidelines The ground truth schema's SpatialExtent is \"the area the data cover, of the CelestialBody they are about: all of it (global) or part of it (e.g. the Arctic; the south pole of Mars)\", and a dataset HAS_SPATIAL_COVERAGE such an area. Rule 9 of Writing a classed triple in the annotation guidelines (quoted below) takes an area the data cover out of an instance, as a fact of its own. In two records I am not sure whether a word is such an area. To decide, I need to know: (a) The record \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\" says \"It is a Global Gravity measurement at the comet 67P\". I wrote \"Global\" as the area the data cover (all of the comet 67P). At a comet, what would \"Global\" mean: the whole comet, or something else? Or is \"Global Gravity\" the name of one sort of radio science measurement, as a whole, so that \"Global\" is no area at all? (Other records of the catalog have the same sentence with \"Phobos Gravity\", \"Occultation\" or \"Solar Conjunction\" in its place: see below.) (b) The example below is a dataset of \"Land Aerosol Optical Depth\". I took \"Land\" out as the area the data cover (\"MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid\" (Dataset) HAS_SPATIAL_COVERAGE \"Land\" (SpatialExtent)), and kept \"Aerosol Optical Depth\" as the quantity measured. Is \"Land\" (the land surfaces of the Earth, as against the oceans) an area in the sense of SpatialExtent, \"part of\" the Earth? Or is \"Land Aerosol Optical Depth\" one quantity, the aerosol optical depth over land, which should stay whole? Or does \"Land\" say what sort of surface the method that computes the product (MAIAC) is made for, so that it stays in the quantity's words as a qualifier of another sort (rule 9 of Writing a classed triple: \"any other kind\")? (c) In general: should SpatialExtent hold only a region of a body (the Arctic, a pole, the whole body), or also a sort of surface (land, ocean, sea ice) that the data are limited to? The areas I have written so far are \"Global\" (the record \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\"), \"global\" (the records \"MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061\" and \"MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0\"), and my draft \"Land\" (the example below, which question (b) is about). Settled, so not asked here: the example's title ends in \"Global 1km SIN Grid\". Checked on 2026-10-25, \"SIN Grid\" is the MODIS sinusoidal grid, and \"Global 1km SIN Grid\" is the standard end of the titles of the MODIS products made on it, so \"Global\" there names the grid's worldwide tiling, not the area this dataset covers (NASA LAADS, the MCD19A2 product page, https://ladsweb.modaps.eosdis.nasa.gov/missions-and-measurements/products/MCD19A2; NASA MODAPS, MCD19A2N, https://modaps.modaps.eosdis.nasa.gov/services/about/products/c61-nrt/MCD19A2N.html). So I wrote no area \"Global\" for it. A \"global\" written as a word of its own (\"This global Level-2 (L2) data set\") I am sure of; the three words above I am not. The sentence of the record \"ROSETTA-ORBITER 67P RSI 1/2/3 COMET ESCORT 4 1149 V1.0\" recurs across the catalog. I counted it in the catalog's 36,406 records: \"It is a Global Gravity measurement\" in 2,835 records (2,442 of them \"at the comet 67P\"), \"It is a Occultation measurement\" in 439, \"It is a Solar Conjunction measurement\" in 240, and \"It is a Phobos Gravity measurement\" in 9. Since \"Phobos Gravity\" sits beside \"Global Gravity\", my reading is that the word before \"Gravity\" may say which gravity measurement it is, not an area; but I don't know. Undecided. For \"Land\", I lean towards option 3: it says which part of the Earth the data cover, which is what a search would ask. For \"Global Gravity\", I lean towards keeping it whole, since \"Phobos Gravity\" in other records reads like the same sort of title; your answer to (a) decides it. MODIS/Terra+Aqua Land Aerosol Optical Depth Daily L2G Global 1km SIN Grid The Moderate Resolution Imaging Spectroradiometer (MODIS) Near Real Time (NRT) Combined Terra and Aqua Multi-Angle Implementation of Atmospheric Correction (MAIAC) Land Aerosol Optical Depth gridded Level 2 product (MCD19A2N) produced daily at 1 kilometer (km) pixel resolutions. The MCD19A2N product provides the atmospheric properties and view geometry used to calculate the MAIAC Land Surface Bidirectional Reflectance Factor (BRF) or surface reflectance, MCD19A1N product. 4c64f3ed-39b4-4f95-95a0-022898ba47a4 SpatialExtent the area the data cover, of the CelestialBody they are about: all of it (global) or part of it (e.g. the Arctic; the south pole of Mars) PhysicalQuantity a property that can be measured, in general, whatever method measures it, e.g. sea surface temperature; snow cover CelestialBody a natural object in space HAS_SPATIAL_COVERAGE covers this area HAS_MEASUREMENTS_OF holds measurements of HAS_TARGET is about this CelestialBody SpatialCoverage SpatialExtent The geographic or sky extent covered by a dataset or observation, such as global, a swath width, or a number of square degrees or areas. HAS_SPATIAL_COVERAGE HAS_SPATIAL_COVERAGE The subject (a dataset or survey) covers the object, a geographic region, latitude range, area extent or coverage descriptor. Keep them as I wrote them \"Global\" (at the comet 67P) and \"Land\" (in the example) are areas the data cover, each a fact of its own. Only regions of a body are areas SpatialExtent holds only a region of a body, or the whole of it. \"Land Aerosol Optical Depth\" stays whole, as the quantity measured, since rule 9 of Writing a classed triple keeps a qualifier that is no area in the instance; \"Global Gravity\" stays whole too, if the answer to (a) is that it names a measurement. Name sorts of surface in the definition The definition of SpatialExtent says that a sort of surface the data are limited to (land, ocean, sea ice) is an area too, and rule 9 of Writing a classed triple takes it out like any area."}, {"id": "Q12", "number": 12, "title": "What counts as a dataset: inputs named in a record, and archives, catalogs and data products?", "status": "open", "priority": "medium", "question_kind": "schema entry", "topic": "the ground truth schema's Dataset, for the data a record's dataset is made from and for collections of datasets; four rows of the translation table into Dataset", "line": 1634, "records": [{"line": 1656, "source_texts": [{"text": "The NDSI is derived from radiance data", "line": 1664}, {"text": "radiance data acquired by the Moderate Resolution Imaging Spectroradiometer (MODIS)", "line": 1665}, {"text": "radiance data acquired by the Moderate Resolution Imaging Spectroradiometer (MODIS) on board the Aqua satellite: DOI:10.5067/MODIS/MYD02HKM.061", "line": 1666}, {"text": "radiance data acquired by the Moderate Resolution Imaging Spectroradiometer (MODIS) on board the Aqua satellite: DOI:10.5067/MODIS/MYD02HKM.061 and DOI:10.5067/MODIS/MYD021KM.061", "line": 1667}], "triples": [{"subject": "Normalized Difference Snow Index (NDSI)", "subject_class": "Variable", "predicate": "COMPUTED_FROM", "object": "radiance data", "object_class": "Dataset", "line": 1668}, {"subject": "radiance data", "subject_class": "Dataset", "predicate": "ACQUIRED_BY_INSTRUMENT", "object": "Moderate Resolution Imaging Spectroradiometer (MODIS)", "object_class": "Instrument", "line": 1669}, {"subject": "radiance data", "subject_class": "Dataset", "predicate": "HAS_DOI", "object": "DOI:10.5067/MODIS/MYD02HKM.061", "object_class": "Identifier", "line": 1670}, {"subject": "radiance data", "subject_class": "Dataset", "predicate": "HAS_DOI", "object": "DOI:10.5067/MODIS/MYD021KM.061", "object_class": "Identifier", "line": 1671}], "in_ground_truth": true, "not_yet": "", "record id": "6cfafd07-40f1-46da-9d92-36c2bb319f0b", "pool position": 2, "title": "MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061", "notes": "This global Level-2 (L2) data set provides daily snow cover detected using Normalized Difference Snow Index (NDSI) and a series of screens designed to alleviate errors and flag uncertain snow cover detections. The NDSI is derived from radiance data acquired by the Moderate Resolution Imaging Spectroradiometer (MODIS) on board the Aqua satellite: DOI:10.5067/MODIS/MYD02HKM.061 and DOI:10.5067/MODIS/MYD021KM.061. Each data granule contains 5 minutes of swath data observed at a resolution of 500 m.\n\nThe terms \"Version 61\" and \"Collection 6.1\" are used interchangeably in reference to this release of MODIS data."}], "schema": [{"kind": "entity class", "entry": "Dataset", "definition": "a set of observations, measurements, or samples", "line": 1675}, {"kind": "entity class", "entry": "Variable", "definition": "one named kind of value computed from an Instrument's measurements by one particular Algorithm, e.g. SST4; NDSI", "line": 1676}, {"kind": "entity class", "entry": "Identifier", "definition": "a code that names one thing permanently, e.g. a DOI", "line": 1677}, {"kind": "predicate", "entry": "COMPUTED_FROM", "definition": "was made by processing this input", "line": 1678}, {"kind": "predicate", "entry": "HAS_DOI", "definition": "has the Digital Object Identifier", "line": 1679}], "rows": [{"kind": "entity class", "crt": "Dataset", "gtt": "Dataset", "swap": false, "definition": "A named collection of data compiled from observations, measurements, experiments, or statistics and distributed as a unit, such as an index, data collection, or instrument time series.", "line": 1683}, {"kind": "entity class", "crt": "DataProduct", "gtt": "Dataset", "swap": false, "definition": "A specific processed output of data, such as calibrated images, retrieval products, files, or data segments, generated from instrument or model data.", "line": 1684}, {"kind": "entity class", "crt": "Catalog", "gtt": "Dataset", "swap": false, "definition": "A published, organized list of astronomical sources or objects with their properties, typically derived from a survey or mission.", "line": 1685}, {"kind": "entity class", "crt": "Database", "gtt": "Dataset", "swap": false, "definition": "An organized collection or repository of data records, sources or proposals that can be stored, queried and accessed.", "line": 1686}], "rules": [{"section": "Writing a classed triple", "rule": 1, "words": "Subject instance and object instance: the record's own words, as written.", "line": 1690}, {"section": "Writing a classed triple", "rule": 11, "words": "General facts: include them, unless they're about another dataset that the record's dataset isn't made from or part of.", "line": 1691}, {"section": "Writing a classed triple", "rule": 11, "words": "Leave out facts about another dataset, unless the record's dataset is made from it or is part of it; for example, leave them out if the other dataset is a variant of the record's dataset (the same data at another temporal resolution, spatial resolution, or version), or is made from the record's dataset. In every case, include the fact of how the two datasets are connected.", "line": 1692}, {"section": "Writing a classed triple", "rule": 14, "words": "A processing step: output = method(input).", "line": 1693}], "methods": [], "options": [{"number": 1, "title": "Keep them all as Datasets", "body": [{"p": "Every input named in a record is a Dataset, in the record's words, with the facts the record states about it; the model's Catalog, Database and DataProduct all mean Dataset."}], "consequences": ["Nothing changes in the ground truth triples or the rows above.", "Two inputs named by the same words (\"radiance data\") become one node of the knowledge graph, with both DOIs.", "Facts about an input that has its own record (the epithermal map's instrument) are written in this record too, as rule 11 now allows (\"Leave out facts about another dataset, unless the record's dataset is made from it or is part of it\").", "An archive and the datasets inside it carry the same entity class, so the knowledge graph can't tell them apart by their entity class."], "line": 1697}, {"number": 2, "title": "One input per DOI", "body": [{"p": "When a record names inputs by their DOIs, each DOI is its own Dataset, and the record's words (\"radiance data\") are written once per DOI."}], "consequences": ["The record at pool position 2 gets two inputs, each with one DOI; their instances share the same words, so the ground truth needs a way to tell them apart (for example, the DOI written in the instance), which is a new exception to rule 1 of <em>Writing a classed triple<\/em>."], "line": 1701}, {"number": 3, "title": "Inputs only, no facts about them", "body": [{"p": "Keep each input as a Dataset, but write nothing else about an input that is another dataset of the catalog (its instrument, its processing level). Rule 11 of <em>Writing a classed triple<\/em> now keeps such facts, so it would change."}], "consequences": ["The ground truth triples \"GRaND epithermal neutron map\" ACQUIRED_BY_INSTRUMENT \"GRaND\", \"radiance data\" ACQUIRED_BY_INSTRUMENT \"Moderate Resolution Imaging Spectroradiometer (MODIS)\", and \"pixels\" HAS_PROCESSING_LEVEL \"L2\" are left out.", "An annotator, and the model, must know whether an input has its own record, which the record's <a class=\"term\" data-term=\"text\" href=\"#terms\">text<\/a> often doesn't say.", "Rule 11 of <em>Writing a classed triple<\/em> and the model's copy of the rules change: they now keep the facts about a dataset the record's dataset is made from, and would leave them out."], "line": 1705}, {"number": 4, "title": "An entity class for collections of datasets", "body": [{"p": "When a record names an archive, a database or a source catalog that holds many datasets, the ground truth schema gets an entity class for it, and the model's Database (and Catalog, if your answer to (d) is no) means it."}], "consequences": ["Archives and datasets are kept apart.", "The ground truth schema gains an entity class, and the rows that point to it are checked again.", "It waits for a tuning record that names one."], "line": 1709}], "context": [{"p": "The example below is the one whose input, \"radiance data\", has the most facts of its own (four, two of them DOIs). COMPUTED_FROM joins what was made to what it was made from. Of the records I have read so far, only the record \"Ensemble X-Ray Variability of AGN in 2XMMi-DR3\" names astronomical source catalogs (question (d)); none names a database. The translation table says that the model's Dataset, DataProduct, Catalog and Database all mean the ground truth schema's Dataset."}], "answer": [], "notes": [{"p": "The example is the record at pool position 2. The other two inputs are \"the L2 pixels\" of the record at pool position 4 and \"the GRaND epithermal neutron map\" of the record at pool position 5; every ground truth triple about each of the three inputs is listed under Affects. The record at pool position 12 names three source catalogs and a file of one (decided 2026-10-25, for me to confirm); none of the tuning records so far names a database. The search of (c) was over the titles of 020's records.jsonl."}, {"p": "Deci ng level \"L2\". Is a set of Level 2 pixels a dataset, or just the Level 2 data, unnamed?", "(c) The record \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" says the counts \"were detrended using the GRaND epithermal neutron map\". I wrote that map as a Dataset, collected by GRaND. No record of the catalog has \"epithermal\" in its title (I searched the catalog's titles), so I can't tell whether the map is a dataset of its own; the catalog has other GRaND maps of Vesta (for example, \"DAWN GRAND MAP VESTA NEUTRON ABSORPTION V1.0\"). The annotation guidelines leave out facts about another dataset, but keep them when the record's dataset is made from it (rule 11 of <em>Writing a classed triple<\/em>), so I kept what collected the map. Is it right to keep the map as an input, with what collected it?", "(d) For someone using this catalog, is an astronomical source catalog (a list of objects, each with its measured properties) a dataset in the same sense as a set of measurements of the Earth's surface? The record \"Ensemble X-Ray Variability of AGN in 2XMMi-DR3\" is a table of 412 quasars selected from the source catalog \"2XMMi-DR3\" and matched with \"the DR7 edition of the SDSS Quasar Catalog\", \"based on CDS Catalog J/A+A/536/A84 [...] file table1.dat\". I wrote the table, the two catalogs, \"table1.dat\" and \"CDS Catalog J/A+A/536/A84\" as Datasets, and \"active galactic nuclei (AGN)\", the kind of object the table is about, as its target: \"Ensemble X-Ray Variability of AGN in 2XMMi-DR3\" (Dataset) HAS_TARGET \"active galactic nuclei (AGN)\" (CelestialBody), although a CelestialBody is \"a natural object in space\" and AGN are a kind of object. Are these right?", "(e) Is a database or archive that holds many datasets the same sort of thing as one of the datasets it holds, or should the two be kept apart (e.g. so that a search for datasets doesn't return archives)?", "(f) Is a \"data product\" (e.g. \"Level-3 products\", \"the SST4 product\") always a dataset, or sometimes one variable inside a dataset? The record \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" says \"This data set contains Level 2/3 (EDR/RDR) data\", and later \"The RDR data convert the EDR (raw) sensor data\": I wrote \"RDR data\" and \"EDR (raw) sensor data\" as two Datasets, each PART_OF the record's dataset, and \"RDR data\" (Dataset) COMPUTED_FROM \"EDR (raw) sensor data\" (Dataset). Are the parts of a dataset datasets themselves, or should they be written another way?"]}], "reading": [{"p": "Option 1, for now: it writes what each record states, as rule 11 of <em>Writing a classed triple<\/em> now does for an input, and every collection of data in the records I have read so far is one set of measurements. Your answers decide whether (a) needs option 2, whether (c) needs option 3, and whether (d) and (e) need option 4."}], "terms": ["model", "model", "row", "pair", "text"], "named_records": [{"title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "line": 1646}, {"title": "DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0", "line": 1647}, {"title": "Ensemble X-Ray Variability of AGN in 2XMMi-DR3", "line": 1648}, {"title": "STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0", "line": 1650}, {"title": "Ensemble X-Ray Variability of AGN in 2XMMi-DR3", "line": 1654}], "fingerprint": "67a22b1aba3c", "shown": "Q12: What counts as a dataset: inputs named in a record, and archives, catalogs and data products? | fingerprint 67a22b1aba3c", "search": "Q12 What counts as a dataset: inputs named in a record, and archives, catalogs and data products? the ground truth schema's Dataset, for the data a record's dataset is made from and for collections of datasets; four rows of the translation table into Dataset The ground truth schema's Dataset is \"a set of observations, measurements, or samples\". Besides each record's own dataset, I have written three other things as Datasets, all inputs from which the record's dataset was made; and the model that reads the records has three entity classes for collections of data that the translation table (quoted below) says also mean Dataset. I am not sure each is a dataset in the sense someone in the field would use. To decide, I need to know: (a) The example below says the index it uses \"is derived from radiance data acquired by\" MODIS, followed by two DOIs, MYD02HKM and MYD021KM. I wrote one Dataset, \"radiance data\", with both DOIs. Are these one dataset or two (my reading: two products, at two resolutions)? If two, how should two inputs with the same words be told apart, when the record names them only by their DOIs? (b) The record \"MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0\" says \"the L2 pixels are binned\" into a grid. I wrote \"pixels\" as a Dataset, at processing level \"L2\". Is a set of Level 2 pixels a dataset, or just the Level 2 data, unnamed? (c) The record \"DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0\" says the counts \"were detrended using the GRaND epithermal neutron map\". I wrote that map as a Dataset, collected by GRaND. No record of the catalog has \"epithermal\" in its title (I searched the catalog's titles), so I can't tell whether the map is a dataset of its own; the catalog has other GRaND maps of Vesta (for example, \"DAWN GRAND MAP VESTA NEUTRON ABSORPTION V1.0\"). The annotation guidelines leave out facts about another dataset, but keep them when the record's dataset is made from it (rule 11 of Writing a classed triple), so I kept what collected the map. Is it right to keep the map as an input, with what collected it? (d) For someone using this catalog, is an astronomical source catalog (a list of objects, each with its measured properties) a dataset in the same sense as a set of measurements of the Earth's surface? The record \"Ensemble X-Ray Variability of AGN in 2XMMi-DR3\" is a table of 412 quasars selected from the source catalog \"2XMMi-DR3\" and matched with \"the DR7 edition of the SDSS Quasar Catalog\", \"based on CDS Catalog J/A+A/536/A84 [...] file table1.dat\". I wrote the table, the two catalogs, \"table1.dat\" and \"CDS Catalog J/A+A/536/A84\" as Datasets, and \"active galactic nuclei (AGN)\", the kind of object the table is about, as its target: \"Ensemble X-Ray Variability of AGN in 2XMMi-DR3\" (Dataset) HAS_TARGET \"active galactic nuclei (AGN)\" (CelestialBody), although a CelestialBody is \"a natural object in space\" and AGN are a kind of object. Are these right? (e) Is a database or archive that holds many datasets the same sort of thing as one of the datasets it holds, or should the two be kept apart (e.g. so that a search for datasets doesn't return archives)? (f) Is a \"data product\" (e.g. \"Level-3 products\", \"the SST4 product\") always a dataset, or sometimes one variable inside a dataset? The record \"STARDUST 9P/TEMPEL 1 DFMI 2/3 NEXT V1.0\" says \"This data set contains Level 2/3 (EDR/RDR) data\", and later \"The RDR data convert the EDR (raw) sensor data\": I wrote \"RDR data\" and \"EDR (raw) sensor data\" as two Datasets, each PART_OF the record's dataset, and \"RDR data\" (Dataset) COMPUTED_FROM \"EDR (raw) sensor data\" (Dataset). Are the parts of a dataset datasets themselves, or should they be written another way? The example below is the one whose input, \"radiance data\", has the most facts of its own (four, two of them DOIs). COMPUTED_FROM joins what was made to what it was made from. Of the records I have read so far, only the record \"Ensemble X-Ray Variability of AGN in 2XMMi-DR3\" names astronomical source catalogs (question (d)); none names a database. The translation table says that the model's Dataset, DataProduct, Catalog and Database all mean the ground truth schema's Dataset. Option 1, for now: it writes what each record states, as rule 11 of Writing a classed triple now does for an input, and every collection of data in the records I have read so far is one set of measurements. Your answers decide whether (a) needs option 2, whether (c) needs option 3, and whether (d) and (e) need option 4. MODIS/Aqua Snow Cover 5-Min L2 Swath 500m V061 This global Level-2 (L2) data set provides daily snow cover detected using Normalized Difference Snow Index (NDSI) and a series of screens designed to alleviate errors and flag uncertain snow cover detections. The NDSI is derived from radiance data acquired by the Moderate Resolution Imaging Spectroradiometer (MODIS) on board the Aqua satellite: DOI:10.5067/MODIS/MYD02HKM.061 and DOI:10.5067/MODIS/MYD021KM.061. Each data granule contains 5 minutes of swath data observed at a resolution of 500 m. The terms \"Version 61\" and \"Collection 6.1\" are used interchangeably in reference to this release of MODIS data. 6cfafd07-40f1-46da-9d92-36c2bb319f0b Dataset a set of observations, measurements, or samples Variable one named kind of value computed from an Instrument's measurements by one particular Algorithm, e.g. SST4; NDSI Identifier a code that names one thing permanently, e.g. a DOI COMPUTED_FROM was made by processing this input HAS_DOI has the Digital Object Identifier Dataset Dataset A named collection of data compiled from observations, measurements, experiments, or statistics and distributed as a unit, such as an index, data collection, or instrument time series. DataProduct Dataset A specific processed output of data, such as calibrated images, retrieval products, files, or data segments, generated from instrument or model data. Catalog Dataset A published, organized list of astronomical sources or objects with their properties, typically derived from a survey or mission. Database Dataset An organized collection or repository of data records, sources or proposals that can be stored, queried and accessed. Keep them all as Datasets Every input named in a record is a Dataset, in the record's words, with the facts the record states about it; the model's Catalog, Database and DataProduct all mean Dataset. One input per DOI When a record names inputs by their DOIs, each DOI is its own Dataset, and the record's words (\"radiance data\") are written once per DOI. Inputs only, no facts about them Keep each input as a Dataset, but write nothing else about an input that is another dataset of the catalog (its instrument, its processing level). Rule 11 of Writing a classed triple now keeps such facts, so it would change. An entity class for collections of datasets When a record names an archive, a database or a source catalog that holds many datasets, the ground truth schema gets an entity class for it, and the model's Database (and Catalog, if your answer to (d) is no) means it."}, {"id": "Q13", "number": 13, "title": "What counts as a channel: radio frequency bands and wavelength bands?", "status": "open", "priority": "medium", "question_kind": "schema entry", "topic": "the ground truth schema's Channel; the translation table's rows for Wavelength and Frequency (current or past schema)", "line": 1786, "records": [{"line": 1807, "source_texts": [{"text": "The first is a skin SST produced for both day and night (NSST) observations, derived from the long wave IR 11 and 12 micron wavelength channels", "line": 1813}, {"text": "At night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4", "line": 1814}, {"text": "the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS", "line": 1815}], "triples": [{"subject": "skin SST (NSST)", "subject_class": "Variable", "predicate": "COMPUTED_FROM", "object": "long wave IR 11 micron wavelength channel", "object_class": "Channel", "line": 1816}, {"subject": "skin SST (NSST)", "subject_class": "Variable", "predicate": "COMPUTED_FROM", "object": "long wave IR 12 micron wavelength channel", "object_class": "Channel", "line": 1817}, {"subject": "SST4", "subject_class": "Variable", "predicate": "COMPUTED_FROM", "object": "mid-infrared 3.95 micron wavelengt que to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4"}], "schema": [{"kind": "entity class", "entry": "Channel", "definition": "a range of wavelengths an Instrument measures separately, e.g. the 11 micron channel", "line": 1825}, {"kind": "entity class", "entry": "Instrument", "definition": "a device that takes measurements", "line": 1826}, {"kind": "entity class", "entry": "TemporalResolution", "definition": "the amount of time between one value of the data and the next, e.g. daily; weekly (8 day)", "line": 1827}, {"kind": "predicate", "entry": "COMPUTED_FROM", "definition": "was made by processing this input", "line": 1828}, {"kind": "predicate", "entry": "UNIQUE_TO_INSTRUMENT", "definition": "is found only on this Instrument", "line": 1829}, {"kind": "predicate", "entry": "ACQUIRED_BY_INSTRUMENT", "definition": "was collected by this Instrument", "line": 1830}], "rows": [{"kind": "entity class", "crt": "Wavelength", "gtt": "Channel", "swap": false, "definition": "A wavelength band or spectral range, such as an infrared filter band, in which observatio : Is every process or effect a phenomenon, including ones caused by people or by spaceflight? | fingerprint 1d3d4422ec8b", "search": "Q14 Is every process or effect a phenomenon, including ones caused by people or by spaceflight? the translation table's row for PhysicalPhenomenon (current or past schema), into the ground truth schema's Phenomenon The ground truth schema's Phenomenon is \"something that happens in nature and can be observed, e.g. sun glint\". The schema the model learned has an entity class PhysicalPhenomenon, \"A natural or induced process, event, or effect, such as radiation-belt electron losses, signal refraction, or biological responses to spaceflight, that is observed or studied\", which the translation table translates into Phenomenon. I would like to know: (a) Is every natural or induced process or effect, as PhysicalPhenomenon has it, a Phenomenon in the sense of the ground truth schema, including effects caused by people or by spaceflight (biological responses to spaceflight)? (b) If not: should Phenomenon's definition be widened (\"something that happens, in nature or caused by people, and can be observed\"), or should induced effects be something else? The records I have read so far have one Phenomenon, \"sun glint\", in the example below. It fits both definitions; the question is about records still to come. The record \"MODIS/Terra Land Surface Temperature/Emissivity Daily L3 Global 1km SIN Grid V006\" has an effect caused by spaceflight: \"Production of V6 Terra MODIS Land Surface Temperature and Emissivity (LST&E) data products was discontinued on November 16, 2022, due to significant loss of data retrieval following the Constellation Exit Maneuvers\". Since Phenomenon is \"something that happens in nature\", I wrote it as an Issue, an entity class I coined: \"MODIS/Terra Land Surface Temperature/Emissivity Daily L3 Global 1km SIN Grid V006\" (Dataset) PRODUCTION_DISCONTINUED_DUE_TO \"significant loss of data retrieval following the Co }, {"kind": "entity class", "entry": "TimeOfDay", "definition": "a point or period in the day, which comes back every day, e.g. 2:39 PM; morning; nighttime", "line": 2127}, {"kind": "predicate", "entry": "OBSERVED_AT_TIME_OF_DAY", "definition": "comes from observations made at or during this TimeOfDay", "line": 2128}], "rows": [], "rules": [{"section": "Writing a classed triple", "rule": 5, "words": "One fact per ground truth triple. A sentence that states two facts gives two ground truth triples.", "line": 2132}, {"section": "Writing a classed triple", "rule": 9, "words": "A qualifier that is a temporal resolution, an area the data cover, a processing level, a spatial resolution, a country, a time of day, or a target body is a ground truth triple of its own, and is taken out of the instance.", "line": 2133}, {"section": "Writing a classed triple", "rule": 9, "words": "A qualifier stays in the instance, as written, if it is any other kind (\"sea surface salinity\" stays whole), or if taking it out would give a triple that isn't true. Suppose: a record says \"an afternoon orbit\". Then: taking \"afternoon\" out would give \"orbit\" OBSERVED_AT_TIME_OF_DAY \"afternoon\", which says the orbit comes from observations made in the afternoon. That isn't true, so the instance stays \"afternoon orbit\".", "line": 2134}], "methods": [], "options": [{"number": 1, "title": "Keep the orbit whole", "body": [{"p": "The ground truth keeps one classed triple, as now: \"Aqua\" (Spacecraft) HAS_ORBIT \"sun synchronous, polar orbit with a daylight ascending node at 13:30\" (Orbit)."}], "consequences": ["Nothing changes: not the annotation guidelines, not the ground truth schema, not the ground truth.", "The time 13:30 can be found only by searching inside the words of the orbit's instance; a search for satellites by the time they cross the equator has to read those words.", "Two records that describe the same orbit in different words give two different object instances."], "line": 2138}, {"number": 2, "title": "The time as a ground truth triple of its own", "body": [{"p": "A new predicate in the ground truth schema, e.g. HAS_ASCENDING_NODE_TIME (\"crosses the equator going north at this TimeOfDay\"), and the ground truth writes two classed triples: \"Aqua\" (Spacecraft) HAS_ORBIT \"sun synchronous, polar orbit\" (Orbit), and a second one that gives \"13:30\" (TimeOfDay), with Aqua or the orbit as its subject instance (question (c))."}], "consequences": ["A new predicate in the ground truth schema, and an example for it in the annotation guidelines, so that I write it the same way in every record; the <a class=\"term\" data-term=\"model\" href=\"#terms\">model<\/a> follows the same rules, so its copy of the rules changes too.", "The orbit's instance loses the words \"with a daylight ascending node at 13:30\", which are no longer in that triple.", "The time can be searched for by itself."], "line": 2142}, {"number": 3, "title": "Split the orbit into all its properties", "body": [{"p": "As option 2, and \"sun synchronous\" and \"polar\" also become ground truth triples of their own (question (b))."}], "consequences": ["Everything option 2 brings, and more predicates or entity classes for the properties of an orbit.", "More ground truth triples per record that describes an orbit, each of which the model must also extract."], "line": 2146}], "context": [{"p": "The ground truth schema has a TimeOfDay entity class, and rule 9 of <em>Writing a classed triple<\/em> in the annotation guidelines takes a time of day out of an instance, as a ground truth triple of its own, unless taking it out would give a triple that isn't true. Taking \"13:30\" out with the only predicate the ground truth schema has for a time of day, OBSERVED_AT_TIME_OF_DAY, would say that the orbit comes from observations made at 13:30, which isn't true. So, by rule 9 of <em>Writing a classed triple<\/em>, \"13:30\" stays in the orbit's instance. The question is whether the ground truth schema should have another predicate for this time, so that it can be a ground truth triple of its own."}], "answer": [], "notes": [{"p": "The example is the record at pool position 4, the only tuning record annotated so far that names an orbit."}], "affects": {"records": [{"position": 4, "id": "03a09af3-081e-4db6-9e3b-ea7c0e3138bd", "line": 2179, "title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0"}], "triples": [{"position": 4, "subject": "Aqua", "subject_class": "Spacecraft", "predicate": "HAS_ORBIT", "object": "sun synchronous, polar orbit with a daylight ascending node at 13:30", "object_class": "Orbit", "line": 2180, "draft": false}], "rows": [], "entries": [{"kind": "entity class", "entry": "Orbit", "line": 2181}, {"kind": "predicate", "entry": "HAS_ORBIT", "line": 2182}], "rules": [{"section": "Writing a classed triple", "rule": 5, "line": 2183}, {"section": "Writing a classed triple", "rule": 9, "line": 2184}], "methods": [{"path": "annotations/ground_truth_schema.txt", "what": "a new predicate for the time an orbit crosses the equator (option 2), or for each property of an orbit (option 3)", "line": 2185}, {"path": "common/common_prompts/extraction_rules.txt", "what": "the model's copy of the annotation guidelines' rules, which changes with a rule", "line": 2186}]}, "question": [{"p": "A record says that Aqua was launched \"into a sun synchronous, polar orbit with a daylight ascending node at 13:30\". The ground truth keeps that whole passage as one object instance: Aqua HAS_ORBIT \"sun synchronous, polar orbit with a daylight ascending node at 13:30\". I would like to know:"}, {"ul": ["(a) Is the time of the ascending node (13:30) something people who use this catalog search on by itself, for instance to find the satellites that cross the equator in the early afternoon? My reading, not checked against a source: the ascending node is where the orbit crosses the equator going north, and 13:30 is the local time at which it does so in daylight.", "(b) Are \"sun synchronous\" and \"polar\" two properties of the orbit, each worth a classed triple of its own, or does \"sun synchronous, polar orbit\" name one type of orbit?", "(c) If the time is a <a class=\"term\" data-term=\"fact\" href=\"#terms\">fact<\/a> of its own, what does it belong to: the orbit, or the satellite (Aqua)?"]}], "reading": [{"p": "Option 1, keep the orbit whole, because rule 9 of <em>Writing a classed triple<\/em> keeps the time in the instance, and the records I have read so far name an orbit only once (Aqua's, in the example below). I would change to option 2 if people search this catalog by the time a satellite crosses the equator."}], "terms": ["fact", "model"], "named_records": [], "fingerprint": "d2293735b645", "shown": "Q16: Is the time \"13:30\" in Aqua's orbit a fact of its own? | fingerprint d2293735b645", "search": "Q16 Is the time \"13:30\" in Aqua's orbit a fact of its own? the ground truth schema's Orbit and TimeOfDay, and rule 9 of *Writing a classed triple* in the annotation guidelines A record says that Aqua was launched \"into a sun synchronous, polar orbit with a daylight ascending node at 13:30\". The ground truth keeps that whole passage as one object instance: Aqua HAS_ORBIT \"sun synchronous, polar orbit with a daylight ascending node at 13:30\". I would like to know: (a) Is the time of the ascending node (13:30) something people who use this catalog search on by itself, for instance to find the satellites that cross the equator in the early afternoon? My reading, not checked against a source: the ascending node is where the orbit crosses the equator going north, and 13:30 is the local time at which it does so in daylight. (b) Are \"sun synchronous\" and \"polar\" two properties of the orbit, each worth a classed triple of its own, or does \"sun synchronous, polar orbit\" name one type of orbit? (c) If the time is a fact of its own, what does it belong to: the orbit, or the satellite (Aqua)? The ground truth schema has a TimeOfDay entity class, and rule 9 of Writing a classed triple in the annotation guidelines takes a time of day out of an instance, as a ground truth triple of its own, unless taking it out would give a triple that isn't true. Taking \"13:30\" out with the only predicate the ground truth schema has for a time of day, OBSERVED_AT_TIME_OF_DAY, would say that the orbit comes from observations made at 13:30, which isn't true. So, by rule 9 of Writing a classed triple, \"13:30\" stays in the orbit's instance. The question is whether the ground truth schema should have another predicate for this time, so that it can be a ground truth triple of its own. Option 1, keep the orbit whole, because rule 9 of Writing a classed triple keeps the time in the instance, and the records I have read so far name an orbit only once (Aqua's, in the example below). I would change to option 2 if people search this catalog by the time a satellite crosses the equator. MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0 Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution. Aqua was launched by NASA on May 4, 2002, into a sun synchronous, polar orbit with a daylight ascending node at 13:30, formation flying in the A-train with other Earth Observation Satellites (EOS), to study the global dynamics of the Earth atmosphere, land and oceans. MODIS captures data in 36 spectral bands at a variety of spatial resolutions. Two SST products can be present in these files. The first is a skin SST produced for both day and night (NSST) observations, derived from the long wave IR 11 and 12 micron wavelength channels, using a modified nonlinear SST algorithm intended to provide continuity of SST derived from heritage and current NASA sensors. At night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4 03a09af3-081e-4db6-9e3b-ea7c0e3138bd Orbit the path a Spacecraft travels around a CelestialBody HAS_ORBIT travels in this Orbit TimeOfDay a point or period in the day, which comes back every day, e.g. 2:39 PM; morning; nighttime OBSERVED_AT_TIME_OF_DAY comes from observations made at or during this TimeOfDay Keep the orbit whole The ground truth keeps one classed triple, as now: \"Aqua\" (Spacecraft) HAS_ORBIT \"sun synchronous, polar orbit with a daylight ascending node at 13:30\" (Orbit). The time as a ground truth triple of its own A new predicate in the ground truth schema, e.g. HAS_ASCENDING_NODE_TIME (\"crosses the equator going north at this TimeOfDay\"), and the ground truth writes two classed triples: \"Aqua\" (Spacecraft) HAS_ORBIT \"sun synchronous, polar orbit\" (Orbit), and a second one that gives \"13:30\" (TimeOfDay), with Aqua or the orbit as its subject instance (question (c)). Split the orbit into all its properties As option 2, and \"sun synchronous\" and \"polar\" also become ground truth triples of their own (question (b))."}, {"id": "Q17", "number": 17, "title": "The GRaND residual map is \"related to the average atomic mass on Vesta\": is there a more specific relationship?", "status": "answered", "priority": "low", "question_kind": "records and triples", "topic": "the ground truth schema's RELATED_TO and ESTIMATES, and rule 1 of *What counts as a fact* in the annotation guidelines", "line": 2188, "records": [{"line": 2206, "source_texts": [{"text": "The residual map is related to the average atomic mass on Vesta", "line": 2212}], "triples": [{"subject": "DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0", "subject_class": "Dataset", "predicate": "RELATED_TO", "object": "average atomic mass", "object_class": "PhysicalQuantity", "line": 2213}], "in_ground_truth": true, "not_yet": "", "record id": "99dff022-24ac-48cb-bc83-09fec8b90ad7", "pool position": 5, "title": "DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0", "notes": "These data are maps of fast neutron residual count rates from the GRaND plus Z boron loaded sensor. The nominal fast neutron count rates were detrended using the GRaND epithermal neutron map to produced this residual map. The residual map is related to the average atomic mass on Vesta. Details of the map and data reduction are described in LAWRENCEETAL2013."}], "schema": [{"kind": "predicate", "entry": "RELATED_TO", "definition": "is related to", "line": 2217}, {"kind": "predicate", "entry": "ESTIMATES", "definition": "gives approximate values for", "line": 2218}, {"kind": "entity class", "entry": "PhysicalQuantity", "definition": "a property that can be measured, in general, whatever method measures it, e.g. sea surface temperature; snow cover", "line": 2219}], "rows": [], "rules": [{"section": "What counts as a fact", "rule": 1, "words": "Only what the record states. Never add what you know from elsewhere, and never write down what an unexplained code or abbreviation stands for.", "line": 2223}], "methods": [], "options": [{"number": 1, "title": "Keep RELATED_TO", "body": [{"p": "The ground truth stays as it is: the dataset RELATED_TO \"average atomic mass\"."}], "consequences": ["Nothing changes.", "RELATED_TO says only that some relationship exists; a search for datasets that give values of the average atomic mass won't find this one by that predicate."], "line": 2227}, {"number": 2, "title": "A more specific predicate for the average atomic mass", "body": [{"p": "Only if \"related to\" here means \"gives approximate values for\" (question (a)): the dataset ESTIMATES \"average atomic mass\" in place of RELATED_TO."}], "consequences": ["One ground truth triple changes its predicate, and a search for datasets that give values of the average atomic mass finds this one.", "If \"related to\" means less than that, it would add a <a class=\"term\" data-term=\"fact\" href=\"#terms\">fact<\/a> the record doesn't state, against rule 1 of <em>What counts as a fact<\/em>."], "line": 2231}], "context": [{"p": "I write only what a record states (rule 1 of <em>What counts as a fact<\/em>, quoted below), so a more specific predicate than RELATED_TO needs words in the record that say so. The ground truth schema has ESTIMATES, \"gives approximate values for\", which the ground truth uses for what a Variable gives approximate values of."}], "answer": [{"p": "Settled by checked sources, option 1. A review of this record on 2026-10-22 checked NASA's archive documents for it, and the paper the record cites, LAWRENCEETAL2013 (Lawrence et al. 2013): it says the corrected fast neutron counts vary with the average atomic mass. So the record's \"related to\" is accurate, and ESTIMATES would claim more than the record and the paper say. The ground truth keeps RELATED_TO \"average atomic mass\"."}], "notes": [], "affects": {"records": [{"position": 5, "id": "99dff022-24ac-48cb-bc83-09fec8b90ad7", "line": 2257, "title": "DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0"}], "triples": [{"position": 5, "subject": "DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0", "subject_class": "Dataset", "predicate": "RELATED_TO", "object": "average atomic mass", "object_class": "PhysicalQuantity", "line": 2258, "draft": false}], "rows": [], "entries": [{"kind": "predicate", "entry": "RELATED_TO", "line": 2259}], "rules": [{"section": "What counts as a fact", "rule": 1, "line": 2260}], "methods": []}, "question": [{"p": "A record of data from the GRaND instrument of the Dawn spacecraft says: \"The residual map is related to the average atomic mass on Vesta.\" The ground truth writes this as the dataset RELATED_TO \"average atomic mass\". I would like to know:"}, {"ul": ["(a) What is the relationship between the residual map and the average atomic mass: does the residual map give approximate values of the average atomic mass, or is it only one clue among several?", "(b) Would someone in your field read \"is related to\" in such a record as \"gives approximate values for\", or only as \"has something to do with\"?"]}], "reading": [{"p": "Option 1, because \"related to\" is all the record states. I would change to option 2 if experts say that, in such a record, \"related to\" means that the map gives approximate values of the average atomic mass."}], "terms": ["fact"], "named_records": [], "fingerprint": "a8b83cf4a041", "shown": "Q17: The GRaND residual map is \"related to the average atomic mass on Vesta\": is there a more specific relationship? | fingerprint a8b83cf4a041", "search": "Q17 The GRaND residual map is \"related to the average atomic mass on Vesta\": is there a more specific relationship? the ground truth schema's RELATED_TO and ESTIMATES, and rule 1 of *What counts as a fact* in the annotation guidelines A record of data from the GRaND instrument of the Dawn spacecraft says: \"The residual map is related to the average atomic mass on Vesta.\" The ground truth writes this as the dataset RELATED_TO \"average atomic mass\". I would like to know: (a) What is the relationship between the residual map and the average atomic mass: does the residual map give approximate values of the average atomic mass, or is it only one clue among several? (b) Would someone in your field read \"is related to\" in such a record as \"gives approximate values for\", or only as \"has something to do with\"? I write only what a record states (rule 1 of What counts as a fact, quoted below), so a more specific predicate than RELATED_TO needs words in the record that say so. The ground truth schema has ESTIMATES, \"gives approximate values for\", which the ground truth uses for what a Variable gives approximate values of. Option 1, because \"related to\" is all the record states. I would change to option 2 if experts say that, in such a record, \"related to\" means that the map gives approximate values of the average atomic mass. Settled by checked sources, option 1. A review of this record on 2026-10-22 checked NASA's archive documents for it, and the paper the record cites, LAWRENCEETAL2013 (Lawrence et al. 2013): it says the corrected fast neutron counts vary with the average atomic mass. So the record's \"related to\" is accurate, and ESTIMATES would claim more than the record and the paper say. The ground truth keeps RELATED_TO \"average atomic mass\". DAWN GRAND MAP VESTA FAST NEUTRON RESIDUAL V1.0 These data are maps of fast neutron residual count rates from the GRaND plus Z boron loaded sensor. The nominal fast neutron count rates were detrended using the GRaND epithermal neutron map to produced this residual map. The residual map is related to the average atomic mass on Vesta. Details of the map and data reduction are described in LAWRENCEETAL2013. 99dff022-24ac-48cb-bc83-09fec8b90ad7 RELATED_TO is related to ESTIMATES gives approximate values for PhysicalQuantity a property that can be measured, in general, whatever method measures it, e.g. sea surface temperature; snow cover Keep RELATED_TO The ground truth stays as it is: the dataset RELATED_TO \"average atomic mass\". A more specific predicate for the average atomic mass Only if \"related to\" here means \"gives approximate values for\" (question (a)): the dataset ESTIMATES \"average atomic mass\" in place of RELATED_TO."}, {"id": "Q18", "number": 18, "title": "SST4 and NSST: is SST4 a skin sea surface temperature, lower uncertainty than what, and does this product hold both?", "status": "open", "priority": "low", "question_kind": "records and triples", "topic": "the ground truth schema's Variable, ESTIMATES and HAS_LOWER_UNCERTAINTY_THAN, and rule 13 of the annotation guidelines", "line": 2262, "records": [{"line": 2281, "source_texts": [{"text": "The first is a skin SST produced for both day and night (NSST)", "line": 2287}, {"text": "the SST derived from these measurements is identified as SST4", "line": 2288}, {"text": "The SST4 product has lower uncertainty", "line": 2289}], "triples": [{"subject": "skin SST (NSST)", "subject_class": "Variable", "predicate": "ESTIMATES", "object": "skin sea surface temperature (SST)", "object_class": "PhysicalQuantity", "line": 2290}, {"subject": "SST4", "subject_class": "Variable", "predicate": "ESTIMATES", "object": "SST", "object_class": "PhysicalQuantity", "line": 2291}, {"subject": "SST4", "subject_class": "Variable", "predicate": "HAS_LOWER_UNCERTAINTY_THAN", "object": "skin SST (NSST)", "object_class": "Variable", "line": 2292}], "in_ground_truth": true, "not_yet": "", "record id": "03a09af3-081e-4db6-9e3b-ea7c0e3138bd", "pool position": 4, "title": "MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0", "notes": "Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and And is the title's \"V061\" that same Version 61? (d) The record \"MODIS/Terra Land Surface Temperature/Emissivity Daily L3 Global 1km SIN Grid V006\" writes its version three ways: \"V006\" in its title, \"Version 6\" twice in its notes, and \"V6\" once. I read them as one version, and wrote \"Version 6\", the wording that spells it out (rule 13). Its notes begin \"The MOD11A1 Version 6 data product was decommissioned on July 31, 2023. Users are encouraged to use the MOD11A1 Version 6.1 data product.\", and I wrote \"Version 6.1\" (Version) SUPERSEDES \"Version 6\" (Version), as for \"V2019.0\" above. Are \"V006\", \"Version 6\" and \"V6\" one version? And does the record say that Version 6.1 replaces Version 6, or only recommend it? (e) The record \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" says \"This version V1.0 is the first version of this dataset\". I wrote \"ROSETTA-ORBITER 67P OSINAC 4 ESC3-MTP020 RDR-INFLDSTR V1.0\" (Dataset) HAS_VERSION \"V1.0\" (Version). I also wrote \"V1.0\" (Version) ALSO_KNOWN_AS \"first version\" (Version), since V1.0 stays the first version whatever is released later (decided 2026-10-25). Is that right, or is \"the first version\" a fact of another kind (the dataset has no earlier version)? Rule 13 of the annotation guidelines writes one thing with one wording in a record: of two wordings that say the same, the one the record uses most often, or, on a tie, the one it gives first. Each wording appears once, and the title comes first, so I wrote \"V2019.0\". If they are two names of one release, rule 10 of Writing a classed triple allows an ALSO_KNOWN_AS triple only when the record gives the other name in words of its own, which it doesn't here. Option 1, because the record calls both the release that replaces v2014.1, and nothing in it says they differ. I would change to option 2 if experts say \"R\" and \"V\" mark different things in NASA's ocean products. For (c), I keep \"Version 61\" (Version) ALSO_KNOWN_AS \"Collection 6.1\" (Version), since the record says the two terms \"are used interchangeably\"; if a Collection is a reprocessing of all MODIS products, \"Collection 6.1\" would need an entity class and a predicate of its own (something the dataset belongs to), which the ground truth schema doesn't have yet. MODIS Aqua Level 3 SST MID-IR 8 Day 4km Nighttime V2019.0 Day and night spatially gridded (L3) global NASA skin sea surface temperature (SST) products from the Moderate-resolution Imaging Spectroradiometer (MODIS) onboard the Aqua satellite. Average daily, weekly (8 day), monthly and annual skin SST products at are available at both 4.63 and 9.26 km spatial resolution. Aqua was launched by NASA on May 4, 2002, into a sun synchronous, polar orbit with a daylight ascending node at 13:30, formation flying in the A-train with other Earth Observation Satellites (EOS), to study the global dynamics of the Earth atmosphere, land and oceans. MODIS captures data in 36 spectral bands at a variety of spatial resolutions. Two SST products can be present in these files. The first is a skin SST produced for both day and night (NSST) observations, derived from the long wave IR 11 and 12 micron wavelength channels, using a modified nonlinear SST algorithm intended to provide continuity of SST derived from heritage and current NASA sensors. At night, a second SST product is generated using the mid-infrared 3.95 and 4.05 micron wavelength channels which are unique to MODIS; the SST derived from these measurements is identified as SST4. The SST4 product has lower uncertainty, but due to sun glint can only be used at night. To generate the L3 products the L2 pixels are binned into an integerized sinusoidal area grid (ISEAG) and mapped into an equidistant cylindrical (also known as Platte Carre projection. Additional projection detailed can be found at https://oceancolor.gsfc.nasa.gov/docs/format/ The NASA MODIS L3 SST data products are generated by the NASA Ocean Biology Processing Group (OBPG) and Peter Minnett and his team at the Rosenstiel School of Marine and Atmospheric Science (RSMAS) are responsible for sea surface temperature algorithm development, error statistics and quality flagging. JPL acquires MODIS ocean L3 SST data from the OBPG and is the official Physical Oceanography Data Archive (PO.DAAC) for SST. The R2019.0 supersedes the previous v2014.1 datasets which can be found at https://doi.org/10.5067/MODAM-8D4N4 03a09af3-081e-4db6-9e3b-ea7c0e3138bd Version a label that marks one release of something HAS_VERSION carries this Version SUPERSEDES replaces this earlier one ALSO_KNOWN_AS is the same thing under another name The same release (as now) They are one release, written as now: the dataset HAS_VERSION \"V2019.0\" (Version), and \"V2019.0\" (Version) SUPERSEDES \"v2014.1\" (Version). Two different things They differ: \"R2019.0\" SUPERSEDES \"v2014.1\" (Version), as the record writes it, with \"R2019.0\" in an entity class that fits what it is (question (b)), and the dataset still HAS_VERSION \"V2019.0\" (Version)."}, {"id": "Q20", "number": 20, "title": "What is \"Near Real Time (NRT)\", what counts as an identifier (\"MCD19A2N\", \"LAWRENCEETAL2013\"), and is \"MCD19A1N\" another dataset?", "status": "open", "priority": "low", "question_kind": "records and triples", "topic": "the ground truth schema's Identifier, HAS_DOI, Document, Version and COMPUTED_FROM, the predicate HAS_IDENTIFIER I have coined, and rules 10, 11 and 14 of *Writing a classed triple* in the annotation guidelines", "line": 2459, "records": [{"line": 2481, "source_texts": [{"text": "Near Real Time (NRT)", "line": 2487}, {"text": "The Moderate Resolution Imaging Spectroradiometer (MODIS)", "line": 2488}, {"text": "Combined Terra and Aqua", "line": 2489}, {"text": "Land Aerosol Optical Depth", "line": 2490}, {"text": "produced daily", "line": 2491}, {"text": "gridded Level 2 product", "line": 2492}, {"text": "at 1 kilometer (km) pixel resolutions", "line": 2493}

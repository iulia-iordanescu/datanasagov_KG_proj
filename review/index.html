  :root {
    --bg: #e9ece8; --panel: #ffffff; --ink: #262b31; --muted: #626a76; --line: #d5dad4;
    --tint: #f1f6f5; --paper: #fbf9f3; --label: #4a5260; --stripe: #8fc1cc;
    --accent: #2c6e82; --accent-bg: #eaf3f5; --soft: #fbefc4; --strong: #f5d77a; --error: #a8322b; --flag: #85601a;
    --error-bg: #fdecea; --flag-bg: #fff6e0; --ok: #1f7a3a; --ok-bg: #e5f4ea; --input: #ffffff;
    --subj: #2f6db5; --subj-bg: #eaf1fb; --pred: #8a4fb8; --pred-bg: #f4ecfa; --obj: #2c8a5a; --obj-bg: #e8f5ee;
    --bar: #1f5566; --bar-ink: #ffffff; --bar-soft: rgba(255, 255, 255, 0.16);
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111417; --panel: #1b1f24; --ink: #e4e7ea; --muted: #9aa2ad; --line: #30363d;
      --tint: #222a2e; --paper: #1f2226; --label: #b6bdc7; --stripe: #3f7684;
      --accent: #7fbccd; --accent-bg: #1f3036; --soft: #4d4415; --strong: #7a6400; --error: #ff8a80; --flag: #f0c060;
      --error-bg: #3a1f1f; --flag-bg: #3a3018; --ok: #6fd08c; --ok-bg: #1d3325; --input: #14171c;
      --subj: #7fb0ec; --subj-bg: #1c2836; --pred: #c79ae8; --pred-bg: #2a2133; --obj: #79d1a4; --obj-bg: #1b2e25;
      --bar: #163c47; --bar-ink: #e9f3f5; --bar-soft: rgba(255, 255, 255, 0.10);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
         -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bar); color: var(--bar-ink); box-shadow: var(--shadow); }
  header .topbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 8px 16px; }
  @media (min-width: 1200px) { header .topbar { flex-wrap: nowrap; } }
  header #status { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 5em; }
  header h1 { white-space: nowrap; }
  header nav.tabs { display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 0;
                    max-height: none; overflow: visible; position: static; border-radius: 0; box-shadow: none; }
  header nav.tabs button { display: inline-block; width: auto; margin: 0; text-align: center; box-shadow: none; }
  header nav.tabs .tab.current { background: var(--bar-ink); }
  header nav.tabs .tab.current > button, header nav.tabs .tab.current { color: #0f3d4a; }
  header .tab { display: inline-flex; align-items: center; gap: 4px; border-radius: 8px; }
      color: var(--bar-ink); padding: 6px 8px; border-radius: 8px; white-space: nowrap; }
  header .tab.current, header .tab.current button { background: var(--bar-ink); color: var(--bar); font-weight: 600; }
  header .tab select { border: 0; background: transparent; color: var(--bar-ink); font-weight: 600; padding: 6px 8px;
                       max-width: 330px; cursor: pointer; }
  header .tab select option { color: var(--ink); background: var(--panel); font-weight: 400; }
  header .tab.current select { color: var(--band-solid, #1f3a5f); }
  header #status { color: var(--bar-ink); opacity: 0.85; }
  header #status.failed { color: #ffd2cc; opacity: 1; }
  header #status.saved { color: #bdf2cc; opacity: 1; }
  header .count { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 12px;
                  font-weight: 600; background: #f4b6ae; color: #6d1d16; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.01em; margin: 0 12px 0 0; }
  select, input, textarea, button { font: inherit; color: var(--ink); }
  select, input, textarea { background: var(--input); border: 1px solid #c3cac3; border-radius: 8px; padding: 6px 9px; }
  @media (prefers-color-scheme: dark) { select, input, textarea { border-color: #3b434c; } }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
           transition: background 0.12s, border-color 0.12s; }
  button:hover { border-color: var(--accent); background: var(--accent-bg); }
  .bar button.current { outline: 2px solid var(--accent); font-weight: 600; }
  #status { margin-left: auto; color: var(--muted); font-size: 13.5px; }
  #status.saved { color: var(--ok); } #status.failed { color: var(--error); font-weight: 600; }
  #warnings { margin: 0; padding: 8px 16px; background: var(--error-bg); color: var(--error); }
  #intro { margin: 0; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--accent-bg); }
  #intro[hidden] { display: none; }
  #intro p { margin: 0 0 4px 0; }
  #warnings:empty { display: none; }
  #warnings li { white-space: pre-line; }
  .typepick { display: flex; gap: 6px; margin: 6px 0; }
  .explain p { margin: 6px 0; }
  .gaps { background: var(--error-bg); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .gaps ul { list-style: none; margin: 6px 0 0; padding: 0; }
  .gaps li { margin-top: 6px; }
  .addbox { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: 6px; }
  .addbox input { width: min(420px, 100%); }
  main { display: grid; grid-template-columns: 250px 1fr; gap: 16px; padding: 16px; }
  .workgrid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .textcol { position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow: auto; }
  .textcol #text { max-height: 46vh; }
  @media (max-width: 1100px) { .workgrid { grid-template-columns: 1fr; } .textcol { position: static; max-height: none; } }
  .classpanel { max-height: 40vh; overflow: auto; }
  .classopt { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
              border-radius: 0; padding: 6px 4px; background: transparent; }
  .classopt:hover { background: var(--accent-bg); }
  .classopt.current { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }   /* what the field holds */
  .triplenav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0 8px; }
  .triplenav button { padding: 4px 12px; }
  .listbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 10px; }
  .listbar .triplenav { margin: 0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  nav { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px;
        max-height: calc(100vh - 88px); overflow: auto; position: sticky; top: 72px; align-self: start; }
  nav button { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 6px 8px; margin: 1px 0; }
  nav button.current { background: var(--accent-bg); outline: 0; box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
  nav button:hover { background: var(--tint); }
  nav .badge { float: right; font-size: 13px; margin-left: 6px; }
  nav .small { color: var(--muted); font-size: 12px; }
  section.card { background: var(--panel); border: 1px solid transparent; border-radius: 12px; padding: 16px 20px;
                 margin-bottom: 16px; min-width: 0; box-shadow: var(--shadow); }
  h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  label.finished { font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  #text { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 45vh; overflow: auto; font-size: 15.5px; line-height: 1.65;
          border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; background: var(--paper); }
  mark { background: var(--soft); color: inherit; border-radius: 2px; cursor: pointer; }
  mark.active { background: var(--strong); outline: 1px solid var(--flag); }
  mark.shared { box-shadow: inset 0 -2px 0 var(--muted); }   /* the source text of more than one ground truth triple */
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  ul.hint { padding-left: 18px; }
  ul.hint li { margin: 2px 0; }
  .row { border: 1px solid var(--line); border-left: 4px solid var(--stripe); border-radius: 10px; padding: 12px 14px;
         margin-bottom: 12px; background: var(--tint); }
  .row.active { border-color: var(--accent); border-left-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .rowhead { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .rowfoot { display: flex; justify-content: flex-end; margin-top: 8px; }
  .rowfoot button.deltriple { padding: 2px 10px; font-size: 12.5px; font-weight: 400; color: var(--ink); white-space: nowrap; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; margin-left: 6px; }
  .pill.error { background: var(--error-bg); color: var(--error); }
  .pill.flag { background: var(--flag-bg); color: var(--flag); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.todo { background: var(--bg); color: var(--muted); }
  nav .badge .pill { margin-left: 3px; }
  .recordhead { padding: 10px 16px 0; }
  .headline { display: flex; align-items: center; gap: 8px; }
  .headline h2 { flex: 1; min-width: 0; margin: 0 6px; font-size: 16.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .headline button { padding: 4px 10px; }
  .headline .listtoggle { color: var(--accent); }
  .headmeta { margin: 4px 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
  .headmeta .pill { margin-left: 6px; }
  button.pill.jump { border: 0; cursor: pointer; font: inherit; font-size: 12px; }
  .patterns { margin: 0; }
  .patterns button.patbtn { font-size: 12px; padding: 1px 8px; margin-right: 6px; }
  .patterns .patlist { margin-top: 4px; padding: 6px 10px; border-left: 3px solid var(--muted); }
  .patterns .patlist ul { margin: 4px 0; padding-left: 18px; }
  button.pill.jump:hover { filter: brightness(0.95); text-decoration: underline; }
  body.norecords main { grid-template-columns: 1fr; }
  body.norecords nav#records { display: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }
  @media (prefers-color-scheme: dark) { button.primary { color: #10181b; } }
  label.finished { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 4px 10px; }
  .hintbox { margin-top: 8px; }
  .hintbox summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
  /* a triple's parts, each its own group: subject + subject class, predicate, object + object class; then the
     pattern buttons and the source text. A thin line and some space between groups. */
  /* the component class column is a third of the width, or wider when a component class's longest word needs it */
  .triple .group { display: grid; grid-template-columns: minmax(0, 1fr) minmax(min-content, 34%); gap: 8px 10px; }
  .triple .group.wide { grid-template-columns: minmax(0, 1fr); }       /* the predicate: the triple's full width */
  .triple .group + .group, .row > .patterns, .row > .source { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
  .triple label, .source label { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; font-weight: 600;
                                 color: var(--label); min-width: 0; }
  .triple label input, .triple label textarea, .source label textarea { font-weight: 400; font-size: 14.5px; }
  .triple input, .triple textarea { width: 100%; min-width: 0; }
  textarea.grow { resize: none; overflow: hidden; line-height: 1.4; }
  /* a component class wraps only at spaces, never inside a word; a word wider than its field scrolls sideways */
  .triple .nobreak { overflow-wrap: normal; word-break: normal; min-width: 130px; }
  textarea.grow.nobreak, .fixed.nobreak { overflow-x: auto; }
  .triple label.f-subj { color: var(--subj); } .triple label.f-pred { color: var(--pred); } .triple label.f-obj { color: var(--obj); }
  .f-subj input, .f-subj textarea { background: var(--subj-bg); }
  .f-pred input, .f-pred textarea { background: var(--pred-bg); }
  .f-obj input, .f-obj textarea { background: var(--obj-bg); }
  .f-subj input, .f-subj textarea, .f-pred input, .f-pred textarea, .f-obj input, .f-obj textarea { color: var(--ink); }
  .schematable th { background: var(--tint); }
  .schemaview h3 { color: var(--accent); }
  .triple .cls { font-size: 13px; }
  .triple .def { font-weight: 400; font-size: 12px; }
  @media (max-width: 800px) { .triple .group { grid-template-columns: 1fr; } }
  .source textarea { width: 100%; }
  .source .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }   /* under the source text */
  .problems { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; }
  .problems li { padding: 3px 8px; border-radius: 5px; margin-top: 3px; }
  .problems li.error { background: var(--error-bg); color: var(--error); }
  .problems li.flag { background: var(--flag-bg); color: var(--flag); }
  .fixed { border: 1px dashed #c3cac3; border-radius: 8px; padding: 6px 9px; color: var(--muted); font-weight: 400;
           font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }                      /* written by code, shown only */
  .empty { color: var(--muted); }
  .name { font-weight: 600; }                 /* a view's or section's name, *written so* in the README and guidelines */
  #help { position: fixed; inset: 0; z-index: 5; background: rgba(0, 0, 0, 0.45); display: flex;
          justify-content: center; align-items: flex-start; padding: 40px 16px; overflow: auto; }
  #help[hidden] { display: none; }
  .helpbox.wide { max-width: 1240px; }
  .schemafilter { width: 100%; margin: 12px 0; }
  .schemagrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .schemagrid { grid-template-columns: 1fr; } }
  .schematable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .schematable th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 6px;
                    border-bottom: 1px solid var(--line); }
  .schematable td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .schematable tbody tr:nth-child(even) td { background: var(--tint); }
  .schematable td.schemaname { font-weight: 600; white-space: nowrap; }
  .schematable td.schemauses { text-align: right; color: var(--muted); }
  .helpbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 28px 24px;
             max-width: 860px; width: 100%; box-shadow: 0 10px 30px rgba(16, 24, 40, 0.18); }
  .helpbody { line-height: 1.65; }
  .helpbody p, .helpbody li { max-width: 76ch; }
  .helpbody p { margin: 0 0 12px; }
  .helpbody h3 { font-size: 16.5px; font-weight: 600; margin: 22px 0 8px; }
  .helpbody h3:first-child { margin-top: 4px; font-size: 19px; }
  .helpbody ol, .helpbody ul { padding-left: 24px; margin: 0 0 12px; }
  .helpbody li { margin: 0 0 8px; }
  .helpbody code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 13.5px; }
  .helpbody pre { background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow: auto; }
  .helpbody a, .ref.doclink { color: var(--accent); text-decoration: none; cursor: pointer; }
  .helpbody a:hover, .ref.doclink:hover { text-decoration: underline; }
  .ref.term { border-bottom: 1px dotted var(--muted); cursor: help; }      /* a term: its definition on hover, click to open */
  #intro { box-shadow: var(--shadow); }
  #intro .helpbody p { margin: 0 0 6px; }
  .part { font-size: 12px; border-radius: 10px; padding: 0 7px; border: 1px solid var(--line); }
  .part.held-out { color: var(--flag); background: var(--flag-bg); border-color: var(--flag); }
  .part.tuning { color: var(--accent); background: var(--accent-bg); border-color: var(--accent); }
  .kind { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--line);
          border-radius: 10px; padding: 0 7px; margin-right: 6px; vertical-align: middle; }
  .maprow.todo { border-left: 4px solid var(--flag); }
  .example { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--bg);
             border-radius: 6px; padding: 6px 8px; margin-top: 6px; overflow-wrap: anywhere; white-space: pre-wrap; }
  /* the translation table: tabs (Entity classes, Predicates), search and filters, then one compact box per row:
     current schema → ground truth schema (names, then definitions, in two aligned columns), flags at the bottom */
  .mapcard { padding: 12px 16px; }
  .maptabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .maptab { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 14px; font-weight: 600; color: var(--navy); }
  .maptab.current { background: var(--navy); border-color: var(--navy); color: var(--panel); }
  .maptab.current .mapcount { background: var(--panel); }
  .maptab.current:hover { background: var(--navy); filter: brightness(1.1); }
  .maptab .mapcount { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 0 7px; background: var(--navy-bg); color: var(--navy); }
  .maptab .pill { margin-left: 0; }
  .mapfilters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 0; }
  .mapfilters .mapsearch { flex: 1 1 260px; min-width: 0; }
  .mapfilters label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .maphead, .mapgrid { display: grid; grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr); column-gap: 8px; }
  .maphead { position: sticky; top: 60px; z-index: 1; background: var(--navy-bg); color: var(--navy); font-size: 12px;
             font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 12px 6px 15px;
             border-radius: 8px; margin-bottom: 6px; }
  .mapbox { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; background: var(--panel);
            padding: 8px 12px 8px; margin-bottom: 6px; }
  .mapbox.todo { border-left-color: var(--flag); }
  .mapbox:hover { border-color: var(--stripe); }
  .mapbox.todo:hover { border-left-color: var(--flag); }
  /* an entity class or predicate never breaks inside a word: one line, cut with … (the full text in its tooltip);
     in the tool's own typeface, like every other name in the tool */
  .mapname { min-width: 0; font-size: 14.5px; font-weight: 600;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: center; }
  .mapname select { width: 100%; font: inherit; padding: 3px 8px; text-overflow: ellipsis; }
  .mapname select.none { color: var(--muted); font-style: italic; font-weight: 400; }
  .maparrow { color: var(--sky); display: flex; justify-content: center; align-self: center; }
  .maparrow svg { width: 30px; height: 30px; }
  .maphead .maparrow { color: var(--navy); }
  .maphead .maparrow svg { width: 22px; height: 22px; }
  .mapdef { font-size: 13px; line-height: 1.45; color: var(--label); margin-top: 4px; overflow-wrap: break-word; }
  .mapdef.empty { color: var(--muted); font-style: italic; }
  /* reviewers' comments (annotations/reviews/): under an entry, and the Reviewer comments view */
  .reviewnotes { margin-top: 8px; padding: 6px 10px; border-left: 3px solid var(--sky); background: var(--sky-bg);
                 border-radius: 6px; }
  .reviewnotes .reviewhead { font-size: 12px; font-weight: 600; color: var(--navy); text-transform: uppercase;
                             letter-spacing: 0.04em; }
  .reviewnote { margin-top: 4px; }
  .reviewnote .who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .reviewnote .reviewtext { font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: break-word; }
  .reviewgroup .mapdef { margin-top: 2px; }
  .reviewgroup h4 { margin: 0; font-size: 14.5px; }
  .mapbox .example { margin-top: 6px; padding: 3px 8px; font-family: inherit; font-size: 13px; background: var(--tint);
                    overflow-wrap: break-word; }
  .mapflags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; padding-top: 6px;
              border-top: 1px dashed var(--line); font-size: 13px; }
  .mapflags .pill { margin-left: 0; }
  .mapflags .pill.jump { white-space: normal; text-align: left; }      /* a long flag wraps at spaces, never inside a word */
  .mapflag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px 1px 6px; border-radius: 999px;
             background: var(--tint); border: 1px solid var(--line); color: var(--label); cursor: pointer; white-space: nowrap; }
  .mapflag.on { background: var(--sky-bg); border-color: var(--sky); color: var(--navy); font-weight: 600; }
  .mapflag.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .mapflag input { margin: 0; }
  .mapflags .mapdelete { margin-left: auto; padding: 1px 10px; font-size: 12.5px; }
  .mapbox .problems { margin-top: 6px; }
  .mapempty { padding: 12px 4px; }
  /* partial pairs: one compact box per pair, in the translation table's style: the record on top, then the two
     triples side by side, each under its label, then the verdict buttons at the bottom */
  .pairhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 600; }
  .pairhead .pairpos { color: var(--muted); }
  .pairhead .part { font-weight: 400; }
  .pairgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 16px; margin-top: 8px; }
  .pairside { min-width: 0; }
  .pairside + .pairside { border-left: 1px solid var(--line); padding-left: 16px; }
  .pairlabel { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--navy);
               background: var(--navy-bg); border-radius: 6px; padding: 3px 8px; margin-bottom: 6px; }
  .pairpart { display: grid; grid-template-columns: 7.2em minmax(0, 1fr); column-gap: 8px; padding: 2px 0;
              font-size: 14px; line-height: 1.45; }
  .pairtag { font-size: 12px; font-weight: 600; padding-top: 1px; }
  .pairtag.f-subj { color: var(--subj); } .pairtag.f-pred { color: var(--pred); } .pairtag.f-obj { color: var(--obj); }
  .pairval { min-width: 0; overflow-wrap: break-word; }
  /* a subject instance, predicate, or object instance that differs between the two triples, once evened out: filled on
     both sides, the words only that side has a stronger shade */
  .pairpart { padding: 2px 6px; border-radius: 6px; }
  .pairpart.differs { background: var(--soft); }
  .pairextra, .pairlegend .swatch.extra { background: var(--strong); border-radius: 3px; font-weight: 600; }
  .pairlegend .swatch { padding: 0 5px; border-radius: 4px; background: var(--soft); color: var(--ink); }
  .pairbox details { margin-top: 8px; }
  .pairbox summary { cursor: pointer; }
  .pairtext { white-space: pre-wrap; overflow-wrap: break-word; max-height: 40vh; overflow: auto; margin-top: 4px;
              padding: 8px 12px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); }
  .pairexplain p { margin: 0 0 6px; }
  .pairexplain ul { margin: 0 0 8px; padding-left: 18px; }
  .pairexplain li { margin: 2px 0; }
  .mapflag.no { background: var(--flag-bg); border-color: var(--flag); color: var(--flag); font-weight: 600; }
  .mapflags .pairverdict { margin-left: auto; }
  @media (max-width: 700px) {
    .pairgrid { grid-template-columns: minmax(0, 1fr); }
    .pairside + .pairside { border-left: 0; padding-left: 0; border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
  }

  /* ---------------------------------------------------------------- the look: one palette, navy and sky blue on paper;
     Libre Franklin (chosen 2026-10-14, from eight samples), JetBrains Mono for anything code-like */
  :root {
    --bg: #f3f0ea; --panel: #fffdfa; --paper: #fffaf0; --tint: #f7f3ec; --line: #dcd5c9;
    --ink: #1f2933; --muted: #66707a; --label: #3e4a56;
    --navy: #1f3a5f; --navy-bg: #e7edf5; --sky: #3f7cc0; --sky-bg: #dcebfb; --steel-bg: #e8ebf5;
    --accent: var(--navy); --accent-bg: var(--navy-bg);
    --subj: #11777a; --subj-bg: #e6f4f3; --pred: #b0567a; --pred-bg: #fdeef4; --obj: #6f4a8e; --obj-bg: #f2ecf8;
    --soft: #f6e3b4; --strong: #efc36a;
    --bar: var(--navy); --bar-ink: #fdfaf3; --bar-soft: rgba(255, 255, 255, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181c; --panel: #1c2127; --paper: #1f2329; --tint: #222830; --line: #2e353d;
      --ink: #e9e4da; --muted: #9aa3ab; --label: #c3c9cf;
      --navy: #8fb0d6; --navy-bg: #1f2c3b; --sky: #7fb0e3; --sky-bg: #1b2a3a; --steel-bg: #222838;
      --subj: #6fd0cc; --subj-bg: #17292a; --pred: #f0b0c8; --pred-bg: #2e2027; --obj: #c3a6e3; --obj-bg: #251f2e;
      --soft: #4a3d1c; --strong: #6b5419;
      --bar: #172b45; --bar-ink: #ece6da; --bar-soft: rgba(255, 255, 255, 0.10);
    }
  }
  body { font-family: "Libre Franklin", "Segoe UI", system-ui, sans-serif; font-size: 15px; background: var(--bg); }
  header { background: var(--bar); box-shadow: none; border-bottom: 3px solid #6f9fd2; }
  @media (prefers-color-scheme: dark) { header { border-bottom-color: #3d6596; } }
  header h1 button { background: transparent; border: 0; color: var(--bar-ink); font: inherit; font-weight: 600;
                     font-size: 17px; padding: 4px 10px 4px 0; letter-spacing: 0.01em; }
  .pencil { display: inline-block; width: 24px; height: 24px; margin-left: 8px; vertical-align: -6px; }
  .pencil svg { width: 100%; height: 100%; }
  header h1 button:hover { background: transparent; text-decoration: underline; text-underline-offset: 4px; }
  header nav.tabs .tab.current, header nav.tabs .tab.current > button { background: var(--bar-ink); color: #1f3a5f; }
  header .tab.current select { color: #1f3a5f; }
  section.card { border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(40, 30, 10, 0.06); }
  section.card > h3, .textcard > h3, .triplecard > h3 { color: var(--navy); font-size: 15px; }
  #text { font-size: 16.5px; line-height: 1.7; background: var(--paper); border-color: var(--line); }
  mark { background: var(--soft); border-radius: 3px; }
  mark.active { background: var(--strong); outline: 0; box-shadow: 0 0 0 2px var(--sky); }
  .headline h2 { font-size: 18px; font-weight: 600; color: var(--ink); }
  button { border-radius: 8px; }
  button.primary { background: var(--navy); border: 1px solid var(--navy); color: #fdfaf3; font-weight: 600; box-shadow: none; }

ormer name it previously had. | definition, ground truth schema: is the same thing under another name"}, {"kind": "predicate", "entry": "predicate RETURNED_TO", "crt": "RETURNED_TO", "gtt": "(none)", "swap": "no", "checked": "yes", "crt_def": "Links a group of samples or organisms to the condition or environment, such as normal gravity, to which it was returned.", "gtt_def": "", "gtt_now": "", "line": 164, "stale_gtt": false, "shown": "predicate RETURNED_TO -> (none) | swap subject and object: no | checked: yes | definition, current or past schema: Links a group of samples or organisms to the condition or environment, such as normal gravity, to which it was returned. | definition, ground truth schema: "}, {"kind": "predicate", "entry": "predicate VERSION_OF", "crt": "VERSION_OF", "gtt": "HAS_VERSION", "swap": "yes", "checked": "yes", "crt_def": "Links a version identifier to the dataset of which it is a version.", "gtt_def": "carries this Version", "gtt_now": "carries this Version", "line": 165, "stale_gtt": false, "shown": "predicate VERSION_OF -> HAS_VERSION | swap subject and object: yes | checked: yes | definition, current or past schema: Links a version identifier to the dataset of which it is a version. | definition, ground truth schema: carries this Version"}], "none": "(none)"}, "glossary": [{"term": "schema", "term_html": "<strong>schema<\/strong>", "meaning_html": "A description of the entity classes, the predicates, and the patterns: which entity classes each predicate has been seen between."}, {"term": "schema entry", "term_html": "<strong>schema entry<\/strong>", "meaning_html": "An entity class, a predicate, or a pattern. An output file that lists schema entries of more than one kind gives each its kind as <code>entry_type<\/code>: <code>entity class<\/code>, <code>predicate<\/code>, or <code>pattern<\/code>."}, {"term": "entity class", "term_html": "<strong>entity class<\/strong>", "meaning_html": "A type of thing a subject instance or object instance can be, e.g. <code>Instrument<\/code>, <code>Spacecraft<\/code>: a schema entry. The entity class of a classed triple's subject instance is its subject class; of its object instance, its object class. Through its patterns, an entity class can be a subject class, an object class, or both."}, {"term": "predicate", "term_html": "<strong>predicate<\/strong>", "meaning_html": "A word with two senses, told apart by context: <strong>(1)<\/strong> the component in the middle slot of a triple instance or a classed triple; <strong>(2)<\/strong> a schema entry: a type of relationship, e.g. <code>ABOARD<\/code>, the component class of predicate instances."}, {"term": "kind", "term_html": "<strong>kind<\/strong>", "meaning_html": "Of a component class: whether it is an entity class or a predicate (e.g. the translation table's <code>kind<\/code> column)."}, {"term": "component class", "term_html": "<strong>component class<\/strong>", "meaning_html": "What a component instance is classed as in a particular schema. For a subject instance or an object instance, one of the schema's entity classes; for a predicate instance, one of the schema's predicates (examples below)."}, {"term": "pattern", "term_html": "<strong>pattern<\/strong>", "meaning_html": "The component classes of the three slots of a classed triple, as a schema lists them: a subject class, a predicate, and an object class, read from subject to object, e.g. <code>Instrument ABOARD Spacecraft<\/code>. The subject class and the object class may be the same entity class (<code>PersonName ALSO_KNOWN_AS PersonName<\/code>), though that is unusual. A schema's patterns record where its predicates have been seen, not everywhere a predicate may be used."}, {"term": "pinned predicate", "term_html": "<strong>pinned predicate<\/strong>", "meaning_html": "A predicate of a schema in the text shape (e.g. the ground truth schema) that may join only the entity classes listed on its \"only:\" line (\"any\": any entity class), e.g. <code>ACQUIRED_BY_INSTRUMENT<\/code>, with <code>only: Dataset -&gt; Instrument<\/code>. The checks flag a triple with any other pattern (<code>pattern_not_pinned<\/code>): a ground truth triple (050) or an extracted triple (060). Any other predicate may join whatever entity classes its meaning fits."}, {"term": "ground truth", "term_html": "<strong>ground truth<\/strong>", "meaning_html": "The classed triples of the records chosen for annotation, as a person corrects them. Only a finished record's have been checked; a record not finished yet may still hold drafted triples as the model wrote them. Kept in <code>annotations/ground_truth/<\/code>, one file per batch of records (<code>batch_000.csv<\/code> holds 6 records annotated by hand before step 050 was built: their ground truth triples were written entirely by a person, not drafted and corrected, except the rows of pool positions 1, 2, 3, and 4 whose <code>drafted_by<\/code> column names a model: a model drafted those and a person corrected them; <code>batch_001.csv<\/code> and every later file are corrected from step 050's drafted batch of the same number); the ground truth is all the files together."}, {"term": "ground truth triple", "term_html": "<strong>ground truth triple<\/strong>", "meaning_html": "A classed triple of the ground truth, other than its record's describes triple. A record that states no facts has none (its ground truth file keeps only its id, to show it was annotated). What step 070 pairs with the occurrences of the extracted triples. A record's ground truth triples form its <strong>set of ground truth triples<\/strong>. Two of them with the same subject instance and object instance (evened out) and the same predicate must differ in subject class, object class, or both (by loose match): otherwise they are <strong>the same classed triple twice<\/strong>, and step 070 refuses to run until one is deleted; when they do differ, step 070 warns before evaluating. It has been checked by a person only once its record is finished."}, {"term": "ground truth schema", "term_html": "<strong>ground truth schema<\/strong>", "meaning_html": "The schema of the ground truth, which a person writes while annotating: <code>annotations/ground_truth_schema.txt<\/code>, its entity classes and predicates, each with a one-line definition, and its patterns: those its file lists, and every one the ground truth uses (code reads them from the ground truth files, so none is ever added by hand). Every entity class and predicate a ground truth triple uses must be in it. One used that it doesn't have yet (compared by loose match) is <strong>coined<\/strong>: a new one, or a typo. The annotation tool marks a coined one ✖, with a button that adds it with a definition, and step 070 stops while a finished record uses one; a pattern used for the first time is only flagged ⚑, for a look (a wrong entity class or direction). Step 050 shows it to the model as the component classes to reuse, step 040 compares the schema it learns with it, and step 070 translates the component classes of the current schema into it before comparing."}, {"term": "record", "term_html": "<strong>record<\/strong>", "meaning_html": "The metadata of one catalog entry. The catalog we work with is typically data.nasa.gov."}, {"term": "classed triple", "term_html": "<strong>classed triple<\/strong>", "meaning_html": "A fact written as a subject instance with its subject class, a predicate of a schema, and an object instance with its object class, e.g. \"MODIS\" (<code>Instrument<\/code>) ABOARD \"Aqua\" (<code>Spacecraft<\/code>). What annotation (step 050) and extraction (step 060) write: every ground truth triple and every extracted triple is a classed triple."}, {"term": "subject instance", "term_html": "<strong>subject instance<\/strong>", "meaning_html": "The component instance in the subject slot: the text's words for one particular thing, e.g. \"MODIS\". Its component class, the <strong>subject class<\/strong>, is an entity class (<code>Instrument<\/code>)."}, {"term": "object instance", "term_html": "<strong>object instance<\/strong>", "meaning_html": "The component instance in the object slot, e.g. \"Aqua\". Its component class, the <strong>object class<\/strong>, is an entity class (<code>Spacecraft<\/code>)."}, {"term": "domain", "term_html": "<strong>domain<\/strong> (of a predicate)", "meaning_html": "The entity classes its subject may belong to."}, {"term": "range", "term_html": "<strong>range<\/strong> (of a predicate)", "meaning_html": "The entity classes its object may belong to."}, {"term": "current schema", "term_html": "<strong>current schema<\/strong>", "meaning_html": "The schema step 060 extracts with. By default, the induced schema plus the schema additions. A person may give step 060 another <strong>schema file<\/strong> instead of the induced schema (<code>--schema &lt;file&gt;<\/code>), and another <strong>additions file<\/strong> instead of <code>annotations/schema_additions.txt<\/code> (<code>--additions &lt;file&gt;<\/code>), e.g. an empty one to leave the schema additions out. The schema step 060's last run used is written to <code>schema_used.json<\/code>, which step 070 reads (and 080 will), so both use exactly what 060 used. A <strong>past schema<\/strong> is one an earlier run of 060 used."}, {"term": "extracted triple", "term_html": "<strong>extracted triple<\/strong>", "meaning_html": "A classed triple step 060 kept after checking it: one in <code>extracted_triples.csv<\/code>, the graph's facts and what 070 evaluates. The ones its checks <strong>removed<\/strong> go to <code>extracted_triples_removed.csv<\/code> with the reason, one of five: <code>source_text<\/code> (its source text is missing or isn't in the record's text), <code>component_class_not_in_schema<\/code> (an entity class or predicate the schema doesn't have), <code>component_class_not_in_schema source_text<\/code> (both of those), <code>duplicate<\/code> (the same classed triple twice in the record; one copy is kept), or <code>malformed<\/code> (not a classed triple at all). Removed is not deleted: the file keeps them for a person to look at. A record's extracted triples form its <strong>set of extracted triples<\/strong>. Two of them may share subject instance, object instance (evened out), and predicate only if they differ in subject class or object class (by loose match); otherwise they are the same classed triple twice, and step 060 removes one as <code>duplicate<\/code>."}, {"term": "translation table", "term_html": "<strong>translation table<\/strong>", "meaning_html": "The table <code>annotations/component_class_mapping.csv<\/code>, checked by a person: which component class of the ground truth schema each component class of the current schema means, or <code>(none)<\/code>. What one row says is a <strong>translation<\/strong>. Its columns abbreviate (crt: <strong>current<\/strong>, gtt: <strong>ground truth triples<\/strong>): <code>component_class_from_past_or_crt_schema<\/code> is a component class of the current schema or a past schema (one table serves every schema); <code>component_class_in_gtt<\/code> is a component class of the ground truth schema, the one the ground truth triples use; <code>definition_from_past_or_crt_schema<\/code> keeps that schema's definition of the component class from when the row was written or last checked, so a changed definition shows (the row is then stale: see <strong>row state<\/strong>). <code>kind<\/code> is <code>entity class<\/code> or <code>predicate<\/code>. <code>checked<\/code> says whether a person has checked the row: <code>no<\/code> (not yet: a row step 070 proposed), <code>yes<\/code>, or <code>same component class<\/code> (a row accepted automatically because the two are spelled the same); <code>definition_in_gtt<\/code> keeps the ground truth schema's definition of <code>component_class_in_gtt<\/code> from that check. <code>swap_subject_and_object<\/code> is <code>yes<\/code> when the row's predicate says the same relationship the other way round (\"A CARRIES B\" is \"B ABOARD A\"), else <code>no<\/code> (always <code>no<\/code> for an entity class). These three columns are read ignoring case and spaces at either end; any other value stops step 070, naming its line."}, {"term": "row state", "term_html": "<strong>row state<\/strong>", "meaning_html": "A note the annotation tool shows on a row of the translation table, one of five, each with what step 070 does about it: <strong>stale<\/strong> (⚑; checked, but since then the current schema's definition of its component class changed, or the ground truth schema's definition of the one it translates to changed, or was missing when the row was checked; it counts as unchecked: step 070 stops), <strong>repeated<\/strong> (✖; the component class has more than one row: step 070 stops), <strong>now exists<\/strong> (⚑; says <code>(none)<\/code>, though the ground truth schema now has a component class spelled the same: it was added to the ground truth schema since; a warning in step 070's report), <strong>suggested<\/strong> (⚑; says <code>(none)<\/code>, and the model suggests a component class the ground truth schema gained since; a warning in the report), or <strong>shared<\/strong> (⚑; another component class of the current schema translates to the same one, so evaluation can't tell them apart; listed in the report's <em>The translation table<\/em>). Besides these, a row that translates to a component class the ground truth schema doesn't have (a typo, or one since renamed) shows it in its list marked ⚠, and step 070 stops. Not a <strong>flag<\/strong>, which is raised by a check of a triple instance or a classed triple."}, {"term": "row", "term_html": "<strong>row<\/strong>", "meaning_html": "One line of a CSV file the project keeps: in a ground truth file, a ground truth triple or a describes triple; in the translation table, one translation."}, {"term": "step", "term_html": "<strong>step<\/strong>", "meaning_html": "One of the 8 numbered parts of the pipeline, <code>010_harvest<\/code> to <code>080_build_graph<\/code>. Each step reads what earlier steps wrote and writes its own output."}, {"term": "fingerprint", "term_html": "<strong>fingerprint<\/strong>", "meaning_html": "A short code computed from exact content: a file, a prompt, a set of settings. The same content always gives the same fingerprint, and any change gives a different one. Used to tell whether an input or a cached model answer still matches (technically a SHA-256 hash)."}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const V = D.version;
const $ = (id) => document.getElementById(id);
// An arrow as the page shows it: "->" or "-->" in the files becomes "→" on the screen only; the data, the comments'
// entry texts, the emails and the downloads keep the files' own characters, so --read compares like with like.
const arrows = (text) => String(text).replace(/--?>/g, "→");
const arrowsHtml = (html) => String(html).replace(/--?&gt;/g, "→");
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) node.append(c);
  return node;
}

// ---------------------------------------------------------------- what this browser keeps (localStorage)
// Each read and write may fail (storage blocked for pages opened from disk, a private window): the page then works
// from memory, and says so, so the reviewer downloads before closing.
const KEY = { comments: "schemaReview:comments", name: "schemaReview:name", seen: "schemaReview:seen",
              oneAtATime: "schemaReview:oneAtATime" };
let storageWorks = true;
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch (_) { storageWorks = false; return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (_) { storageWorks = false; return false; }
}
// {id: {kind, entry, text, at, version, commit, shown}}: id is kind|entry, the same in every copy of the page, so
// comments carry over to a newer copy opened in the same browser.
let comments = load(KEY.comments, {});
if (!comments || typeof comments !== "object") comments = {};
let reviewer = load(KEY.name, "") || "";
let oneAtATime = load(KEY.oneAtATime, false) === true;

// ---------------------------------------------------------------- the entries
const ENTRIES = [];                          // every entry of this copy: {id, kind, entry, shown, ...}
for (const e of D.schema.entity_classes) ENTRIES.push({ ...e, id: `${e.kind}|${e.entry}` });
for (const e of D.schema.predicates) ENTRIES.push({ ...e, id: `${e.kind}|${e.entry}` });
for (const r of D.mapping.rows) ENTRIES.push({ ...r, kind: "translation row", rowKind: r.kind, id: `translation row|${r.entry}` });
const BY_ID = Object.fromEntries(ENTRIES.map((e) => [e.id, e]));
const GENERAL = { id: "general|(general)", kind: "general", entry: "(general)", shown: "" };

// Changed since you last looked: the copy opened before this one (an older one, by when it was made) left the text
// of each entry here; an entry whose text differs is changed, one it lacked is new.
const seenAll = (() => { const s = load(KEY.seen, {}); return s && typeof s === "object" ? s : {}; })();
const previous = Object.values(seenAll).filter((s) => s && s.content !== V.content && s.generated < V.generated)
  .sort((a, b) => (a.generated < b.generated ? 1 : -1))[0] || null;
const CHANGED = new Set(), NEW = new Set();
if (previous) for (const e of ENTRIES) {
  if (!(e.id in previous.entries)) NEW.add(e.id);
  else if (previous.entries[e.id] !== e.shown) CHANGED.add(e.id);
}
(() => {                                      // keep this copy's texts, and those of the three copies before it
  seenAll[V.content] = { version: V.id, generated: V.generated, content: V.content,
                         entries: Object.fromEntries(ENTRIES.map((e) => [e.id, e.shown])) };
  const keep = Object.values(seenAll).sort((a, b) => (a.generated < b.generated ? 1 : -1)).slice(0, 4);
  save(KEY.seen, Object.fromEntries(keep.map((s) => [s.content, s])));
})();

// ---------------------------------------------------------------- comments
const written = () => Object.values(comments).filter((c) => c && c.text && c.text.trim());
let saveTimer = null;
// The time now, on this computer's clock, with its offset from UTC: 2026-10-24T14:05:09-04:00.
function localIso() {
  const d = new Date(), pad = (n) => String(Math.abs(n)).padStart(2, "0"), off = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:` +
         `${pad(d.getSeconds())}${off < 0 ? "-" : "+"}${pad(Math.trunc(off / 60))}:${pad(off % 60)}`;
}
function setComment(e, text) {
  if (text.trim()) comments[e.id] = { kind: e.kind, entry: e.entry, text, at: localIso(),
                                      version: V.id, commit: V.commit, shown: e.shown };
  else delete comments[e.id];
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { save(KEY.comments, comments); drawStatus(); }, 300);
  drawStatus(true);
}
function commentBox(e, label) {
  const c = comments[e.id];
  const box = el("div", { class: "commentbox" + (c ? " has" : "") });
  const ta = el("textarea", { rows: 2, placeholder: "Your comment (optional): what is wrong, unclear, or missing",
                              "aria-label": label });
  ta.value = c ? c.text : "";
  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight + 2, 44) + "px"; };
  ta.addEventListener("input", () => {
    setComment(e, ta.value); box.classList.toggle("has", !!ta.value.trim());
    const card = box.closest(".mapbox"); if (card) card.classList.toggle("commented", !!ta.value.trim());
    grow();
  });

    `[sent] ${sent}`, `[part] ${k} of ${n}`, `=== start of part ${k} of ${n} ===`, "", ...lines,

        searchBox(st, "Search names and definitions"), counterpart,
        check(st, "mine", "Only those I commented on"),
        previous ? check(st, "changed", "Only those changed or new since I last looked") : null),
      bar,
      shown.length ? [el("div", { class: "maphead" }, el("div", {}, `Current or past schema ${what}`), mapArrow(),
                         el("div", {}, `Ground truth schema ${what}`)),
                      (at === null ? shown : [shown[at]]).map(mappingBox)]
                   : el("p", { class: "empty mapempty" }, "Nothing matches the search and filters above."))];
}

// ---------------------------------------------------------------- terms
function drawTerms() {
  const rows = D.glossary.map((t) => {
    const term = el("td", { class: "term" }); term.innerHTML = arrowsHtml(t.term_html);      // written by helpers/review_page.py,
    const meaning = el("td", {}); meaning.innerHTML = arrowsHtml(t.meaning_html);           // from docs/terminology.md, escaped
    return el("tr", {}, term, meaning);
  });
  return [el("section", { class: "card" }, el("h2", {}, "Terms"),
    el("p", { class: "meta" }, `The words this page uses, as my project's list of terms (docs/terminology.md) defines them at commit ${V.commit}.`),
    el("table", { class: "schematable terms" }, el("thead", {}, el("tr", {}, el("th", {}, "Term"), el("th", {}, "Meaning"))),
       el("tbody", {}, rows)))];
}

// ---------------------------------------------------------------- how to read this
function drawHome() {
  const nameField = el("input", { id: "reviewer", type: "text", value: reviewer, placeholder: "e.g. Jane Smith", autocomplete: "name",
    oninput: (ev) => { reviewer = ev.target.value; save(KEY.name, reviewer); } });
  const picker = el("input", { type: "file", accept: ".csv,text/csv", hidden: true,
                               onchange: (ev) => { if (ev.target.files[0]) loadFile(ev.target.files[0]); ev.target.value = ""; } });
  const gone = written().filter((c) => c.kind !== "general" && !BY_ID[`${c.kind}|${c.entry}`]);
  const nSchema = D.schema.entity_classes.length + " entity classes and " + D.schema.predicates.length + " predicates";
  return [el("section", { class: "card home" },
    el("h2", {}, "How to read this page"),
    el("p", {}, "Thank you for reviewing this. My project builds a knowledge graph from the records of the data.nasa.gov catalog: " +
      "a model reads each record's text and writes down the facts it states, each as a classed triple, e.g. “MODIS” (Instrument) " +
      "ABOARD “Aqua” (Spacecraft). To measure how well it does, I check a sample of records by hand and write down every fact " +
      "their texts state: the ground truth. This page shows two files that decide what those facts may say, as they were when " +
      "the page was made (the line above says when), so that you can tell me where they are wrong, unclear, or missing something."),
    el("h3", {}, "Ground truth schema"),
    el("p", {}, `The ${nSchema} the ground truth may use, each with a one-line definition. An entity class is a kind of thing a ` +
      "subject instance or object instance can be (Instrument); a predicate is a kind of relationship (ABOARD). Under a predicate " +
      "are its patterns, the pairs of entity classes it has joined, read subject → object: Instrument → Spacecraft under ABOARD " +
      "says that an instrument is carried on a spacecraft. The ground truth itself may use more patterns than the file lists. " +
      "A line “only: …” pins a predicate: it may join only those entity classes (“any”: any entity class). A line " +
      "“source: …” says where the idea for an entry came from: “ground truth tuning #2” means from the record at position 2 of " +
      "my shuffled list of records to annotate."),
    el("p", {}, "Worth asking: is each definition right, and clear to someone in your field? Should two entries be one, or one be two? " +
      "Is a kind of thing or relationship that the catalog often states missing? Is a predicate pinned where it shouldn't be?"),
    el("h3", {}, "Translation table"),
    el("p", {}, "The model doesn't use the ground truth schema: it extracts with its own, the current schema, learned from other " +
      "records of the catalog. To compare its facts with the ground truth, each entity class and predicate of the current schema " +
      "(and of past ones) is translated into the one of the ground truth schema that means the same, or into (none) when none does. " +
      "Each box is one row: on the left, the current or past schema's entity class or predicate and its definition; on the right, " +
      "what it translates to and the ground truth schema's definition. “Swap subject and object” means the ground truth " +
      "schema's predicate states the relationship the other way round (“A CARRIES B” is “B ABOARD A”). The last pill says " +
      "whether I have checked the row."),
    el("p", {}, "Worth asking: does each translation keep the meaning? Does a row that says (none) really have no counterpart?"),
    el("h3", {}, "Your comments"),
    el("p", {}, "Write in the box under any entry, and anything else under General comments below. Every comment is kept in this " +
      "browser as you type, on this computer only, so you can stop and come back; the top of the page says how many you have written. " +
      "When you're done, type your name and press Email my comments to Iulia: your email program opens a new email to me " +
      "with your comments in it, for you to send (a long set of comments takes a few emails, numbered). If that doesn't " +
      "work, press Download my comments, and attach the small file it saves (a CSV file) to an email to me. " +
      "Your name and comments reach only me: I keep them on my computer, not in my project's public repository."),
    el("p", {}, "This page is a copy: it can't change the files, and it sends nothing anywhere by itself (an email goes only when you " +
      "press Send in your email program). When I update it, the same link shows the newer copy (or I send you a newer file): " +
      "open it in the same browser, and your comments carry over, and entries that changed since the copy you opened before are marked " +
      "“changed since you last looked”. In another browser or on another computer, read your comments back in from the file " +
      "you downloaded (Load my comments from a file, below)."),
    el("div", { class: "namefield" }, el("label", { for: "reviewer", class: "name" }, "Your name"), nameField),
    commentBox(GENERAL, "General comments"),
    el("div", { class: "actions" },
      el("button", { class: "primary", onclick: email }, "Email my comments to Iulia"),
      el("button", { onclick: download }, "Download my comments"),
      el("button", { onclick: () => picker.click(), title: "Read back a file of comments this page saved before" },
         "Load my comments from a file"), picker),
    drawEmailing(),
    !storageWorks ? el("p", { class: "problems" }, el("span", { class: "pill flag" },
      "⚑ This browser doesn't let the page keep your comments: download them before you close it.")) : null,
    gone.length ? el("div", { class: "gone" }, el("h3", {}, "Your comments on entries no longer on this page"),
      el("p", { class: "meta" }, "They are still in your download, with the entry as it read when you wrote them."),
      el("ul", {}, gone.map((c) => el("li", {}, el("strong", {}, `${c.kind} ${c.entry}`), `: ${c.text}`,
                                          el("div", { class: "meta" }, `It read: ${arrows(c.shown)}`))))) : null)];
}

// ---------------------------------------------------------------- views
let view = "home";
const VIEWS = { home: drawHome, schema: drawSchema, mapping: drawMapping, terms: drawTerms };
function redraw() {
  for (const v of Object.keys(VIEWS)) {
    $(`tab-${v}`).classList.toggle("current", v === view);
    if (v === view) $(`tab-${v}`).setAttribute("aria-current", "page"); else $(`tab-${v}`).removeAttribute("aria-current");
  }
  $("view").replaceChildren(...VIEWS[view]().flat(Infinity).filter(Boolean));
  drawStatus();
}
function show(v) {
  view = VIEWS[v] ? v : "home";
  history.replaceState(null, "", "#" + view);
  message = "";
  redraw();
  window.scrollTo(0, 0);
}
for (const v of Object.keys(VIEWS)) $(`tab-${v}`).addEventListener("click", () => show(v));
$("homebutton").addEventListener("click", () => show("home"));
drawVersion();
show(location.hash.slice(1) || "home");
</script>
</body>
</html>

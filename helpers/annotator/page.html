<style>
  /* the tool's own copies (helpers/annotator/fonts/, SIL Open Font License), so the look doesn't depend on the network */

<style>
  :root {
    --bg: #e9ece8; --panel: #ffffff; --ink: #262b31; --muted: #626a76; --line: #d5dad4;
    --tint: #f1f6f5; --paper: #fbf9f3; --label: #4a5260; --stripe: #8fc1cc;
    --accent: #2c6e82; --accent-bg: #eaf3f5; --soft: #fbefc4; --strong: #f5d77a; --error: #a8322b; --flag: #85601a;
    --error-bg: #fdecea; --flag-bg: #fff6e0; --ok: #1f7a3a; --ok-bg: #e5f4ea; --input: #ffffff;
    --subj: #2f6db5; --subj-bg: #eaf1fb; --pred: #8a4fb8; --pred-bg: #f4ecfa; --obj: #2c8a5a; --obj-bg: #e8f5ee;
    --bar: #1f5566; --bar-ink: #ffffff; --bar-soft: rgba(255, 255, 255, 0.16);
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111417; --panel: #1b1f24; --ink: #e4e7ea; --muted: #9aa2ad; --line: #30363d;
      --tint: #222a2e; --paper: #1f2226; --label: #b6bdc7; --stripe: #3f7684;
      --accent: #7fbccd; --accent-bg: #1f3036; --soft: #4d4415; --strong: #7a6400; --error: #ff8a80; --flag: #f0c060;
      --error-bg: #3a1f1f; --flag-bg: #3a3018; --ok: #6fd08c; --ok-bg: #1d3325; --input: #14171c;
      --subj: #7fb0ec; --subj-bg: #1c2836; --pred: #c79ae8; --pred-bg: #2a2133; --obj: #79d1a4; --obj-bg: #1b2e25;
      --bar: #163c47; --bar-ink: #e9f3f5; --bar-soft: rgba(255, 255, 255, 0.10);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
         -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bar); color: var(--bar-ink); box-shadow: var(--shadow); }
  header .topbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 8px 16px; }
  @media (min-width: 1200px) { header .topbar { flex-wrap: nowrap; } }
  header #status { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 5em; }
  header h1 { white-space: nowrap; }
  header nav.tabs { display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 0;
                    max-height: none; overflow: visible; position: static; border-radius: 0; box-shadow: none; }
  header nav.tabs button { display: inline-block; width: auto; margin: 0; text-align: center; box-shadow: none; }
  header nav.tabs .tab.current { background: var(--bar-ink); }
  header nav.tabs .tab.current > button, header nav.tabs .tab.current { color: #0f3d4a; }
  header .tab { display: inline-flex; align-items: center; gap: 4px; border-radius: 8px; }
      color: var(--bar-ink); padding: 6px 8px; border-radius: 8px; white-space: nowrap; }
  header .tab.current, header .tab.current button { background: var(--bar-ink); color: var(--bar); font-weight: 600; }
  header .tab select { border: 0; background: transparent; color: var(--bar-ink); font-weight: 600; padding: 6px 8px;
                       max-width: 330px; cursor: pointer; }
  header .tab select option { color: var(--ink); background: var(--panel); font-weight: 400; }
  header .tab.current select { color: var(--band-solid, #1f3a5f); }
  header #status { color: var(--bar-ink); opacity: 0.85; }
  header #status.failed { color: #ffd2cc; opacity: 1; }
  header #status.saved { color: #bdf2cc; opacity: 1; }
  header .count { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 12px;
                  font-weight: 600; background: #f4b6ae; color: #6d1d16; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.01em; margin: 0 12px 0 0; }
  select, input, textarea, button { font: inherit; color: var(--ink); }
  select, input, textarea { background: var(--input); border: 1px solid #c3cac3; border-radius: 8px; padding: 6px 9px; }
  @media (prefers-color-scheme: dark) { select, input, textarea { border-color: #3b434c; } }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
           transition: background 0.12s, border-color 0.12s; }
  button:hover { border-color: var(--accent); background: var(--accent-bg); }
  .bar button.current { outline: 2px solid var(--accent); font-weight: 600; }
  #status { margin-left: auto; color: var(--muted); font-size: 13.5px; }
  #status.saved { color: var(--ok); } #status.failed { color: var(--error); font-weight: 600; }
  #warnings { margin: 0; padding: 8px 16px; background: var(--error-bg); color: var(--error); }
  #intro { margin: 0; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--accent-bg); }
  #intro[hidden] { display: none; }
  #intro p { margin: 0 0 4px 0; }
  #warnings:empty { display: none; }
  #warnings li { white-space: pre-line; }
  .typepick { display: flex; gap: 6px; margin: 6px 0; }
  .explain p { margin: 6px 0; }
  .gaps { background: var(--error-bg); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .gaps ul { list-style: none; margin: 6px 0 0; padding: 0; }
  .gaps li { margin-top: 6px; }
  .addbox { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: 6px; }
  .addbox input { width: min(420px, 100%); }
  main { display: grid; grid-template-columns: 250px 1fr; gap: 16px; padding: 16px; }
  .workgrid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .textcol { position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow: auto; }
  .textcol #text { max-height: 46vh; }
  @media (max-width: 1100px) { .workgrid { grid-template-columns: 1fr; } .textcol { position: static; max-height: none; } }
  .classpanel { max-height: 40vh; overflow: auto; }
  .classopt { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
              border-radius: 0; padding: 6px 4px; background: transparent; }
  .classopt:hover { background: var(--accent-bg); }
  .classopt.current { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }   /* what the field holds */
  .triplenav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0 8px; }
  .triplenav button { padding: 4px 12px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  nav { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px;
        max-height: calc(100vh - 88px); overflow: auto; position: sticky; top: 72px; align-self: start; }
  nav button { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 6px 8px; margin: 1px 0; }
  nav button.current { background: var(--accent-bg); outline: 0; box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
  nav button:hover { background: var(--tint); }
  nav .badge { float: right; font-size: 13px; margin-left: 6px; }
  nav .small { color: var(--muted); font-size: 12px; }
  section.card { background: var(--panel); border: 1px solid transparent; border-radius: 12px; padding: 16px 20px;
                 margin-bottom: 16px; min-width: 0; box-shadow: var(--shadow); }
  h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  label.finished { font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  #text { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 45vh; overflow: auto; font-size: 15.5px; line-height: 1.65;
          border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; background: var(--paper); }
  mark { background: var(--soft); color: inherit; border-radius: 2px; cursor: pointer; }
  mark.active { background: var(--strong); outline: 1px solid var(--flag); }
  mark.shared { box-shadow: inset 0 -2px 0 var(--muted); }   /* the source text of more than one ground truth triple */
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  ul.hint { padding-left: 18px; }
  ul.hint li { margin: 2px 0; }
  .row { border: 1px solid var(--line); border-left: 4px solid var(--stripe); border-radius: 10px; padding: 12px 14px;
         margin-bottom: 12px; background: var(--tint); }
  .row.active { border-color: var(--accent); border-left-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .rowhead { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .rowfoot { display: flex; justify-content: flex-end; margin-top: 8px; }
  .rowfoot button.deltriple { padding: 2px 10px; font-size: 12.5px; font-weight: 400; color: var(--ink); white-space: nowrap; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; margin-left: 6px; }
  .pill.error { background: var(--error-bg); color: var(--error); }
  .pill.flag { background: var(--flag-bg); color: var(--flag); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.todo { background: var(--bg); color: var(--muted); }
  nav .badge .pill { margin-left: 3px; }
  .recordhead { padding: 10px 16px 0; }
  .headline { display: flex; align-items: center; gap: 8px; }
  .headline h2 { flex: 1; min-width: 0; margin: 0 6px; font-size: 16.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .headline button { padding: 4px 10px; }
  .headline .listtoggle { color: var(--accent); }
  .headmeta { margin: 4px 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
  .headmeta .pill { margin-left: 6px; }
  button.pill.jump { border: 0; cursor: pointer; font: inherit; font-size: 12px; }
  .patterns { margin: 0; }
  .patterns button.patbtn { font-size: 12px; padding: 1px 8px; margin-right: 6px; }
  .patterns .patlist { margin-top: 4px; padding: 6px 10px; border-left: 3px solid var(--muted); }
  .patterns .patlist ul { margin: 4px 0; padding-left: 18px; }
  button.pill.jump:hover { filter: brightness(0.95); text-decoration: underline; }
  body.norecords main { grid-template-columns: 1fr; }
  body.norecords nav#records { display: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }
  @media (prefers-color-scheme: dark) { button.primary { color: #10181b; } }
  label.finished { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 4px 10px; }
  .hintbox { margin-top: 8px; }
  .hintbox summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
  /* a triple's parts, each its own group: subject + subject class, predicate, object + object class; then the
     pattern buttons and the source text. A thin line and some space between groups. */
  /* the component class column is a third of the width, or wider when a component class's longest word needs it */
  .triple .group { display: grid; grid-template-columns: minmax(0, 1fr) minmax(min-content, 34%); gap: 8px 10px; }
  .triple .group.wide { grid-template-columns: minmax(0, 1fr); }       /* the predicate: the triple's full width */
  .triple .group + .group, .row > .patterns, .row > .source { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
  .triple label, .source label { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; font-weight: 600;
                                 color: var(--label); min-width: 0; }
  .triple label input, .triple label textarea, .source label textarea { font-weight: 400; font-size: 14.5px; }
  .triple input, .triple textarea { width: 100%; min-width: 0; }
  textarea.grow { resize: none; overflow: hidden; line-height: 1.4; }
  /* a component class wraps only at spaces, never inside a word; a word wider than its field scrolls sideways */
  .triple .nobreak { overflow-wrap: normal; word-break: normal; min-width: 130px; }
  textarea.grow.nobreak, .fixed.nobreak { overflow-x: auto; }
  .triple label.f-subj { color: var(--subj); } .triple label.f-pred { color: var(--pred); } .triple label.f-obj { color: var(--obj); }
  .f-subj input, .f-subj textarea { background: var(--subj-bg); }
  .f-pred input, .f-pred textarea { background: var(--pred-bg); }
  .f-obj input, .f-obj textarea { background: var(--obj-bg); }
  .f-subj input, .f-subj textarea, .f-pred input, .f-pred textarea, .f-obj input, .f-obj textarea { color: var(--ink); }
  .schematable th { background: var(--tint); }
  .schemaview h3 { color: var(--accent); }
  .triple .cls { font-size: 13px; }
  .triple .def { font-weight: 400; font-size: 12px; }
  @media (max-width: 800px) { .triple .group { grid-template-columns: 1fr; } }
  .source textarea { width: 100%; }
  .source .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }   /* under the source text */
  .problems { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; }
  .problems li { padding: 3px 8px; border-radius: 5px; margin-top: 3px; }
  .problems li.error { background: var(--error-bg); color: var(--error); }
  .problems li.flag { background: var(--flag-bg); color: var(--flag); }
  .fixed { border: 1px dashed #c3cac3; border-radius: 8px; padding: 6px 9px; color: var(--muted); font-weight: 400;
           font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }                      /* written by code, shown only */
  .empty { color: var(--muted); }
  .name { font-weight: 600; }                 /* a view's or section's name, *written so* in the README and guidelines */
  #help { position: fixed; inset: 0; z-index: 5; background: rgba(0, 0, 0, 0.45); display: flex;
          justify-content: center; align-items: flex-start; padding: 40px 16px; overflow: auto; }
  #help[hidden] { display: none; }
  .helpbox.wide { max-width: 1240px; }
  .schemafilter { width: 100%; margin: 12px 0; }
  .schemagrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .schemagrid { grid-template-columns: 1fr; } }
  .schematable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .schematable th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 6px;
                    border-bottom: 1px solid var(--line); }
  .schematable td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .schematable tbody tr:nth-child(even) td { background: var(--tint); }
  .schematable td.schemaname { font-weight: 600; white-space: nowrap; }
  .schematable td.schemauses { text-align: right; color: var(--muted); }
  .helpbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 28px 24px;
             max-width: 860px; width: 100%; box-shadow: 0 10px 30px rgba(16, 24, 40, 0.18); }
  .helpbody { line-height: 1.65; }
  .helpbody p, .helpbody li { max-width: 76ch; }
  .helpbody p { margin: 0 0 12px; }
  .helpbody h3 { font-size: 16.5px; font-weight: 600; margin: 22px 0 8px; }
  .helpbody h3:first-child { margin-top: 4px; font-size: 19px; }
  .helpbody ol, .helpbody ul { padding-left: 24px; margin: 0 0 12px; }
  .helpbody li { margin: 0 0 8px; }
  .helpbody code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 13.5px; }
  .helpbody pre { background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow: auto; }
  .helpbody a, .ref.doclink { color: var(--accent); text-decoration: none; cursor: pointer; }
  .helpbody a:hover, .ref.doclink:hover { text-decoration: underline; }
  .ref.term { border-bottom: 1px dotted var(--muted); cursor: help; }      /* a term: its definition on hover, click to open */
  #intro { box-shadow: var(--shadow); }
  #intro .helpbody p { margin: 0 0 6px; }
  .part { font-size: 12px; border-radius: 10px; padding: 0 7px; border: 1px solid var(--line); }
  .part.held-out { color: var(--flag); background: var(--flag-bg); border-color: var(--flag); }
  .part.tuning { color: var(--accent); background: var(--accent-bg); border-color: var(--accent); }
  .kind { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--line);
          border-radius: 10px; padding: 0 7px; margin-right: 6px; vertical-align: middle; }
  .maprow.todo { border-left: 4px solid var(--flag); }
  .maprow .means { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .maprow select { max-width: 100%; }
  .example { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--bg);
             border-radius: 6px; padding: 6px 8px; margin-top: 6px; overflow-wrap: anywhere; white-space: pre-wrap; }

  /* ---------------------------------------------------------------- the look: one palette, navy and sky blue on paper;
     Libre Franklin (chosen 2026-10-14, from eight samples), JetBrains Mono for anything code-like */
  :root {
    --bg: #f3f0ea; --panel: #fffdfa; --paper: #fffaf0; --tint: #f7f3ec; --line: #dcd5c9;
    --ink: #1f2933; --muted: #66707a; --label: #3e4a56;
    --navy: #1f3a5f; --navy-bg: #e7edf5; --sky: #3f7cc0; --sky-bg: #dcebfb; --steel-bg: #e8ebf5;
    --accent: var(--navy); --accent-bg: var(--navy-bg);
    --subj: #11777a; --subj-bg: #e6f4f3; --pred: #b0567a; --pred-bg: #fdeef4; --obj: #6f4a8e; --obj-bg: #f2ecf8;
    --soft: #f6e3b4; --strong: #efc36a;
    --bar: var(--navy); --bar-ink: #fdfaf3; --bar-soft: rgba(255, 255, 255, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181c; --panel: #1c2127; --paper: #1f2329; --tint: #222830; --line: #2e353d;
      --ink: #e9e4da; --muted: #9aa3ab; --label: #c3c9cf;
      --navy: #8fb0d6; --navy-bg: #1f2c3b; --sky: #7fb0e3; --sky-bg: #1b2a3a; --steel-bg: #222838;
      --subj: #6fd0cc; --subj-bg: #17292a; --pred: #f0b0c8; --pred-bg: #2e2027; --obj: #c3a6e3; --obj-bg: #251f2e;
      --soft: #4a3d1c; --strong: #6b5419;
      --bar: #172b45; --bar-ink: #ece6da; --bar-soft: rgba(255, 255, 255, 0.10);
    }
  }
  body { font-family: "Libre Franklin", "Segoe UI", system-ui, sans-serif; font-size: 15px; background: var(--bg); }
  header { background: var(--bar); box-shadow: none; border-bottom: 3px solid #6f9fd2; }
  @media (prefers-color-scheme: dark) { header { border-bottom-color: #3d6596; } }

                display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0; background: var(--panel);
                border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px rgba(20, 30, 40, 0.15); }

<body>
<header>
  <div class="topbar">
    <h1><button id="homebutton" title="Home: what the tool is for, and its views">Annotation tool<span class="pencil"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(45 32 32)" stroke="#5a3b1c" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M25.6 4.6c2.1-1 10.6-1 12.7.1l.3 6.4H25.4z" fill="#d48a7e"/><path d="M25.4 11.1h13.2l.1 5.6H25.3z" fill="#b8bcc0"/><path d="M25.6 13.1h12.9M25.5 15h13" stroke="#8b9095" stroke-width="1"/><path d="M25.3 16.7h13.4l-.2 27.6H25.5z" fill="#d9a23f"/><path d="M29.8 17l.2 27M34.2 17l-.1 27" stroke-width="1.1"/><path d="M30.9 17.4l.1 26.4" stroke="#f0c86e" stroke-width="1.4"/><path d="M25.5 44.3h13l-6.4 12.9z" fill="#ead2a3"/><path d="M28.2 47.6c1.4.9 2.4 2.6 2.6 4.4M35.6 47.4c-1.1 1.1-1.7 2.8-1.8 4.6" stroke="#b58a52" stroke-width="0.9"/><path d="M30.1 53.4h4l-2 3.8z" fill="#3a3632" stroke="#2b2724"/></g></svg></span></button></h1>
    <nav class="tabs" aria-label="Views">
      <span class="tab" id="tab-batch" title="Correct a model's drafted triples into ground truth triples, record by record: choose a batch"><select id="batch" aria-label="Ground truth: choose a batch"></select></span>
      <button class="tab" id="mapping" title="annotations/component_class_mapping.csv: after step 070 has run">Translation table</button>
      <button class="tab" id="partial" title="annotations/partial_pair_reviews.csv: after step 070 has run">Partial pairs</button>
      <button class="tab" id="additions" title="annotations/schema_additions.txt: schema entries a person adds to the current schema">Schema additions</button>
    </nav>
    <span id="status"></span>
  </div>
</header>
<ul id="warnings"></ul>
<div id="intro" hidden></div>
<main>
  <nav id="records" aria-label="Records"></nav>
  <div id="record"></div>
</main>
<div id="help" hidden></div>

<script>
"use strict";
// The whole state: the open batch, as the server sent it, edited in place.
let batch = null, current = 0, activeRow = null, saveTimer = null, saving = false, dirty = false;
// One at a time (or all at once), remembered on this computer: the record's describes triple, then its ground truth
// triples; tripleAt: which of those is shown (0 = the describes triple, if the record has one).
let oneAtATime = (() => { try { return localStorage.getItem("oneAtATime") !== "0"; } catch (_) { return true; } })();
let tripleAt = 0;
let listHidden = (() => { try { return localStorage.getItem("recordsHidden") === "1"; } catch (_) { return false; } })();
function toggleList() {
  listHidden = !listHidden;
  try { localStorage.setItem("recordsHidden", listHidden ? "1" : "0"); } catch (_) {}
  show(current);
}
let shownRow = null;                       // the row shown (one at a time): it stays shown when the order changes
// The record's ground truth triples (row numbers) in the order of the record's text: by where each source text
// starts, then ends; ties, and those whose source text isn't found (or is empty), keep the file's order, the
// latter after all the others. The file keeps its own order.
const tripleRows = (rec) => {
  const at = (r) => { const s = rec.text && r.source_text ? findSpan(rec.text, r.source_text) : null;
                      return s || [Infinity, Infinity]; };
  return rec.rows.map((r, j) => [j, at(r)]).filter(([j]) => !isDescribes(rec.rows[j]))
    .sort((a, b) => (a[1][0] - b[1][0]) || (a[1][1] - b[1][1]) || (a[0] - b[0])).map(([j]) => j);
};
const stepRows = (rec) => rec.rows.filter(isDescribes).length
  ? [rec.rows.findIndex(isDescribes), ...tripleRows(rec)] : tripleRows(rec);

const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? "" : v);
  }
  const raw = RAW_TAGS.has(tag) || /\bfixed\b/.test((attrs && attrs["class"]) || "");
  for (const c of children.flat(Infinity)) {      // lists inside lists, at any depth
    if (c === null || c === undefined) continue;
    if (typeof c === "string" && !raw) node.append(...codeWords(c)); else node.append(c);
  }
  return node;
}
// Where text is shown as written (the record's text, a field's value, a list's options), nothing is reformatted.
const RAW_TAGS = new Set(["mark", "option", "select", "textarea", "code", "pre", "title", "script", "style"]);
// A command (py helpers/annotate.py --port 8051), a path or folder of the repository (annotations/ground_truth/,
// 060_extract/run.py), a file name (batch_000.csv), or a column or setting name (all_facts_extracted).
const CODE_WORDS = new RegExp([
  String.raw`\bpy [\w./-]+(?: --?\w+(?: [\w./<>*-]+)?)*`,
  String.raw`\b(?:annotations|outputs|docs|common|helpers|tests|\d{3}_[a-z_]+)/(?:[\w.<>*@-]+/?)*`,
  String.raw`\b\d{3}_[a-z]+(?:_[a-z]+)*\b`,
  String.raw`\b[\w<>*-]+\.(?:csv|txt|md|json|jsonl|py|log|html)\b`,
  String.raw`\b[a-z][a-z0-9]*(?:_[a-z0-9]+)+\b`].join("|"), "g");
function codeWords(s) {
  const out = [];
  let last = 0;
  for (const m of s.matchAll(CODE_WORDS)) {
    if (m.index > last) out.push(s.slice(last, m.index));
    out.push(el("code", {}, m[0]));
    last = m.index + m[0].length;
  }
  if (last < s.length) out.push(s.slice(last));
  return out;
}
async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
// The save status, short ("✓ Saved") when all is saved; the whole message (which file, when) on hover.
function status(text, kind) {
  const s = $("status");
  s.textContent = kind === "saved" && /^(Editing|Saved to) /.test(text) ? "✓ Saved" : text;
  s.title = text; s.className = kind || "";
}
// As the server decides (common/common_helpers/triples_io.is_describes): the subject class by
// loose match (only letters and digits count, so "Catalog_Entry" counts too); the predicate
// with case ignored, spaces, "_" and "-" equivalent, and punctuation at either end dropped.
const looseKey = (s) => (s || "").toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
const predicateKey = (s) => (s || "").toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "")
  .replace(/[\s_\-]+/g, " ").trim();
const isDescribes = (r) => looseKey(r.subject_class) === "catalogentry" && predicateKey(r.predicate) === "describes";
// A record's ground truth triples, filled in (its describes triple not counted).
const groundTruthCount = (rec) => rec.rows.filter((r) => !isDescribes(r) && r.subject && r.predicate && r.object).length;
const errorsIn = (rec) => rec.rows.reduce((n, r) => n + r.problems.filter(p => p.type === "error").length, 0);
const flagsIn = (rec) => rec.rows.reduce((n, r) => n + r.problems.filter(p => p.type === "flag").length, 0);

// The record's place in the batch, the batch's progress, and what in this record is left to fix or look at.
function infoOpen() {                    // folded away unless opened earlier on this computer
  try { return localStorage.getItem("recordInfoOpen") === "1"; } catch (_) { return false; }
}
function hintOpen() {                    // folded away unless opened earlier on this computer
  try { return localStorage.getItem("hintTextOpen") === "1"; } catch (_) { return false; }
}

function drawProgress() {
  const box = $("progress"), rec = batch && batch.records[current];
  if (!box || !rec) return;
  const finishedRecs = batch.records.filter((r) => r.finished);
  const total = finishedRecs.reduce((n, r) => n + groundTruthCount(r), 0);
  if ($("batchgt")) $("batchgt").textContent =
    `${total} ground truth triple${total === 1 ? "" : "s"} from ${finishedRecs.length} finished record${finishedRecs.length === 1 ? "" : "s"}`;
  for (const id of ["gtdt", "gtdd"]) if ($(id)) $(id).hidden = !rec.finished;
  if ($("gtdd")) $("gtdd").textContent = String(groundTruthCount(rec));
  const done = batch.records.filter((r) => r.finished).length, all = batch.records.length;
  const errors = errorsIn(rec), flags = flagsIn(rec);
  box.replaceChildren(...[                   // replaceChildren would write a null as the word "null"
    errors ? el("button", { class: "pill error jump", onclick: () => goToNext("error"),
                            title: "Go to the next ground truth triple with something to fix (after the last, back to the first)" },
                `${errors} to fix (✖)`) : null,
    flags ? el("button", { class: "pill flag jump", onclick: () => goToNext("flag"),
                           title: "Go to the next ground truth triple with something to look at (after the last, back to the first)" },
               `${flags} to look at (⚑)`) : null,
    !errors && !flags ? el("span", { class: "pill ok" }, "nothing to fix") : null].filter((x) => x !== null));
  const top = $("batchprogress");
  if (top) top.replaceChildren(
    el("div", { class: "batchline" }, el("strong", {}, `Record ${current + 1} of ${all}`), el("span", {}, `${done} of ${all} finished`)),
    el("div", { class: "segments", title: "One block per record: filled when finished; the record you're on is outlined" },
      batch.records.map((r, i) => el("span", { class: "seg" + (r.finished ? " done" : "") + (i === current ? " here" : ""),
                                              title: `Record ${i + 1}: ${r.finished ? "finished" : "not finished"}` }))));
}

// ---------------------------------------------------------------- batches
let BATCHES = [];
// The batch to go on with, in pool order: the first one with records left to finish, else the first drafted batch not opened
// yet, else the last one.
const nextBatch = () => {
  const upward = [...BATCHES].sort((a, b) => a.n - b.n);       // the server lists them newest first
  return upward.find((b) => b.ground_truth && b.finished < b.records) || upward.find((b) => !b.ground_truth)
      || upward[upward.length - 1] || null;
};
// The Ground truth dropdown: one entry per batch; `chosen` stays selected. Its prompt shows only while no batch is
// chosen: it isn't in the opened list.
function fillBatchList(data, chosen) {
  BATCHES = data.batches;
  const pick = $("batch");
  pick.replaceChildren(el("option", { value: "", disabled: true, selected: true, hidden: true }, "Ground truth: choose a batch"));
  for (const b of data.batches) {
    const what = b.ground_truth ? `${b.finished} of ${b.records} finished` : "not opened yet";
    pick.append(el("option", { value: b.n, "data-new": b.ground_truth ? null : "" }, `Batch ${b.n} (${what})`));
  }
  if (chosen !== undefined) pick.value = String(chosen);
}
async function loadBatches() {
  const data = await api("/api/batches");
  fillBatchList(data);
  const pick = $("batch");
  const warnings = [...data.problems];
  if (!data.records_found) warnings.unshift("outputs/intermediate_results/020_clean/records.jsonl wasn't found, so records' texts can't be shown or checked. Run py 010_harvest/run.py and py 020_clean/run.py, then restart the tool (py helpers/annotate.py).");
  $("warnings").replaceChildren(...warnings.map(w => el("li", {}, w)));
  drawGaps(data.gaps);
  const wanted = new URLSearchParams(location.hash.slice(1));
  if (wanted.has("m")) { await openMapping(); return; }
  if (wanted.has("p")) { await openPartial(); return; }
  if (wanted.has("a")) { await openAdditions(); return; }
  if (wanted.has("v")) { await openVocab(); return; }
  if (wanted.has("b") && [...pick.options].some(o => o.value === wanted.get("b"))) {
    pick.value = wanted.get("b");
    await openBatch(+wanted.get("b"), +(wanted.get("r") || 0), +(wanted.get("t") || 0));
  } else {
    showHome();                                 // no view named in the address
  }
}
async function openBatch(n, at, step = 0) {
  await flush();
  mapping = null; partial = null; additions = null; vocab = null;
  status("Opening…");
  batch = await api(`/api/batch?n=${n}`);
  tripleAt = step;                         // a newly opened batch: the row the address names, else the record's first
  status(`Editing annotations/ground_truth/${batch.file}`, "saved");
  current = Math.min(at || 0, Math.max(batch.records.length - 1, 0));   // so show() keeps tripleAt
  show(current);
  const opt = [...$("batch").options].find(o => o.value === String(n));
  if (opt && opt.hasAttribute("data-new")) fillBatchList(await api("/api/batches"), n);   // it now has its copy
}

// Three buttons under a ground truth triple, one per component class: each shows the ground truth schema's patterns
// with that component class in the same place (its subject class as subject class, its predicate as predicate, its
// object class as object class); this triple's own pattern in bold.
// The patterns are the saved ground truth's, so they change only once an edit is saved.
function patternButtons(r, j) {
  const list = el("div", { class: "patlist", hidden: true });
  let open = null;
  const toggle = (place, label) => {
    if (open === place) { open = null; list.hidden = true; return; }
    open = place; list.hidden = false;
    const want = looseKey(r[place]), own = ["subject_class", "predicate", "object_class"].map(c => looseKey(r[c]));
    const i = { subject_class: 0, predicate: 1, object_class: 2 }[place];
    const found = (batch.patterns || []).filter(p => looseKey(p[i]) === want);
    list.replaceChildren(
      el("div", { class: "meta" }, `Patterns with ${label}: ${found.length}`),
      found.length
        ? el("ul", {}, found.map(p => el("li", {},
            el(p.every((x, k) => looseKey(x) === own[k]) ? "b" : "span", {}, `${p[0]} ${p[1]} ${p[2]}`))))
        : el("p", { class: "empty" }, `None yet: no pattern of the ground truth schema has ${label}.`));
  };
  const label = (place, what) => `${r[place] || "(empty)"} as ${what}`;
  const places = [["subject_class", "subject class"], ["predicate", "predicate"], ["object_class", "object class"]];
  const buttons = places.map(([place, what]) => el("button", { class: "patbtn",
    onclick: () => { setActive(j); refresh(); toggle(place, label(place, what)); } }));
  // the buttons name the triple's component classes as they are now: redrawn when one is typed or picked
  const refresh = () => places.forEach(([place, what], k) => {
    buttons[k].textContent = label(place, what); buttons[k].disabled = !looseKey(r[place]);
    buttons[k].title = `The patterns with ${label(place, what)}`;
    if (open === place) { open = null; if (buttons[k].disabled) list.hidden = true; else toggle(place, label(place, what)); }
  });
  refresh();
  const bar = el("div", { class: "patterns", onpointerenter: refresh }, el("span", { class: "meta" }, "Patterns: "), buttons, list);
  bar.refresh = refresh;
  return bar;
}

// ---------------------------------------------------------------- highlighting
// Finds a source text in the text, for highlighting only: the letters and digits must
// match, in order, and anything else between them may differ or be missing ("500m" for
// "500 m", as evening out also allows). That is more forgiving
// than the server's check (evened out, as docs/terminology.md defines it),
// so a highlighted source text can still get the server's ✖ "isn't in the record's text".
function findSpan(text, source) {
  const words = (source || "").match(/\p{L}+|\p{N}+/gu);
  if (!words) return null;
  const esc = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const m = new RegExp(esc.join("[^\\p{L}\\p{N}]*"), "iu").exec(text);
  return m ? [m.index, m.index + m[0].length] : null;
}
function drawText() {
  const box = $("text"), rec = batch && batch.records[current];
  if (!box || !rec || rec.text === null) return;
  // Every ground truth triple whose source text covers each character: shared and overlapping passages too.
  const owners = Array.from({ length: rec.text.length }, () => []);
  rec.rows.forEach((r, j) => {
    if (isDescribes(r)) return;
    const span = findSpan(rec.text, r.source_text);
    if (!span) return;
    for (let k = span[0]; k < span[1]; k++) owners[k].push(j);
  });
  const number = (j) => tripleRows(rec).indexOf(j) + 1;    // as in its heading: in the text's order
  const parts = [];
  for (let k = 0; k < rec.text.length;) {
    const key = owners[k].join(",");
    let end = k + 1;
    while (end < rec.text.length && owners[end].join(",") === key) end++;
    const piece = rec.text.slice(k, end), mine = owners[k];
    if (!mine.length) { parts.push(piece); k = end; continue; }
    const names = mine.map(number);
    const title = mine.length === 1 ? `Go to ground truth triple ${names[0]}`
      : `Shared by ground truth triples ${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}: each click goes to the next`;
    parts.push(el("mark", {
      class: [mine.includes(activeRow) ? "active" : "", mine.length > 1 ? "shared" : ""].join(" ").trim(), title,
      // The next of them after the one you're on (the first, if you're on none of them).
      onclick: () => { const i = mine.indexOf(activeRow); goToRow(mine[(i + 1) % mine.length]); } }, piece));
    k = end;
  }
  box.replaceChildren(...parts);
}

    options.push(el("option", { value: r.component_class_in_gtt, selected: true },
                    `⚠ ${r.component_class_in_gtt} (not in the ground truth schema: pick another)`));
  for (const v of vocab) options.push(el("option", { value: v.component_class, selected: v.component_class === r.component_class_in_gtt }, v.component_class));
  const chosen = vocab.find(v => v.component_class === r.component_class_in_gtt);
  // Other component classes of the current schema already translated to the same component_class:
  // evaluation won't be able to tell them apart.
  const sharing = r.in_crt && r.component_class_in_gtt !== mapping.none
    ? mapping.rows.filter(o => o !== r && o.in_crt && o.kind === r.kind && o.component_class_in_gtt === r.component_class_in_gtt)
                  .map(o => o.component_class_from_past_or_crt_schema) : [];
  const same = r.checked === "same component class";
  // A (none) row whose component class the ground truth schema now has: probably out of date.
  const nowExists = r.component_class_in_gtt === mapping.none && r.same_component_class_in_gtt ? { component_class: r.same_component_class_in_gtt } : null;
  // a row accepted automatically (same spelling) can be changed; changing it makes it an ordinary row to check
  const update = (key, value) => { r[key] = value; if (same && key !== "checked") r.checked = "no"; mapChanged(); drawMapping(); };

  return el("section", { class: "card maprow" + (toCheck(r) || r.repeated ? " todo" : "") },
    el("h3", {}, el("span", { class: "kind" }, r.kind), r.component_class_from_past_or_crt_schema,
       el("span", { class: "meta" }, isCurrent(r) ? "  (current schema)" : "  (past schema only)"),
       r.repeated ? el("span", { class: "meta" }, `  (line ${r._line}, repeated) `) : null,
       r.repeated ? el("button", { onclick: () => deleteMappingRow(r) }, "Delete this row") : null),
    r.repeated ? el("div", { class: "meta" }, "Stored definition (when this row was checked): ",
       r.definition_from_past_or_crt_schema || el("span", { class: "empty" }, "none")) : null,
    el("div", { class: "meta" }, "In the current schema: ",
       r.crt_definition ? r.crt_definition : el("span", { class: "empty" }, "no definition")),
    r.stale ? el("div", { class: "problems" }, el("li", { class: "flag" },
       "⚑ This row was checked when the component class was defined as: “" +
       (r.definition_from_past_or_crt_schema || "(no definition)") +
       "”. The meaning of " + r.component_class_from_past_or_crt_schema + " may have changed since: check this translation again.")) : null,
    r.stale_gtt ? el("div", { class: "problems" }, el("li", { class: "flag" },
       "⚑ This row was checked when the ground truth schema defined " + r.component_class_in_gtt +
       " (ground truth schema) as: “" + (r.definition_in_gtt || "(no definition)") +
       "”. The ground truth schema now defines " + r.component_class_in_gtt + " as shown below, under “In the ground truth schema”: check this translation again.")) : null,
    el("div", { class: "means" },
      el("label", { class: "meta", for: `m${i}` }, "Means, in the ground truth schema:"),
      el("select", { id: `m${i}`, onchange: (e) => update("component_class_in_gtt", e.target.value) }, options)),
    r.component_class_in_gtt === mapping.none && r.suggested_gtt && !nowExists ? el("ul", { class: "problems" },
      el("li", { class: "flag" }, `⚑ The model suggests ${r.component_class_from_past_or_crt_schema} (current schema) may ` +
        `mean ${r.suggested_gtt} (ground truth schema), a component class the ground truth schema gained since this row was ` +
        `checked. Pick ${r.suggested_gtt} if that is right; otherwise keep (none).`)) : null,
    nowExists ? el("ul", { class: "problems" }, el("li", { class: "flag" },
      `⚑ ${nowExists.component_class} (ground truth schema) now exists: should ${r.component_class_from_past_or_crt_schema} ` +
      `(current schema) translate to ${nowExists.component_class}? Keep (none) only if the two mean different things.`)) : null,
    sharing.length ? el("ul", { class: "problems" }, el("li", { class: "flag" },
      `⚑ ${[r.component_class_from_past_or_crt_schema, ...sharing].map(n => `${n} (current schema)`).join(" and ")} ` +
      `both translate to ${r.component_class_in_gtt} (ground truth schema), so step 070 can't tell these component classes apart: ` +
      `extraction loses nothing by mixing them up. That is fine if your ground truth doesn't distinguish them; if your ground ` +
      `truth should distinguish them, annotate with separate component classes in the ground truth.`)) : null,
    chosen ? el("div", { class: "meta" }, "In the ground truth schema: ",
                chosen.definition ? chosen.definition
                  : el("span", { class: "empty" }, "coined while annotating; no definition yet (add one to the ground truth schema)")) : null,
    r.kind === "predicate" ? el("label", { class: "meta", style: "display:block;margin-top:6px" },
      el("input", { type: "checkbox", disabled: r.component_class_in_gtt === mapping.none,
                    checked: r.swap_subject_and_object === "yes",
                    onchange: (e) => update("swap_subject_and_object", e.target.checked ? "yes" : "no") }),
      " Swap subject and object (the ground truth's predicate states the relation the other way round)") : null,
    exampleLine(r),
    el("div", { class: "bar" }, same && !r.stale && !r.stale_gtt
      ? el("span", { class: "meta" }, "Accepted automatically, because the component class is spelled the same in the current " +
           "schema and in the ground truth schema. Compare the two definitions above (In the current schema, In the ground truth " +
           "schema); if the two mean different things, pick the right translation.")
      : el("label", { class: "finished" },
          el("input", { type: "checkbox", checked: r.checked === "yes" && !r.stale && !r.stale_gtt,
                        onchange: (e) => { r.stale = false; r.stale_gtt = false;
                                           update("checked", e.target.checked ? "yes" : "no"); } }),
          "Checked: this translation is right")));
}

async function deleteMappingRow(r) {
  if (!confirm(`Delete line ${r._line} (${r.kind} ${r.component_class_from_past_or_crt_schema} --> ${r.component_class_in_gtt})?`)) return;
  await flush();
  try {
    await api("/api/mapping/delete", { line: r._line, kind: r.kind, component_class: r.component_class_from_past_or_crt_schema });
    await openMapping();
    status(`Deleted line ${r._line} of ${mapping.file}`, "saved");
  } catch (e) { fail(e); }
}

function mapChanged() {
  mapDirty = true;
  status("Unsaved changes…");
  clearTimeout(mapTimer);
  mapTimer = setTimeout(saveMapping, 600);
}
async function saveMapping() {
  clearTimeout(mapTimer);
  if (!mapping || !mapDirty) return;
  if (mapSaving) { mapTimer = setTimeout(saveMapping, 300); return; }
  mapSaving = true; mapDirty = false;
  status("Saving…");
  try {
    await api("/api/mapping/save", { rows: mapping.rows.map(r => ({ kind: r.kind,
      component_class_from_past_or_crt_schema: r.component_class_from_past_or_crt_schema, component_class_in_gtt: r.component_class_in_gtt,
      swap_subject_and_object: r.swap_subject_and_object, checked: r.checked, keep_definition: !!(r.stale || r.stale_gtt) })) });
    status(`Saved to ${mapping.file} at ${new Date().toLocaleTimeString()}`, "saved");
  } catch (e) {
    mapDirty = true;
    status(`NOT SAVED: ${e.message}`, "failed");
  } finally { mapSaving = false; }
}

// ---------------------------------------------------------------- partial pairs
// Evaluation's partial pairs of tuning records (one subject or object only
// contained in the other), to mark "same fact" or "not the same fact".
let partial = null, onlyUnreviewed = true;

async function openPartial() {
  await flush();
  batch = null; mapping = null; additions = null; vocab = null;
  document.body.classList.remove("norecords");   // other views use the left column
  chrome("partial");
  $("batch").value = "";
  status("Opening…");
  partial = await api("/api/partial");
  setHash("p");
  showIntro();
  if (!partial.found) {                    // nothing to review yet: still the side panel, with its Help
    $("records").replaceChildren(el("div", { style: "padding:6px 8px" },
      el("div", { class: "panelhead" }, el("h3", {}, "Partial pairs"), toolsMenu())));
    $("record").replaceChildren(el("section", { class: "card" }, el("p", { class: "empty" },
      "outputs/intermediate_results/070_evaluate/compared_triples.csv wasn't found, so there are no partial pairs to review. Run py 070_evaluate/run.py, then open Partial pairs again.")));
    status("");
    return;
  }
  onlyUnreviewed = partial.items.some(i => !i.verdict);
  status(`Saving verdicts to ${partial.file}`, "saved");
  drawPartial();
}

function drawPartial() {
  const left = partial.items.filter(i => !i.verdict).length;
  $("records").replaceChildren(el("div", { style: "padding:6px 8px" },
    el("div", { class: "panelhead" }, el("h3", {}, "Partial pairs"), toolsMenu()),
    el("p", { class: "meta" }, `${partial.items.length} partial pair(s) of tuning records; ${left} not reviewed yet.`),
    el("p", { class: "meta" }, "A partial pair is an occurrence (a translated extracted triple of the record) and a ground " +
      "truth triple whose predicates agree, and whose subject instances, and whose object instances, are each the " +
      "same or one contained in the other as whole words. Such a " +
      "pairing can be wrong (MODIS vs MODIS Terra). A pair you mark “not the same fact” is never paired again: step 070 " +
      "then pairs each of the two with another partner if it can; otherwise the ground truth triple is ground truth " +
      "only, and the occurrence is extracted only."),
    el("label", { class: "meta" },
      el("input", { type: "checkbox", checked: onlyUnreviewed,
                    onchange: (e) => { onlyUnreviewed = e.target.checked; drawPartial(); } }),
      " Show only pairs not reviewed yet")));
  const shown = partial.items.filter(i => !onlyUnreviewed || !i.verdict);
  $("record").replaceChildren(...(shown.length ? shown.map(partialCard) : [el("section", { class: "card" },
    el("p", { class: "empty" }, partial.items.length ? "Every pair is reviewed." :
      "No partial pairs in step 070's last run."))]));
}

function partialCard(i) {
  const triple = (who, s, p, o) => el("div", { class: "example" }, `${who}:  ${s}  ${p}  ${o}`);
  const pick = async (verdict) => {
    try {
      await api("/api/partial/review", { ...i, verdict });
      i.verdict = verdict || null;
      status(`Saved to ${partial.file} at ${new Date().toLocaleTimeString()}`, "saved");
      drawPartial();
    } catch (e) { fail(e); }
  };
  return el("section", { class: "card maprow" + (i.verdict ? "" : " todo") },
    el("h3", {}, `#${i.position ?? "?"} `, el("span", { class: "part tuning" }, "tuning"), " ", i.title),
    triple("Ground truth (ground truth schema)", i.ground_truth_subject, i.ground_truth_predicate,
           i.ground_truth_object),
    triple("Extracted (translated into the ground truth schema)", i.translated_subject,
           i.translated_predicate, i.translated_object),
    i.text ? el("details", {}, el("summary", { class: "meta" }, "The record's text"),
                el("div", { class: "meta", style: "white-space:pre-wrap" }, i.text)) : null,
    el("div", { class: "bar" },
      el("button", { onclick: () => pick("same fact"), class: i.verdict === "same fact" ? "current" : "" },
         (i.verdict === "same fact" ? "✓ " : "") + "Same fact"),
      el("button", { onclick: () => pick("not the same fact"),
                     class: i.verdict === "not the same fact" ? "current" : "" },
         (i.verdict === "not the same fact" ? "✓ " : "") + "Not the same fact"),
      i.verdict ? el("button", { onclick: () => pick("") }, "Take back") : null,
      el("span", { class: "meta" }, i.verdict ? `Your verdict: ${i.verdict}` : "Not reviewed yet")));
}

// ---------------------------------------------------------------- schema additions
// annotations/schema_additions.txt, through a form. A source naming the ground
// truth must say "tuning" and name tuning records only (checked here and by
// extraction); the form keeps the file's layout right.
let additions = null, editing = null;

async function openAdditions(prefill) {

async function saveAdditions(entries) {
  try {
    await api("/api/additions/save", { entries });

    editing = null;
    status(`Saved to ${additions.file} at ${new Date().toLocaleTimeString()}`, "saved");
    drawAdditions();
  } catch (e) { status(`NOT SAVED: ${e.message}`, "failed"); }

function drawAdditions() {
  const left = additions.new_component_classes.filter(n => !n.added).length;
  $("records").replaceChildren(el("div", { style: "padding:6px 8px" },
    el("div", { class: "panelhead" }, el("h3", {}, "Schema additions"), toolsMenu()),
    el("p", { class: "meta" }, `${additions.entries.length} entr(ies) in ${additions.file}. Step 060 (extraction) adds ` +
      "these entries to the induced schema (or to another schema it is given): together, the current schema."),
    el("p", { class: "meta" }, "Every entity class and predicate added here needs a one-line definition, and every entry " +
      "needs a source: where the idea came from. An entry learned from the ground truth must come from tuning records " +
      "only, named by pool position: “ground truth tuning #12, #15”. To add a pattern for a " +
      "predicate the schema already has, add an entry of type pattern."),
    el("button", { onclick: () => { editing = { entry_type: "entity class", component_class: "", definition: "", source: "",
                                                  patterns: [] }; drawAdditions(); } }, "+ Add an entry")));
  const cards = [];
  if (additions.unread.length)
    cards.push(el("section", { class: "card" }, el("ul", { class: "problems" }, el("li", { class: "error" },
      `✖ ${additions.file} has line(s) the tool can't read: ${additions.unread.join("; ")}. ` +
      "Fix those lines by hand in the file first; until then the tool won't save the file, so nothing in it is lost."))));
  if (editing) cards.push(additionForm(editing));
  cards.push(el("section", { class: "card" }, el("h3", {}, "In the file"),
    additions.entries.length ? additions.entries.map((e, i) => el("div", { class: "row" },
      e.entry_type === "pattern"
        ? el("div", {}, el("span", { class: "kind" }, "pattern"), el("b", {}, entryName(e)), " (additions file)")
        : el("div", {}, el("span", { class: "kind" }, e.entry_type), el("b", {}, e.component_class), " (additions file): ", e.definition),
      e.patterns && e.patterns.length ? el("div", { class: "meta" }, "Patterns: " + e.patterns.map(p => `${p[0]} -> ${p[1]}`).join("; ")) : null,
      el("div", { class: "meta" }, `source: ${e.source || "(none)"}`),
      el("div", { class: "bar" },
        el("button", { onclick: () => { editing = { ...e, patterns: (e.patterns || []).map(p => [...p]), _index: i }; drawAdditions(); } }, "Edit"),
        el("button", { onclick: () => { if (confirm(`Delete ${entryName(e)} from ${additions.file}?`))
                                          saveAdditions(additions.entries.filter((_, j) => j !== i)); } }, "Delete"))))
      : el("p", { class: "empty" }, "No entries yet.")));
  cards.push(el("section", { class: "card" }, el("h3", {}, "Component classes outside the schema (step 060's last run)"),
    additions.counted_over
      ? el("div", { class: "explain" },
          el("p", {}, "While extracting, the model sometimes uses an entity class or predicate that the current schema " +
            "doesn't have, and step 060 removes those extracted triples. Each one it used is listed here, counted over " +
            `${additions.counted_over}. Held-out records are never counted, since they must not shape the schema, so any ` +
            "one listed may be added."),
          el("p", {}, "If one names a real type of thing or relation that the schema lacks, " +
            "press Add: the form above opens, filled in, for you to write its definition. The next run of step 060 can then " +
            "extract it. If it doesn't (a vague or wrong one), leave it: nothing changes until you add it. " +
            `${left} not added yet.`),
          el("p", { class: "meta" }, "Patterns aren't listed: step 060 keeps an extracted triple whose pattern the schema " +
            "lacks (it only flags it), so a missing pattern costs nothing. To add one anyway, use + Add an entry, Pattern."))
      : el("p", { class: "meta" }, "outputs/intermediate_results/060_extract/extracted_triples_details.json wasn't found, so the component classes outside the schema from step 060's last run can't be listed. Run py 060_extract/run.py, then open Schema additions again."),
    additions.new_component_classes.map(n => el("div", { class: "row" },
      el("span", { class: "kind" }, n.kind), el("b", {}, n.component_class), ` (used by the model; not in the current schema) · ` +
      `${n.records} record(s) · source: ${n.source}`, " ",
      n.added ? el("span", { class: "meta" }, "added") :
        el("button", { onclick: () => { editing = { entry_type: n.kind, component_class: n.component_class, definition: "", source: n.source,
                                                    patterns: [] }; drawAdditions(); window.scrollTo(0, 0); } }, "Add")))));
  $("record").replaceChildren(...cards);
}

// An entry's name for messages: a component class, or a pattern written as "Subject PREDICATE Object".
const entryName = (e) => e.entry_type === "pattern" ? [e.subject_class, e.predicate, e.object_class].join(" ") : e.component_class;

function additionForm(e) {
  const problem = el("ul", { class: "problems" });
  const check = async () => {
    const r = await api("/api/additions/check", e);
    problem.replaceChildren(...(r.problem ? [el("li", { class: "error" }, "✖ " + r.problem)] : []));
  };
  const input = (key, label, attrs) => el("label", { style: "display:block;margin-top:6px" }, el("span", { class: "meta" }, label),
    el("input", { value: e[key] || "", style: "width:100%", ...attrs,
                  oninput: (ev) => { e[key] = ev.target.value; check(); } }));
  const patterns = el("label", { style: "display:block;margin-top:6px" },
    el("span", { class: "meta" }, "Patterns: the pairs of entity classes it joins, each written Subject -> Object, separated by ; (e.g. Instrument -> Spacecraft; Instrument -> Mission)"),
    el("input", { value: (e.patterns || []).map(p => `${p[0]} -> ${p[1]}`).join("; "), style: "width:100%",
                  oninput: (ev) => { e.patterns = ev.target.value.split(";").map(x => x.trim()).filter(Boolean)
                                       .map(x => x.split("->").map(y => y.trim())); check(); } }));
  const save = () => {
    const entries = additions.entries.map(x => ({ ...x }));
    const clean = e.entry_type === "pattern"
      ? { entry_type: "pattern", subject_class: e.subject_class, predicate: e.predicate, object_class: e.object_class, source: e.source }
      : { entry_type: e.entry_type, component_class: e.component_class, definition: e.definition, source: e.source, patterns: e.patterns || [] };
    if (e._index !== undefined) entries[e._index] = clean; else entries.push(clean);
    saveAdditions(entries);
  };
  setTimeout(check, 0);
  return el("section", { class: "card maprow todo" },
    el("h3", {}, e._index !== undefined ? `Edit ${entryName(e)}` : "Add an entry"),
    el("div", { class: "typepick" },
      [["entity class", "Entity class"], ["predicate", "Predicate"], ["pattern", "Pattern"]].map(([k, words]) =>
        el("button", { class: e.entry_type === k ? "primary" : "", onclick: () => { e.entry_type = k; drawAdditions(); } }, words))),
    el("p", { class: "meta" }, {
      "entity class": "A new type of thing that extraction may use as a subject class or an object class.",
      "predicate": "A new relation between two things, with the pairs of entity classes it joins (its patterns).",
      "pattern": "A new pair of entity classes for a predicate that the schema (or this file) already has." }[e.entry_type]),
    ...({
      "entity class": [input("component_class", "Entity class: one word in CamelCase (e.g. SpaceMission)"),
                       input("definition", "Definition: one line saying what type of thing it is (e.g. a named spaceflight effort)")],
      "predicate": [input("component_class", "Predicate: one word in UPPER_SNAKE_CASE (e.g. PART_OF_MISSION)"),
                    input("definition", "Definition: one line, read from subject to object (e.g. was carried out as part of)"),
                    patterns],
      "pattern": [input("subject_class", "Subject class: one word (e.g. Instrument)"),
                  input("predicate", "Predicate: one the schema has, or one added in this file (e.g. ABOARD)"),
                  input("object_class", "Object class: one word (e.g. Spacecraft)")] }[e.entry_type]),
    input("source", "Source: where the idea came from (e.g. mentor; NASA missions A-to-Z; ground truth tuning #12)"),
    problem,
    el("div", { class: "bar" }, el("button", { onclick: save }, "Save"),
       el("button", { onclick: () => { editing = null; drawAdditions(); } }, "Cancel")));
}

// ---------------------------------------------------------------- the ground truth schema
// Every entity class and predicate of the ground truth schema: change a definition (in the
// ground truth schema), or rename one, or merge it into another, everywhere at once. A rename or
// merge is shown first (every file and what changes in it) and done only after "Make these changes".
let vocab = null, vocabPlan = null;

async function openVocab() {
  await flush();
  batch = null; mapping = null; partial = null; additions = null;
  document.body.classList.remove("norecords");   // other views use the left column
  chrome("vocab");
  $("batch").value = "";
  status("Opening…");
  vocab = await api("/api/vocab");
  vocabPlan = null;
  setHash("v");
  showIntro();
  status(`Ground truth schema (definitions in ${vocab.file})`, "saved");
  drawVocab();
}

async function planVocab(kind, old, input) {
  const name = input.value.trim();
  if (!name) { status("Type the new component class first (or an existing one, to merge into it).", "failed"); return; }
  try {
    vocabPlan = await api("/api/vocab/plan", { kind, old, new: name });
    drawVocab();
    window.scrollTo(0, 0);
  } catch (e) { fail(e); }
}

async function applyVocab() {
  try {
    const done = await api("/api/vocab/apply", { kind: vocabPlan.kind, old: vocabPlan.old, new: vocabPlan.new });
    vocab = await api("/api/vocab");
    vocabPlan = null;
    status(`${done.merge ? "Merged" : "Renamed"} ${done.old} → ${done.new} (${done.kind}) at ${new Date().toLocaleTimeString()}. Commit the changed files.`, "saved");
    drawVocab();
    drawGaps(await api("/api/gaps"));                // the count on the Ground truth schema button, and its list
  } catch (e) { fail(e); }
}

async function defineVocab(kind, name, input) {
  try {
    const done = await api("/api/vocab/define", { kind, component_class: name, definition: input.value });
    vocab = await api("/api/vocab");
    status(`Saved the definition of ${name} at ${new Date().toLocaleTimeString()}` +
           (done.stale.length ? `. ${done.stale.length} row(s) of the translation table now need checking again: ${done.stale.join(", ")}.` : "."),
           "saved");
    drawVocab();
  } catch (e) { fail(e); }
}

function planCard() {
  const p = vocabPlan;
  return el("section", { class: "card todo" },
    el("h3", {}, `${p.merge ? "Merge" : "Rename"} ${p.old} → ${p.new} (${p.kind})`),
    el("p", { class: "meta" }, p.merge
      ? `${p.new} is already in the ground truth schema, so ${p.old} is merged into ${p.new}: every use of ${p.old} becomes ${p.new}.`
      : `${p.old} is renamed ${p.new} everywhere.`),
    el("p", {}, "What would change (nothing has changed yet):"),
    el("ul", {}, p.changes.map(c => el("li", {}, el("code", {}, c.file), ": ", c.what))),
    p.notes.length ? el("ul", { class: "problems" }, p.notes.map(n => el("li", { class: "flag" }, "⚑ " + n))) : null,
    el("div", { class: "bar" },
      el("button", { onclick: applyVocab }, "Make these changes"), " ",
      el("button", { onclick: () => { vocabPlan = null; drawVocab(); } }, "Cancel")));
}

function vocabEntry(kind, v) {
  const def = el("input", { value: v.definition, style: "width:100%", "aria-label": `definition of ${v.component_class}`,
                            placeholder: "one-line definition" });
  const rename = el("input", { placeholder: "new component class, or an existing one to merge into", style: "width:60%",
                               "aria-label": `rename ${v.component_class}` });
  return el("div", { class: "row" },
    el("div", {}, el("span", { class: "kind" }, kind), el("b", {}, v.component_class),
       el("span", { class: "meta" }, `  ${v.in_hand ? "in the ground truth schema" : "coined while annotating, not in the ground truth schema yet"}` +
         ` · used ${v.uses} time(s) in the ground truth` + (v.files.length ? ` (${v.files.join(", ")})` : "") +
         (v.translated_from.length ? ` · the translation table translates ${v.translated_from.join(", ")} (current or past schema) into ${v.component_class}` : ""))),
    el("div", { class: "bar" }, def, " ",
       v.in_hand
         ? el("button", { onclick: () => defineVocab(kind, v.component_class, def) }, "Save definition")
         : el("button", { onclick: async () => {
             try { await api("/api/hand/add", { entry_type: kind, component_class: v.component_class, definition: def.value });
                   vocab = await api("/api/vocab"); status(`Added ${v.component_class} to the ground truth schema`, "saved"); drawVocab();
             } catch (e) { fail(e); } } }, "Add to the ground truth schema")),
    el("div", { class: "bar" }, rename, " ",
       el("button", { onclick: () => planVocab(kind, v.component_class, rename) }, "Rename or merge…")));
}

function drawVocab() {
  const count = (k) => vocab.vocabulary[k].length;
  $("records").replaceChildren(el("div", { style: "padding:6px 8px" },
    el("div", { class: "panelhead" }, el("h3", {}, "Ground truth schema"), toolsMenu()),
    el("p", { class: "meta" }, `${count("entity class")} entity class(es) and ${count("predicate")} predicate(s): every one ` +
      "in the ground truth schema, plus any the ground truth uses that it doesn't have yet (coined while annotating: " +
      "add each, or fix the typo, before step 070 runs)."),
    el("p", { class: "meta" }, "Changing a definition makes the translation table's rows that translate to that " +
      "component class need checking again. Renaming or merging changes every file that uses the component class, after " +
      "first showing you every change the rename or merge would make.")));
  const cards = [];
  if (vocabPlan) cards.push(planCard());
  for (const kind of ["entity class", "predicate"])
    cards.push(el("section", { class: "card" }, el("h3", {}, kind === "entity class" ? "Entity classes" : "Predicates"),
      vocab.vocabulary[kind].map(v => vocabEntry(kind, v))));
  $("record").replaceChildren(...cards);
}

function currentView() {
  return vocab ? "vocab" : additions ? "additions" : partial ? "partial" : mapping ? "mapping" : "batch";
}

// Each term's definition (docs/terminology.md, read by the server), for the tooltip of a link to a term.
let TERMS = {};
api("/api/terms").then((t) => { TERMS = t; }).catch(() => {});

function joinPath(base, rel) {           // a link's target, from the folder of the document it is in
  const parts = base.split("/").slice(0, -1);
  for (const seg of rel.split("/")) {
    if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg);
  }
  return parts.join("/");
}
function termOf(words) {                 // "classes" -> "class": a link's words as a term of docs/terminology.md
  const w = words.replace(/<[^>]+>|`/g, "").trim().toLowerCase();
  return TERMS[w] !== undefined ? w : [w.replace(/es$/, ""), w.replace(/s$/, "")].find((x) => TERMS[x] !== undefined);
}
function linkHtml(words, target, base) {
  const esc = (s) => s.replace(/"/g, "&quot;");
  if (/^https?:/.test(target)) return `<a href="${esc(target)}" target="_blank" rel="noopener">${words}</a>`;
  const [file, anchor] = target.split("#");
  const path = file ? joinPath(base || "", file) : base;
  const at = anchor ? ` data-anchor="${esc(anchor)}"` : "";
  if (/(^|\/)terminology\.md$/.test(path || "")) {
    const term = termOf(words);
    const tip = term ? `${term}: ${TERMS[term]}` : "a term of docs/terminology.md";
    return `<span class="ref term" data-doc="${esc(path)}"${at} title="${esc(tip)}">${words}</span>`;
  }
  if (/\.md$/.test(path || "")) return `<span class="ref doclink" data-doc="${esc(path)}"${at} title="Open ${esc(path)}">${words}</span>`;
  return `<span class="ref" title="${esc(path || target)}">${words}</span>`;
}

function inline(text, base) {            // [links](…), `code`, **bold**, *names* (not italic), on escaped text
  const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/\[([^\[\]]+)\]\(([^()\s]+)\)/g, (m, words, target) => linkHtml(words, target, base))
            .replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
            .replace(/\*([^*]+)\*/g, '<span class="name">$1</span>');
}

// A heading's anchor, as GitHub makes it: lowercased, punctuation dropped, each space a hyphen ("3. Schemas" ->
// "3-schemas"), so a link's #section finds its heading here too.
function slug(text) {
  return text.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/[`*]/g, "").toLowerCase()
             .replace(/[^\p{L}\p{N} _-]/gu, "").replace(/ /g, "-");
}

function markdown(md, base) {            // headings, paragraphs, lists, code blocks: enough for the README and guidelines
  const out = [];
  let list = null, code = null, ordered = false;
  for (const line of md.split("\n")) {
    if (line.startsWith("```")) {
      if (code === null) code = []; else { out.push(`<pre>${code.join("\n").replace(/</g, "&lt;")}</pre>`); code = null; }
      continue;
    }
    if (code !== null) { code.push(line); continue; }
    const item = line.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    if (item) {                            // numbered lists keep their numbers ("rule 8")
      if (!list) { list = []; ordered = /\d/.test(item[1]); }
      list.push(`<li>${inline(item[2], base)}</li>`); continue;
    }
    if (list) { out.push(ordered ? `<ol>${list.join("")}</ol>` : `<ul>${list.join("")}</ul>`); list = null; }
    const head = line.match(/^(#{1,4})\s+(.*)$/);
    if (head) out.push(`<h3 id="${slug(head[2])}">${inline(head[2], base)}</h3>`);
    else if (line.trim()) out.push(`<p>${inline(line, base)}</p>`);
  }
  if (list) out.push(ordered ? `<ol>${list.join("")}</ol>` : `<ul>${list.join("")}</ul>`);
  return out.join("");
}

// ---------------------------------------------------------------- help
// The section of annotations/README.md about the view you're on (Help → How to use this view), or another document.
async function showHelp(path, anchor) {    // the README's section for this view, or another document, at a section
  try {
    const h = await api(path || `/api/help?view=${currentView()}`);
    const body = el("div", { class: "helpbody" });
    body.innerHTML = markdown(h.markdown, h.file);
    $("help").replaceChildren(el("div", { class: "helpbox" },
      el("div", { class: "bar", style: "margin-top:0" },
        el("span", { class: "meta" }, `From ${h.file}`),
        el("button", { style: "margin-left:auto", onclick: hideHelp }, "Close")),
      body));
    $("help").hidden = false;
    const target = anchor && body.querySelector(`[id="${CSS.escape(anchor)}"]`);
    if (target) target.scrollIntoView({ block: "start" });
  } catch (e) { fail(e); }
}
function hideHelp() { $("help").hidden = true; }

// The ground truth schema at a glance (read from the file each time): its entity classes and predicates side by
// side, each with its definition and how many ground truth triples use it, a predicate also with its patterns;
// coined ones (used, not in the file yet) marked. A filter narrows both tables; editing is the view behind the button.
async function showSchema() {
  const v = (await api("/api/vocab")).vocabulary;
  const filter = el("input", { type: "search", placeholder: "Filter by entity class or predicate, definition, or pattern", class: "schemafilter" });
  const row = (kind, x) => el("tr", { "data-text": [x.component_class, x.definition, ...(x.patterns || []).flat()].join(" ").toLowerCase() },
    el("td", { class: "schemaname" }, x.component_class,
       x.in_hand ? null : el("span", { class: "pill error", title: "Used in the ground truth, not in the ground truth schema yet: add it, or fix the typo" }, "✖ coined")),
    el("td", {}, x.definition || el("span", { class: "empty" }, "no definition yet"),
       kind === "predicate" && x.patterns.length
         ? el("div", { class: "meta" }, x.patterns.map(([s, o]) => `${s} → ${o}`).join(" · ")) : null),
    el("td", { class: "schemauses", title: "ground truth triples and describes triples that use it" }, String(x.uses)));
  const table = (kind, title) => el("section", {},
    el("h3", {}, `${title} `, el("span", { class: "meta" }, `(${v[kind].length})`)),
    el("table", { class: "schematable" },
      el("thead", {}, el("tr", {}, el("th", {}, kind === "predicate" ? "Predicate" : "Entity class"), el("th", {}, "Definition"), el("th", { title: "ground truth triples and describes triples that use it" }, "Uses"))),
      el("tbody", {}, v[kind].map((x) => row(kind, x)))));
  const grid = el("div", { class: "schemagrid" }, table("entity class", "Entity classes"), table("predicate", "Predicates"));
  filter.addEventListener("input", () => {
    const q = filter.value.trim().toLowerCase();
    grid.querySelectorAll("tbody tr").forEach((r) => { r.hidden = q && !r.dataset.text.includes(q); });
  });
  $("help").replaceChildren(el("div", { class: "helpbox wide schemaview" },
    el("div", { class: "bar", style: "margin-top:0" },
      el("h2", { style: "margin:0" }, "Ground truth schema"),
      el("span", { class: "meta" }, "annotations/ground_truth_schema.txt"),
      el("span", { style: "margin-left:auto" },
        el("button", { onclick: () => { hideHelp(); openVocab().catch(fail); },
                       title: "Change a definition, rename one, or merge two that mean the same thing, in every file at once" },
           "Edit definitions, rename, or merge…"), " ",
        el("button", { onclick: hideHelp }, "Close"))),
    gapsList(), filter, grid));
  $("help").hidden = false;
  filter.focus();
}

// At the top of every view but a batch: what the view is for, and when (the first paragraph of its README section,
// read from the file each time), with the way to the rest.
async function showIntro() {
  const view = currentView(), box = $("intro");
  if (view === "batch" || !$("intro").isConnected) { box.hidden = true; return; }
  try {
    const h = await api(`/api/help?view=${view}`);
    const body = el("div", { class: "helpbody" });
    body.innerHTML = markdown(h.intro, h.file);
    box.replaceChildren(body);                    // the rest of the view's section: its Help menu, How to use this view
    box.hidden = false;
  } catch (e) { box.hidden = true; }
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideHelp(); });
// ← and → go to the previous and next record of the batch, unless a field (or the help window) has the keyboard.
document.addEventListener("keydown", (e) => {
  if (!batch || e.altKey || e.ctrlKey || e.metaKey || !$("help").hidden) return;
  if (e.target.closest && e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowRight" && batch.records.length > 1) { e.preventDefault(); show(stepRecord(1)); }
  if (e.key === "ArrowLeft" && batch.records.length > 1) { e.preventDefault(); show(stepRecord(-1)); }
  if (oneAtATime && e.key === "ArrowDown" && goToTriple(tripleAt + 1)) e.preventDefault();
  if (oneAtATime && e.key === "ArrowUp" && goToTriple(tripleAt - 1)) e.preventDefault();
});
// A followed link opens its document in the help window (a term: docs/terminology.md).
document.addEventListener("click", (e) => {
  const link = e.target.closest && e.target.closest("[data-doc]");
  if (link) showHelp(`/api/doc?path=${encodeURIComponent(link.dataset.doc)}`, link.dataset.anchor);
});

loadBatches().catch(fail);
</script>

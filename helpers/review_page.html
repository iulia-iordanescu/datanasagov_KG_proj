<title>Schema review ({{VERSION}})</title>
<link rel="icon" href="data:,">
<!-- The annotation tool's look, copied from helpers/annotator/page.html when this page was made by
     helpers/review_page.py; its typefaces (Libre Franklin, JetBrains Mono: SIL Open Font License) are inside. -->
<style>
{{ANNOTATOR_STYLES}}
</style>
<style>
  /* this page's own additions, in the same palette */
  main.single { display: block; max-width: 1100px; margin: 0 auto; padding: 16px; }
  /* the version line: one short, calm line; the commit, page version and fingerprints open under "details" */
  #version { margin: 0; padding: 7px 24px; border-bottom: 1px solid var(--line); background: var(--sky-bg); color: var(--label);
             font-size: 13px; line-height: 1.5; }
  #version summary { list-style: none; cursor: pointer; display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  #version summary::-webkit-details-marker { display: none; }
  #version summary .more { color: var(--navy); font-weight: 600; font-size: 12.5px; }
  #version summary .more::after { content: " ▾"; }
  #version details[open] summary .more::after { content: " ▴"; }
  #version summary:hover .more { text-decoration: underline; text-underline-offset: 3px; }
  #version .full { margin: 6px 0 2px; max-width: 110ch; color: var(--ink); }
  #version strong { color: var(--navy); }
  #version .files { color: var(--label); overflow-wrap: anywhere; }
  /* the view bar: room around each tab, the current one plainly filled, wrapping cleanly on narrow screens */
  header .topbar { padding: 12px 24px; row-gap: 10px; }
  header nav.tabs { flex: 0 1 auto; flex-wrap: wrap; gap: 6px; }
  header nav.tabs button.tab { background: transparent; border: 1px solid var(--bar-soft); color: var(--bar-ink);
                               padding: 7px 18px; font-weight: 500; }
  header nav.tabs button.tab:hover { background: var(--bar-soft); border-color: var(--bar-soft); }
  header nav.tabs button.tab.current, header nav.tabs button.tab.current:hover {
    background: var(--bar-ink); border-color: var(--bar-ink); color: #1f3a5f; font-weight: 600; }
  header #status { flex-wrap: wrap; row-gap: 8px; }
  @media (max-width: 900px) {
    header .topbar { padding: 10px 16px; }
    header h1 { margin-right: 8px; padding-right: 0; border-right: 0; }
    #version { padding: 7px 16px; }
  }
  header #status { gap: 10px; }
  header #status button.primary { background: var(--bar-ink); color: #1f3a5f; border-color: var(--bar-ink); }
  header #status .counter { white-space: nowrap; }
  .commentbox { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .commentbox label { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; font-weight: 600; color: var(--label); }
  .commentbox textarea { width: 100%; min-height: 2.6em; font-size: 14px; font-weight: 400; resize: vertical; line-height: 1.4; }
  .commentbox.has textarea { border-color: var(--sky); background: var(--sky-bg); }
  .commentbox .hint { margin-top: 4px; }
  .mapbox.commented { border-left-color: var(--sky); }
  .entryhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .entryhead .mapname { flex: 0 1 auto; }
  .patline { font-size: 13px; color: var(--label); margin-top: 4px; overflow-wrap: break-word; }
  .patline .pat { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
  .home h2 { font-size: 22px; }
  .home h3 { color: var(--navy); font-size: 16px; margin: 18px 0 6px; }
  .home p, .home li { max-width: 78ch; line-height: 1.6; }
  .home ul, .home ol { padding-left: 22px; }
  .namefield { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
  .namefield input { width: min(320px, 100%); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  .terms td.term { white-space: nowrap; font-weight: 600; }
  .terms td { line-height: 1.5; }
  .notes p { margin: 0 0 4px; }
  .gone li { margin: 6px 0; }
  /* the Questions view: one calm card per question. At the top, what the expert needs to answer, in plain sections
     with room between them; at the bottom, folded and quiet, my bookkeeping (not needed to answer). */
  .mapbox.question { padding: 18px 24px 14px; margin-bottom: 18px; }
  .question h3.qheading { font-size: 18px; font-weight: 600; line-height: 1.4; margin: 0 0 2px; color: var(--ink); }
  .question h3.qheading .qid { color: var(--navy); font-weight: 700; margin-right: 6px; }
  .question .qmeta { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .question h4 { color: var(--navy); font-size: 14.5px; font-weight: 600; margin: 22px 0 6px; }
  .question p, .question li { max-width: 78ch; line-height: 1.65; }
  .question ul { padding-left: 22px; margin: 6px 0; }
  .question li { margin: 3px 0; }
  .question .prose table { margin: 8px 0 12px; max-width: 78ch; }
  .question .field { margin: 10px 0; }
  .question .field > .label { display: block; font-size: 13px; font-weight: 600; color: var(--label); margin-bottom: 2px; }
  .question .quote { margin: 2px 0 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--line);
                     line-height: 1.65; overflow-wrap: anywhere; max-width: 78ch; }
  .question .quote p { margin: 0 0 6px; }
  .question .quote p:last-child { margin-bottom: 0; }
  .question mark { background: var(--soft); color: inherit; padding: 0 2px; border-radius: 2px; }
  .question .triple { font-size: 14px; margin: 4px 0; overflow-wrap: anywhere; }
  .question .triple .inst { font-weight: 600; }
  .question .triple .cls, .question .triple .pred { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
  .question .triple .cls { color: var(--muted); }
  .question .option { margin: 12px 0; }
  .question .option .otitle { font-weight: 600; margin: 0 0 2px; }
  .question .option .prose p { margin: 2px 0 6px; }
  .question .commentbox { margin-top: 20px; padding-top: 12px; }
  .question details.forus { margin: 16px 0 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--label); font-size: 13.5px; }
  .question details.forus summary { cursor: pointer; font-weight: 600; color: var(--label); }
  .question details.forus summary .meta { font-weight: 400; }
  .question details.forus h5 { font-size: 13px; color: var(--label); margin: 14px 0 4px; }
  .question details.forus p, .question details.forus li { line-height: 1.55; }
  .question details.forus ul { margin: 4px 0; }
  a.term, a.term:visited { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  a.term:hover { color: var(--navy); text-decoration-style: solid; }
  .groupname { color: var(--navy); font-size: 16px; margin: 14px 0 4px; }
  .terms tr.here td { background: var(--sky-bg) !important; }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <h1><button id="homebutton" title="How to read this page">Schema review</button></h1>
    <nav class="tabs" aria-label="Views">
      <button class="tab" id="tab-home" data-label="How to read this">How to read this</button>
      <button class="tab" id="tab-questions" data-label="Questions">Questions</button>
      <button class="tab" id="tab-schema" data-label="Ground truth schema">Ground truth schema</button>
      <button class="tab" id="tab-mapping" data-label="Translation table">Translation table</button>
      <button class="tab" id="tab-terms" data-label="Terms">Terms</button>
    </nav>
    <span id="status"></span>
  </div>
</header>
<div id="version"></div>
<main class="single"><div id="view"></div></main>
<script type="application/json" id="data">{{DATA}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const V = D.version;
const $ = (id) => document.getElementById(id);
// An arrow as the page shows it: "->" or "-->" in the files becomes "→" on the screen only; the data, the comments'
// entry texts, the emails and the downloads keep the files' own characters, so --read compares like with like.
const arrows = (text) => String(text).replace(/--?>/g, "→");
const arrowsHtml = (html) => String(html).replace(/--?&gt;/g, "→");
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) node.append(c);
  return node;
}

// ---------------------------------------------------------------- what this browser keeps (localStorage)
// Each read and write may fail (storage blocked for pages opened from disk, a private window): the page then works
// from memory, and says so, so the reviewer downloads before closing.
const KEY = { comments: "schemaReview:comments", name: "schemaReview:name", seen: "schemaReview:seen",
              oneAtATime: "schemaReview:oneAtATime" };
let storageWorks = true;
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch (_) { storageWorks = false; return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (_) { storageWorks = false; return false; }
}
// {id: {kind, entry, text, at, version, commit, shown}}: id is kind|entry, the same in every copy of the page, so
// comments carry over to a newer copy opened in the same browser.
let comments = load(KEY.comments, {});
if (!comments || typeof comments !== "object") comments = {};
let reviewer = load(KEY.name, "") || "";
let oneAtATime = load(KEY.oneAtATime, false) === true;

// ---------------------------------------------------------------- the entries
const ENTRIES = [];                          // every entry of this copy: {id, kind, entry, shown, ...}
for (const e of D.schema.entity_classes) ENTRIES.push({ ...e, id: `${e.kind}|${e.entry}` });
for (const e of D.schema.predicates) ENTRIES.push({ ...e, id: `${e.kind}|${e.entry}` });
for (const r of D.mapping.rows) ENTRIES.push({ ...r, kind: "translation row", rowKind: r.kind, id: `translation row|${r.entry}` });
for (const q of D.questions) ENTRIES.push({ ...q, kind: "question", entry: q.id, id: `question|${q.id}` });
const BY_ID = Object.fromEntries(ENTRIES.map((e) => [e.id, e]));
const GENERAL = { id: "general|(general)", kind: "general", entry: "(general)", shown: "" };

// Changed since you last looked: the copy opened before this one (an older one, by when it was made) left the text
// of each entry here; an entry whose text differs is changed, one it lacked is new.
const seenAll = (() => { const s = load(KEY.seen, {}); return s && typeof s === "object" ? s : {}; })();
const previous = Object.values(seenAll).filter((s) => s && s.content !== V.content && s.generated < V.generated)
  .sort((a, b) => (a.generated < b.generated ? 1 : -1))[0] || null;
const CHANGED = new Set(), NEW = new Set();
if (previous) for (const e of ENTRIES) {
  if (!(e.id in previous.entries)) NEW.add(e.id);
  else if (previous.entries[e.id] !== e.shown) CHANGED.add(e.id);
}
(() => {                                      // keep this copy's texts, and those of the three copies before it
  seenAll[V.content] = { version: V.id, generated: V.generated, content: V.content,
                         entries: Object.fromEntries(ENTRIES.map((e) => [e.id, e.shown])) };
  const keep = Object.values(seenAll).sort((a, b) => (a.generated < b.generated ? 1 : -1)).slice(0, 4);
  save(KEY.seen, Object.fromEntries(keep.map((s) => [s.content, s])));
})();

// ---------------------------------------------------------------- comments
const written = () => Object.values(comments).filter((c) => c && c.text && c.text.trim());
let saveTimer = null;
// The time now, on this computer's clock, with its offset from UTC: 2026-10-24T14:05:09-04:00.
function localIso() {
  const d = new Date(), pad = (n) => String(Math.abs(n)).padStart(2, "0"), off = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:` +
         `${pad(d.getSeconds())}${off < 0 ? "-" : "+"}${pad(Math.trunc(off / 60))}:${pad(off % 60)}`;
}
function setComment(e, text) {
  if (text.trim()) comments[e.id] = { kind: e.kind, entry: e.entry, text, at: localIso(),
                                      version: V.id, commit: V.commit, shown: e.shown };
  else delete comments[e.id];
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { save(KEY.comments, comments); drawStatus(); }, 300);
  drawStatus(true);
}
function commentBox(e, label) {
  const c = comments[e.id];
  const box = el("div", { class: "commentbox" + (c ? " has" : "") });
  const ta = el("textarea", { rows: 2, placeholder: "Your comment (optional): what is wrong, unclear, or missing",
                              "aria-label": label });
  ta.value = c ? c.text : "";
  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight + 2, 44) + "px"; };
  ta.addEventListener("input", () => {
    setComment(e, ta.value); box.classList.toggle("has", !!ta.value.trim());
    const card = box.closest(".mapbox"); if (card) card.classList.toggle("commented", !!ta.value.trim());
    grow();
  });
  requestAnimationFrame(grow);
  box.append(el("label", {}, label, ta));
  if (c && c.text && e.kind !== "general" && c.shown !== e.shown)
    box.append(el("p", { class: "hint" }, `You wrote this on the copy ${c.version}, when the entry read: ${arrows(c.shown)}`));
  return box;
}
const csvCell = (v) => /[",\r\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
const COLUMNS = ["reviewer", "page_version", "git_commit", "kind", "entry", "entry_text_shown", "comment", "timestamp"];
const KIND_ORDER = ["general", "question", "entity class", "predicate", "translation row"];
function commentsCsv() {
  const rows = written().sort((a, b) => (KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind)) ||
                                        a.entry.localeCompare(b.entry));
  const lines = [COLUMNS.join(",")].concat(rows.map((c) =>
    [reviewer, c.version, c.commit, c.kind, c.entry, c.shown, c.text, c.at].map(csvCell).join(",")));
  return "﻿" + lines.join("\r\n") + "\r\n";
}
function download() {
  if (!reviewer.trim()) {
    show("home");
    status("Type your name first, then press Download again.");
    const f = $("reviewer"); if (f) f.focus();
    return;
  }
  const blob = new Blob([commentsCsv()], { type: "text/csv;charset=utf-8" });
  const a = el("a", { href: URL.createObjectURL(blob),
                      download: `comments_${reviewer.trim().replace(/[^\w-]+/g, "_")}_${localIso().slice(0, 10)}.csv` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  status(`Saved ${written().length} comment(s) to your Downloads folder. Email me that file.`);
}

// ---------------------------------------------------------------- email
// "Email my comments to Iulia" opens the reviewer's email program with a new email, its body the comments in the
// plain-text format helpers/review_page.py --read reads back (common/common_helpers/review_comments.py,
// EMAIL_FORMAT): one "[field] value" line each, so lines an email client wraps, quotes or merges are put back.
// The address is put together only when the button is pressed, so it isn't in the page for address harvesters.
const to = () => ["iulia", "m", "iordanescu"].join(".") + "+kgreview" + String.fromCharCode(64) + ["gmail", "com"].join(".");
// The longest mailto: address made: 1,900 characters, under the 2,083 that Windows passes on to an email program
// (INTERNET_MAX_URL_LENGTH); more comments are split into parts, each its own email, up to MAX_EMAILS of them.
const MAILTO_MAX = 1900, MAX_EMAILS = 5;
const HEADER = "REVIEW COMMENTS (format 1): please send this email as it is";
function emailLines() {
  const rows = written().sort((a, b) => (KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind)) ||
                                        a.entry.localeCompare(b.entry));
  const one = (s) => String(s || "").replace(/\s+/g, " ").trim();
  return rows.flatMap((c) => ["=== comment ===", `[kind] ${c.kind}`, `[entry] ${one(c.entry)}`,
    `[page_version] ${one(c.version)}`, `[git_commit] ${one(c.commit)}`, `[timestamp] ${one(c.at)}`,
    `[entry_text_shown] ${one(c.shown)}`,
    ...c.text.trim().split(/\r?\n/).map((l) => `[comment] ${l.replace(/\s+$/, "")}`), ""]);
}
// {parts: [{subject, url}], needed}: the emails to send; needed > MAX_EMAILS: too many, and parts is empty.
function emailParts(sent) {
  const name = reviewer.trim();
  const subject = (k, n) => `Review comments — ${name} — ${V.id}` + (n > 1 ? ` — part ${k} of ${n}` : "");
  const body = (k, n, lines) => [HEADER, `[reviewer] ${name}`, `[page_version] ${V.id}`, `[git_commit] ${V.commit}`,
    `[sent] ${sent}`, `[part] ${k} of ${n}`, `=== start of part ${k} of ${n} ===`, "", ...lines,
    `=== end of part ${k} of ${n} ===`, ""].join("\r\n");
  const link = (k, n, lines) => `mailto:${to()}?subject=${encodeURIComponent(subject(k, n))}` +
                               `&body=${encodeURIComponent(body(k, n, lines))}`;
  const fits = (lines) => link(99, 99, lines).length <= MAILTO_MAX;
  const chunks = []; let cur = [];
  const pending = emailLines();
  while (pending.length) {
    const line = pending.shift();
    if (fits([...cur, line])) { cur.push(line); continue; }
    if (cur.some((l) => l)) { chunks.push(cur); cur = []; pending.unshift(line); continue; }
    // one line too long for an email by itself: as much as fits, cut at a space; the rest starts the next part
    let cut = line.length - 1;
    while (cut > 0 && !fits([line.slice(0, cut)])) cut = Math.floor(cut * 0.9);
    const space = line.lastIndexOf(" ", cut);
    if (cut < 20) return { parts: [], needed: MAX_EMAILS + 1 };       // the name alone fills an email
    const at = space > cut / 2 ? space : cut;
    chunks.push([line.slice(0, at)]);
    pending.unshift(line.slice(at).replace(/^ /, ""));
  }
  if (cur.length) chunks.push(cur);
  const n = chunks.length;
  return n > MAX_EMAILS ? { parts: [], needed: n }
    : { parts: chunks.map((lines, i) => ({ subject: subject(i + 1, n), url: link(i + 1, n, lines) })), needed: n };
}
let emailing = null;                         // {parts, opened: Set, needed}: the emails to send, shown in How to read this
function openMail(url) { const a = el("a", { href: url }); document.body.append(a); a.click(); a.remove(); }
function email() {
  if (!reviewer.trim()) {
    show("home");
    status("Type your name first, then press Email my comments again.");
    const f = $("reviewer"); if (f) f.focus();
    return;
  }
  if (!written().length) { status("No comments written yet: write one in the box under any entry first."); return; }
  const got = emailParts(localIso());
  emailing = { ...got, opened: new Set() };
  if (got.parts.length === 1) {
    emailing.opened.add(0);
    openMail(got.parts[0].url);
  }
  show("home");
  const box = $("emailing"); if (box) box.scrollIntoView({ block: "center" });
}
function drawEmailing() {
  if (!emailing) return null;
  const { parts, opened, needed } = emailing;
  if (!parts.length) return el("div", { id: "emailing", class: "card todo" },
    el("p", {}, `Your comments are too long to email from this page: they would take more than ${MAX_EMAILS} emails. Press Download my ` +
      "comments instead, then attach the file it saves to an email to me."),
    el("div", { class: "actions" },
      el("button", { class: "primary", onclick: download }, "Download my comments"),
      el("button", { onclick: () => openMail(`mailto:${to()}?subject=${encodeURIComponent(`Review comments — ${reviewer.trim()} — ${V.id}`)}` +
                                             `&body=${encodeURIComponent("My comment file is attached.\r\n")}`) },
         "Write the email to attach it to")));
  const one = parts.length === 1;
  return el("div", { id: "emailing", class: "card" },
    el("p", {}, one
      ? "Your email program should now show a new email to me with your comments in it: press Send there. If nothing " +
        "opened (no email program is set up in this browser), press Download my comments instead, and attach the file it saves to an email to me."
      : `Your comments take ${parts.length} emails. Press each button below in turn, and send each email it opens ` +
        "(nothing in them needs changing)."),
    el("div", { class: "actions" }, parts.map((p, i) => el("button", {
      class: opened.has(i) ? "" : "primary", title: p.subject,
      onclick: () => { opened.add(i); openMail(p.url); redraw(); } },
      one ? "Open the email again" : `${opened.has(i) ? "✓ " : ""}Email part ${i + 1} of ${parts.length}`))));
}
// A comment file downloaded from any copy of this page (another browser, another computer), read back in: each of
// its comments is kept unless this browser holds a newer one for the same entry.
function parseCsv(text) {
  const rows = []; let row = [], cell = "", quoted = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    const head = rows.shift() || [];
    if (!COLUMNS.every((c) => head.includes(c))) { status(`${file.name} isn't a file of comments saved by this page.`); return; }
    const at = Object.fromEntries(head.map((c, i) => [c, i]));
    let added = 0;
    for (const r of rows) {
      const get = (c) => (r[at[c]] || "");
      if (!get("comment").trim()) continue;
      const id = `${get("kind")}|${get("entry")}`;
      if (comments[id] && comments[id].at >= get("timestamp")) continue;
      comments[id] = { kind: get("kind"), entry: get("entry"), text: get("comment"), at: get("timestamp"),
                       version: get("page_version"), commit: get("git_commit"), shown: get("entry_text_shown") };
      added++;
      if (!reviewer && get("reviewer")) { reviewer = get("reviewer"); save(KEY.name, reviewer); }
    }
    save(KEY.comments, comments);
    redraw();
    status(`Read ${added} comment(s) from ${file.name}.`);
  };
  reader.readAsText(file, "utf-8");
}

// ---------------------------------------------------------------- the header and the version line
let message = "";
function status(text) { message = text; drawStatus(); }
function drawStatus(typing) {
  const n = written().length;

      el("div", { class: "otitle" }, `Option ${o.number}: ${o.title}`), prose([{ ul: o.consequences }])))] : null,
    el("h5", {}, `Everything the answer may change: ${parts.join(", ")}`),
    a.records.length ? field("Records (all tuning records)", el("ul", {}, a.records.map((r) => el("li", {},
      `Pool position ${r.position}: “${r.title}”`, el("span", { class: "meta nolink" }, ` (id ${r.id})`),
      byPos[r.position] ? el("div", {}, byPos[r.position].map((t) => [tripleLine(t),
        t.draft ? el("span", { class: "meta" }, "my draft: this record isn't in the ground truth yet") : null])) : null)))) : null,
    a.rows.length ? field("Rows of the translation table (current or past schema)", el("ul", {}, a.rows.map((r) => el("li", {}, `${r.kind} ${r.crt}`)))) : null,
    a.entries.length ? field("Entries of the ground truth schema", el("ul", {}, a.entries.map((e) => el("li", {}, `${e.kind} ${e.entry}`)))) : null,
    a.rules.length ? field("Rules of the annotation guidelines", el("ul", {}, a.rules.map((r) => el("li", {}, `${r.section}, rule ${r.rule}`)))) : null,
    a.methods.length ? field("Pipeline methods", el("ul", {}, a.methods.map((m) => el("li", {}, el("code", {}, m.path), `: ${m.what}`)))) : null,
    q.methods.length ? [el("h5", {}, "The pipeline's words, quoted"), q.methods.map((m) => field(m.path, quoted(m.words)))] : null,
    ex ? el("p", { class: "nolink" }, `The example is the record at pool position ${ex["pool position"]} (id ${ex["record id"]}), a tuning record.`) : null);
}
function questionBox(q) {
  const [, pl] = PRIORITY[q.priority], [, sl] = STATUS[q.status];
  const marks = (r) => r.source_texts.map((s) => s.text);
  const card = el("section", { class: "mapbox question" + (has(q) ? " commented" : ""), id: `q-${q.entry}` },
    el("h3", { class: "qheading" }, el("span", { class: "qid nolink" }, q.entry), q.title),
    el("div", { class: "qmeta nolink" }, pl + (q.status === "open" ? "" : ` · ${sl}`), changedPill(q)),
    prose(q.question),
    q.context.length ? prose(q.context) : null,
    q.records.map((r) => [el("h4", {}, "An example"),
      field("Its title", quoted(r.title, marks(r))),
      field("Its notes (the words this question is about are highlighted)", quoted(r.notes, marks(r))),
      r.triples.length ? field(r.in_ground_truth ? "The facts I wrote down from these words" : "The facts I have written down from these words so far (a draft, not checked yet)",
                               r.triples.map(tripleLine)) : null]),
    q.schema.length || q.rows.length || q.rules.length ? [el("h4", {}, "The definitions and rules this is judged by"),
      q.schema.map((e) => field(`${e.kind} ${e.entry} (ground truth schema)`, quoted(e.definition))),
      q.rows.map((r) => field(`Translation table: ${r.kind} ${r.crt} (current or past schema) → ${r.gtt === D.mapping.none ? `${D.mapping.none}: nothing in the ground truth schema` : `${r.gtt} (ground truth schema)`}` +
                              (r.swap ? ", subject and object swapped" : "") + "; the row's definition of " + r.crt + ":", quoted(r.definition))),
      q.rules.map((r) => field(`Annotation guidelines, ${r.section}, rule ${r.rule}`, quoted(r.words)))] : null,
    q.options.length ? [el("h4", {}, "The choices I see (pick one, or tell me another)"), q.options.map((o) => el("div", { class: "option" },
      el("div", { class: "otitle" }, `Option ${o.number}: ${o.title}`), prose(o.body)))] : null,
    el("h4", {}, "My current reading"), prose(q.reading),
    q.answer.length ? [el("h4", {}, "The answer"), prose(q.answer)] : null,
    commentBox(q, `Your answer or comment on ${q.entry}`),
    impactsBox(q));
  linkTerms(card);
  return card;
}
const PRIORITIES = D.priorities;
function drawQuestions() {
  const st = state.questions;
  const all = ENTRIES.filter((e) => e.kind === "question")
    .sort((a, b) => (PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority)) || (a.number - b.number));
  const live = all.filter((q) => st.closed || q.status === "open");
  const shown = live.filter((q) => (st.priority === "all" || q.priority === st.priority) && (!st.mine || has(q))
    && (!st.changed || CHANGED.has(q.id) || NEW.has(q.id)) && matches(st.search, q.search));
  const count = (p) => live.filter((q) => q.priority === p).length;
  const closedN = all.filter((q) => q.status !== "open").length;
  const { at, bar } = itemsOneAtATime("questions", shown.map((q) => q.id), "Question");
  const select = el("select", { "aria-label": "Questions by priority", onchange: (ev) => { st.priority = ev.target.value; redraw(); } },
    [["all", `Every priority (${live.length})`], ...PRIORITIES.map((p) => [p, `${PRIORITY[p][1]} (${count(p)})`])]
      .map(([v, t]) => el("option", { value: v, selected: st.priority === v }, t)));
  const groups = at === null ? PRIORITIES.map((p) => [p, shown.filter((q) => q.priority === p)]).filter(([, l]) => l.length) : null;
  const intro = el("section", { class: "card" }, el("h2", {}, "Questions"),
    el("p", { class: "meta" }, "What I am not sure about and would like an expert's answer to, most urgent first. Each question " +
      "shows what you need to answer it: the question, one record as an example (its title and notes, the words concerned " +
      "highlighted), the definitions and rules it is judged by, the choices I see, and my current reading. " +
      "Write your answer in the box under a question; it is sent with your other comments. Under the box, folded, is my own " +
      "bookkeeping (what the answer would change in my files); you don't need it to answer."),
    el("p", { class: "meta" }, PRIORITIES.map((p, i) => `${i ? " · " : ""}${PRIORITY[p][1]}: ${count(p)}`).join("") +
      (closedN && !st.closed ? ` · ${closedN} answered or withdrawn, not shown` : "")));
  linkTerms(intro);
  return [intro,
    el("section", { class: "card mapcard" },
      el("div", { class: "mapfilters" },
        searchBox(st, "Search the questions, their records and options"), select,
        check(st, "closed", `Show answered and withdrawn questions too (${closedN})`),
        check(st, "mine", "Only those I commented on"),
        previous ? check(st, "changed", "Only those changed or new since I last looked") : null),
      bar,
      !shown.length ? el("p", { class: "empty mapempty" }, all.length ? "Nothing matches the search and filters above." : "No questions yet.")
        : at !== null ? questionBox(shown[at])
        : groups.map(([p, list]) => [el("h3", { class: "groupname" }, `${PRIORITY[p][1]} (${list.length})`), list.map(questionBox)]))];
}

// ---------------------------------------------------------------- terms
function drawTerms() {
  const rows = D.glossary.map((t) => {
    const term = el("td", { class: "term" }); term.innerHTML = arrowsHtml(t.term_html);      // written by helpers/review_page.py,
    const meaning = el("td", {}); meaning.innerHTML = arrowsHtml(t.meaning_html);           // from docs/terminology.md, escaped
    return el("tr", { id: termSlug(t.term) }, term, meaning);
  });
  return [el("section", { class: "card" }, el("h2", {}, "Terms"),
    el("p", { class: "meta" }, `The words this page uses, as my project's list of terms (docs/terminology.md) defines them at commit ${V.commit}.`),
    el("table", { class: "schematable terms" }, el("thead", {}, el("tr", {}, el("th", {}, "Term"), el("th", {}, "Meaning"))),
       el("tbody", {}, rows)))];
}

// ---------------------------------------------------------------- how to read this
function drawHome() {
  const nameField = el("input", { id: "reviewer", type: "text", value: reviewer, placeholder: "e.g. Jane Smith", autocomplete: "name",
    oninput: (ev) => { reviewer = ev.target.value; save(KEY.name, reviewer); } });
  const picker = el("input", { type: "file", accept: ".csv,text/csv", hidden: true,
                               onchange: (ev) => { if (ev.target.files[0]) loadFile(ev.target.files[0]); ev.target.value = ""; } });
  const gone = written().filter((c) => c.kind !== "general" && !BY_ID[`${c.kind}|${c.entry}`]);
  const nOpen = D.questions.filter((q) => q.status === "open").length;
  const nSchema = D.schema.entity_classes.length + " entity classes and " + D.schema.predicates.length + " predicates";
  return [el("section", { class: "card home" },
    el("h2", {}, "How to read this page"),
    el("p", {}, "Thank you for reviewing this. My project builds a knowledge graph from the records of the data.nasa.gov catalog: " +
      "a model reads each record's text and writes down the facts it states, each as a classed triple, e.g. “MODIS” (Instrument) " +
      "ABOARD “Aqua” (Spacecraft). To measure how well it does, I check a sample of records by hand and write down every fact " +
      "their texts state: the ground truth. This page shows two files that decide what those facts may say, as they were when " +
      "the page was made (the line above says when), so that you can tell me where they are wrong, unclear, or missing something, " +
      "and the questions I would like an expert's answer to."),
    el("h3", {}, "Questions"),
    el("p", {}, `${nOpen} question${nOpen === 1 ? "" : "s"} I would like an expert's answer to, most urgent first, each written out ` +
      "whole, so it can be read on its own: one record as its example, quoted, the definitions and rules it is judged by, the " +
      "choices I see, and my current reading. Your answer goes in the box under each one."),
    el("h3", {}, "Ground truth schema"),
    el("p", {}, `The ${nSchema} the ground truth may use, each with a one-line definition. An entity class is a kind of thing a ` +
      "subject instance or object instance can be (Instrument); a predicate is a kind of relationship (ABOARD). Under a predicate " +
      "are its patterns, the pairs of entity classes it has joined, read subject → object: Instrument → Spacecraft under ABOARD " +
      "says that an instrument is carried on a spacecraft. The ground truth itself may use more patterns than the file lists. " +
      "A line “only: …” pins a predicate: it may join only those entity classes (“any”: any entity class). A line " +
      "“source: …” says where the idea for an entry came from: “ground truth tuning #2” means from the record at position 2 of " +
      "my shuffled list of records to annotate."),
    el("p", {}, "Worth asking: is each definition right, and clear to someone in your field? Should two entries be one, or one be two? " +
      "Is a kind of thing or relationship that the catalog often states missing? Is a predicate pinned where it shouldn't be?"),
    el("h3", {}, "Translation table"),
    el("p", {}, "The model doesn't use the ground truth schema: it extracts with its own, the current schema, learned from other " +
      "records of the catalog. To compare its facts with the ground truth, each entity class and predicate of the current schema " +
      "(and of past ones) is translated into the one of the ground truth schema that means the same, or into (none) when none does. " +
      "Each box is one row: on the left, the current or past schema's entity class or predicate and its definition; on the right, " +
      "what it translates to and the ground truth schema's definition. “Swap subject and object” means the ground truth " +
      "schema's predicate states the relationship the other way round (“A CARRIES B” is “B ABOARD A”). The last pill says " +
      "whether I have checked the row."),
    el("p", {}, "Worth asking: does each translation keep the meaning? Does a row that says (none) really have no counterpart?"),
    el("h3", {}, "Your comments"),
    el("p", {}, "Write in the box under any entry, and anything else under General comments below. Every comment is kept in this " +
      "browser as you type, on this computer only, so you can stop and come back; the top of the page says how many you have written. " +
      "When you're done, type your name and press Email my comments to Iulia: your email program opens a new email to me " +
      "with your comments in it, for you to send (a long set of comments takes a few emails, numbered). If that doesn't " +
      "work, press Download my comments, and attach the small file it saves (a CSV file) to an email to me. " +
      "Your name and comments reach only me: I keep them on my computer, not in my project's public repository."),
    el("p", {}, "This page is a copy: it can't change the files, and it sends nothing anywhere by itself (an email goes only when you " +
      "press Send in your email program). When I update it, the same link shows the newer copy (or I send you a newer file): " +
      "open it in the same browser, and your comments carry over, and entries that changed since the copy you opened before are marked " +
      "“changed since you last looked”. In another browser or on another computer, read your comments back in from the file " +
      "you downloaded (Load my comments from a file, below)."),
    el("div", { class: "namefield" }, el("label", { for: "reviewer", class: "name" }, "Your name"), nameField),
    commentBox(GENERAL, "General comments"),
    el("div", { class: "actions" },
      el("button", { class: "primary", onclick: email }, "Email my comments to Iulia"),
      el("button", { onclick: download }, "Download my comments"),
      el("button", { onclick: () => picker.click(), title: "Read back a file of comments this page saved before" },
         "Load my comments from a file"), picker),
    drawEmailing(),
    !storageWorks ? el("p", { class: "problems" }, el("span", { class: "pill flag" },
      "⚑ This browser doesn't let the page keep your comments: download them before you close it.")) : null,
    gone.length ? el("div", { class: "gone" }, el("h3", {}, "Your comments on entries no longer on this page"),
      el("p", { class: "meta" }, "They are still in your download, with the entry as it read when you wrote them."),
      el("ul", {}, gone.map((c) => el("li", {}, el("strong", {}, `${c.kind} ${c.entry}`), `: ${c.text}`,
                                          el("div", { class: "meta" }, `It read: ${arrows(c.shown)}`))))) : null)];
}

// ---------------------------------------------------------------- views
let view = "home";
const VIEWS = { home: drawHome, questions: drawQuestions, schema: drawSchema, mapping: drawMapping, terms: drawTerms };
function redraw() {
  for (const v of Object.keys(VIEWS)) {
    $(`tab-${v}`).classList.toggle("current", v === view);
    if (v === view) $(`tab-${v}`).setAttribute("aria-current", "page"); else $(`tab-${v}`).removeAttribute("aria-current");
  }
  $("view").replaceChildren(...VIEWS[view]().flat(Infinity).filter(Boolean));
  drawStatus();
}
function show(v) {
  view = VIEWS[v] ? v : "home";
  history.replaceState(null, "", "#" + view);
  message = "";
  redraw();
  window.scrollTo(0, 0);
}
for (const v of Object.keys(VIEWS)) $(`tab-${v}`).addEventListener("click", () => show(v));
$("homebutton").addEventListener("click", () => show("home"));
drawVersion();
show(location.hash.slice(1) || "home");
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing on this page may reach the network: no address outside the page itself loads (typefaces come inline). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Review our work: a knowledge graph for data.nasa.gov ({{VERSION}})</title>
<link rel="icon" href="data:,">
<!-- The annotation tool's look, copied from helpers/annotator/page.html when this page was made by
     helpers/review_page.py (its typefaces, Libre Franklin and JetBrains Mono, SIL Open Font License, are inside),
     then this page's own palette and typefaces, the demo deck's: Archivo (The Archivo Project Authors) and Atkinson
     Hyperlegible (Braille Institute of America), SIL Open Font License, from helpers/review_page_fonts/. -->
<style>
{{ANNOTATOR_STYLES}}
</style>
<style>
{{PAGE_FONTS}}
</style>
<style>
  /* this page's own additions. The palette and typefaces are the demo deck's, so the page and the slides read as one
     set: deep teal, teal and gold on a light page (light only: no dark version); Archivo for headings, Atkinson
     Hyperlegible for the text. The three asks share one colour, teal. Every text colour on its background passes WCAG AA
     (4.5:1); gold and the deck's teal tint carry no small text. */
  :root {
    color-scheme: light;
    --teal: #0E7C86; --teal-ink: #0B5F67; --teal-deep: #0B3C49; --teal-bg: #DDEFF1;
    --gold: #F2C14E; --gold-deep: #C99A1E; --gold-ink: #7A5C0E; --gold-bg: #FFF4D6;
    --grey-bg: #EEF1F4;
    --bg: #F7F9FB; --panel: #ffffff; --paper: #ffffff; --tint: #F1F5F8; --line: #D5DEE4;
    --ink: #13252F; --muted: #4A5D68; --label: #4A5D68; --heading: #0B3C49;
    --navy: var(--teal-ink); --navy-bg: var(--teal-bg); --sky: var(--teal); --sky-bg: var(--teal-bg);
    --accent: var(--teal); --accent-bg: var(--teal-bg); --soft: #FBE3A0; --strong: #F2C14E;
    --bar: var(--teal-deep); --bar-ink: #ffffff; --bar-soft: rgba(255, 255, 255, 0.16);
    --button: var(--teal); --button-ink: #ffffff;
  }
  body { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; font-size: 16px; background: var(--bg); color: var(--ink); }
  h1, h2, h3, h4, .qheading, .groupname, header nav.tabs button.tab, .ask .num, .ask .asklabel, .mapname, .maptab {
    font-family: Archivo, "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; }
  h2, h3 { color: var(--heading); }
  a { color: var(--teal); }
  button.primary, header #status button.primary { background: var(--button); border-color: var(--button); color: var(--button-ink); font-weight: 700; }
  button.primary:hover { background: var(--button); filter: brightness(1.08); }
  main.single { display: block; max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  section.card { border-color: var(--line); border-radius: 14px; padding: 20px 24px; margin-bottom: 18px; }
  @media (max-width: 600px) { section.card { padding: 16px; } main.single { padding: 14px 12px 32px; } }
  /* the header: the deck's deep teal band, a gold rule under it */
  header { background: var(--teal-deep); border-bottom: 4px solid var(--gold); }
  header h1 button { color: #ffffff; font-size: 19px; font-weight: 700; letter-spacing: 0; }
  /* the title is long: on a narrow screen it wraps, never runs off the edge */
  header h1 { white-space: normal; flex: 0 1 auto; min-width: 0; }
  header h1 button { white-space: normal; text-align: left; }
  /* the version line: one short, calm line; the commit, page version and fingerprints open under "details" */
  #version { margin: 0; padding: 7px 24px; border-bottom: 1px solid var(--line); background: var(--panel); color: var(--muted);
             font-size: 13.5px; line-height: 1.5; }
  #version summary { list-style: none; cursor: pointer; display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  #version summary::-webkit-details-marker { display: none; }
  #version summary .more { color: var(--teal-ink); font-weight: 700; font-size: 13px; }
  #version summary .more::after { content: " ▾"; }
  #version details[open] summary .more::after { content: " ▴"; }
  #version summary:hover .more { text-decoration: underline; text-underline-offset: 3px; }
  #version .full { margin: 6px 0 2px; max-width: 110ch; color: var(--ink); }
  #version strong { color: var(--heading); }
  #version .files { color: var(--muted); overflow-wrap: anywhere; }
  /* the view bar: the asks' numbers in the asks' teal; the current view plainly filled; wrapping cleanly on narrow screens */
  header .topbar { padding: 12px 24px; row-gap: 10px; }
  header nav.tabs { flex: 0 1 auto; flex-wrap: wrap; gap: 6px; }
  header nav.tabs button.tab { background: transparent; border: 1px solid rgba(255, 255, 255, 0.28); color: #ffffff;
                               padding: 6px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
  header nav.tabs button.tab:hover { background: var(--bar-soft); border-color: rgba(255, 255, 255, 0.5); }
  header nav.tabs button.tab.current, header nav.tabs button.tab.current:hover {
    background: #ffffff; border-color: #ffffff; color: #0B3C49; }
  /* every tab is bold, current or not, so the tool's width-keeping copy of the label isn't needed (in a flex tab it would take room) */
  header nav.tabs button.tab[data-label]::after { display: none; }
  header nav.tabs .tabnum { display: inline-flex; align-items: center; justify-content: center; width: 21px; height: 21px;
                            border-radius: 50%; background: var(--teal-bg); color: var(--teal-ink); font-size: 12.5px; font-weight: 800; }
  header #status { flex-wrap: wrap; row-gap: 8px; gap: 10px; color: #ffffff; opacity: 1; font-size: 14px; }
  header #status button.primary { background: var(--gold); border-color: var(--gold); color: #13252F; }
  header #status button:not(.primary) { background: transparent; color: #ffffff; border-color: rgba(255, 255, 255, 0.45); }
  header #status button:not(.primary):hover { background: var(--bar-soft); }
  header #status .counter { white-space: nowrap; }
  @media (max-width: 900px) {
    header .topbar { padding: 10px 16px; }
    header h1 { margin-right: 8px; padding-right: 0; border-right: 0; }
    #version { padding: 7px 16px; }
    header #status .counter { white-space: normal; }
  }
  /* the start view */
  .home .lead { font-size: 17px; line-height: 1.65; max-width: 72ch; margin: 6px 0 4px; }
  .home h2 { font-size: 26px; margin-bottom: 6px; }
  .asks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin: 0 0 18px; }
  .ask { --c: var(--teal); --cbg: var(--teal-bg); --cink: var(--teal-ink);
         background: var(--panel); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: 14px;
         padding: 16px 20px 18px; display: flex; flex-direction: column; box-shadow: 0 1px 3px rgba(11, 60, 73, 0.07); }
  .ask .askhead { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .ask .num { font-size: 40px; line-height: 1; font-weight: 800; color: var(--cink); background: var(--cbg);
              border-radius: 12px; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; flex: none; }
  .ask .asklabel { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cink); }
  .ask h3 { font-size: 20px; margin: 2px 0 0; line-height: 1.25; }
  .ask h3 .opt { font-weight: 500; font-size: 15px; color: var(--muted); }
  .ask p { margin: 4px 0 14px; line-height: 1.6; flex: 1; }
  .ask button { align-self: flex-start; background: var(--cbg); border: 1px solid var(--c); color: var(--cink); font-weight: 700; padding: 8px 16px; }
  .ask button:hover { background: var(--cbg); filter: brightness(0.97); border-color: var(--cink); }
  .sendbox { border-left: 6px solid var(--teal); }
  section.card.sendbox > h3 { font-size: 19px; margin: 0 0 6px; color: var(--heading); }
  .sendbox ol { padding-left: 22px; margin: 6px 0 10px; max-width: 78ch; line-height: 1.65; }
  .namefield { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 8px; font-weight: 700; }
  .namefield input { width: min(320px, 100%); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  /* each view's opening card: the asks' teal on top, what you see, what to look for, then folded extras */
  .intro { --c: var(--teal); --cbg: var(--teal-bg); --cink: var(--teal-ink); border-top: 6px solid var(--c) !important; }
  .intro.plain { --c: var(--line); }
  .intro .askbadge { display: inline-block; font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
                     color: var(--cink); background: var(--cbg); border-radius: 999px; padding: 2px 11px; margin-bottom: 6px; }
  .intro h2 { font-size: 24px; margin: 0 0 6px; }
  .intro p, .intro li { max-width: 78ch; line-height: 1.65; }
  section.card.intro > h3 { font-size: 17px; margin: 18px 0 4px; color: var(--heading); }
  .intro ul { padding-left: 22px; margin: 4px 0; }
  .intro li { margin: 3px 0; }
  details.fold { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.fold > summary { cursor: pointer; font-weight: 700; color: var(--teal-ink); }
  details.fold > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
  details.fold p, details.fold li { max-width: 78ch; line-height: 1.6; }
  details.fold ul { padding-left: 22px; }
  details.fold li { margin: 6px 0; }
  dl.words { margin: 8px 0 4px; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; max-width: 90ch; }
  dl.words dt { font-weight: 700; }
  dl.words dd { margin: 0; line-height: 1.55; }
  @media (max-width: 600px) { dl.words { grid-template-columns: 1fr; gap: 2px; } dl.words dd { margin-bottom: 8px; } }
  /* pills: an entity class in teal, a predicate in gold, as in the deck's triples */
  .kind.ec, .triple .cls { background: var(--teal-bg); color: var(--teal-ink); border: 0; border-radius: 999px; padding: 1px 9px; }
  .kind.pr, .triple .pred { background: var(--gold-bg); color: var(--gold-ink); border: 0; border-radius: 999px; padding: 1px 9px; font-weight: 700; }
  .commentbox { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .commentbox label { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; font-weight: 700; color: var(--label); }
  .commentbox textarea { width: 100%; min-height: 2.6em; font-size: 15px; font-weight: 400; resize: vertical; line-height: 1.45; }
  .commentbox.has textarea { border-color: var(--teal); background: var(--teal-bg); }
  .commentbox .hint { margin-top: 4px; }
  .mapbox { border-radius: 12px; }
  .mapbox.commented { border-left-color: var(--teal); }
  .entryhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .entryhead .mapname { flex: 0 1 auto; font-size: 16px; }
  .mapbox .mapdef { font-size: 14.5px; color: var(--ink); }
  .patline { font-size: 14px; color: var(--label); margin-top: 4px; overflow-wrap: break-word; }
  .patline .pat { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; font-size: 13px; }
  .mapfilters select, .mapfilters input { max-width: 100%; }
  @media (max-width: 600px) { .mapname { white-space: normal; overflow-wrap: anywhere; text-overflow: clip; } }
  .maptab.current { background: var(--teal-ink); border-color: var(--teal-ink); color: #ffffff; }
  .terms td.term { white-space: nowrap; font-weight: 700; }
  .terms td { line-height: 1.5; }
  .notes p { margin: 0 0 4px; }
  .gone li { margin: 6px 0; }
  /* the Questions view: one calm card per question. At the top, what the expert needs to answer, in plain sections
     with room between them; at the bottom, folded and quiet, our bookkeeping (not needed to answer). */
  .mapbox.question { padding: 20px 26px 16px; margin-bottom: 18px; }
  .mapbox.question.high { border-left: 6px solid var(--gold); }
  @media (max-width: 600px) { .mapbox.question { padding: 16px; } }
  .question h3.qheading { font-size: 19px; font-weight: 700; line-height: 1.4; margin: 0 0 4px; color: var(--heading); }
  .question h3.qheading .qid { color: var(--teal-ink); font-weight: 800; margin-right: 8px; }
  .question .qmeta { color: var(--muted); font-size: 13.5px; margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .question .qmeta .pill { margin-left: 0; }
  .pill.prio-high { background: var(--gold); color: #13252F; }
  .pill.prio-medium { background: var(--teal-bg); color: var(--teal-ink); }
  .pill.prio-low { background: var(--grey-bg); color: var(--muted); }
  .question h4 { color: var(--heading); font-size: 15.5px; font-weight: 700; margin: 22px 0 6px; }
  .question p, .question li { max-width: 78ch; line-height: 1.65; }
  .question ul { padding-left: 22px; margin: 6px 0; }
  .question li { margin: 3px 0; }
  .question .prose table { margin: 8px 0 12px; max-width: 78ch; }
  .question .field { margin: 10px 0; }
  .question .field > .label { display: block; font-size: 13.5px; font-weight: 700; color: var(--label); margin-bottom: 2px; }
  .question .quote { margin: 2px 0 0; padding: 4px 0 4px 14px; border-left: 3px solid var(--teal-bg);
                     line-height: 1.65; overflow-wrap: anywhere; max-width: 78ch; }
  .question .quote p { margin: 0 0 6px; }
  .question .quote p:last-child { margin-bottom: 0; }
  .question mark { background: var(--soft); color: inherit; padding: 0 2px; border-radius: 3px; }
  .question .triple { font-size: 15px; margin: 6px 0; overflow-wrap: anywhere; line-height: 1.9; }
  .question .triple .inst { font-weight: 700; }
  .question .triple .cls, .question .triple .pred { font-size: 13px; }
  .question .option { margin: 12px 0; padding: 8px 14px; background: var(--tint); border-radius: 10px; }
  .question .option .otitle { font-weight: 700; margin: 0 0 2px; }
  .question .option .prose p { margin: 2px 0 6px; }
  .question .commentbox { margin-top: 20px; padding-top: 12px; }
  .question details.judged { margin: 12px 0 0; }
  .question details.judged summary { cursor: pointer; font-weight: 700; color: var(--label); }
  .question details.fullnotes { margin: 4px 0 0; font-size: 14px; }
  .question details.fullnotes summary { cursor: pointer; color: var(--label); }
  .question details.forus { margin: 16px 0 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--label); font-size: 14px; }
  .question details.forus summary { cursor: pointer; font-weight: 700; color: var(--label); }
  .question details.forus summary .meta { font-weight: 400; }
  .question details.forus h5 { font-size: 13.5px; color: var(--label); margin: 14px 0 4px; }
  .question details.forus p, .question details.forus li { line-height: 1.55; }
  .question details.forus ul { margin: 4px 0; }
  a.term, a.term:visited { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  a.term:hover { color: var(--teal-ink); text-decoration-style: solid; }
  .groupname { color: var(--heading); font-size: 17px; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
  .groupname::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--line)); flex: none; }
  .groupname.high { --c: var(--gold); } .groupname.medium { --c: var(--teal); } .groupname.low { --c: #9AAAB4; }
  .terms tr.here td { background: var(--teal-bg) !important; }
</style>

<body>
<header>
  <div class="topbar">
    <h1><button id="homebutton" title="The start of the page">Review our work: a knowledge graph for data.nasa.gov</button></h1>
    <nav class="tabs" aria-label="Views">
      <button class="tab" id="tab-home" data-label="Start">Start</button>
      <button class="tab" id="tab-schema" data-label="1 Schema" title="Ask 1: review our schema"><span class="tabnum" aria-hidden="true">1</span>Schema</button>
      <button class="tab" id="tab-questions" data-label="2 Questions" title="Ask 2: answer our questions"><span class="tabnum" aria-hidden="true">2</span>Questions</button>
      <button class="tab" id="tab-mapping" data-label="3 Translation table" title="Ask 3: check part of the translation table"><span class="tabnum" aria-hidden="true">3</span>Translation table</button>
    </nav>
    <span id="status"></span>
  </div>
</header>
<div id="version"></div>
<main class="single"><div id="view"></div></main>
<script type="application/json" id="data">{{DATA}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const V = D.version;
const $ = (id) => document.getElementById(id);
// An arrow as the page shows it: "->" or "-->" in the files becomes "→" on the screen only; the data, the comments'
// entry texts, the emails and the downloads keep the files' own characters, so --read compares like with like.
const arrows = (text) => String(text).replace(/--?>/g, "→");
const arrowsHtml = (html) => String(html).replace(/--?&gt;/g, "→");
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) node.append(c);
  return node;
}

// ---------------------------------------------------------------- what this browser keeps (localStorage)
// Each read and write may fail (storage blocked for pages opened from disk, a private window): the page then works
// from memory, and says so, so the reviewer downloads before closing.
const KEY = { comments: "schemaReview:comments", name: "schemaReview:name", seen: "schemaReview:seen",
              oneAtATime: "schemaReview:oneAtATime" };
let storageWorks = true;
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch (_) { storageWorks = false; return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (_) { storageWorks = false; return false; }
}
// {id: {topic, entry, text, at, version, commit, shown}}: id is topic|entry, the same in every copy of the page, so
// comments carry over to a newer copy opened in the same browser. A comment an older copy kept calls its topic
// D.legacy_topic ("kind"): read as the topic.
let comments = load(KEY.comments, {});
if (!comments || typeof comments !== "object") comments = {};
for (const c of Object.values(comments))
  if (c && typeof c === "object" && c.topic === undefined && c[D.legacy_topic] !== undefined) {
    c.topic = c[D.legacy_topic]; delete c[D.legacy_topic];
  }
let reviewer = load(KEY.name, "") || "";
let oneAtATime = load(KEY.oneAtATime, false) === true;

// ---------------------------------------------------------------- the entries
// every entry of this copy: {id, topic, entry, shown, ...}; the topic of an entity class or predicate is its kind
const ENTRIES = [];
for (const e of D.schema.entity_classes) ENTRIES.push({ ...e, topic: e.kind, id: `${e.kind}|${e.entry}` });
for (const e of D.schema.predicates) ENTRIES.push({ ...e, topic: e.kind, id: `${e.kind}|${e.entry}` });
for (const r of D.mapping.rows) ENTRIES.push({ ...r, topic: "translation row", rowKind: r.kind, id: `translation row|${r.entry}` });
for (const q of D.questions) ENTRIES.push({ ...q, topic: "question", entry: q.id, id: `question|${q.id}` });
const BY_ID = Object.fromEntries(ENTRIES.map((e) => [e.id, e]));
const GENERAL = { id: "general|(general)", topic: "general", entry: "(general)", shown: "" };

// Changed since you last looked: the copy opened before this one (an older one, by when it was made) left the text
// of each entry here; an entry whose text differs is changed, one it lacked is new.
const seenAll = (() => { const s = load(KEY.seen, {}); return s && typeof s === "object" ? s : {}; })();
const previous = Object.values(seenAll).filter((s) => s && s.content !== V.content && s.generated < V.generated)
  .sort((a, b) => (a.generated < b.generated ? 1 : -1))[0] || null;
const CHANGED = new Set(), NEW = new Set();
if (previous) for (const e of ENTRIES) {
  if (!(e.id in previous.entries)) NEW.add(e.id);
  else if (previous.entries[e.id] !== e.shown) CHANGED.add(e.id);
}
(() => {                                      // keep this copy's texts, and those of the three copies before it
  seenAll[V.content] = { version: V.id, generated: V.generated, content: V.content,
                         entries: Object.fromEntries(ENTRIES.map((e) => [e.id, e.shown])) };
  const keep = Object.values(seenAll).sort((a, b) => (a.generated < b.generated ? 1 : -1)).slice(0, 4);
  save(KEY.seen, Object.fromEntries(keep.map((s) => [s.content, s])));
})();

// ---------------------------------------------------------------- comments
const written = () => Object.values(comments).filter((c) => c && c.text && c.text.trim());
let saveTimer = null;
// The time now, on this computer's clock, with its offset from UTC: 2026-10-24T14:05:09-04:00.
function localIso() {
  const d = new Date(), pad = (n) => String(Math.abs(n)).padStart(2, "0"), off = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:` +
         `${pad(d.getSeconds())}${off < 0 ? "-" : "+"}${pad(Math.trunc(off / 60))}:${pad(off % 60)}`;
}
function setComment(e, text) {
  if (text.trim()) comments[e.id] = { topic: e.topic, entry: e.entry, text, at: localIso(),
                                      version: V.id, commit: V.commit, shown: e.shown };
  else delete comments[e.id];
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { save(KEY.comments, comments); drawStatus(); }, 300);
  drawStatus(true);
}
function commentBox(e, label) {
  const c = comments[e.id];
  const box = el("div", { class: "commentbox" + (c ? " has" : "") });
  const ta = el("textarea", { rows: 2, placeholder: "Your comment (optional): what is wrong, unclear, or missing",
                              "aria-label": label });
  ta.value = c ? c.text : "";
  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight + 2, 44) + "px"; };
  ta.addEventListener("input", () => {
    setComment(e, ta.value); box.classList.toggle("has", !!ta.value.trim());
    const card = box.closest(".mapbox"); if (card) card.classList.toggle("commented", !!ta.value.trim());
    grow();
  });
  requestAnimationFrame(grow);
  box.append(el("label", {}, label, ta));
  if (c && c.text && e.topic !== "general" && c.shown !== e.shown)

const to = () => ["iulia", "m", "iordanescu"].join(".") + "+kgreview" + String.fromCharCode(64) + ["gmail", "com"].join(".");

// (INTERNET_MAX_URL_LENGTH); more comments are split into parts, each its own email, up to MAX_EMAILS of them.
const MAILTO_MAX = 1900, MAX_EMAILS = 5;
const HEADER = "REVIEW COMMENTS (format 1): please send this email as it is";
function emailLines() {
  const rows = written().sort((a, b) => (TOPIC_ORDER.indexOf(a.topic) - TOPIC_ORDER.indexOf(b.topic)) ||
                                        a.entry.localeCompare(b.entry));
  const one = (s) => String(s || "").replace(/\s+/g, " ").trim();
  return rows.flatMap((c) => ["=== comment ===", `[topic] ${c.topic}`, `[entry] ${one(c.entry)}`,
    `[page_version] ${one(c.version)}`, `[git_commit] ${one(c.commit)}`, `[timestamp] ${one(c.at)}`,

// {parts: [{subject, url}], needed}: the emails to send; needed > MAX_EMAILS: too many, and parts is empty.
function emailParts(sent) {
  const name = reviewer.trim();
  const subject = (k, n) => `Review comments — ${name} — ${V.id}` + (n > 1 ? ` — part ${k} of ${n}` : "");
  const body = (k, n, lines) => [HEADER, `[reviewer] ${name}`, `[page_version] ${V.id}`, `[git_commit] ${V.commit}`,
    `[sent] ${sent}`, `[part] ${k} of ${n}`, `=== start of part ${k} of ${n} ===`, "", ...lines,
    `=== end of part ${k} of ${n} ===`, ""].join("\r\n");
  const link = (k, n, lines) => `mailto:${to()}?subject=${encodeURIComponent(subject(k, n))}` +
                               `&body=${encodeURIComponent(body(k, n, lines))}`;
  const fits = (lines) => link(99, 99, lines).length <= MAILTO_MAX;
  const chunks = []; let cur = [];
  const pending = emailLines();
  while (pending.length) {
    const line = pending.shift();
    if (fits([...cur, line])) { cur.push(line); continue; }
    if (cur.some((l) => l)) { chunks.push(cur); cur = []; pending.unshift(line); continue; }
    // one line too long for an email by itself: as much as fits, cut at a space; the rest starts the next part
    let cut = line.length - 1;
    while (cut > 0 && !fits([line.slice(0, cut)])) cut = Math.floor(cut * 0.9);
    const space = line.lastIndexOf(" ", cut);
    if (cut < 20) return { parts: [], needed: MAX_EMAILS + 1 };       // the name alone fills an email
    const at = space > cut / 2 ? space : cut;
    chunks.push([line.slice(0, at)]);
    pending.unshift(line.slice(at).replace(/^ /, ""));
  }
  if (cur.length) chunks.push(cur);
  const n = chunks.length;
  return n > MAX_EMAILS ? { parts: [], needed: n }
    : { parts: chunks.map((lines, i) => ({ subject: subject(i + 1, n), url: link(i + 1, n, lines) })), needed: n };
}

function parseCsv(text) {
  const rows = []; let row = [], cell = "", quoted = false;

    const ch = text[i];
    if (quoted) {

      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }

}

    if (!head.includes("topic") && head.includes(D.legacy_topic)) head = head.map((c) => c === D.legacy_topic ? "topic" : c);
    if (!COLUMNS.every((c) => head.includes(c))) { status(`${file.name} isn't a file of comments saved by this page.`); return; }
    const at = Object.fromEntries(head.map((c, i) => [c, i]));

      if (comments[id] && comments[id].at >= get("timestamp")) continue;
      comments[id] = { topic: get("topic"), entry: get("entry"), text: get("comment"), at: get("timestamp"),
                       version: get("page_version"), commit: get("git_commit"), shown: get("entry_text_shown") };
      added++;
      if (!reviewer && get("reviewer")) { reviewer = get("reviewer"); save(KEY.name, reviewer); }
    }
    save(KEY.comments, comments);

     `${PRIORITY[PRIORITIES[0]][1].toLowerCase()} one${nHigh === 1 ? ", marked in gold, comes" : "s, marked in gold, come"} first. Each is written out ` +
     "on its own: the question, the definitions and rules it is judged by (folded: open them when you need them), one or a few " +
     "records as examples (the sentences that matter, the words concerned highlighted), the choices we see, and our current reading. " +
     "Write your answer in the box under a question."],
    ["Which choice is right, or is there another we didn’t list?",
     "Would our current reading mislead someone in your field?",
     "Does the question rest on something we have wrong about the data?",
     "Short on time? The high priority questions first: answering a few already helps."],
    ["The questions are grouped by priority. The list next to the search box shows one priority only.",
     "A term with a dotted underline opens its definition in the list of all terms.",
     "Under each answer box, folded, “The answer to this question impacts:” is our bookkeeping: what your answer would " +
     "change in our files. You don’t need it to answer.",
     "Every quote (a record’s words, a definition, a rule) is checked against its source each time this page is made.",
     `Answered and withdrawn questions are hidden at first (${closedN} now); a checkbox shows them.`,
     LIST_NOTE, CHANGED_NOTE],
    el("p", { class: "meta" }, PRIORITIES.map((p, i) => `${i ? " · " : ""}${PRIORITY[p][1]}: ${count(p)}`).join("") +
      (closedN && !st.closed ? ` · ${closedN} answered or withdrawn, not shown` : "")));
  return [intro,
    el("section", { class: "card mapcard" },
      el("div", { class: "mapfilters" },
        searchBox(st, "Search the questions, their records and options"), select,
        check(st, "closed", `Show answered and withdrawn questions too (${closedN})`),
        check(st, "mine", "Only those I commented on"),
        previous ? check(st, "changed", "Only those changed or new since I last looked") : null),
      bar,
      !shown.length ? el("p", { class: "empty mapempty" }, all.length ? "Nothing matches the search and filters above." : "No questions yet.")
        : at !== null ? questionBox(shown[at])
        : groups.map(([p, list]) => [el("h3", { class: `groupname ${p}` }, `${PRIORITY[p][1]} (${list.length})`), list.map(questionBox)]))];
}

// ---------------------------------------------------------------- terms
function drawTerms() {
  const rows = D.glossary.map((t) => {
    const term = el("td", { class: "term" }); term.innerHTML = arrowsHtml(t.term_html);      // written by helpers/review_page.py,
    const meaning = el("td", {}); meaning.innerHTML = arrowsHtml(t.meaning_html);           // from docs/terminology.md, escaped
    return el("tr", { id: termSlug(t.term) }, term, meaning);
  });
  return [el("section", { class: "card intro plain" }, el("h2", {}, "All terms"),
    el("p", { class: "meta" }, `The words of our project, as our list of terms (docs/terminology.md) defines them at commit ${V.commit}. ` +
      "Some name parts of the project this page doesn’t show."),
    el("table", { class: "schematable terms" }, el("thead", {}, el("tr", {}, el("th", {}, "Term"), el("th", {}, "Meaning"))),
       el("tbody", {}, rows)))];
}

// ---------------------------------------------------------------- the start view
// A short welcome, the three asks in the demo deck's order (each: what we ask and a button to its view),
// then how to send comments. How to read each view is in that view; nothing here is said again there.
function drawHome() {
  const nameField = el("input", { id: "reviewer", type: "text", value: reviewer, placeholder: "e.g. Jane Smith", autocomplete: "name",
    oninput: (ev) => { reviewer = ev.target.value; save(KEY.name, reviewer); } });
  const picker = el("input", { type: "file", accept: ".csv,text/csv", hidden: true,
                               onchange: (ev) => { if (ev.target.files[0]) loadFile(ev.target.files[0]); ev.target.value = ""; } });
  const gone = written().filter((c) => c.topic !== "general" && !BY_ID[`${c.topic}|${c.entry}`]);
  const open = D.questions.filter((q) => q.status === QS.OPEN);
  const nHigh = open.filter((q) => q.priority === D.priorities[0]).length;
  const nRows = D.mapping.rows.length;
  const sample = SAMPLE
    ? `${SAMPLE.size} rows chosen at random from the ${D.mapping.checked === nRows ? nRows : `${D.mapping.checked} checked`}: does ` +
      "the model’s entity class or predicate mean the same as ours? If all " + `${SAMPLE.size} are right, at most about ` +
      `${Math.round(100 * D.mapping.bound / D.mapping.checked)}% of the ${D.mapping.checked} are wrong ` +
      `(${Math.round(100 * D.mapping.confidence)}% confidence).`
    : `The ${nRows} rows: does the model’s entity class or predicate mean the same as ours?`;
  const ask = (n, title, opt, text, button, target) => el("section", { class: `ask a${n}` },
    el("div", { class: "askhead" }, el("div", { class: "num", "aria-hidden": "true" }, String(n)),
       el("div", {}, el("div", { class: "asklabel" }, `Ask ${n}`), el("h3", {}, title, opt ? el("span", { class: "opt" }, ` ${opt}`) : null))),
    el("p", {}, text),
    el("button", { onclick: () => show(target) }, button));
  return [el("section", { class: "card home" },
    el("h2", {}, "Thank you for reviewing our work"),
    el("p", { class: "lead" }, "We are building a knowledge graph from the records of the data.nasa.gov catalog: an AI model reads " +
      "each record’s text and writes down the facts it states, such as “MODIS is aboard Aqua”. To measure how well it does, " +
      "we wrote down, and checked by hand, every fact in a sample of records, and we would value your expertise on three parts of that work."),
    wordsBox()),
    el("div", { class: "asks" },
      ask(1, "Review our schema", "",
        `${D.schema.entity_classes.length} entity classes and ${D.schema.predicates.length} predicates, each with a one-line ` +
        "definition. Are they right for NASA data? What is missing?", "Open the schema", "schema"),
      ask(2, "Answer our questions", "",
        `${open.length} question${open.length === 1 ? "" : "s"} we can’t settle alone, each with an example record and the ` +
        `choices we see. The ${nHigh} most urgent come first; any number helps.`, "Open the questions", "questions"),
      ask(3, "Check part of the translation table", "(if you have time)", sample,
        "Open the translation table", "mapping")),
    el("section", { class: "card sendbox" },
      el("h3", {}, "How to send your comments"),
      el("ol", {},
        el("li", {}, "Type in the box under any entry, question or row, or under General comments below. This browser keeps " +
          "what you type, so you can stop and come back."),
        el("li", {}, "Type your name, and press Email my comments to Iulia: your email program opens an email with your comments in it. Press Send."),
        el("li", {}, "If no email opens, press Download my comments, and attach the file it saves to an email to Iulia.")),
      el("div", { class: "namefield" }, el("label", { for: "reviewer", class: "name" }, "Your name"), nameField),
      commentBox(GENERAL, "General comments"),
      el("div", { class: "actions" },
        el("button", { class: "primary", onclick: email }, "Email my comments to Iulia"),
        el("button", { onclick: download }, "Download my comments"),
        el("button", { onclick: () => picker.click(), title: "Read back a file of comments this page saved before" },
           "Load my comments from a file"), picker),
      drawEmailing(),
      !storageWorks ? el("p", { class: "problems" }, el("span", { class: "pill flag" },
        "⚑ This browser doesn't let the page keep your comments: download them before you close it.")) : null,
      el("details", { class: "fold nolink" }, el("summary", {}, "More about your comments and this page"),
        el("ul", {},
          el("li", {}, "Your comments stay in this browser, on this computer only, until you email or download them; the top " +
            "of the page counts them. Clearing this browser’s site data before sending would lose them."),
          el("li", {}, "Many comments take a few emails, numbered: the page then shows one button per email."),
          el("li", {}, "Your name and comments go only to Iulia, who keeps them on her computer, not in the project’s public repository."),
          el("li", {}, "This page is a read-only copy: it can’t change our files, and it sends nothing by itself (an email goes " +
            "only when you press Send)."),
          el("li", {}, "When we update the page, the same link shows the newer copy. Open it in the same browser and your " +
            "comments carry over; in another browser or on another computer, press Load my comments from a file to read back " +
            "the file you downloaded."))),
      gone.length ? el("div", { class: "gone" }, el("h3", {}, "Your comments on entries no longer on this page"),
        el("p", { class: "meta" }, "They are still in your download, with the entry as it read when you wrote them."),
        el("ul", {}, gone.map((c) => el("li", {}, el("strong", {}, `${c.topic} ${c.entry}`), `: ${c.text}`,
                                            el("div", { class: "meta" }, `It read: ${arrows(c.shown)}`))))) : null)];
}

// ---------------------------------------------------------------- views
// in the asks' order; the Terms view has no tab: the words box and a question's linked terms open it
let view = "home";
const VIEWS = { home: drawHome, schema: drawSchema, questions: drawQuestions, mapping: drawMapping, terms: drawTerms };
function redraw() {
  for (const v of Object.keys(VIEWS)) {
    const tab = $(`tab-${v}`);
    if (!tab) continue;
    tab.classList.toggle("current", v === view);
    if (v === view) tab.setAttribute("aria-current", "page"); else tab.removeAttribute("aria-current");
  }
  $("view").replaceChildren(...VIEWS[view]().flat(Infinity).filter(Boolean));
  drawStatus();
}
function show(v) {
  view = VIEWS[v] ? v : "home";
  history.replaceState(null, "", "#" + view);
  message = "";
  redraw();
  window.scrollTo(0, 0);
}
for (const v of Object.keys(VIEWS)) if ($(`tab-${v}`)) $(`tab-${v}`).addEventListener("click", () => show(v));
$("homebutton").addEventListener("click", () => show("home"));
drawVersion();
show(location.hash.slice(1) || "home");
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing on this page may reach the network: no address outside the page itself loads (typefaces come inline). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Schema review ({{VERSION}})</title>
<link rel="icon" href="data:,">
<!-- The annotation tool's look, copied from helpers/annotator/page.html when this page was made by
     helpers/review_page.py; its typefaces (Libre Franklin, JetBrains Mono: SIL Open Font License) are inside. -->
<style>
{{ANNOTATOR_STYLES}}
</style>
<style>
  /* this page's own additions, in the same palette */
  main.single { display: block; max-width: 1100px; margin: 0 auto; padding: 16px; }
  #version { margin: 0; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--sky-bg); color: var(--ink);
             font-size: 13.5px; line-height: 1.5; }
  #version strong { color: var(--navy); }
  #version .files { color: var(--label); overflow-wrap: anywhere; }
  header #status { gap: 10px; }
  header #status button.primary { background: var(--bar-ink); color: #1f3a5f; border-color: var(--bar-ink); }
  header #status .counter { white-space: nowrap; }
  .commentbox { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .commentbox label { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; font-weight: 600; color: var(--label); }
  .commentbox textarea { width: 100%; min-height: 2.6em; font-size: 14px; font-weight: 400; resize: vertical; line-height: 1.4; }
  .commentbox.has textarea { border-color: var(--sky); background: var(--sky-bg); }
  .commentbox .hint { margin-top: 4px; }
  .mapbox.commented { border-left-color: var(--sky); }
  .entryhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .entryhead .mapname { flex: 0 1 auto; }
  .patline { font-size: 13px; color: var(--label); margin-top: 4px; overflow-wrap: break-word; }
  .patline .pat { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
  .home h2 { font-size: 22px; }
  .home h3 { color: var(--navy); font-size: 16px; margin: 18px 0 6px; }
  .home p, .home li { max-width: 78ch; line-height: 1.6; }
  .home ul, .home ol { padding-left: 22px; }
  .namefield { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
  .namefield input { width: min(320px, 100%); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  .terms td.term { white-space: nowrap; font-weight: 600; }
  .terms td { line-height: 1.5; }
  .notes p { margin: 0 0 4px; }
  .gone li { margin: 6px 0; }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <h1><button id="homebutton" title="How to read this page">Schema review</button></h1>
    <nav class="tabs" aria-label="Views">
      <button class="tab" id="tab-home" data-label="How to read this">How to read this</button>
      <button class="tab" id="tab-schema" data-label="Ground truth schema">Ground truth schema</button>
      <button class="tab" id="tab-mapping" data-label="Translation table">Translation table</button>
      <button class="tab" id="tab-terms" data-label="Terms">Terms</button>
    </nav>
    <span id="status"></span>
  </div>
</header>
<p id="version"></p>
<main class="single"><div id="view"></div></main>
<script type="application/json" id="data">{{DATA}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const V = D.version;
const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) node.append(c);
  return node;
}

// ---------------------------------------------------------------- what this browser keeps (localStorage)
// Each read and write may fail (storage blocked for pages opened from disk, a private window): the page then works
// from memory, and says so, so the reviewer downloads before closing.
const KEY = { comments: "schemaReview:comments", name: "schemaReview:name", seen: "schemaReview:seen",
              oneAtATime: "schemaReview:oneAtATime" };
let storageWorks = true;
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch (_) { storageWorks = false; return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (_) { storageWorks = false; return false; }
}
// {id: {kind, entry, text, at, version, commit, shown}}: id is kind|entry, the same in every copy of the page, so
// comments carry over to a newer copy opened in the same browser.
let comments = load(KEY.comments, {});
if (!comments || typeof comments !== "object") comments = {};
let reviewer = load(KEY.name, "") || "";
let oneAtATime = load(KEY.oneAtATime, false) === true;

// ---------------------------------------------------------------- the entries
const ENTRIES = [];                          // every entry of this copy: {id, kind, entry, shown, ...}
for (const e of D.schema.entity_classes) ENTRIES.push({ ...e, id: `${e.kind}|${e.entry}` });
for (const e of D.schema.predicates) ENTRIES.push({ ...e, id: `${e.kind}|${e.entry}` });
for (const r of D.mapping.rows) ENTRIES.push({ ...r, kind: "translation row", rowKind: r.kind, id: `translation row|${r.entry}` });
const BY_ID = Object.fromEntries(ENTRIES.map((e) => [e.id, e]));
const GENERAL = { id: "general|(general)", kind: "general", entry: "(general)", shown: "" };

// Changed since you last looked: the copy opened before this one (an older one, by when it was made) left the text
// of each entry here; an entry whose text differs is changed, one it lacked is new.
const seenAll = (() => { const s = load(KEY.seen, {}); return s && typeof s === "object" ? s : {}; })();
const previous = Object.values(seenAll).filter((s) => s && s.content !== V.content && s.generated < V.generated)
  .sort((a, b) => (a.generated < b.generated ? 1 : -1))[0] || null;
const CHANGED = new Set(), NEW = new Set();
if (previous) for (const e of ENTRIES) {
  if (!(e.id in previous.entries)) NEW.add(e.id);
  else if (previous.entries[e.id] !== e.shown) CHANGED.add(e.id);
}
(() => {                                      // keep this copy's texts, and those of the three copies before it
  seenAll[V.content] = { version: V.id, generated: V.generated, content: V.content,
                         entries: Object.fromEntries(ENTRIES.map((e) => [e.id, e.shown])) };
  const keep = Object.values(seenAll).sort((a, b) => (a.generated < b.generated ? 1 : -1)).slice(0, 4);
  save(KEY.seen, Object.fromEntries(keep.map((s) => [s.content, s])));
})();

// ---------------------------------------------------------------- comments
const written = () => Object.values(comments).filter((c) => c && c.text && c.text.trim());
let saveTimer = null;
// The time now, on this computer's clock, with its offset from UTC: 2026-10-24T14:05:09-04:00.
function localIso() {
  const d = new Date(), pad = (n) => String(Math.abs(n)).padStart(2, "0"), off = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:` +
         `${pad(d.getSeconds())}${off < 0 ? "-" : "+"}${pad(Math.trunc(off / 60))}:${pad(off % 60)}`;
}
function setComment(e, text) {
  if (text.trim()) comments[e.id] = { kind: e.kind, entry: e.entry, text, at: localIso(),
                                      version: V.id, commit: V.commit, shown: e.shown };
  else delete comments[e.id];
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { save(KEY.comments, comments); drawStatus(); }, 300);
  drawStatus(true);
}
function commentBox(e, label) {
  const c = comments[e.id];
  const box = el("div", { class: "commentbox" + (c ? " has" : "") });
  const ta = el("textarea", { rows: 2, placeholder: "Your comment (optional): what is wrong, unclear, or missing",
                              "aria-label": label });
  ta.value = c ? c.text : "";
  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight + 2, 44) + "px"; };
  ta.addEventListener("input", () => {
    setComment(e, ta.value); box.classList.toggle("has", !!ta.value.trim());
    const card = box.closest(".mapbox"); if (card) card.classList.toggle("commented", !!ta.value.trim());
    grow();
  });
  requestAnimationFrame(grow);
  box.append(el("label", {}, label, ta));
  if (c && c.text && e.kind !== "general" && c.shown !== e.shown)
    box.append(el("p", { class: "hint" }, `You wrote this on the copy ${c.version}, when the entry read: ${c.shown}`));
  return box;
}
const csvCell = (v) => /[",\r\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
const COLUMNS = ["reviewer", "page_version", "git_commit", "kind", "entry", "entry_text_shown", "comment", "timestamp"];
const KIND_ORDER = ["general", "entity class", "predicate", "translation row"];
function commentsCsv() {
  const rows = written().sort((a, b) => (KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind)) ||
                                        a.entry.localeCompare(b.entry));
  const lines = [COLUMNS.join(",")].concat(rows.map((c) =>
    [reviewer, c.version, c.commit, c.kind, c.entry, c.shown, c.text, c.at].map(csvCell).join(",")));
  return "﻿" + lines.join("\r\n") + "\r\n";
}
function download() {
  if (!reviewer.trim()) {
    show("home");
    status("Type your name first, then press Download again.");
    const f = $("reviewer"); if (f) f.focus();
    return;
  }
  const blob = new Blob([commentsCsv()], { type: "text/csv;charset=utf-8" });
  const a = el("a", { href: URL.createObjectURL(blob),
                      download: `comments_${reviewer.trim().replace(/[^\w-]+/g, "_")}_${localIso().slice(0, 10)}.csv` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  status(`Saved ${written().length} comment(s) to your Downloads folder. Email me that file.`);
}
// A comment file downloaded from any copy of this page (another browser, another computer), read back in: each of
// its comments is kept unless this browser holds a newer one for the same entry.
function parseCsv(text) {
  const rows = []; let row = [], cell = "", quoted = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    const head = rows.shift() || [];
    if (!COLUMNS.every((c) => head.includes(c))) { status(`${file.name} isn't a file of comments saved by this page.`); return; }
    const at = Object.fromEntries(head.map((c, i) => [c, i]));
    let added = 0;
    for (const r of rows) {
      const get = (c) => (r[at[c]] || "");
      if (!get("comment").trim()) continue;
      const id = `${get("kind")}|${get("entry")}`;
      if (comments[id] && comments[id].at >= get("timestamp")) continue;
      comments[id] = { kind: get("kind"), entry: get("entry"), text: get("comment"), at: get("timestamp"),
                       version: get("page_version"), commit: get("git_commit"), shown: get("entry_text_shown") };
      added++;
      if (!reviewer && get("reviewer")) { reviewer = get("reviewer"); save(KEY.name, reviewer); }
    }
    save(KEY.comments, comments);
    redraw();
    status(`Read ${added} comment(s) from ${file.name}.`);
  };
  reader.readAsText(file, "utf-8");
}

// ---------------------------------------------------------------- the header and the version line
let message = "";
function status(text) { message = text; drawStatus(); }
function drawStatus(typing) {
  const n = written().length;
  const where = !storageWorks ? "kept only until you close this page: this browser doesn't let it save them, so download before closing"
    : typing ? "saving…" : "saved in this browser";
  $("status").replaceChildren(...[
    el("span", { class: "counter", title: "Comments you have written (on this computer, in this browser)" },
       `${n} comment${n === 1 ? "" : "s"} written, ${where}`),
    message ? el("span", {}, message) : null,
    el("button", { class: "primary", onclick: download, title: "Save your comments as a small CSV file, to email back" },
       "Download my comments")].filter(Boolean));
}
function drawVersion() {
  const made = V.generated.replace("T", " ").slice(0, 16);
  $("version").replaceChildren(...[
    el("strong", {}, "A read-only copy: it can't change anything. "),
    `Made ${made} from Git commit ${V.commit}` +
      (V.edited ? ", with changes to these two files not yet committed" : "") + `; page version ${V.id}. `,
    el("span", { class: "files" }, "Fingerprints (sha256): ",
       V.files.map((f, i) => [i ? "; " : "", el("code", {}, f.path), ` ${f.sha256}`])),
    previous ? el("span", {}, `. Since the copy you opened before (${previous.version}): ${CHANGED.size} entr${CHANGED.size === 1 ? "y" : "ies"} changed, ${NEW.size} new.`) : null].filter(Boolean));
}

// ---------------------------------------------------------------- one at a time or all at once
function arrow(dir) {
  const s = document.createElement("span");
  s.className = "arrow";
  s.innerHTML = `<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 2.5v11M3.8 9.3 8 13.5l4.2-4.2" ` +
    `fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ` +
    `transform="rotate(${{ down: 0, up: 180 }[dir]} 8 8)"/></svg>`;
  return s;
}
function mapArrow() {
  const d = el("div", { class: "maparrow", "aria-hidden": "true" });
  d.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" ' +
                'stroke-linejoin="round"><path d="M3 12h17M13 5l7 7-7 7"/></svg>';
  return d;
}
const listAt = {};
let listStep = null;
function itemsOneAtATime(view, keys, noun) {
  listStep = null;
  const sw = el("button", { onclick: () => { oneAtATime = !oneAtATime; save(KEY.oneAtATime, oneAtATime); redraw(); } },
                oneAtATime ? "Show all at once" : "Show one at a time");
  if (!oneAtATime || !keys.length) return { at: null, bar: el("div", { class: "bar listbar" }, sw) };
  const s = listAt[view] || (listAt[view] = { key: null, at: 0 });
  let at = keys.indexOf(s.key);
  if (at < 0) at = Math.max(0, Math.min(s.at, keys.length - 1));
  s.key = keys[at]; s.at = at;
  const go = (d) => {
    if (keys.length < 2) return false;
    const k = ((at + d) % keys.length + keys.length) % keys.length;
    s.key = keys[k]; s.at = k; redraw(); return true;
  };
  listStep = { view, go };
  return { at, bar: el("div", { class: "listbar" },
    el("div", { class: "triplenav" },
      el("button", { onclick: () => go(-1), disabled: keys.length < 2, title: "Previous (or the ↑ key, when not typing)" }, arrow("up")),
      el("strong", {}, `${noun} ${at + 1} of ${keys.length}`),
      el("button", { onclick: () => go(1), disabled: keys.length < 2, title: "Next (or the ↓ key, when not typing)" }, arrow("down"))),
    sw) };
}
document.addEventListener("keydown", (e) => {
  if (!oneAtATime || !listStep || listStep.view !== view || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest && e.target.closest("input, textarea, select")) return;
  if (e.key === "ArrowDown" && listStep.go(1)) e.preventDefault();
  if (e.key === "ArrowUp" && listStep.go(-1)) e.preventDefault();
});

// ---------------------------------------------------------------- filters shared by the two lists
const state = { schema: { kind: "entity class", search: "", mine: false, changed: false, pinned: false },
                mapping: { kind: "entity class", search: "", mine: false, changed: false, counterpart: "any" } };
const has = (e) => !!(comments[e.id] && comments[e.id].text.trim());
const changedPill = (e) => CHANGED.has(e.id)
  ? el("span", { class: "pill flag", title: `When you last looked (copy ${previous.version}), it read: ${previous.entries[e.id]}` },
       "⚑ changed since you last looked")
  : NEW.has(e.id) ? el("span", { class: "pill flag" }, "⚑ new since you last looked") : null;
function kindTabs(st, counts) {
  return el("div", { class: "maptabs", role: "tablist" }, [["entity class", "Entity classes"], ["predicate", "Predicates"]].map(([k, label]) =>
    el("button", { class: "maptab" + (st.kind === k ? " current" : ""), role: "tab", "aria-selected": st.kind === k ? "true" : "false",
                   onclick: () => { st.kind = k; redraw(); } },
       label, el("span", { class: "mapcount" }, String(counts[k].all)),
       counts[k].mine ? el("span", { class: "pill ok" }, `${counts[k].mine} commented`) : null)));
}
function searchBox(st, placeholder) {
  return el("input", { type: "search", class: "mapsearch", value: st.search, placeholder, "aria-label": placeholder,
    oninput: (ev) => { st.search = ev.target.value; const p = ev.target.selectionStart; redraw();
                       const f = document.querySelector(".mapsearch"); if (f) { f.focus(); f.setSelectionRange(p, p); } } });
}
function check(st, key, label, title) {
  return el("label", { class: "meta", title: title || null },
    el("input", { type: "checkbox", checked: st[key], onchange: (ev) => { st[key] = ev.target.checked; redraw(); } }), " " + label);
}
const matches = (q, ...texts) => !q.trim() || texts.some((t) => (t || "").toLowerCase().includes(q.trim().toLowerCase()));

// ---------------------------------------------------------------- the ground truth schema
function schemaBox(e) {
  const what = e.kind === "predicate" ? "predicate" : "entity class";
  return el("section", { class: "mapbox" + (has(e) ? " commented" : "") },
    el("div", { class: "entryhead" },
      el("div", { class: "mapname", title: `${e.entry} (ground truth schema ${what})` }, e.entry),
      el("span", { class: "kind" }, what), changedPill(e)),
    el("div", { class: "mapdef" + (e.definition ? "" : " empty") }, e.definition || "No definition yet."),
    e.kind === "predicate" ? el("div", { class: "patline" }, "Patterns listed: ",
      e.patterns.length ? e.patterns.map(([s, o], i) => [i ? "; " : "", el("span", { class: "pat" }, `${s} -> ${o}`)])
                        : el("span", { class: "empty" }, "none in the file")) : null,
    e.pins && e.pins.length ? el("div", { class: "patline" },
      el("span", { class: "pill todo", title: `Pinned: ${e.entry} may join only these entity classes ("any": any entity class)` },
         "only: " + e.pins.map(([s, o]) => `${s} -> ${o}`).join("; "))) : null,
    e.source ? el("div", { class: "meta" }, `source: ${e.source}`) : null,
    commentBox(e, `Your comment on ${e.entry} (ground truth schema ${what})`));
}
function drawSchema() {
  const st = state.schema;
  const all = ENTRIES.filter((e) => e.kind === "entity class" || e.kind === "predicate");
  const counts = Object.fromEntries(["entity class", "predicate"].map((k) => [k, {
    all: all.filter((e) => e.kind === k).length, mine: all.filter((e) => e.kind === k && has(e)).length }]));
  const shown = all.filter((e) => e.kind === st.kind && (!st.mine || has(e)) && (!st.changed || CHANGED.has(e.id) || NEW.has(e.id))
    && (!st.pinned || (e.pins && e.pins.length))
    && matches(st.search, e.entry, e.definition, e.source, (e.patterns || []).map((p) => p.join(" -> ")).join(" ")));
  const { at, bar } = itemsOneAtATime("schema", shown.map((e) => e.id), st.kind === "predicate" ? "Predicate" : "Entity class");
  const notes = D.schema.notes.length ? el("section", { class: "card notes" }, el("h3", {}, "Notes in the file"),
    el("p", { class: "meta" }, D.schema.notes.join(" "))) : null;
  return [
    el("section", { class: "card" }, el("h2", {}, "Ground truth schema"),
      el("p", { class: "meta" }, "annotations/ground_truth_schema.txt: the entity classes and predicates the ground truth may use, " +
        "each with its definition; under a predicate, its patterns (subject class -> object class) and any “only:” line that pins it.")),
    notes,
    el("section", { class: "card mapcard" }, kindTabs(st, counts),
      el("div", { class: "mapfilters" },
        searchBox(st, "Search names, definitions and patterns"),
        st.kind === "predicate" ? check(st, "pinned", "Only pinned predicates") : null,
        check(st, "mine", "Only those I commented on"),
        previous ? check(st, "changed", "Only those changed or new since I last looked") : null),
      bar,
      shown.length ? (at === null ? shown : [shown[at]]).map(schemaBox)
                   : el("p", { class: "empty mapempty" }, "Nothing matches the search and filters above."))];
}

// ---------------------------------------------------------------- the translation table
const CHECKED = { "yes": ["ok", "✓ Checked by me"],
                  "same component class": ["ok", "✓ Accepted automatically: spelled the same in both schemas"],
                  "no": ["flag", "⚑ Not checked yet"] };
function exampleLine(r) {
  if (r.rowKind !== "predicate") return null;
  const after = r.gtt === D.mapping.none ? `(not translated: nothing in the ground truth schema means ${r.crt})`
    : r.swap === "yes" ? `B  ${r.gtt}  A` : `A  ${r.gtt}  B`;
  return el("div", { class: "example", title: "A made-up triple (subject instance A, object instance B), before and after translation" },
            `A  ${r.crt}  B   →   ${after}`);
}
function mappingBox(r) {
  const what = r.rowKind === "predicate" ? "predicate" : "entity class";
  const none = r.gtt === D.mapping.none;
  const [ck, cl] = CHECKED[r.checked] || ["todo", `checked: ${r.checked}`];
  return el("section", { class: "mapbox" + (has(r) ? " commented" : "") },
    el("div", { class: "mapgrid" },
      el("div", { class: "mapname", title: `${r.crt} (current or past schema ${what})` }, r.crt),
      mapArrow(),
      el("div", { class: "mapname" + (none ? " empty" : ""), title: none ? `${D.mapping.none}: nothing in the ground truth schema means this`
                                                                         : `${r.gtt} (ground truth schema ${what})` }, r.gtt),
      el("div", { class: "mapdef" + (r.crt_def ? "" : " empty") }, r.crt_def || "No definition stored."),
      el("div", {}),
      none ? el("div", { class: "mapdef empty" }, `${D.mapping.none}: nothing in the ground truth schema means ${r.crt}.`)
           : el("div", { class: "mapdef" + (r.gtt_def ? "" : " empty") }, r.gtt_def || "No definition stored.")),
    exampleLine(r),
    el("div", { class: "mapflags" },
      r.rowKind === "predicate" && r.swap === "yes"
        ? el("span", { class: "mapflag on", title: `${r.gtt} (ground truth schema predicate) states the relationship the other way round from ${r.crt}` },
             "Swap subject and object") : null,
      el("span", { class: `pill ${ck}` }, cl),
      r.stale_gtt ? el("span", { class: "pill flag", title: `The ground truth schema now defines ${r.gtt} as: ${r.gtt_now || "(no definition)"}` },
                       `⚑ ${r.gtt}: its ground truth schema definition changed since this row was checked`) : null,
      changedPill(r)),
    commentBox(r, `Your comment on this row (${what} ${r.crt} → ${r.gtt})`));
}
function drawMapping() {
  const st = state.mapping;
  const all = ENTRIES.filter((e) => e.kind === "translation row");
  const counts = Object.fromEntries(["entity class", "predicate"].map((k) => [k, {
    all: all.filter((e) => e.rowKind === k).length, mine: all.filter((e) => e.rowKind === k && has(e)).length }]));
  const shown = all.filter((r) => r.rowKind === st.kind && (!st.mine || has(r)) && (!st.changed || CHANGED.has(r.id) || NEW.has(r.id))
    && (st.counterpart === "any" || (st.counterpart === "none") === (r.gtt === D.mapping.none))
    && matches(st.search, r.crt, r.gtt, r.crt_def, r.gtt_def));
  const what = st.kind === "predicate" ? "predicate" : "entity class";
  const counterpart = el("select", { "aria-label": "Rows by what they translate to",
                                     onchange: (ev) => { st.counterpart = ev.target.value; redraw(); } },
    [["any", "All rows, whatever they translate to"], ["has", `Rows that translate to a ground truth schema ${what}`],
     ["none", `Rows that translate to ${D.mapping.none}: nothing in the ground truth schema`]]
      .map(([v, t]) => el("option", { value: v, selected: st.counterpart === v }, t)));
  const { at, bar } = itemsOneAtATime("mapping", shown.map((r) => r.id), "Row");
  return [
    el("section", { class: "card" }, el("h2", {}, "Translation table"),
      el("p", { class: "meta" }, "annotations/component_class_mapping.csv: each box is one row, an entity class or predicate of the " +
        "current schema (or of a past one) → what it means in the ground truth schema, each with its definition as the row stores it.")),
    el("section", { class: "card mapcard" }, kindTabs(st, counts),
      el("div", { class: "mapfilters" },
        searchBox(st, "Search names and definitions"), counterpart,
        check(st, "mine", "Only those I commented on"),
        previous ? check(st, "changed", "Only those changed or new since I last looked") : null),
      bar,
      shown.length ? [el("div", { class: "maphead" }, el("div", {}, `Current or past schema ${what}`), mapArrow(),
                         el("div", {}, `Ground truth schema ${what}`)),
                      (at === null ? shown : [shown[at]]).map(mappingBox)]
                   : el("p", { class: "empty mapempty" }, "Nothing matches the search and filters above."))];
}

// ---------------------------------------------------------------- terms
function drawTerms() {
  const rows = D.glossary.map((t) => {
    const term = el("td", { class: "term" }); term.innerHTML = t.term_html;      // written by helpers/review_page.py,
    const meaning = el("td", {}); meaning.innerHTML = t.meaning_html;           // from docs/terminology.md, escaped
    return el("tr", {}, term, meaning);
  });
  return [el("section", { class: "card" }, el("h2", {}, "Terms"),
    el("p", { class: "meta" }, `The words this page uses, as my project's list of terms (docs/terminology.md) defines them at commit ${V.commit}.`),
    el("table", { class: "schematable terms" }, el("thead", {}, el("tr", {}, el("th", {}, "Term"), el("th", {}, "Meaning"))),
       el("tbody", {}, rows)))];
}

// ---------------------------------------------------------------- how to read this
function drawHome() {
  const nameField = el("input", { id: "reviewer", type: "text", value: reviewer, placeholder: "e.g. Jane Smith", autocomplete: "name",
    oninput: (ev) => { reviewer = ev.target.value; save(KEY.name, reviewer); } });
  const picker = el("input", { type: "file", accept: ".csv,text/csv", hidden: true,
                               onchange: (ev) => { if (ev.target.files[0]) loadFile(ev.target.files[0]); ev.target.value = ""; } });
  const gone = written().filter((c) => c.kind !== "general" && !BY_ID[`${c.kind}|${c.entry}`]);
  const nSchema = D.schema.entity_classes.length + " entity classes and " + D.schema.predicates.length + " predicates";
  return [el("section", { class: "card home" },
    el("h2", {}, "How to read this page"),
    el("p", {}, "Thank you for reviewing this. My project builds a knowledge graph from the records of the data.nasa.gov catalog: " +
      "a model reads each record's text and writes down the facts it states, each as a classed triple, e.g. “MODIS” (Instrument) " +
      "ABOARD “Aqua” (Spacecraft). To measure how well it does, I check a sample of records by hand and write down every fact " +
      "their texts state: the ground truth. This page shows two files that decide what those facts may say, as they were when " +
      "the page was made (the line above says when), so that you can tell me where they are wrong, unclear, or missing something."),
    el("h3", {}, "Ground truth schema"),
    el("p", {}, `The ${nSchema} the ground truth may use, each with a one-line definition. An entity class is a kind of thing a ` +
      "subject instance or object instance can be (Instrument); a predicate is a kind of relationship (ABOARD). Under a predicate " +
      "are its patterns, the pairs of entity classes it has joined, read subject -> object: Instrument -> Spacecraft under ABOARD " +
      "says that an instrument is carried on a spacecraft. The ground truth itself may use more patterns than the file lists. " +
      "A line “only: …” pins a predicate: it may join only those entity classes (“any”: any entity class). A line " +
      "“source: …” says where the idea for an entry came from: “ground truth tuning #2” means from the record at position 2 of " +
      "my shuffled list of records to annotate."),
    el("p", {}, "Worth asking: is each definition right, and clear to someone in your field? Should two entries be one, or one be two? " +
      "Is a kind of thing or relationship that the catalog often states missing? Is a predicate pinned where it shouldn't be?"),
    el("h3", {}, "Translation table"),
    el("p", {}, "The model doesn't use the ground truth schema: it extracts with its own, the current schema, learned from other " +
      "records of the catalog. To compare its facts with the ground truth, each entity class and predicate of the current schema " +
      "(and of past ones) is translated into the one of the ground truth schema that means the same, or into (none) when none does. " +
      "Each box is one row: on the left, the current or past schema's entity class or predicate and its definition; on the right, " +
      "what it translates to and the ground truth schema's definition. “Swap subject and object” means the ground truth " +
      "schema's predicate states the relationship the other way round (“A CARRIES B” is “B ABOARD A”). The last pill says " +
      "whether I have checked the row."),
    el("p", {}, "Worth asking: does each translation keep the meaning? Does a row that says (none) really have no counterpart?"),
    el("h3", {}, "Your comments"),
    el("p", {}, "Write in the box under any entry, and anything else under General comments below. Every comment is kept in this " +
      "browser as you type, on this computer only, so you can stop and come back; the top of the page says how many you have written. " +
      "When you're done, type your name, press Download my comments, and email me the small file it saves (a CSV file). " +
      "Your name and comments will be kept with my project's files, in its Git repository, so that each change can be traced " +
      "to its reason."),
    el("p", {}, "This page is a copy: it can't change the files, and it sends nothing anywhere. If I send you a newer copy, open it in " +
      "the same browser: your comments carry over, and entries that changed since the copy you opened before are marked " +
      "“changed since you last looked”. In another browser or on another computer, read your comments back in from the file " +
      "you downloaded (Load my comments from a file, below)."),
    el("div", { class: "namefield" }, el("label", { for: "reviewer", class: "name" }, "Your name"), nameField),
    commentBox(GENERAL, "General comments"),
    el("div", { class: "actions" },
      el("button", { class: "primary", onclick: download }, "Download my comments"),
      el("button", { onclick: () => picker.click(), title: "Read back a file of comments this page saved before" },
         "Load my comments from a file"), picker),
    !storageWorks ? el("p", { class: "problems" }, el("span", { class: "pill flag" },
      "⚑ This browser doesn't let the page keep your comments: download them before you close it.")) : null,
    gone.length ? el("div", { class: "gone" }, el("h3", {}, "Your comments on entries no longer on this page"),
      el("p", { class: "meta" }, "They are still in your download, with the entry as it read when you wrote them."),
      el("ul", {}, gone.map((c) => el("li", {}, el("strong", {}, `${c.kind} ${c.entry}`), `: ${c.text}`,
                                          el("div", { class: "meta" }, `It read: ${c.shown}`))))) : null)];
}

// ---------------------------------------------------------------- views
let view = "home";
const VIEWS = { home: drawHome, schema: drawSchema, mapping: drawMapping, terms: drawTerms };
function redraw() {
  for (const v of Object.keys(VIEWS)) $(`tab-${v}`).classList.toggle("current", v === view);
  $("view").replaceChildren(...VIEWS[view]().flat(Infinity).filter(Boolean));
  drawStatus();
}
function show(v) {
  view = VIEWS[v] ? v : "home";
  history.replaceState(null, "", "#" + view);
  message = "";
  redraw();
  window.scrollTo(0, 0);
}
for (const v of Object.keys(VIEWS)) $(`tab-${v}`).addEventListener("click", () => show(v));
$("homebutton").addEventListener("click", () => show("home"));
drawVersion();
show(location.hash.slice(1) || "home");
</script>
</body>
</html>
